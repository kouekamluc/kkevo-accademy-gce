{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KKEVO Academy{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Clear, structured lessons for students preparing for the Cameroon GCE O and A Levels.{% endblock %}">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:site_name" content="KKEVO Academy">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:title" content="{% block og_title %}KKEVO Academy: pass your GCE, one small win at a time{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Short lessons, quick quizzes and a report card you can send to your parents on WhatsApp. For Cameroon GCE O Level and A Level students.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}{% if request %}{{ request.scheme }}://{{ request.get_host }}{% endif %}{% static 'img/icon-512.png' %}{% endblock %}">
  <meta name="twitter:card" content="summary">
  <link rel="preload" href="{% static 'vendor/fonts/nunito-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <meta name="theme-color" content="#5B3FE4">
  <link rel="manifest" href="{% url 'core:manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KKEVO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script defer src="{% static 'js/pwa.js' %}"></script>
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="{% block body_class %}{% endblock %}">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-btn focus:bg-white focus:px-4 focus:py-2">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
