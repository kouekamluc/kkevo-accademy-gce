{% if messages %}
<div class="flex flex-col gap-2" role="status" aria-live="polite">
  {% for message in messages %}
  <div x-data="{ show: true }" x-show="show" class="flex items-start gap-3 rounded-card border px-4 py-3 text-sm {% if message.level_tag == 'error' %}border-danger-200 bg-danger-50 text-danger-text{% elif message.level_tag == 'warning' %}border-warning-200 bg-warning-50 text-warning-text{% else %}border-success-200 bg-success-50 text-success-text{% endif %}">
    {% include "components/icon.html" with name="check" class="mt-0.5 h-4 w-4 shrink-0" stroke="2.5" %}
    <span class="flex-1 font-medium">{{ message }}</span>
    <button type="button" @click="show = false" class="-m-1 flex h-7 w-7 items-center justify-center rounded-md hover:bg-black/5" aria-label="Dismiss">{% include "components/icon.html" with name="close" class="h-4 w-4" stroke="2" %}</button>
  </div>
  {% endfor %}
</div>
{% endif %}
