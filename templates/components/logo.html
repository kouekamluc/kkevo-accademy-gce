{# Brand mark. Usage: {% include "components/logo.html" with size="sm" %} #}
{% if size == "sm" %}
<span class="flex h-8 w-8 items-end justify-center gap-[3px] rounded-lg bg-navy py-[7px]" aria-hidden="true"><span class="h-1.5 w-1 rounded-[1px] bg-primary-300"></span><span class="h-[11px] w-1 rounded-[1px] bg-white"></span><span class="h-[17px] w-1 rounded-[1px] bg-success"></span></span>
{% else %}
<span class="flex h-9 w-9 items-end justify-center gap-[3px] rounded-[9px] bg-navy py-2" aria-hidden="true"><span class="h-[7px] w-1 rounded-[1px] bg-primary-300"></span><span class="h-3 w-1 rounded-[1px] bg-white"></span><span class="h-[19px] w-1 rounded-[1px] bg-success"></span></span>
{% endif %}
