{# Renders one form field with label, help and errors. Usage: {% include "components/field.html" with field=form.email %} #}
<div class="flex flex-col gap-1.5">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-ink-muted">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not field.errors %}<p id="{{ field.auto_id }}_helptext" class="text-[13px] leading-snug text-ink-muted">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-[13px] font-medium text-danger-text" role="alert">{{ error }}</p>{% endfor %}
</div>
