<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"><rect width="560" height="360" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#102A43"/></marker></defs>
<text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">From exile to Roman rule (BC to AD, approximate)</text>
<line x1="40" y1="180" x2="520" y2="180" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
<circle cx="40" cy="180" r="6" fill="#2563EB"/>
<line x1="40.0" y1="180" x2="40.0" y2="146" stroke="#2563EB" stroke-width="2"/>
<text x="40" y="124" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="start" fill="#102A43" font-weight="normal">Exile</text>
<text x="40" y="140" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="start" fill="#B45309" font-weight="normal">586 BC</text>
<circle cx="75" cy="180" r="6" fill="#2563EB"/>
<line x1="75.1219512195122" y1="180" x2="75.1219512195122" y2="209" stroke="#2563EB" stroke-width="2"/>
<text x="75" y="229" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Return</text>
<text x="75" y="245" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">538 BC</text>
<circle cx="226" cy="180" r="6" fill="#2563EB"/>
<line x1="225.85365853658539" y1="180" x2="225.85365853658539" y2="146" stroke="#2563EB" stroke-width="2"/>
<text x="226" y="124" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Alexander</text>
<text x="226" y="140" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">332 BC</text>
<circle cx="347" cy="180" r="6" fill="#2563EB"/>
<line x1="346.5853658536585" y1="180" x2="346.5853658536585" y2="209" stroke="#2563EB" stroke-width="2"/>
<text x="347" y="229" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Maccabees</text>
<text x="347" y="245" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">167 BC</text>
<circle cx="423" cy="180" r="6" fill="#2563EB"/>
<line x1="422.6829268292683" y1="180" x2="422.6829268292683" y2="146" stroke="#2563EB" stroke-width="2"/>
<text x="423" y="124" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Pompey</text>
<text x="423" y="140" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">63 BC</text>
<circle cx="491" cy="180" r="6" fill="#2563EB"/>
<line x1="490.73170731707313" y1="180" x2="490.73170731707313" y2="209" stroke="#2563EB" stroke-width="2"/>
<text x="491" y="229" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Jesus</text>
<text x="491" y="245" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">AD 30</text>
<circle cx="520" cy="180" r="6" fill="#2563EB"/>
<line x1="520.0" y1="180" x2="520.0" y2="146" stroke="#2563EB" stroke-width="2"/>
<text x="520" y="124" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Temple falls</text>
<text x="520" y="140" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B45309" font-weight="normal">AD 70</text>
<text x="280" y="300" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Persian, Greek, Hasmonean, then Roman rule</text>
