<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bridge from the updated cash book balance to the bank statement balance">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#102A43"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#FFFFFF"/>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">
    <rect x="80" y="14" width="400" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="280" y="38" font-weight="bold">Balance per UPDATED cash book</text>
    <text x="280" y="60">303 000</text>

    <rect x="80" y="100" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="280" y="124" font-weight="bold" fill="#B45309">ADD unpresented cheques</text>
    <text x="280" y="146">cheques we wrote, bank has not paid yet: 73 000</text>

    <rect x="80" y="186" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="280" y="210" font-weight="bold" fill="#B45309">LESS uncredited lodgments</text>
    <text x="280" y="232">money we banked, not yet on statement: 60 000</text>

    <rect x="80" y="288" width="400" height="58" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="280" y="312" font-weight="bold" fill="#047857">Balance per BANK STATEMENT</text>
    <text x="280" y="334">316 000</text>

    <path d="M280 74 L280 96" stroke="#102A43" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M280 160 L280 182" stroke="#102A43" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M280 246 L280 284" stroke="#102A43" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  </g>
</svg>
