<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Full adder = two half adders + an OR gate</text>
<rect x="120" y="70" width="110" height="80" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="175" y="102" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Half adder 1</text>
<text x="175" y="124" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">S = A xor B</text>
<text x="175" y="142" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">C = A and B</text>
<rect x="290" y="70" width="110" height="80" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="345" y="102" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Half adder 2</text>
<text x="345" y="124" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">S = S1 xor Cin</text>
<text x="345" y="142" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">C = S1 and Cin</text>
<text x="28" y="95" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">A</text>
<line x1="50" y1="90" x2="120" y2="90" stroke="#102A43" stroke-width="2"/>
<text x="28" y="135" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">B</text>
<line x1="50" y1="130" x2="120" y2="130" stroke="#102A43" stroke-width="2"/>
<line x1="230" y1="110" x2="290" y2="110" stroke="#2563EB" stroke-width="2"/>
<text x="260" y="102" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="700">S1</text>
<text x="340" y="48" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Cin</text>
<line x1="340" y1="62" x2="340" y2="70" stroke="#102A43" stroke-width="2"/>
<line x1="400" y1="110" x2="510" y2="110" stroke="#047857" stroke-width="2"/>
<text x="535" y="115" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Sum</text>
<line x1="190" y1="150" x2="190" y2="250" stroke="#B45309" stroke-width="2"/>
<line x1="190" y1="250" x2="330" y2="250" stroke="#B45309" stroke-width="2"/>
<text x="212" y="200" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">C1</text>
<line x1="380" y1="150" x2="380" y2="220" stroke="#B45309" stroke-width="2"/>
<text x="402" y="190" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">C2</text>
<rect x="330" y="220" width="100" height="60" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/>
<text x="380" y="256" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">OR</text>
<line x1="430" y1="250" x2="510" y2="250" stroke="#047857" stroke-width="2"/>
<text x="535" y="255" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Cout</text>
<text x="280" y="320" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">Sum = A xor B xor Cin</text>
<text x="280" y="342" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">Cout = AB + (A xor B).Cin</text>
</svg>
