<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Two current-voltage graphs: a straight line through the origin for an ohmic conductor, and a curve that flattens for a filament lamp</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="40" y1="300" x2="270" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="270,300 261.7,303.5 261.7,296.5" fill="#102A43"/>
<line x1="40" y1="300" x2="40" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="40,70 43.5,78.3 36.5,78.3" fill="#102A43"/>
<text x="272" y="318" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">V</text>
<text x="24" y="64" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">I</text>
<line x1="320" y1="300" x2="550" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="550,300 541.7,303.5 541.7,296.5" fill="#102A43"/>
<line x1="320" y1="300" x2="320" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="320,70 323.5,78.3 316.5,78.3" fill="#102A43"/>
<text x="552" y="318" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">V</text>
<text x="304" y="64" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">I</text>
<text x="150" y="40" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Ohmic conductor</text>
<text x="430" y="40" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Filament lamp</text>
<line x1="40" y1="300" x2="250" y2="110" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
<polyline points="320,300 325,284 330,269.1 335,255 340,241.9 345,229.6 350,218 355,207.2 360,197.1 365,187.6 370,178.7 375,170.3 380,162.5 385,155.2 390,148.3 395,141.9 400,135.9 405,130.2 410,124.9 415,120 420,115.3 425,111 430,106.9 435,103.1 440,99.5 445,96.1 450,93 455,90 460,87.3 465,84.7 470,82.3 475,80 480,77.9 485,75.9 490,74 495,72.2 500,70.6 505,69.1 510,67.6 515,66.3 520,65" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150" y="345" font-size="13" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">I proportional to V: constant resistance</text>
<text x="430" y="345" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">resistance rises as it gets hot</text>
</svg>
