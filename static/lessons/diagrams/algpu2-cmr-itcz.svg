<text x="169" y="72" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">Harmattan: dry NE</text>
<text x="169" y="88" font-size="13" text-anchor="middle" fill="#B45309" stroke="#fff" stroke-width="3" paint-order="stroke">trade wind from the Sahara</text>
<text x="169.5" y="292" font-size="13" text-anchor="middle" fill="#047857" stroke="#fff" stroke-width="3" paint-order="stroke">moist air only in the far south</text>
<rect x="305" y="50" width="235" height="250" fill="#fff" stroke="#102A43" stroke-width="2"/>
<text x="422.5" y="38" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">July</text>
