<text x="423" y="92" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">Monsoon: moist SW air</text>
<text x="423" y="108" font-size="13" text-anchor="middle" fill="#2563EB" stroke="#fff" stroke-width="3" paint-order="stroke">from the Atlantic</text>
<text x="290" y="322" font-size="13" text-anchor="middle" fill="#102A43">Rain falls where moist monsoon air lies south of the ITCZ.</text>
<text x="290" y="342" font-size="13" text-anchor="middle" fill="#102A43" font-style="italic">Schematic; positions approximate (check your textbook).</text>
