<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Schematic of the seasonal shift of the ITCZ over Cameroon with the harmattan and the monsoon</title><rect width="560" height="360" fill="#fff"/>
