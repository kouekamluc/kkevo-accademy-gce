<text x="169.5" y="224.69230769230768" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">ITCZ near the coast</text>
<path d="M202,108 L147,146" stroke="#B45309" stroke-width="3"/><path d="M147,146 l4,-12 l8,8 Z" fill="#B45309" stroke="#B45309" stroke-width="2"/>
<path d="M147,140 L92,178" stroke="#B45309" stroke-width="3"/><path d="M92,178 l4,-12 l8,8 Z" fill="#B45309" stroke="#B45309" stroke-width="2"/>
