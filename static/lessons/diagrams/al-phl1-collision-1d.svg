<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Before and after a head-on elastic collision: a 2 kg trolley moving at 6 metres per second hits a stationary 4 kg trolley; afterwards the 2 kg trolley moves back at 2 m/s and the 4 kg trolley forward at 4 m/s</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="30.0" y="34.0" font-size="16" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="600">Before</text>
<line x1="30.0" y1="160.0" x2="530.0" y2="160.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="90.0" y="100.0" width="60.0" height="46.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" rx="0"/>
<text x="120.0" y="123.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">2 kg</text>
<circle cx="104.0" cy="153.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<circle cx="136.0" cy="153.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<rect x="330.0" y="90.0" width="80.0" height="56.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" rx="0"/>
<text x="370.0" y="118.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">4 kg</text>
<circle cx="344.0" cy="153.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<circle cx="396.0" cy="153.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<line x1="155.0" y1="123.0" x2="234.0" y2="123.0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polygon points="245.0,123.0 234.0,127.6 234.0,118.4" fill="#047857"/>
<text x="200.0" y="100.0" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="600">6 m/s</text>
<text x="370.0" y="66.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">at rest</text>
<text x="30.0" y="204.0" font-size="16" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="600">After</text>
<line x1="30.0" y1="330.0" x2="530.0" y2="330.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="170.0" y="270.0" width="60.0" height="46.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" rx="0"/>
<text x="200.0" y="293.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">2 kg</text>
<circle cx="184.0" cy="323.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<circle cx="216.0" cy="323.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<rect x="360.0" y="260.0" width="80.0" height="56.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" rx="0"/>
<text x="400.0" y="288.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">4 kg</text>
<circle cx="374.0" cy="323.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<circle cx="426.0" cy="323.0" r="6.0" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<line x1="165.0" y1="293.0" x2="111.0" y2="293.0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polygon points="100.0,293.0 111.0,288.4 111.0,297.6" fill="#047857"/>
<text x="135.0" y="268.0" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="600">2 m/s</text>
<line x1="445.0" y1="288.0" x2="504.0" y2="288.0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polygon points="515.0,288.0 504.0,292.6 504.0,283.4" fill="#047857"/>
<text x="480.0" y="262.0" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="600">4 m/s</text>
</svg>
