<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Five-step flow: ship berths, goods unloaded, customs check, storage, onward transport by road or rail"><rect width="560" height="360" fill="#fff"/>
<text x="280" y="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" font-weight="700">What happens to imported goods at a port (schematic)</text>
<rect x="20" y="110" width="96" height="90" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="68.0" y="142.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">1. Ship</text><text x="68.0" y="159.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">arrives at</text><text x="68.0" y="176.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">the quay</text>
<polygon points="116,146 128,155 116,164" fill="#102A43"/>
<rect x="128" y="110" width="96" height="90" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="176.0" y="142.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">2. Unload</text><text x="176.0" y="159.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">cranes and</text><text x="176.0" y="176.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">handling</text>
<polygon points="224,146 236,155 224,164" fill="#102A43"/>
<rect x="236" y="110" width="96" height="90" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="284.0" y="142.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">3. Customs</text><text x="284.0" y="159.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">checks and</text><text x="284.0" y="176.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">duty paid</text>
<polygon points="332,146 344,155 332,164" fill="#102A43"/>
<rect x="344" y="110" width="96" height="90" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="392.0" y="142.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">4. Storage</text><text x="392.0" y="159.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">port sheds</text><text x="392.0" y="176.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">or yard</text>
<polygon points="440,146 452,155 440,164" fill="#102A43"/>
<rect x="452" y="110" width="96" height="90" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="500.0" y="142.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">5. Onward</text><text x="500.0" y="159.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">by road</text><text x="500.0" y="176.6" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">or rail</text>
<text x="280" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Port Authority: runs berths, equipment and port services.</text>
<text x="280" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Customs: checks goods and collects duty.</text>
<text x="280" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Transit goods carry on towards neighbouring countries.</text>
</svg>
