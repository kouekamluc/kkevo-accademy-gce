<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" role="img"><rect width="560" height="365" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">The shifting cultivation cycle</text><circle cx="280" cy="200" r="105" fill="#ECFDF5" stroke="#047857" stroke-width="3"/><circle cx="280.0" cy="95.0" r="9" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="385.0" cy="200.0" r="9" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="280.0" cy="305.0" r="9" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="175.0" cy="200.0" r="9" fill="#2563EB" stroke="#102A43" stroke-width="2"/><rect x="200" y="45" width="160" height="44" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280" y="65" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">1. Clear and burn</text><text x="280" y="82" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">ash adds nutrients</text><rect x="400" y="178" width="155" height="44" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="477" y="198" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">2. Plant</text><text x="477" y="215" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">maize, cassava, yam</text><rect x="200" y="308" width="160" height="44" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280" y="328" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">3. Yields fall</text><text x="280" y="345" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">after 2-3 years</text><rect x="5" y="178" width="155" height="44" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="82" y="198" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">4. Fallow</text><text x="82" y="215" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">bush regrows</text><text x="280" y="196" font-size="14" text-anchor="middle" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">Then move to a</text><text x="280" y="216" font-size="14" text-anchor="middle" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">new plot</text></svg>