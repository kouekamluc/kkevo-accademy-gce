<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>A circuit with three branches</title><desc>Two cells and three resistors in three parallel branches between points A and B. The left branch has a 12 volt cell and a 4 ohm resistor, the middle branch a 6 ohm resistor, the right branch a 6 volt cell and a 2 ohm resistor.</desc><rect width="560" height="360" fill="#FFFFFF"/><line x1="110" y1="80" x2="450" y2="80" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="290" x2="450" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="80" x2="110" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="94" y1="155" x2="126" y2="155" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="102" y1="165" x2="118" y2="165" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="165" x2="110" y2="205" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polyline points="110.0,205.0 110.0,215.0 102.0,218.8 118.0,226.2 102.0,233.8 118.0,241.2 102.0,248.8 118.0,256.2 110.0,260.0 110.0,270.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="270" x2="110" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="280" y1="80" x2="280" y2="130" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polyline points="280.0,130.0 280.0,140.0 272.0,148.3 288.0,165.0 272.0,181.7 288.0,198.3 272.0,215.0 288.0,231.7 280.0,240.0 280.0,250.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="280" y1="250" x2="280" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="80" x2="450" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="434" y1="155" x2="466" y2="155" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="442" y1="165" x2="458" y2="165" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="165" x2="450" y2="205" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polyline points="450.0,205.0 450.0,215.0 442.0,218.8 458.0,226.2 442.0,233.8 458.0,241.2 442.0,248.8 458.0,256.2 450.0,260.0 450.0,270.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="450" y1="270" x2="450" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><circle cx="280" cy="80" r="4" fill="#102A43"/><circle cx="280" cy="290" r="4" fill="#102A43"/><text x="86" y="158" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end" fill="#102A43" font-weight="normal">E1</text><text x="86" y="176" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end" fill="#102A43" font-weight="normal">12 V</text><text x="130" y="242" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">R1</text><text x="130" y="260" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">4 ohm</text><text x="300" y="186" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">R3</text><text x="300" y="204" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">6 ohm</text><text x="474" y="158" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">E2</text><text x="474" y="176" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="start" fill="#102A43" font-weight="normal">6 V</text><text x="430" y="242" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end" fill="#102A43" font-weight="normal">R2</text><text x="430" y="260" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="end" fill="#102A43" font-weight="normal">2 ohm</text><text x="266" y="70" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="end" fill="#102A43" font-weight="bold">A</text><text x="266" y="312" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="end" fill="#102A43" font-weight="bold">B</text><text x="280" y="336" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">The long plate (positive side) of each cell is at the top.</text></svg>