<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<rect x="20" y="20" width="520" height="320" fill="#ECFDF5" stroke="#102A43" stroke-width="2" rx="6"/>
<circle cx="280" cy="220" r="90" fill="#ffffff" stroke="#B45309" stroke-width="3"/>
<text x="280" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#B45309">F: first-years</text>
<text x="280" y="238" text-anchor="middle" font-size="14" fill="#102A43">not in the group E</text>
<text x="46" y="60" font-size="16" font-weight="700" fill="#047857">E: allowed to enter</text>
<text x="46" y="82" font-size="14" fill="#102A43">(shaded: everyone who is not a first-year)</text>
<text x="514" y="322" text-anchor="end" font-size="13" fill="#102A43">Whole box = all students</text>
</svg>
