<line x1="70" y1="39" x2="70" y2="30" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="85.5" y1="43.2" x2="90" y2="35.4" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="96.8" y1="54.5" x2="104.6" y2="50" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="128" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700" >Sun</text>
<rect x="120" y="130" width="420" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="330" y="155" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="700" >Greenhouse gases in the atmosphere</text>
<text x="330" y="175" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="400" >(carbon dioxide, methane, water vapour)</text>
<rect x="120" y="300" width="420" height="50" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2" />
<text x="330" y="330" font-size="14" text-anchor="middle" fill="#047857" font-weight="700" >Earth's surface (land and sea)</text>
<line x1="100" y1="90" x2="160" y2="296" stroke="#B45309" stroke-width="4" marker-end="url(#aB45309)" stroke-linecap="round"/>
<text x="60" y="220" font-size="13" text-anchor="start" fill="#B45309" font-weight="700" >Sunlight</text>
<line x1="235" y1="194" x2="235" y2="294" stroke="#B91C1C" stroke-width="4" marker-end="url(#aB91C1C)" stroke-linecap="round"/>
<text x="243" y="226" font-size="13" text-anchor="start" fill="#B91C1C" font-weight="700" >Gases send some</text>
<text x="243" y="242" font-size="13" text-anchor="start" fill="#B91C1C" font-weight="700" >heat back down</text>
<line x1="380" y1="296" x2="380" y2="194" stroke="#B91C1C" stroke-width="4" marker-end="url(#aB91C1C)" stroke-linecap="round"/>
<text x="388" y="262" font-size="13" text-anchor="start" fill="#B91C1C" font-weight="700" >Heat (infrared)</text>
<text x="388" y="278" font-size="13" text-anchor="start" fill="#B91C1C" font-weight="700" >leaves the surface</text>
<line x1="520" y1="296" x2="520" y2="56" stroke="#B91C1C" stroke-width="4" marker-end="url(#aB91C1C)" stroke-linecap="round"/>
<text x="512" y="86" font-size="13" text-anchor="end" fill="#B91C1C" font-weight="700" >Some heat</text>
<text x="512" y="102" font-size="13" text-anchor="end" fill="#B91C1C" font-weight="700" >escapes to space</text>
<text x="280" y="372" font-size="13" text-anchor="middle" fill="#64748B" font-weight="400" >More greenhouse gases means more heat sent back, so the surface warms.</text>
</svg>
