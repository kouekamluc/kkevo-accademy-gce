<line x1="70" y1="101" x2="70" y2="110" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="54.5" y1="96.8" x2="50" y2="104.6" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="43.2" y1="85.5" x2="35.4" y2="90" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="39" y1="70" x2="30" y2="70" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
