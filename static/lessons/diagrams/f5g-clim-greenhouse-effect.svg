<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Inter, Arial, sans-serif">
<rect width="560" height="380" fill="#FFFFFF"/>
<defs><marker id="aB45309" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="aB91C1C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<text x="280" y="24" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >The greenhouse effect</text>
<circle cx="70" cy="70" r="26" fill="#FCD34D" stroke="#B45309" stroke-width="2"/>
<line x1="101" y1="70" x2="110" y2="70" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
