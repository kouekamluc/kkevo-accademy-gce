<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Trade flows between AICs, LICs and NICs showing manufactured goods going to LICs and raw materials going to AICs"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="380" fill="#ffffff"/><text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">World trade patterns (qualitative)</text><rect x="10.0" y="100.0" width="140" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="80.0" y="136.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">AICs</text><text x="80.0" y="153.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">rich countries</text><rect x="410.0" y="100.0" width="140" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="480.0" y="136.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">LICs</text><text x="480.0" y="153.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">poorer countries</text><rect x="210.0" y="270.0" width="140" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="301.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">NICs and</text><text x="280.0" y="318.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">emerging</text><line x1="150.0" y1="125.0" x2="410.0" y2="125.0" stroke="#047857" stroke-width="3" marker-end="url(#ar)"/><text x="280.0" y="116.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#047857" text-anchor="middle">Machines, vehicles, medicines</text><line x1="410.0" y1="155.0" x2="150.0" y2="155.0" stroke="#B45309" stroke-width="5" marker-end="url(#ar)"/><text x="280.0" y="190.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#B45309" text-anchor="middle">Oil, cocoa, cotton, timber, minerals</text><line x1="95.0" y1="184.0" x2="235.0" y2="266.0" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><line x1="210.0" y1="266.0" x2="70.0" y2="184.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="465.0" y1="184.0" x2="325.0" y2="266.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="350.0" y1="266.0" x2="490.0" y2="184.0" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><text x="280.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#2563EB" text-anchor="middle">Largest flows: between AICs themselves,</text><text x="280.0" y="70.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#2563EB" text-anchor="middle">mostly manufactures and services</text><text x="280.0" y="362.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">Thicker arrows show larger or more important flows. Not to scale.</text></svg>