<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Seven points rising along a curve, a perfect rank relationship</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="70.0" y1="290.0" x2="520.0" y2="290.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="290.0" x2="70.0" y2="40.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="290.0" x2="70.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="70.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">0</text>
<line x1="126.2" y1="290.0" x2="126.2" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="126.2" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">1</text>
<line x1="182.5" y1="290.0" x2="182.5" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="182.5" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">2</text>
<line x1="238.8" y1="290.0" x2="238.8" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="238.8" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">3</text>
<line x1="295.0" y1="290.0" x2="295.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="295.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">4</text>
<line x1="351.2" y1="290.0" x2="351.2" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="351.2" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">5</text>
<line x1="407.5" y1="290.0" x2="407.5" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="407.5" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">6</text>
<line x1="463.8" y1="290.0" x2="463.8" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="463.8" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">7</text>
<line x1="520.0" y1="290.0" x2="520.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="520.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">8</text>
<line x1="64.0" y1="290.0" x2="70.0" y2="290.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="60.0" y="295.0" font-size="14" fill="#102A43" text-anchor="end">0</text>
<line x1="64.0" y1="200.7" x2="70.0" y2="200.7" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="60.0" y="205.7" font-size="14" fill="#102A43" text-anchor="end">10</text>
<line x1="64.0" y1="111.4" x2="70.0" y2="111.4" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="60.0" y="116.4" font-size="14" fill="#102A43" text-anchor="end">20</text>
<text x="295.0" y="340.0" font-size="14" fill="#102A43" text-anchor="middle">x (ranked 1 to 7)</text>
<text x="18" y="165" font-size="14" fill="#102A43" text-anchor="middle" transform="rotate(-90 18 165)">y</text>
<circle cx="126.2" cy="276.6" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="182.5" cy="272.1" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="238.8" cy="261.4" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="295.0" cy="245.4" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="351.2" cy="215.0" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="407.5" cy="165.0" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<circle cx="463.8" cy="66.8" r="6" fill="#2563EB" stroke="none" stroke-width="2"/>
<polyline points="126.2,276.6 182.5,272.1 238.8,261.4 295.0,245.4 351.2,215.0 407.5,165.0 463.8,66.8" fill="none" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
<text x="103.8" y="75.7" font-size="14" fill="#047857" text-anchor="start" font-weight="700">Ranks agree exactly,</text>
<text x="103.8" y="102.5" font-size="14" fill="#102A43" text-anchor="start">but the points are not on a line</text>
<text x="300.0" y="24.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Always rising, curved: Spearman 1, PMCC below 1</text>
</svg>
