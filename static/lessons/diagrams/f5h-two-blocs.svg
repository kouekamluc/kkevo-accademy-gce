<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14"><rect width="560" height="360" fill="#fff"/><text x="280" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">The two blocs</text><rect x="20" y="50" width="220" height="230" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><rect x="320" y="50" width="220" height="230" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="130" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Western bloc</text><text x="130" y="142" text-anchor="middle" font-size="14" fill="#102A43">USA and allies</text><text x="130" y="172" text-anchor="middle" font-size="14" fill="#102A43">Capitalism and</text><text x="130" y="202" text-anchor="middle" font-size="14" fill="#102A43">democracy</text><text x="130" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">NATO (1949)</text><text x="430" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Eastern bloc</text><text x="430" y="142" text-anchor="middle" font-size="14" fill="#102A43">USSR and allies</text><text x="430" y="172" text-anchor="middle" font-size="14" fill="#102A43">Communism and</text><text x="430" y="202" text-anchor="middle" font-size="14" fill="#102A43">one-party rule</text><text x="430" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Warsaw Pact (1955)</text><line x1="245" y1="165" x2="315" y2="165" stroke="#047857" stroke-width="3" stroke-dasharray="6 5"/><text x="280" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Rivalry</text><text x="280" y="188" text-anchor="middle" font-size="14" fill="#047857">no direct</text><text x="280" y="206" text-anchor="middle" font-size="14" fill="#047857">war</text><rect x="80" y="298" width="400" height="44" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="325" text-anchor="middle