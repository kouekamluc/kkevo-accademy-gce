<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-label="Primary, secondary and tertiary industry; secondary divided into heavy and light manufacturing"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="350" fill="#ffffff"/><text x="280.0" y="24.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">The three groups of industry</text><rect x="15.0" y="44.0" width="160" height="92" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="95.0" y="69.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">PRIMARY</text><text x="95.0" y="86.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Get raw materials</text><text x="95.0" y="103.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">farming, mining,</text><text x="95.0" y="120.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">fishing, forestry</text><rect x="200.0" y="44.0" width="160" height="92" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280.0" y="77.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">SECONDARY</text><text x="280.0" y="94.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Make or process</text><text x="280.0" y="111.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">goods: manufacturing</text><rect x="385.0" y="44.0" width="160" height="92" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465.0" y="69.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">TERTIARY</text><text x="465.0" y="86.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Provide services</text><text x="465.0" y="103.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">trade, transport,</text><text x="465.0" y="120.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">banking, teaching</text><line x1="175.0" y1="90.0" x2="200.0" y2="90.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="360.0" y1="90.0" x2="385.0" y2="90.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="280.0" y1="136.0" x2="175.0" y2="190.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="280.0" y1="136.0" x2="385.0" y2="190.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="95.0" y="190.0" width="160" height="110" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="175.0" y="217.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">HEAVY</text><text x="175.0" y="233.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">Bulky raw materials,</text><text x="175.0" y="249.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">big machines:</text><text x="175.0" y="265.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">steel, cement,</text><text x="175.0" y="281.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">ships, aluminium</text><rect x="305.0" y="190.0" width="160" height="110" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="385.0" y="217.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">LIGHT</text><text x="385.0" y="233.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">Small, light goods,</text><text x="385.0" y="249.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">less power:</text><text x="385.0" y="265.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">clothes, soap,</text><text x="385.0" y="281.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">electronics, bread</text><text x="280.0" y="330.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">Secondary industry is split into heavy and light manufacturing</text></svg>