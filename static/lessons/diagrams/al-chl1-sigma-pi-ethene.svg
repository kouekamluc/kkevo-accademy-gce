<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Sigma and pi bonding in ethene: a sigma bond along the C-C axis and a pi bond as two lobes above and below the molecular plane</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="280.0" y="26.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >Ethene, C2H4: one sigma bond and one pi bond between the carbons</text>
<line x1="200.0" y1="180.0" x2="130.0" y2="128.0" stroke="#102A43" stroke-width="2.5" />
<circle cx="130.0" cy="128.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="130.0" y="133.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<line x1="200.0" y1="180.0" x2="130.0" y2="232.0" stroke="#102A43" stroke-width="2.5" />
<circle cx="130.0" cy="232.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="130.0" y="237.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<line x1="360.0" y1="180.0" x2="430.0" y2="128.0" stroke="#102A43" stroke-width="2.5" />
<circle cx="430.0" cy="128.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="430.0" y="133.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<line x1="360.0" y1="180.0" x2="430.0" y2="232.0" stroke="#102A43" stroke-width="2.5" />
<circle cx="430.0" cy="232.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="430.0" y="237.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<ellipse cx="280.0" cy="112.0" rx="100" ry="34" fill="#B4530933" stroke="#B45309" stroke-width="2.5" transform="rotate(0 280.0 112.0)" />
<ellipse cx="280.0" cy="248.0" rx="100" ry="34" fill="#B4530933" stroke="#B45309" stroke-width="2.5" transform="rotate(0 280.0 248.0)" />
<line x1="200.0" y1="180.0" x2="360.0" y2="180.0" stroke="#2563EB" stroke-width="4" />
<circle cx="200.0" cy="180.0" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="200.0" y="185.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >C</text>
<circle cx="360.0" cy="180.0" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="360.0" y="185.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >C</text>
<text x="280.0" y="172.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700" >sigma</text>
<text x="280.0" y="118.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" >pi bond (above the plane)</text>
<text x="280.0" y="254.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" >pi bond (below the plane)</text>
<text x="280.0" y="304.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="600" >Sigma: head-on overlap of sp2 orbitals, along the bond axis.</text>
<text x="280.0" y="324.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="600" >Pi: sideways overlap of two parallel p orbitals, above and below the plane.</text>
<text x="280.0" y="344.0" font-size="13" fill="#047857" text-anchor="middle" font-weight="600" >All six atoms lie in one plane; the H-C-H and H-C-C angles are about 120 degrees.</text>
</svg>
