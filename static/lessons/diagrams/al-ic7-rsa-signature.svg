<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 z" fill="#102A43"/></marker><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 z" fill="#B45309"/></marker></defs><text x="125" y="24" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Sender signs</text><text x="435" y="24" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Receiver verifies</text><rect x="20" y="40" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125" y="67.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Document</text><line x1="125" y1="86" x2="125" y2="110" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="110" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125" y="128.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Hash of the</text><text x="125" y="145.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">document</text><line x1="125" y1="156" x2="125" y2="180" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="180" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125" y="198.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Transform the hash with</text><text x="125" y="215.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">the PRIVATE key</text><line x1="125" y1="226" x2="125" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="250" width="210" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="125" y="277.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Signature</text><rect x="330" y="40" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="435" y="58.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Hash the received</text><text x="435" y="75.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">document</text><rect x="330" y="110" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="435" y="128.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Open the signature with</text><text x="435" y="145.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">the sender's PUBLIC key</text><line x1="435" y1="156" x2="435" y2="180" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="330" y="180" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="435" y="207.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Compare the two hashes</text><line x1="435" y1="226" x2="435" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="330" y="250" width="210" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="435" y="268.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Equal: valid</text><text x="435" y="285.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Different: reject</text><path d="M540,63 L552,63 L552,203 L542,203" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="230" y1="263" x2="330" y2="133" stroke="#B45309" stroke-width="3" marker-end="url(#ab)"/><text x="280" y="328" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Document and signature are sent to the receiver (amber arrow).</text><text x="280" y="348" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">The two hashes match only if the document is unchanged.</text></svg>