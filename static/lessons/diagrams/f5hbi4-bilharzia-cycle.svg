<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>Bilharzia life cycle</title><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="32" text-anchor="middle" font-size="16" fill="#102A43" font-weight="700">Life cycle of the bilharzia worm</text><rect x="20" y="70" width="200" height="66" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="120" y="99" text-anchor="middle" font-weight="700" font-size="15">Person with worms</text><text x="120" y="119" text-anchor="middle" font-size="13">eggs in urine or faeces</text><rect x="340" y="70" width="200" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="440" y="99" text-anchor="middle" font-weight="700" font-size="15">Eggs in fresh water</text><text x="440" y="119" text-anchor="middle" font-size="13">hatch into larvae</text><rect x="340" y="230" width="200" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="440" y="259" text-anchor="middle" font-weight="700" font-size="15">Larvae infect snail</text><text x="440" y="279" text-anchor="middle" font-size="13">multiply in the snail</text><rect x="20" y="230" width="200" height="66" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="120" y="259" text-anchor="middle" font-weight="700" font-size="15">Larvae swim free</text><text x="120" y="279" text-anchor="middle" font-size="13">enter skin of person</text><line x1="220" y1="103" x2="340" y2="103" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="440" y1="136" x2="440" y2="230" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="263" x2="220" y2="263" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="120" y1="230" x2="120" y2="136" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="320" text-anchor="middle" font-size="13" fill="#102A43">Contact with infested water lets larvae enter the skin</text></g></svg>