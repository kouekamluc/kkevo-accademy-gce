<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Three rays inside glass meeting a glass-air boundary: below the critical angle most light leaves, at the critical angle the ray skims the surface, above it the ray is totally reflected</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="10" y="170" width="170" height="160" rx="0" fill="#EFF6FF" stroke="#EFF6FF" stroke-width="2"/>
<line x1="10" y1="170" x2="180" y2="170" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="95" y1="60" x2="95" y2="300" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="45" y1="256.6" x2="95" y2="170" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="74.5,205.5 69.8,222.3 62.3,218" fill="#2563EB"/>
<line x1="95" y1="170" x2="170" y2="103.9" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="146.8,124.4 136.9,138.8 131.2,132.3" fill="#047857"/>
<text x="95" y="28" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">i less than c</text>
<text x="24" y="156" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">air</text>
<text x="24" y="190" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">glass</text>
<rect x="195" y="170" width="170" height="160" rx="0" fill="#EFF6FF" stroke="#EFF6FF" stroke-width="2"/>
<line x1="195" y1="170" x2="365" y2="170" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="280" y1="60" x2="280" y2="300" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="213.3" y1="244.5" x2="280" y2="170" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="252.7,200.6 244.6,216 238.2,210.3" fill="#2563EB"/>
<line x1="280" y1="170" x2="358" y2="169" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="335.8,169.3 319,173.8 318.8,165.2" fill="#047857"/>
<text x="280" y="28" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">i = c</text>
<text x="209" y="156" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">air</text>
<text x="209" y="190" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">glass</text>
<rect x="380" y="170" width="170" height="160" rx="0" fill="#EFF6FF" stroke="#EFF6FF" stroke-width="2"/>
<line x1="380" y1="170" x2="550" y2="170" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="465" y1="60" x2="465" y2="300" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="383.1" y1="227.4" x2="465" y2="170" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="431.4,193.5 420,206.7 415.1,199.7" fill="#2563EB"/>
<line x1="465" y1="170" x2="546.9" y2="227.4" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="521.5,209.6 505.2,203.4 510.2,196.3" fill="#047857"/>
<text x="465" y="28" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">i greater than c</text>
<text x="394" y="156" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">air</text>
<text x="394" y="190" font-size="13" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">glass</text>
<text x="95" y="345" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="400">ray refracts out</text>
<text x="280" y="345" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="400">ray along boundary</text>
<text x="465" y="345" font-size="13" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">total internal reflection</text>
<text x="280" y="18" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="400"></text>
</svg>
