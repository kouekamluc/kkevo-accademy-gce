<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>grid-template-areas for a page</title><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><text x="130" y="22" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#B45309">220px</text><text x="355" y="22" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#B45309">1fr</text><rect x="60" y="30" width="440" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="66" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">head  (header)</text><rect x="60" y="100" width="140" height="180" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="130" y="196" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">nav</text><rect x="210" y="100" width="290" height="180" rx="4" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="355" y="196" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">main</text><rect x="60" y="290" width="440" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="316" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">foot  (footer)</text><text x="280" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">rows: "head head" / "nav main" / "foot foot"</text></svg>