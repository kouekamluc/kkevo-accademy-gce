<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<title>Abraham's journey, schematic map</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="28" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">Abraham's journey (schematic)</text>
<rect x="20" y="44" width="150" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95" y="70" font-size="14" fill="#2563EB" text-anchor="middle">Mediterranean Sea</text>
<path d="M40 340 C40 300 45 270 50 240" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="32" y="230" font-size="14" fill="#2563EB" text-anchor="start">Nile</text>
<circle cx="480" cy="250" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<text x="480" y="236" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Ur</text>
<circle cx="330" cy="110" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<text x="330" y="96" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Haran</text>
<circle cx="200" cy="215" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<text x="186" y="220" font-size="14" fill="#102A43" text-anchor="end" font-weight="700">Canaan</text>
<circle cx="110" cy="320" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/>
<text x="110" y="346" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Egypt</text>
<line x1="472" y1="242" x2="345.4" y2="126.7" stroke="#B45309" stroke-width="2"/>
<polygon points="338,120 342.0,130.4 348.8,123.0" fill="#B45309"/>
<line x1="322" y1="118" x2="214.9" y2="201.8" stroke="#B45309" stroke-width="2"/>
<polygon points="207,208 218.0,205.8 211.8,197.9" fill="#B45309"/>
<line x1="190" y1="226" x2="124.4" y2="304.3" stroke="#047857" stroke-width="2"/>
<polygon points="118,312 128.3,307.5 120.6,301.1" fill="#047857"/>
<text x="420" y="170" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">1</text>
<text x="250" y="150" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">2</text>
<text x="200" y="300" font-size="14" fill="#102A43" text-anchor="start">1 Ur to Haran</text>
<text x="200" y="322" font-size="14" fill="#102A43" text-anchor="start">2 Haran to Canaan</text>
<text x="200" y="344" font-size="14" fill="#047857" text-anchor="start">Green: a stay in Egypt</text>
</svg>
