<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14"><rect width="560" height="360" fill="#fff"/><text x="280" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">OAU and African Union compared</text><rect x="20" y="48" width="255" height="282" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><rect x="285" y="48" width="255" height="282" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="147" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">OAU</text><text x="147" y="128" text-anchor="middle" font-size="14" fill="#102A43">Addis Ababa</text><text x="147" y="152" text-anchor="middle" font-size="14" fill="#102A43">25 May 1963</text><text x="147" y="200" text-anchor="middle" font-size="14" fill="#102A43">Ends colonialism</text><text x="147" y="224" text-anchor="middle" font-size="14" fill="#102A43">Unity, sovereignty</text><text x="147" y="248" text-anchor="middle" font-size="14" fill="#102A43">Non-interference</text><text x="147" y="272" text-anchor="middle" font-size="14" fill="#102A43">Colonial borders kept</text><text x="412" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">African Union</text><text x="412" y="128" text-anchor="middle" font-size="14" fill="#102A43">Durban</text><text x="412" y="152" text-anchor="middle" font-size="14" fill="#102A43">9 July 2002</text><text x="412" y="200" text-anchor="middle" font-size="14" fill="#102A43">Constitutive Act</text><text x="412" y="224" text-anchor="middle" font-size="14" fill="#102A43">Can intervene in grave</text><text x="412" y="248" text-anchor="middle" font-size="14" fill="#102A43">circumstances</text><text x="412" y="272" text-anchor="middle" font-size="14" fill="#102A43">Pan-African Parliament</text><text x="412" y="296" text-anchor="middle" font-size="14" fill="#102A43">Peace and Security</text><text x="412" y="320" text-anchor="middle" font-size="14" fill="#102A43">Council</text></svg>