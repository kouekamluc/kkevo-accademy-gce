<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Schematic of the four drainage basins of Cameroon around the Adamawa water divide</title><rect width="560" height="360" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/></marker></defs>
<rect x="190" y="150" width="180" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="280" y="175" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700">Adamawa plateau</text>
<text x="280" y="194" font-size="13" text-anchor="middle" fill="#102A43">main water divide</text>
<rect x="20" y="20" width="180" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="110" y="42" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">Niger basin</text>
<text x="110" y="64" font-size="13" text-anchor="middle" fill="#102A43">Benue, Faro,</text>
<text x="110" y="81" font-size="13" text-anchor="middle" fill="#102A43">Mayo K&#233;bi</text>
<text x="110" y="98" font-size="13" text-anchor="middle" fill="#102A43">to the Niger, then</text>
<text x="110" y="115" font-size="13" text-anchor="middle" fill="#102A43">the Atlantic</text>
<line x1="190" y1="150" x2="170" y2="130" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="360" y="20" width="180" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="450" y="42" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">Lake Chad basin</text>
<text x="450" y="64" font-size="13" text-anchor="middle" fill="#102A43">Logone (Vina, Mb&#233;r&#233;),</text>
<text x="450" y="81" font-size="13" text-anchor="middle" fill="#102A43">Chari</text>
<text x="450" y="98" font-size="13" text-anchor="middle" fill="#102A43">to Lake Chad</text>
<text x="450" y="115" font-size="13" text-anchor="middle" fill="#102A43">(inland drainage)</text>
<line x1="370" y1="150" x2="390" y2="130" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="20" y="230" width="180" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="110" y="252" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">Atlantic basin</text>
<text x="110" y="274" font-size="13" text-anchor="middle" fill="#102A43">Sanaga (Dj&#233;rem, Lom),</text>
<text x="110" y="291" font-size="13" text-anchor="middle" fill="#102A43">Nyong, Ntem,</text>
<text x="110" y="308" font-size="13" text-anchor="middle" fill="#102A43">Wouri, Mungo</text>
<text x="110" y="325" font-size="13" text-anchor="middle" fill="#102A43">straight to the sea</text>
<line x1="190" y1="210" x2="170" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="360" y="230" width="180" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="450" y="252" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">Congo basin</text>
<text x="450" y="274" font-size="13" text-anchor="middle" fill="#102A43">Dja, Boumba, Kad&#233;&#239;,</text>
<text x="450" y="291" font-size="13" text-anchor="middle" fill="#102A43">Ngoko to the Sangha,</text>
<text x="450" y="308" font-size="13" text-anchor="middle" fill="#102A43">then the Congo</text>
<line x1="370" y1="210" x2="390" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="298" y="118" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700">N</text>
<path d="M280,128 L280,100" stroke="#102A43" stroke-width="2"/><path d="M274,108 L280,98 L286,108" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="280" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-style="italic">Schematic: boxes show</text>
<text x="280" y="270" font-size="13" text-anchor="middle" fill="#102A43" font-style="italic">direction of flow,</text>
<text x="280" y="288" font-size="13" text-anchor="middle" fill="#102A43" font-style="italic">not exact areas</text>
</svg>