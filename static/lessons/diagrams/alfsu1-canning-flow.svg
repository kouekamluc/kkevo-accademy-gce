<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="22.0" y="60.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="78.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43">1 Receive,</text><text x="78.0" y="104.5" font-size="13" text-anchor="middle" fill="#102A43">wash, grade</text><line x1="134.0" y1="92.0" x2="152.0" y2="92.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="152.0" y="60.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="208.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43">2 Peel, cut,</text><text x="208.0" y="104.5" font-size="13" text-anchor="middle" fill="#102A43">blanch</text><line x1="264.0" y1="92.0" x2="282.0" y2="92.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="282.0" y="60.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="338.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43">3 Fill, add</text><text x="338.0" y="104.5" font-size="13" text-anchor="middle" fill="#102A43">brine, headspace</text><line x1="394.0" y1="92.0" x2="412.0" y2="92.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="412.0" y="60.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="468.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43">4 Exhaust</text><text x="468.0" y="104.5" font-size="13" text-anchor="middle" fill="#102A43">(remove air)</text><rect x="412.0" y="220.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="468.0" y="248.6" font-size="13" text-anchor="middle" fill="#102A43">5 Seal: double</text><text x="468.0" y="264.6" font-size="13" text-anchor="middle" fill="#102A43">seam</text><line x1="412.0" y1="252.0" x2="394.0" y2="252.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="282.0" y="220.0" width="112.0" height="64.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="338.0" y="248.6" font-size="13" text-anchor="middle" fill="#102A43">6 Retort:</text><text x="338.0" y="264.6" font-size="13" text-anchor="middle" fill="#102A43">heat to F0</text><line x1="282.0" y1="252.0" x2="264.0" y2="252.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="152.0" y="220.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="208.0" y="248.6" font-size="13" text-anchor="middle" fill="#102A43">7 Cool in</text><text x="208.0" y="264.6" font-size="13" text-anchor="middle" fill="#102A43">chlorinated water</text><line x1="152.0" y1="252.0" x2="134.0" y2="252.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="22.0" y="220.0" width="112.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="78.0" y="248.6" font-size="13" text-anchor="middle" fill="#102A43">8 Dry, label,</text><text x="78.0" y="264.6" font-size="13" text-anchor="middle" fill="#102A43">store, incubate</text><line x1="468.0" y1="124.0" x2="468.0" y2="220.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280.0" y="35.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">Canning of a low-acid food</text><text x="280.0" y="328.0" font-size="13" text-anchor="middle" fill="#047857">Seal first, then heat: the sealed can stops recontamination</text></svg>