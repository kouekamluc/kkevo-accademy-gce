<circle cx="90" cy="170" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="90" y="188" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<circle cx="290" cy="170" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="290" y="152" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<circle cx="390" cy="170" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="390" y="152" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">2F</text>
<text x="280" y="345" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Slide between F and 2F: image beyond 2F, real, inverted, magnified</text>
