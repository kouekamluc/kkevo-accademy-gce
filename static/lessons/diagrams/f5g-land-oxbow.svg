<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="6" width="540" height="108" rx="6" fill="#fff" stroke="#64748B" stroke-width="2"/><rect x="20" y="12" width="190" height="96" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="0"/><g transform="translate(15,6) scale(1.0)"><path d="M20,95 L55,95 C55,95 25,45 78,30 C130,18 140,90 100,95 L170,95" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,95 L55,95 C55,95 25,45 78,30 C130,18 140,90 100,95 L170,95" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="46" y1="68" x2="62" y2="68" stroke="#B45309" stroke-width="3" marker-end="url(#ao)"/><line x1="116" y1="68" x2="100" y2="68" stroke="#B45309" stroke-width="3" marker-end="url(#ao)"/></g><text x="228" y="36" font-size="15" text-anchor="start" fill="#047857" font-weight="700">1. Meander loop grows</text><text x="228" y="58" font-size="14" text-anchor="start" fill="#102A43">The river erodes the outer banks of</text><text x="228" y="76" font-size="14" text-anchor="start" fill="#102A43">the loop. The neck of land between the</text><text x="228" y="94" font-size="14" text-anchor="start" fill="#102A43">two arms gets narrower.</text><rect x="10" y="124" width="540" height="108" rx="6" fill="#fff" stroke="#64748B" stroke-width="2"/><rect x="20" y="130" width="190" height="96" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="0"/><g transform="translate(15,124) scale(1.0)"><path d="M55,95 C55,95 25,45 78,30 C130,18 140,90 100,95 Z" fill="none" stroke="#93C5FD" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M55,95 C55,95 25,45 78,30 C130,18 140,90 100,95 Z" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,95 L170,95" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,95 L170,95" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text x="228" y="154" font-size="15" text-anchor="start" fill="#047857" font-weight="700">2. River cuts through the neck</text><text x="228" y="176" font-size="14" text-anchor="start" fill="#102A43">In a flood the river breaks through</text><text x="228" y="194" font-size="14" text-anchor="start" fill="#102A43">the narrow neck and takes the short,</text><text x="228" y="212" font-size="14" text-anchor="start" fill="#102A43">straight route.</text><rect x="10" y="242" width="540" height="108" rx="6" fill="#fff" stroke="#64748B" stroke-width="2"/><rect x="20" y="248" width="190" height="96" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="0"/><g transform="translate(15,242) scale(1.0)"><path d="M55,95 C55,95 25,45 78,30 C130,18 140,90 100,95 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,95 L170,95" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,95 L170,95" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="62" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">Ox-bow</text><text x="80" y="78" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">lake</text></g><text x="228" y="272" font-size="15" text-anchor="start" fill="#047857" font-weight="700">3. Ox-bow lake</text><text x="228" y="294" font-size="14" text-anchor="start" fill="#102A43">Silt seals the ends of the old loop.</text><text x="228" y="312" font-size="14" text-anchor="start" fill="#102A43">The loop becomes a curved lake cut off</text><text x="228" y="330" font-size="14" text-anchor="start" fill="#102A43">from the river.</text></svg>