<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>SR latch made from two NOR gates</title><defs><marker id="srn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="srb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="srg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="340" fill="#FFFFFF"/><text x="30" y="71" font-size="18" text-anchor="middle" font-weight="bold" fill="#102A43">R</text><text x="30" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#102A43">S</text><path d="M45 65 L232 65" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><path d="M45 255 L232 255" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><path d="M312 80 L470 80" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round"/><path d="M312 240 L470 240" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round"/><path d="M380 80 L380 130 L170 190 L170 225 L232 225" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/><path d="M380 240 L380 190 L190 130 L190 95 L232 95" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/><circle cx="380" cy="80" r="4.5" fill="#047857"/><circle cx="380" cy="240" r="4.5" fill="#047857"/><path d="M220 50Q270 50 300 80Q270 110 220 110Q240 80 220 50Z" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><circle cx="306" cy="80" r="6" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5"/><text x="262" y="128" font-size="14" text-anchor="middle" fill="#475569">NOR</text><path d="M220 210Q270 210 300 240Q270 270 220 270Q240 240 220 210Z" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><circle cx="306" cy="240" r="6" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5"/><text x="262" y="202" font-size="14" text-anchor="middle" fill="#475569">NOR</text><text x="480" y="86" font-size="18" font-weight="bold" fill="#047857">Q</text><text x="480" y="246" font-size="18" font-weight="bold" fill="#047857">Q</text><path d="M480 226 L493 226" fill="none" stroke="#047857" stroke-width="2" stroke-linejoin="round"/><text x="280" y="300" font-size="15" text-anchor="middle" fill="#102A43">S = 1 sets Q to 1.  R = 1 resets Q to 0.</text><text x="280" y="322" font-size="15" text-anchor="middle" fill="#102A43">S = R = 0 holds the last value.  S = R = 1 is not allowed.</text></svg>
