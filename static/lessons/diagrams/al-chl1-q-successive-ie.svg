<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Bar chart of the first six ionisation energies of element Y: 578, 1817, 2745, 11577, 14842, 18379 kJ per mole</title>
