<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="24.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">Roller milling of wheat</text><rect x="40.0" y="40.0" width="190.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="135.0" y="59.5" font-size="13" text-anchor="middle" fill="#102A43">Cleaning:</text><text x="135.0" y="75.5" font-size="13" text-anchor="middle" fill="#102A43">sieves, magnets</text><line x1="135.0" y1="86.0" x2="135.0" y2="100.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="40.0" y="100.0" width="190.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="135.0" y="119.5" font-size="13" text-anchor="middle" fill="#102A43">Conditioning:</text><text x="135.0" y="135.6" font-size="13" text-anchor="middle" fill="#102A43">add water, rest</text><line x1="135.0" y1="146.0" x2="135.0" y2="160.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="40.0" y="160.0" width="190.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="135.0" y="179.6" font-size="13" text-anchor="middle" fill="#102A43">Break rolls:</text><text x="135.0" y="195.6" font-size="13" text-anchor="middle" fill="#102A43">open the grain</text><line x1="135.0" y1="206.0" x2="135.0" y2="220.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="40.0" y="220.0" width="190.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="135.0" y="239.6" font-size="13" text-anchor="middle" fill="#102A43">Sifting and</text><text x="135.0" y="255.6" font-size="13" text-anchor="middle" fill="#102A43">purifying</text><line x1="135.0" y1="266.0" x2="135.0" y2="280.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="40.0" y="280.0" width="190.0" height="46.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="135.0" y="299.6" font-size="13" text-anchor="middle" fill="#102A43">Reduction rolls:</text><text x="135.0" y="315.6" font-size="13" text-anchor="middle" fill="#102A43">grind to flour</text><rect x="340.0" y="100.0" width="180.0" height="46.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="430.0" y="119.5" font-size="13" text-anchor="middle" fill="#102A43">Bran and germ</text><text x="430.0" y="135.6" font-size="13" text-anchor="middle" fill="#102A43">(offals, feed)</text><line x1="230.0" y1="163.0" x2="340.0" y2="130.0" stroke="#B45309" stroke-width="2" marker-end="url(#a)"/><rect x="340.0" y="280.0" width="180.0" height="46.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="430.0" y="299.6" font-size="13" text-anchor="middle" fill="#102A43">White flour</text><text x="430.0" y="315.6" font-size="13" text-anchor="middle" fill="#102A43">(about 72-75%)</text><line x1="230.0" y1="303.0" x2="340.0" y2="303.0" stroke="#047857" stroke-width="2" marker-end="url(#g)"/><text x="430.0" y="196.0" font-size="13" text-anchor="middle" fill="#B45309">Bran flakes are removed</text><text x="430.0" y="213.0" font-size="13" text-anchor="middle" fill="#B45309">at each stage</text></svg>