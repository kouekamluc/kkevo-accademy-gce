<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><text x="280" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Temperature and bacteria (approximate)</text><rect x="60" y="268" width="60" height="62" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><rect x="60" y="130" width="60" height="138" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="60" y="30" width="60" height="100" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><line x1="120" y1="325" x2="134" y2="325" stroke="#102A43" stroke-width="2"/><text x="54" y="330" text-anchor="end" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">-18</text><line x1="120" y1="268" x2="134" y2="268" stroke="#102A43" stroke-width="2"/><text x="54" y="272" text-anchor="end" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">5</text><line x1="120" y1="130" x2="134" y2="130" stroke="#102A43" stroke-width="2"/><text x="54" y="135" text-anchor="end" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">60</text><line x1="120" y1="92" x2="134" y2="92" stroke="#102A43" stroke-width="2"/><text x="54" y="98" text-anchor="end" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">75</text><text x="90.0" y="350" text-anchor="middle" font-size="13" fill="#102A43" font-family="Inter, Arial, sans-serif">degrees Celsius</text><text x="144" y="330" font-size="14" fill="#2563EB" font-family="Inter, Arial, sans-serif">Freezer: growth stops, not killed</text><text x="144" y="277" font-size="14" fill="#2563EB" font-family="Inter, Arial, sans-serif">Fridge: growth slow</text><text x="144" y="205" font-size="14" font-weight="700" fill="#B45309" font-family="Inter, Arial, sans-serif">Danger zone (about 5 to 60):</text><text x="144" y="223" font-size="14" font-weight="700" fill="#B45309" font-family="Inter, Arial, sans-serif">bacteria multiply fastest</text><text x="144" y="85" font-size="14" fill="#047857" font-family="Inter, Arial, sans-serif">Above about 60: hot holding;</text><text x="144" y="103" font-size="14" fill="#047857" font-family="Inter, Arial, sans-serif">about 75 at centre when cooking</text></svg>