<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Critical lenses</title><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Five approaches, five questions</text><rect x="20" y="50" width="160" height="120" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="100" y="90" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Formalist</text><text x="100" y="122" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">How is the</text><text x="100" y="142" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">text made?</text><rect x="200" y="50" width="160" height="120" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="90" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Marxist</text><text x="280" y="122" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Class, work</text><text x="280" y="142" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">and power?</text><rect x="380" y="50" width="160" height="120" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="460" y="90" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Feminist</text><text x="460" y="122" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">How is</text><text x="460" y="142" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">gender shown?</text><rect x="110" y="200" width="160" height="120" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="190" y="240" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Post-Colonial</text><text x="190" y="272" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Empire, language,</text><text x="190" y="292" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">identity?</text><rect x="290" y="200" width="160" height="120" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="370" y="240" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Psychoanalytic</text><text x="370" y="272" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">What does the</text><text x="370" y="292" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">mind hide?</text><text x="280" y="345" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Choose the lens that fits the question</text></svg>