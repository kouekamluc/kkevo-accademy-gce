<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Two tangents from an external point are equal and meet the radii at right angles</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<circle cx="190.0" cy="180.0" r="110.0" fill="none" stroke="#102A43" stroke-width="2.5"/>
<line x1="190.0" y1="180.0" x2="230.3" y2="77.7" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<line x1="190.0" y1="180.0" x2="230.3" y2="282.3" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<line x1="490.0" y1="180.0" x2="230.3" y2="77.7" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="490.0" y1="180.0" x2="230.3" y2="282.3" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="190.0" y1="180.0" x2="490.0" y2="180.0" stroke="#102A43" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
<path d="M225.2,90.7 L238.2,95.8 L243.4,82.8" fill="none" stroke="#047857" stroke-width="2.5"/>
<path d="M225.2,269.3 L238.2,264.2 L243.4,277.2" fill="none" stroke="#047857" stroke-width="2.5"/>
<line x1="363.1" y1="121.4" x2="357.2" y2="136.3" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<line x1="357.2" y1="223.7" x2="363.1" y2="238.6" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="190.0" cy="180.0" r="4" fill="#102A43"/>
<text x="170.0" y="180.0" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">O</text>
<circle cx="490.0" cy="180.0" r="4" fill="#102A43"/>
<text x="510.0" y="180.0" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">P</text>
<circle cx="230.3" cy="77.7" r="4" fill="#102A43"/>
<text x="230.3" y="57.7" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<circle cx="230.3" cy="282.3" r="4" fill="#102A43"/>
<text x="230.3" y="302.3" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">B</text>
<text x="20.0" y="30.0" font-size="18" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">PA = PB</text>
<text x="20.0" y="56.0" font-size="18" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">∠OAP = ∠OBP = 90°</text>
</svg>
