<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Economic growth and development overlap</title><defs><marker id="g1n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="g1b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="g1g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="g1a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="28.0" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700">Growth and development overlap</text><circle cx="215.0" cy="175.0" r="115" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><circle cx="345.0" cy="175.0" r="115" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="165.0" y="130.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">ECONOMIC</text><text x="165.0" y="150.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">GROWTH</text><text x="165.0" y="175.0" font-size="14" text-anchor="middle" fill="#102A43">more goods,</text><text x="165.0" y="194.0" font-size="14" text-anchor="middle" fill="#102A43">services and</text><text x="165.0" y="213.0" font-size="14" text-anchor="middle" fill="#102A43">income</text><text x="395.0" y="130.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">DEVELOPMENT</text><text x="395.0" y="155.0" font-size="14" text-anchor="middle" fill="#102A43">better health,</text><text x="395.0" y="174.0" font-size="14" text-anchor="middle" fill="#102A43">education, jobs</text><text x="395.0" y="193.0" font-size="14" text-anchor="middle" fill="#102A43">and fair chances</text><text x="280.0" y="140.0" font-size="13" text-anchor="middle" fill="#102A43">Growth</text><text x="280.0" y="159.0" font-size="13" text-anchor="middle" fill="#102A43">that reaches</text><text x="280.0" y="178.0" font-size="13" text-anchor="middle" fill="#102A43">ordinary</text><text x="280.0" y="197.0" font-size="13" text-anchor="middle" fill="#102A43">people</text><text x="280.0" y="322.0" font-size="14" text-anchor="middle" fill="#102A43">Poverty: not having enough for basic needs. Underdevelopment:</text><text x="280.0" y="342.0" font-size="14" text-anchor="middle" fill="#102A43">a country where development is low for most people.</text></svg>