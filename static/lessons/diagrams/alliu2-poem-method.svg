<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="34" font-family="Inter, Arial, sans-serif" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">Five questions for any poem</text>
<rect x="6.0" y="70" width="104" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="58.0" y="102" font-family="Inter, Arial, sans-serif" font-size="22" fill="#B45309" text-anchor="middle" font-weight="700">1</text>
<text x="58.0" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Who speaks?</text>
<text x="58.0" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The speaker</text>
<text x="58.0" y="181" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">or persona</text>
<line x1="111.0" y1="170" x2="116.0" y2="170" stroke="#102A43" stroke-width="2"/>
<polygon points="116.0,170 107.7,173.5 107.7,166.5" fill="#102A43"/>
<rect x="117.0" y="70" width="104" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="169.0" y="102" font-family="Inter, Arial, sans-serif" font-size="22" fill="#B45309" text-anchor="middle" font-weight="700">2</text>
<text x="169.0" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">To whom?</text>
<text x="169.0" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The addressee</text>
<line x1="222.0" y1="170" x2="227.0" y2="170" stroke="#102A43" stroke-width="2"/>
<polygon points="227.0,170 218.7,173.5 218.7,166.5" fill="#102A43"/>
<rect x="228.0" y="70" width="104" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="102" font-family="Inter, Arial, sans-serif" font-size="22" fill="#B45309" text-anchor="middle" font-weight="700">3</text>
<text x="280.0" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">About what?</text>
<text x="280.0" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Situation and</text>
<text x="280.0" y="181" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">subject</text>
<line x1="333.0" y1="170" x2="338.0" y2="170" stroke="#102A43" stroke-width="2"/>
<polygon points="338.0,170 329.7,173.5 329.7,166.5" fill="#102A43"/>
<rect x="339.0" y="70" width="104" height="200" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="391.0" y="102" font-family="Inter, Arial, sans-serif" font-size="22" fill="#B45309" text-anchor="middle" font-weight="700">4</text>
<text x="391.0" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">How?</text>
<text x="391.0" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Diction,</text>
<text x="391.0" y="181" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">images,</text>
<text x="391.0" y="198" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">sound, form</text>
<line x1="444.0" y1="170" x2="449.0" y2="170" stroke="#102A43" stroke-width="2"/>
<polygon points="449.0,170 440.7,173.5 440.7,166.5" fill="#102A43"/>
<rect x="450.0" y="70" width="104" height="200" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="502.0" y="102" font-family="Inter, Arial, sans-serif" font-size="22" fill="#B45309" text-anchor="middle" font-weight="700">5</text>
<text x="502.0" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">So what?</text>
<text x="502.0" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Theme,</text>
<text x="502.0" y="181" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">attitude,</text>
<text x="502.0" y="198" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">effect</text>
<text x="150" y="300" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">Meaning</text>
<text x="430" y="300" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">Criticism</text>
<line x1="6.0" y1="285" x2="332.0" y2="285" stroke="#2563EB" stroke-width="2"/>
<line x1="339.0" y1="285" x2="554.0" y2="285" stroke="#047857" stroke-width="2"/>
<text x="280" y="335" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">Questions 1 to 3 give meaning; 4 and 5 give criticism.</text>
</svg>
