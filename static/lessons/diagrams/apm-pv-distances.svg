rt">Point to line</text><path d="M310.0 250.0 L540.0 170.0" fill="none" stroke="#2563EB" stroke-width="3"/><path d="M420.0 90.0 L457.8 198.6" fill="none" stroke="#047857" stroke-width="3"/><circle cx="420" cy="90" r="5" fill="#102A43"/><circle cx="457.8" cy="198.6" r="5" fill="#102A43"/><text x="430.0" y="94.0" font-size="15" fill="#102A43" text-anchor="start">P</text><text x="449.8" y="222.6" font-size="15" fill="#102A43" text-anchor="start">F (foot)</text><text x="448.9" y="144.3" font-size="17" fill="#047857" font-weight="bold" text-anchor="start">d</text><path d="M444.6 203.2 L440.0 190.0 L453.2 185.4" fill="none" stroke="#B45309" stroke-width="2"/><text x="310.0" y="300.0" font-size="15" fill="#047857" font-weight="bold" text-anchor="start">PF · direction of line = 0</text><text x="310.0" y="326.0" font-size="14" fill="#102A43" text-anchor="start">Shortest distance = length PF</text></svg>