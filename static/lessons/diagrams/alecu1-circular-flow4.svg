<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">
<text x="280" y="24" text-anchor="middle" font-weight="700">Circular flow of income: four sectors</text>
<rect x="20" y="115" width="130" height="130" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="85.0" y="185.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Households</text>
<rect x="410" y="115" width="130" height="130" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="475.0" y="185.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Firms</text>
<rect x="215" y="46" width="130" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="73.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Government</text>
<rect x="215" y="272" width="130" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="299.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Financial sector</text>
<rect x="215" y="160" width="130" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="185.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Rest of world</text>
<line x1="150.0" y1="126.0" x2="404.0" y2="126.0" stroke="#102A43" stroke-width="2"/><polygon points="410.0,126.0 400.0,121.5 400.0,130.5" fill="#102A43"/>
<text x="280.0" y="119.0" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Consumer spending (C)</text>
<line x1="410.0" y1="234.0" x2="156.0" y2="234.0" stroke="#102A43" stroke-width="2"/><polygon points="150.0,234.0 160.0,238.5 160.0,229.5" fill="#102A43"/>
<text x="280.0" y="254.0" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Factor incomes (Y)</text>
<line x1="70.0" y1="115.0" x2="208.3" y2="73.7" stroke="#B45309" stroke-width="2"/><polygon points="214.0,72.0 203.1,70.5 205.7,79.2" fill="#B45309"/>
<text x="118.0" y="80.0" text-anchor="end" fill="#B45309" font-size="13" font-weight="400">Taxes (T)</text>
<line x1="70.0" y1="245.0" x2="208.3" y2="288.2" stroke="#B45309" stroke-width="2"/><polygon points="214.0,290.0 205.8,282.7 203.1,291.3" fill="#B45309"/>
<text x="118.0" y="296.0" text-anchor="end" fill="#B45309" font-size="13" font-weight="400">Saving (S)</text>
<line x1="150.0" y1="180.0" x2="208.0" y2="180.0" stroke="#B45309" stroke-width="2"/><polygon points="214.0,180.0 204.0,175.5 204.0,184.5" fill="#B45309"/>
<text x="182.0" y="172.0" text-anchor="middle" fill="#B45309" font-size="13" font-weight="700">M</text>
<line x1="346.0" y1="72.0" x2="470.3" y2="113.1" stroke="#047857" stroke-width="2"/><polygon points="476.0,115.0 467.9,107.6 465.1,116.1" fill="#047857"/>
<text x="400.0" y="70.0" text-anchor="start" fill="#047857" font-size="13" font-weight="400">Gov. spending (G)</text>
<line x1="346.0" y1="290.0" x2="470.3" y2="247.0" stroke="#047857" stroke-width="2"/><polygon points="476.0,245.0 465.1,244.0 468.0,252.5" fill="#047857"/>
<text x="400.0" y="300.0" text-anchor="start" fill="#047857" font-size="13" font-weight="400">Investment (I)</text>
<line x1="346.0" y1="180.0" x2="403.0" y2="180.0" stroke="#047857" stroke-width="2"/><polygon points="409.0,180.0 399.0,175.5 399.0,184.5" fill="#047857"/>
<text x="378.0" y="172.0" text-anchor="middle" fill="#047857" font-size="13" font-weight="700">X</text>
<text x="280.0" y="340.0" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Brown: leakages (S, T, M). Green: injections (I, G, X).</text>
</g></svg>