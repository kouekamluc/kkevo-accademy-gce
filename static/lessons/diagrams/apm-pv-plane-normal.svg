<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>A plane with a normal vector n and a vector AR lying in the plane</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><polygon points="110,250 400,250 480,170 190,170" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M280.0 215.0 L280.0 75.0" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/><text x="290.0" y="85.0" font-size="16" fill="#047857" font-weight="bold" text-anchor="start">n = normal</text><path d="M280.0 215.0 L380.0 195.0" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#ao)"/><circle cx="280" cy="215" r="5" fill="#102A43"/><circle cx="380" cy="195" r="5" fill="#102A43"/><text x="264.0" y="237.0" font-size="15" fill="#102A43" text-anchor="start">A</text><text x="388.0" y="217.0" font-size="15" fill="#102A43" text-anchor="start">R (any point)</text><path d="M296 211.5 L296 196 L280 196" fill="none" stroke="#102A43" stroke-width="2"/><text x="60.0" y="300.0" font-size="15" fill="#102A43" text-anchor="start">A and R lie in the plane, so AR is perpendicular to n:</text><text x="60.0" y="326.0" font-size="17" fill="#2563EB" font-weight="bold" text-anchor="start">(r − a) · n = 0  gives  r · n = a · n</text><text x="70.0" y="150.0" font-size="16" fill="#2563EB" font-weight="bold" text-anchor="start">plane Π</text></svg>