<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="28" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">The first four ecumenical councils</text>
<rect x="15" y="48" width="255" height="140" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<circle cx="39" cy="74" r="14" fill="#2563EB"/><text x="39" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text>
<text x="63" y="80" font-size="16" font-weight="bold" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">AD 325 Nicaea</text>
<text x="31" y="110" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Called by Constantine</text>
<text x="31" y="132" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Arius condemned</text>
<text x="31" y="154" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Son of one substance</text>
<text x="31" y="176" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">with the Father</text>
<rect x="290" y="48" width="255" height="140" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<circle cx="314" cy="74" r="14" fill="#2563EB"/><text x="314" y="79" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text>
<text x="338" y="80" font-size="16" font-weight="bold" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">AD 381 Constantinople</text>
<text x="306" y="110" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Nicaea reaffirmed</text>
<text x="306" y="132" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Creed extended to</text>
<text x="306" y="154" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">the Holy Spirit</text>
<rect x="15" y="204" width="255" height="140" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<circle cx="39" cy="230" r="14" fill="#2563EB"/><text x="39" y="235" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text>
<text x="63" y="236" font-size="16" font-weight="bold" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">AD 431 Ephesus</text>
<text x="31" y="266" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Nestorius condemned</text>
<text x="31" y="288" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Mary as Theotokos</text>
<text x="31" y="310" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">One person, not two</text>
<rect x="290" y="204" width="255" height="140" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<circle cx="314" cy="230" r="14" fill="#2563EB"/><text x="314" y="235" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text>
<text x="338" y="236" font-size="16" font-weight="bold" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">AD 451 Chalcedon</text>
<text x="306" y="266" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Marcian and Leo's Tome</text>
<text x="306" y="288" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">One person, two natures</text>
<text x="306" y="310" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Oriental Orthodox churches</text>
<text x="306" y="332" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">did not accept it</text>
</svg>
