<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Angle between two vectors and the projection of a on b</title><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><path d="M90.0 260.0 L470.0 260.0" fill="none" stroke="#102A43" stroke-width="3" marker-end="url(#ak)"/><path d="M90.0 260.0 L294.8 116.6" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/><path d="M294.8 116.6 L294.8 260.0" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5"/><path d="M90.0 260.0 L294.8 260.0" fill="none" stroke="#047857" stroke-width="5"/><path d="M280.8 260.0 L280.8 246.0 L294.8 246.0" fill="none" stroke="#B45309" stroke-width="2"/><path d="M150.0 260.0 A60 60 0 0 0 139.1 225.6" fill="none" stroke="#102A43" stroke-width="2"/><text x="158.0" y="246.0" font-size="15" fill="#102A43" text-anchor="start">θ</text><text x="68.0" y="266.0" font-size="15" fill="#102A43" text-anchor="start">O</text><text x="302.8" y="110.6" font-size="18" fill="#2563EB" font-weight="bold" text-anchor="start">a</text><text x="478.0" y="265.0" font-size="18" fill="#102A43" font-weight="bold" text-anchor="start">b</text><text x="130.0" y="290.0" font-size="15" fill="#047857" font-weight="bold" text-anchor="start">|a| cos θ (projection of a on b)</text><text x="30.0" y="40.0" font-size="18" fill="#102A43" font-weight="bold" text-anchor="start">a · b = |a| |b| cos θ</text><text x="30.0" y="66.0" font-size="15" fill="#102A43" text-anchor="start">= (length of b) × (projection of a on b)</text><text x="30.0" y="92.0" font-size="15" fill="#B45309" font-weight="bold" text-anchor="start">If θ = 90°, the projection is 0 and a · b = 0.</text></svg>