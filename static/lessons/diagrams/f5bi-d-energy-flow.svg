<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Energy passed along a food chain (kJ)</text><rect x="23.0" y="102.0" width="104" height="56" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="75" y="126.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Grass</text><text x="75" y="143.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">(producer)</text><text x="75" y="205" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">10 000 kJ</text><rect x="160.0" y="102.0" width="104" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="212" y="126.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Grasshopper</text><text x="212" y="143.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">(primary)</text><text x="212" y="205" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">1 000 kJ</text><rect x="297.0" y="102.0" width="104" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="349" y="126.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Frog</text><text x="349" y="143.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">(secondary)</text><text x="349" y="205" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">100 kJ</text><rect x="434.0" y="102.0" width="104" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="486" y="126.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Snake</text><text x="486" y="143.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">(tertiary)</text><text x="486" y="205" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">10 kJ</text><line x1="130.0" y1="130.0" x2="155.0" y2="130.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="267.0" y1="130.0" x2="292.0" y2="130.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="404.0" y1="130.0" x2="429.0" y2="130.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="212" y1="222" x2="212" y2="262" stroke="#B45309" stroke-width="2" marker-end="url(#ara)" stroke-linecap="round"/><line x1="349" y1="222" x2="349" y2="262" stroke="#B45309" stroke-width="2" marker-end="url(#ara)" stroke-linecap="round"/><line x1="486" y1="222" x2="486" y2="262" stroke="#B45309" stroke-width="2" marker-end="url(#ara)" stroke-linecap="round"/><text x="285" y="285" font-family="Inter, Arial, sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">Energy lost as heat from respiration, in waste and in parts not eaten</text><text x="285" y="330" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">About one tenth passes to the next level</text></svg>