<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="An observer on a curved earth sees only the mast and sail of a distant ship because the hull is below the horizon">
<rect width="560" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker></defs>
<circle cx="280.0" cy="600.0" r="420.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<line x1="200.7" y1="187.6" x2="198" y2="173.8" stroke="#102A43" stroke-width="3"/>
<circle cx="198" cy="169.8" r="5" fill="#ffffff" stroke="#102A43" stroke-width="2"/>
<g opacity="0.3"><g transform="translate(359.3 187.6) rotate(10.9)"><path d="M-28.0 0 L28.0 0 L19.0 -16 L-19.0 -16 Z" fill="#B45309" stroke="#102A43" stroke-width="2"/><line x1="0" y1="-16" x2="0" y2="-72.76645974201523" stroke="#102A43" stroke-width="3"/><path d="M3 -68.76645974201523 L26 -26 L3 -22 Z" fill="#ffffff" stroke="#102A43" stroke-width="2"/></g>
</g>
<defs><clipPath id="above"><path d="M198 173.8 L429.3 129.3 L429.3 0 L198 0 Z"/></clipPath></defs>
<g clip-path="url(#above)"><g transform="translate(359.3 187.6) rotate(10.9)"><path d="M-28.0 0 L28.0 0 L19.0 -16 L-19.0 -16 Z" fill="#B45309" stroke="#102A43" stroke-width="2"/><line x1="0" y1="-16" x2="0" y2="-72.76645974201523" stroke="#102A43" stroke-width="3"/><path d="M3 -68.76645974201523 L26 -26 L3 -22 Z" fill="#ffffff" stroke="#102A43" stroke-width="2"/></g>
</g>
<line x1="198" y1="173.8" x2="429.3" y2="129.3" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<text x="280" y="30" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43" text-anchor="middle" >Why a ship disappears hull first</text>
<text x="280" y="52" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" >(the curve of the earth hides the bottom of the ship)</text>
<text x="188" y="151.8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="end" >Observer</text>
<text x="369.3" y="100.8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" >Mast and sail still visible</text>
<text x="369.3" y="249.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Hull hidden by the curve (faded)</text>
<text x="212" y="149.8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start" >Line of sight</text>
<text x="280" y="345" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" >Not to scale: the curve is exaggerated. A ship sailing away shows less and less of its hull.</text>
</svg>
