<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><line x1="20.0" y1="300.0" x2="540.0" y2="300.0" stroke="#102A43" stroke-width="3"/><polygon points="20,300 150,300 110,140 20,140" fill="#EFF6FF"/><polygon points="330,300 540,300 540,150" fill="#EFF6FF"/><polyline points="150.0,300.0 110.0,140.0" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><polyline points="330.0,300.0 540.0,150.0" fill="none" stroke="#B91C1C" stroke-width="3" stroke-linejoin="round"/><text x="55.0" y="230.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="bold" >cold air</text><text x="480.0" y="270.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="bold" >cold air</text><text x="240.0" y="255.0" font-size="13" text-anchor="middle" fill="#B91C1C" font-weight="bold" >warm sector</text><text x="240.0" y="272.0" font-size="13" text-anchor="middle" fill="#B91C1C" font-weight="normal" >(warm, moist air)</text><text x="150.0" y="320.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >cold front</text><text x="330.0" y="320.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >warm front</text><text x="150.0" y="120.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >cumulonimbus:</text><text x="150.0" y="136.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >heavy showers</text><text x="362.0" y="226.0" font-size="13" text-anchor="end" fill="#102A43" font-weight="normal" >nimbostratus:</text><text x="362.0" y="242.0" font-size="13" text-anchor="end" fill="#102A43" font-weight="normal" >steady rain</text><text x="440.0" y="172.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >altostratus</text><text x="500.0" y="130.0" font-size="13" text-anchor="end" fill="#102A43" font-weight="normal" >cirrus</text><line x1="240.0" y1="60.0" x2="330.0" y2="60.0" stroke="#102A43" stroke-width="2.5" marker-end="url(#a)"/><text x="230.0" y="65.0" font-size="13" text-anchor="end" fill="#102A43" font-weight="normal" >direction of movement</text><text x="280.0" y="345.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Section through a mid-latitude depression (not to scale)</text><line x1="395.0" y1="236.0" x2="452.0" y2="200.0" stroke="#B91C1C" stroke-width="2" marker-end="url(#a)"/><line x1="170.0" y1="230.0" x2="135.0" y2="180.0" stroke="#B91C1C" stroke-width="2" marker-end="url(#a)"/></svg>