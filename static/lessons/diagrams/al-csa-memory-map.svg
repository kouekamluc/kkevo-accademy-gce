<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">A 16-bit address space (65 536 bytes)</text>
<rect x="250" y="60" width="290" height="56" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="395" y="84" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">ROM (16 KiB)</text>
<text x="395" y="104" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">0000 - 3FFF (hex)</text>
<text x="12" y="84" font-size="13" text-anchor="start" fill="#B45309" font-weight="400">A15 A14</text>
<text x="12" y="104" font-size="15" text-anchor="start" fill="#B45309" font-weight="700">= 0 0</text>
<line x1="170" y1="88" x2="250" y2="88" stroke="#2563EB" stroke-width="2"/>
<rect x="250" y="122" width="290" height="56" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="395" y="146" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">RAM block 1 (16 KiB)</text>
<text x="395" y="166" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">4000 - 7FFF (hex)</text>
<text x="12" y="146" font-size="13" text-anchor="start" fill="#B45309" font-weight="400">A15 A14</text>
<text x="12" y="166" font-size="15" text-anchor="start" fill="#B45309" font-weight="700">= 0 1</text>
<line x1="170" y1="150" x2="250" y2="150" stroke="#2563EB" stroke-width="2"/>
<rect x="250" y="184" width="290" height="56" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="395" y="208" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">RAM block 2 (16 KiB)</text>
<text x="395" y="228" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">8000 - BFFF (hex)</text>
<text x="12" y="208" font-size="13" text-anchor="start" fill="#B45309" font-weight="400">A15 A14</text>
<text x="12" y="228" font-size="15" text-anchor="start" fill="#B45309" font-weight="700">= 1 0</text>
<line x1="170" y1="212" x2="250" y2="212" stroke="#2563EB" stroke-width="2"/>
<rect x="250" y="246" width="290" height="56" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/>
<text x="395" y="270" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">I/O ports (16 KiB)</text>
<text x="395" y="290" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">C000 - FFFF (hex)</text>
<text x="12" y="270" font-size="13" text-anchor="start" fill="#B45309" font-weight="400">A15 A14</text>
<text x="12" y="290" font-size="15" text-anchor="start" fill="#B45309" font-weight="700">= 1 1</text>
<line x1="170" y1="274" x2="250" y2="274" stroke="#2563EB" stroke-width="2"/>
<rect x="105" y="52" width="65" height="250" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
<text x="137" y="165" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="400">2-to-4</text>
<text x="137" y="182" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="400">decoder</text>
<text x="280" y="335" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">The top two address lines choose one block. The other 14 lines choose a byte inside it.</text>
</svg>
