<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Two faulty divisions: overlapping members and a missing member</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280" y="22" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">Faulty division 1: two bases mixed (cross-division)</text><rect x="200" y="32" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="58" font-size="16" fill="#102A43" text-anchor="middle" font-weight="bold">Students</text><path d="M280 72 L105 100" fill="none" stroke="#102A43" stroke-width="2"/><rect x="40" y="100" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="105" y="126" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Boys</text><path d="M280 72 L280 100" fill="none" stroke="#102A43" stroke-width="2"/><rect x="215" y="100" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="280" y="126" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Girls</text><path d="M280 72 L455 100" fill="none" stroke="#102A43" stroke-width="2"/><rect x="390" y="100" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="455" y="126" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Footballers</text><text x="280" y="164" font-size="13" fill="#102A43" text-anchor="middle">A girl can be a footballer: the members overlap.</text><path d="M30 184 L530 184" fill="none" stroke="#102A43" stroke-width="2"/><text x="280" y="206" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">Faulty division 2: not exhaustive (a member is missing)</text><rect x="200" y="216" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="242" font-size="16" fill="#102A43" text-anchor="middle" font-weight="bold">Plants</text><path d="M280 256 L185 284" fill="none" stroke="#102A43" stroke-width="2"/><rect x="120" y="284" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="185" y="310" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Trees</text><path d="M280 256 L375 284" fill="none" stroke="#102A43" stroke-width="2"/><rect x="310" y="284" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="375" y="310" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Shrubs</text><text x="280" y="348" font-size="13" fill="#102A43" text-anchor="middle">Herbs, grasses and others are left out.</text></svg>