<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#FFFFFF"/>
<defs><marker id="a102A43" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">
<text x="280" y="28" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">Stack after push 15, 8, 23, pop, push 40, push 6</text>
<rect x="200" y="70" width="160" height="48" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="100" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">6</text>
<text x="186" y="100" font-size="14" text-anchor="end" fill="#102A43">[3]</text>
<rect x="200" y="118" width="160" height="48" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="148" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">40</text>
<text x="186" y="148" font-size="14" text-anchor="end" fill="#102A43">[2]</text>
<rect x="200" y="166" width="160" height="48" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="196" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">8</text>
<text x="186" y="196" font-size="14" text-anchor="end" fill="#102A43">[1]</text>
<rect x="200" y="214" width="160" height="48" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="244" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">15</text>
<text x="186" y="244" font-size="14" text-anchor="end" fill="#102A43">[0]</text>
<text x="280.0" y="284" font-size="14" text-anchor="middle" fill="#102A43">bottom of stack (index 0)</text>
<line x1="430" y1="94" x2="366" y2="94" stroke="#B45309" stroke-width="2" marker-end="url(#aB45309)"/>
<text x="436" y="86" font-size="14" text-anchor="start" fill="#B45309" font-weight="700">top = 3</text>
<text x="436" y="118" font-size="14" text-anchor="start" fill="#102A43">stack is full:</text>
<text x="436" y="136" font-size="14" text-anchor="start" fill="#102A43">next push fails</text>
<line x1="100" y1="56" x2="100" y2="96" stroke="#2563EB" stroke-width="2" marker-end="url(#a2563EB)"/>
<text x="100" y="48" font-size="14" text-anchor="middle" fill="#2563EB">push in</text>
<line x1="100" y1="220" x2="100" y2="182" stroke="#2563EB" stroke-width="2" marker-end="url(#a2563EB)"/>
<text x="100" y="242" font-size="14" text-anchor="middle" fill="#2563EB">pop out</text>
<text x="280" y="334" font-size="14" text-anchor="middle" fill="#102A43">Last in, first out: only the top item can be reached.</text>
</g>
</svg>
