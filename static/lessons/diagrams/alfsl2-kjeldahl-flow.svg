<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">Kjeldahl method: from nitrogen to protein</text><rect x="20" y="90" width="118" height="190" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="79" y="120" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">1 Digest</text><text x="79" y="155" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Sample, acid</text><text x="79" y="181" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">and catalyst,</text><text x="79" y="207" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">heated, N goes</text><text x="79" y="233" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">to ammonium</text><path d="M140 185 L153 185" stroke="#102A43" stroke-width="3"/><path d="M148 178 L154 185 L148 192" fill="none" stroke="#102A43" stroke-width="3"/><rect x="155" y="90" width="118" height="190" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="214" y="120" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">2 Distil</text><text x="214" y="155" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Excess NaOH</text><text x="214" y="181" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">frees ammonia,</text><text x="214" y="207" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">trapped in</text><text x="214" y="233" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">boric acid</text><path d="M275 185 L288 185" stroke="#102A43" stroke-width="3"/><path d="M283 178 L289 185 L283 192" fill="none" stroke="#102A43" stroke-width="3"/><rect x="290" y="90" width="118" height="190" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="349" y="120" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">3 Titrate</text><text x="349" y="155" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Standard HCl</text><text x="349" y="181" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">to the end</text><text x="349" y="207" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">point (titre</text><text x="349" y="233" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">minus blank)</text><path d="M410 185 L423 185" stroke="#102A43" stroke-width="3"/><path d="M418 178 L424 185 L418 192" fill="none" stroke="#102A43" stroke-width="3"/><rect x="425" y="90" width="118" height="190" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="484" y="120" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">4 Calculate</text><text x="484" y="155" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Nitrogen %</text><text x="484" y="181" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">from titre;</text><text x="484" y="207" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">protein % =</text><text x="484" y="233" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">N % x 6.25</text><text x="280" y="325" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#B45309" font-weight="normal">Kjeldahl measures total nitrogen, so protein is an estimate</text></svg>