<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Tree showing the balance of payments split into the current account (visible and invisible trade) and the capital account"><rect width="560" height="360" fill="#fff"/>
<text x="280" y="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" font-weight="700">Balance of payments (BoP): all money in and out</text>
<rect x="180" y="44" width="200" height="40" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="68.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">Current account</text>
<rect x="425" y="44" width="125" height="40" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="487.5" y="68.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">Capital account</text>
<line x1="280" y1="84" x2="280" y2="104" stroke="#102A43" stroke-width="2"/>
<line x1="280" y1="104" x2="110" y2="104" stroke="#102A43" stroke-width="2"/>
<line x1="280" y1="104" x2="330" y2="104" stroke="#102A43" stroke-width="2"/>
<line x1="110" y1="104" x2="110" y2="124" stroke="#102A43" stroke-width="2"/>
<line x1="330" y1="104" x2="330" y2="124" stroke="#102A43" stroke-width="2"/>
<line x1="485" y1="84" x2="485" y2="124" stroke="#102A43" stroke-width="2"/>
<rect x="20" y="124" width="180" height="56" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="110.0" y="147.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Visible trade</text><text x="110.0" y="165.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">(goods)</text>
<rect x="240" y="124" width="180" height="56" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="330.0" y="147.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Invisible trade</text><text x="330.0" y="165.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">(services, transfers)</text>
<rect x="20" y="200" width="180" height="50" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="110.0" y="220.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">Balance of trade</text><text x="110.0" y="238.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">exports - imports</text>
<rect x="240" y="200" width="180" height="50" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="330.0" y="220.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">Invisible balance</text><text x="330.0" y="238.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">exports - imports</text>
<line x1="110" y1="180" x2="110" y2="200" stroke="#102A43" stroke-width="2"/>
<line x1="330" y1="180" x2="330" y2="200" stroke="#102A43" stroke-width="2"/>
<rect x="425" y="124" width="125" height="56" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="487.5" y="147.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Loans, aid and</text><text x="487.5" y="165.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">investments</text>
<text x="280" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309" font-weight="700">Current account balance = balance of trade + invisible balance</text>
<text x="280" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Figures in this lesson are invented for practice.</text>
</svg>
