<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Structure of a cereal grain</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<ellipse cx="280" cy="190" rx="95" ry="140" fill="#FDE68A" stroke="#B45309" stroke-width="5"/>
<ellipse cx="280" cy="190" rx="82" ry="127" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<path d="M230,308 Q210,250 280,240 Q350,250 330,308 Q280,324 230,308 Z" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<circle cx="280" cy="160" r="3" fill="#102A43"/>
<circle cx="255" cy="180" r="3" fill="#102A43"/>
<circle cx="308" cy="185" r="3" fill="#102A43"/>
<circle cx="280" cy="205" r="3" fill="#102A43"/>
<circle cx="250" cy="130" r="3" fill="#102A43"/>
<circle cx="310" cy="135" r="3" fill="#102A43"/>
<circle cx="270" cy="100" r="3" fill="#102A43"/>
<circle cx="290" cy="215" r="3" fill="#102A43"/>
<line x1="404.0" y1="95.0" x2="369.0" y2="140.0" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<text x="410" y="100" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Bran (outer coat)</text>
<circle cx="369" cy="140" r="3.5" fill="#047857"/>
<line x1="404.0" y1="185.0" x2="308.0" y2="185.0" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<text x="410" y="190" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Endosperm</text>
<circle cx="308" cy="185" r="3.5" fill="#047857"/>
<line x1="404.0" y1="285.0" x2="300.0" y2="285.0" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<text x="410" y="290" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Germ (embryo)</text>
<circle cx="300" cy="285" r="3.5" fill="#047857"/>
<text x="150" y="100" font-size="13" fill="#102A43" text-anchor="end" font-weight="400">fibre, B vitamins,</text>
<text x="150" y="118" font-size="13" fill="#102A43" text-anchor="end" font-weight="400">minerals</text>
<text x="150" y="190" font-size="13" fill="#102A43" text-anchor="end" font-weight="400">mostly starch</text>
<text x="150" y="290" font-size="13" fill="#102A43" text-anchor="end" font-weight="400">fat, protein,</text>
<text x="150" y="308" font-size="13" fill="#102A43" text-anchor="end" font-weight="400">vitamins B and E</text>
</svg>
