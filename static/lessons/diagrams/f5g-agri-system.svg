<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" role="img"><rect width="560" height="365" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="28" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">A farm as a system (a cocoa farm)</text><rect x="20" y="50" width="160" height="230" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="100" y="76" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">INPUTS</text><text x="100" y="120" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Land, rain, sun, soil</text><text x="100" y="164" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Seedlings, fertiliser</text><text x="100" y="208" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Labour (family, hired)</text><text x="100" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Tools, money, skills</text><rect x="200" y="50" width="160" height="230" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280" y="76" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">PROCESSES</text><text x="280" y="120" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Clearing and planting</text><text x="280" y="164" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Weeding and spraying</text><text x="280" y="208" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Harvesting pods</text><text x="280" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Drying the beans</text><rect x="380" y="50" width="160" height="230" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="460" y="76" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">OUTPUTS</text><text x="460" y="120" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Cocoa beans sold</text><text x="460" y="164" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Food crops eaten</text><text x="460" y="208" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Income (FCFA)</text><text x="460" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Waste: pod husks</text><line x1="180" y1="165" x2="200" y2="165" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="165" x2="380" y2="165" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="460" y1="282" x2="460" y2="320" stroke="#102A43" stroke-width="2"/><line x1="460" y1="320" x2="100" y2="320" stroke="#102A43" stroke-width="2"/><line x1="100" y1="320" x2="100" y2="284" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="312" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">Feedback: profit is reinvested in inputs</text><text x="280" y="350" font-size="13" text-anchor="middle" fill="#64748B" font-weight="400" font-family="Inter, Arial, sans-serif">Money from the market pays for next season's inputs</text></svg>