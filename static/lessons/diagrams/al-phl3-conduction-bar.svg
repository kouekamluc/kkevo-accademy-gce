<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>Steady conduction along a lagged bar</title><desc>A bar of length L and area A, lagged on its sides, with a hot end at 100 degrees Celsius and a cold end at 0 degrees Celsius. Heat flows from hot to cold and the temperature falls in a straight line along the bar.</desc><rect width="560" height="360" fill="#FFFFFF"/><rect x="120" y="106" width="320" height="98" fill="#EFF6FF" stroke="#102A43" stroke-width="2" stroke-dasharray="6 4"/><rect x="130" y="120" width="300" height="70" fill="#FDE8D0" stroke="#102A43" stroke-width="2"/><text x="280.0" y="160" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="normal">uniform bar, area A</text><text x="280" y="100" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">lagging (insulation)</text><rect x="30" y="120" width="90" height="70" fill="#FDE8D0" stroke="#B45309" stroke-width="2"/><text x="75" y="150" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B45309" font-weight="bold">hot</text><text x="75" y="170" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B45309" font-weight="normal">100 C</text><rect x="440" y="120" width="90" height="70" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="485" y="150" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="bold">cold</text><text x="485" y="170" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="normal">0 C</text><line x1="150" y1="60" x2="410" y2="60" stroke="#047857" stroke-width="2" stroke-linecap="round"/><polygon points="410,60 400.8,63.9 400.8,56.1" fill="#047857"/><text x="280.0" y="46" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#047857" font-weight="bold">heat flow Q/t</text><line x1="130" y1="215" x2="130" y2="238" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="430" y1="215" x2="430" y2="238" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="228" x2="390" y2="228" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="390,228 380.8,231.9 380.8,224.1" fill="#102A43"/><line x1="390" y1="228" x2="170" y2="228" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="170,228 179.2,224.1 179.2,231.9" fill="#102A43"/><text x="280.0" y="256" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="normal">length L</text><line x1="130" y1="340" x2="450" y2="340" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="450,340 440.8,343.9 440.8,336.1" fill="#102A43"/><line x1="130" y1="340" x2="130" y2="277" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="130,277 133.9,286.2 126.1,286.2" fill="#102A43"/><polyline points="134.0,285.0 430.0,337.0" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="122" y="289" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="end" fill="#102A43" font-weight="normal">T</text><text x="450" y="358" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="end" fill="#102A43" font-weight="normal">distance</text><text x="300" y="281" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#B45309" font-weight="normal">temperature falls steadily along the bar</text></svg>