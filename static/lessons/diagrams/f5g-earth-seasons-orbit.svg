<text x="297.3" y="101" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" >N</text>
<text x="320" y="79" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" >23 September</text>
<text x="320" y="97" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" >Sun overhead: equator</text>
