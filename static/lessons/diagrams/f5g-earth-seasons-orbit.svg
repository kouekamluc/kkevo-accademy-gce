<text x="320" y="435" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" >Sun overhead: equator</text>
<text x="320" y="24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle" >The earth's orbit: four positions (not to scale)</text>
<text x="320" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" >The axis stays tilted the same way (23.5° from the vertical) all year.</text>
<text x="320" y="474" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" >Shaded half = lit by the Sun. Earth moves anticlockwise round the Sun: one orbit takes about 365 days.</text>
</svg>
