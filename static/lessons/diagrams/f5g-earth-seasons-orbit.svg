<text x="82.3" y="206" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" >N</text>
<text x="8" y="306" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="start" >22 December</text>
<text x="8" y="324" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start" >Sun overhead: 23.5°S</text>
<text x="8" y="342" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#047857" text-anchor="start" >(Tropic of Capricorn)</text>
