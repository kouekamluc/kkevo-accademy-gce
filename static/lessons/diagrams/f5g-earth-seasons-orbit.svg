<text x="512.3" y="206" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" >N</text>
<text x="632" y="306" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="end" >21 June</text>
<text x="632" y="324" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="end" >Sun overhead: 23.5°N</text>
<text x="632" y="342" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#047857" text-anchor="end" >(Tropic of Cancer)</text>
