<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Animal, mammal and dog: more attributes, fewer individuals</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><circle cx="150" cy="205" r="145" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="250" r="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><circle cx="150" cy="295" r="55" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="90" font-size="16" fill="#102A43" text-anchor="middle" font-weight="bold">Animal</text><text x="150" y="178" font-size="16" fill="#102A43" text-anchor="middle" font-weight="bold">Mammal</text><text x="150" y="300" font-size="16" fill="#047857" text-anchor="middle" font-weight="bold">Dog</text><rect x="310" y="60" width="230" height="74" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="425" y="84" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="bold">Animal</text><text x="425" y="106" font-size="13" fill="#102A43" text-anchor="middle">Fewest attributes (comprehension)</text><text x="425" y="124" font-size="13" fill="#102A43" text-anchor="middle">Most individuals (extension)</text><rect x="310" y="150" width="230" height="74" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="425" y="174" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="bold">Mammal</text><text x="425" y="196" font-size="13" fill="#102A43" text-anchor="middle">More attributes (comprehension)</text><text x="425" y="214" font-size="13" fill="#102A43" text-anchor="middle">Fewer individuals (extension)</text><rect x="310" y="240" width="230" height="74" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="425" y="264" font-size="16" fill="#047857" text-anchor="middle" font-weight="bold">Dog</text><text x="425" y="286" font-size="13" fill="#102A43" text-anchor="middle">Most attributes (comprehension)</text><text x="425" y="304" font-size="13" fill="#102A43" text-anchor="middle">Fewest individuals (extension)</text><text x="425" y="340" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">Add attributes: the extension shrinks.</text></svg>