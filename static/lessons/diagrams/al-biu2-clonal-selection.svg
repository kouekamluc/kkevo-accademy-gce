<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><text x="280" y="24" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" >Clonal selection of a B lymphocyte</text><rect x="20" y="60" width="120" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="80" y="88" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >B cells with</text><text x="80" y="108" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >varied receptors</text><rect x="20" y="190" width="120" height="60" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="80" y="216" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >Antigen</text><text x="80" y="236" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >(pathogen)</text><rect x="190" y="110" width="130" height="80" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="255" y="138" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >One B cell</text><text x="255" y="158" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >with matching</text><text x="255" y="176" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >receptor selected</text><rect x="380" y="52" width="160" height="74" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="460" y="80" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >Plasma cells</text><text x="460" y="100" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >secrete antibodies</text><text x="460" y="118" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >(primary response)</text><rect x="380" y="164" width="160" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="460" y="192" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >Memory B cells</text><text x="460" y="212" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >stay for years</text><text x="460" y="230" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >(secondary response)</text><rect x="190" y="252" width="130" height="66" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="255" y="278" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >T helper cell</text><text x="255" y="298" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >releases cytokines</text><line x1="142" y1="95" x2="188" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="142" y1="215" x2="188" y2="170" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="322" y1="140" x2="376" y2="100" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="322" y1="160" x2="376" y2="200" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="255" y1="250" x2="255" y2="194" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/><text x="280" y="346" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Cell division makes a clone of identical cells</text></svg>