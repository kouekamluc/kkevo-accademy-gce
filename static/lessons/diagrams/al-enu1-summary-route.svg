<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Five-step route to a summary</title><desc id="d">Five boxes in a column: read the task, read the passage, mark and sort, paraphrase, link and check.</desc><rect width="560" height="360" fill="#FFFFFF"/><rect x="40" y="18" width="380" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="75" cy="43" r="17" fill="#2563EB"/><text x="75" y="49" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="110" y="49" font-size="18" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Read the task</text><line x1="230" y1="68" x2="230" y2="79" stroke="#102A43" stroke-width="2.5"/><path d="M224 74 L230 82 L236 74 Z" fill="#102A43"/><rect x="40" y="82" width="380" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="75" cy="107" r="17" fill="#2563EB"/><text x="75" y="113" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="110" y="113" font-size="18" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Read the passage</text><line x1="230" y1="132" x2="230" y2="143" stroke="#102A43" stroke-width="2.5"/><path d="M224 138 L230 146 L236 138 Z" fill="#102A43"/><rect x="40" y="146" width="380" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="75" cy="171" r="17" fill="#2563EB"/><text x="75" y="177" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="110" y="177" font-size="18" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Mark and sort</text><line x1="230" y1="196" x2="230" y2="207" stroke="#102A43" stroke-width="2.5"/><path d="M224 202 L230 210 L236 202 Z" fill="#102A43"/><rect x="40" y="210" width="380" height="50" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><circle cx="75" cy="235" r="17" fill="#047857"/><text x="75" y="241" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="110" y="241" font-size="18" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Paraphrase</text><line x1="230" y1="260" x2="230" y2="271" stroke="#102A43" stroke-width="2.5"/><path d="M224 266 L230 274 L236 266 Z" fill="#102A43"/><rect x="40" y="274" width="380" height="50" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><circle cx="75" cy="299" r="17" fill="#047857"/><text x="75" y="305" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">5</text><text x="110" y="305" font-size="18" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Link and check</text><text x="435" y="175" font-size="13" fill="#B45309" font-family="Inter, Arial, sans-serif">finding points</text><text x="435" y="270" font-size="13" fill="#B45309" font-family="Inter, Arial, sans-serif">writing</text></svg>