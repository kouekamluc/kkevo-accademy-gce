<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><rect x="150" y="14" width="260" height="332" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="398" y="40" font-size="13" font-weight="600" fill="#B45309" text-anchor="end">Sender's address + date</text><text x="166" y="94" font-size="13" font-weight="600" fill="#B45309" text-anchor="start">Receiver's name and address</text><text x="166" y="134" font-size="13" font-weight="600" fill="#047857" text-anchor="start">Salutation: Dear Sir or Madam,</text><text x="280" y="164" font-size="13" font-weight="600" fill="#102A43" text-anchor="middle">SUBJECT HEADING</text><text x="166" y="196" font-size="13" font-weight="600" fill="#102A43" text-anchor="start">Body: paragraph 1 (purpose)</text><text x="166" y="228" font-size="13" font-weight="600" fill="#102A43" text-anchor="start">Body: paragraph 2 (details)</text><text x="166" y="260" font-size="13" font-weight="600" fill="#102A43" text-anchor="start">Body: paragraph 3 (request, thanks)</text><text x="166" y="298" font-size="13" font-weight="600" fill="#047857" text-anchor="start">Yours faithfully,</text><text x="166" y="328" font-size="13" font-weight="600" fill="#102A43" text-anchor="start">(signature) Name given in task</text><text x="280" y="364" font-size="1" fill="#fff"> </text><text x="14" y="126" font-size="13" fill="#047857">match</text><text x="14" y="142" font-size="13" fill="#047857">endings</text><text x="14" y="290" font-size="13" fill="#047857">Sir/Madam</text><text x="14" y="306" font-size="13" fill="#047857">= faithfully</text></svg>