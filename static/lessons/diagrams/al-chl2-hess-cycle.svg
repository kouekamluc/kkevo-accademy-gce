<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="26.0" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">A Hess cycle: two routes, one enthalpy change</text><rect x="30" y="70" width="170" height="52" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="115.0" y="102.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">C(s) + O2(g)</text><rect x="360" y="70" width="170" height="52" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="445.0" y="102.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">CO(g) + 1/2 O2(g)</text><rect x="195" y="250" width="170" height="52" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="282.0" font-size="15" fill="#047857" text-anchor="middle" font-weight="bold">CO2(g)</text><line x1="200.0" y1="96.0" x2="356.0" y2="96.0" stroke="#B45309" stroke-width="3"/><polygon points="356.0,96.0 347.7,99.5 347.7,92.5" fill="#B45309"/><text x="280.0" y="86.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">dH1 = ?</text><line x1="80.0" y1="126.0" x2="230.0" y2="246.0" stroke="#2563EB" stroke-width="3"/><polygon points="230.0,246.0 221.3,243.6 225.7,238.1" fill="#2563EB"/><text x="70.0" y="205.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="bold">dH2 = -393.5</text><line x1="480.0" y1="126.0" x2="330.0" y2="246.0" stroke="#2563EB" stroke-width="3"/><polygon points="330.0,246.0 334.3,238.1 338.7,243.6" fill="#2563EB"/><text x="495.0" y="205.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="bold">dH3 = -283.0</text><text x="280.0" y="336.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="bold">dH1 + dH3 = dH2, so dH1 = -393.5 - (-283.0) = -110.5 kJ per mol</text></svg>