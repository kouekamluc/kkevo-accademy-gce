<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Schematic of how German Kamerun was divided, not a map</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Kamerun: from German colony to two mandates</text><rect x="20" y="60" width="160" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="86" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Kamerun to 1911</text><text x="100.0" y="105" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">German colony</text><text x="100.0" y="124" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">(before the treaty)</text><rect x="20" y="200" width="160" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="226" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Kamerun 1911-14</text><text x="100.0" y="245" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">plus Neukamerun</text><text x="100.0" y="264" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">(from French Congo)</text><rect x="220" y="130" width="150" height="90" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="295.0" y="156" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">1916 to 1919</text><text x="295.0" y="175" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">Provisional</text><text x="295.0" y="194" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">Anglo-French split</text><rect x="405" y="60" width="140" height="90" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475.0" y="86" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">British share</text><text x="475.0" y="105" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">(smaller)</text><text x="475.0" y="124" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">Cameroons</text><rect x="405" y="200" width="140" height="90" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475.0" y="226" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">French share</text><text x="475.0" y="245" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">(larger)</text><text x="475.0" y="264" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">Cameroun</text><line x1="100" y1="150" x2="100" y2="200" stroke="#102A43" stroke-width="2"/><line x1="180" y1="245" x2="220" y2="200" stroke="#102A43" stroke-width="2"/><line x1="370" y1="175" x2="405" y2="105" stroke="#102A43" stroke-width="2"/><line x1="370" y1="175" x2="405" y2="245" stroke="#102A43" stroke-width="2"/><text x="280" y="318" font-size="13" fill="#B45309" text-anchor="middle" font-weight="400">Neukamerun went back to French rule in 1919.</text><text x="280" y="342" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Schematic only: sizes and positions are not to scale.</text></svg>