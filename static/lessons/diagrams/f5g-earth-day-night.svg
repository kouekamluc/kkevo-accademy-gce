<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" role="img" aria-label="View from above the North Pole: the left half of the earth facing the sun is day, the right half is night, and the earth rotates anticlockwise">
<rect width="600" height="365" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker></defs>
<circle cx="260" cy="195" r="105" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<path d="M260.0 90.0 A105.0 105.0 0 0 1 260.0 300.0 Z" fill="#CBD5E1"/>
<path d="M260.0 90.0 A105.0 105.0 0 0 0 260.0 300.0 Z" fill="#FEF3C7"/>
<circle cx="260" cy="195" r="105" fill="none" stroke="#102A43" stroke-width="3"/>
<line x1="260" y1="82" x2="260" y2="308" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="40" y1="125" x2="120" y2="125" stroke="#B45309" stroke-width="3" marker-end="url(#ah)"/>
<line x1="40" y1="160" x2="120" y2="160" stroke="#B45309" stroke-width="3" marker-end="url(#ah)"/>
<line x1="40" y1="195" x2="120" y2="195" stroke="#B45309" stroke-width="3" marker-end="url(#ah)"/>
<line x1="40" y1="230" x2="120" y2="230" stroke="#B45309" stroke-width="3" marker-end="url(#ah)"/>
<line x1="40" y1="265" x2="120" y2="265" stroke="#B45309" stroke-width="3" marker-end="url(#ah)"/>
<text x="48" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start" >Sun's rays</text>
<text x="205" y="187" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle" >DAY</text>
<text x="315" y="187" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" >NIGHT</text>
<circle cx="260" cy="195" r="4" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<text x="268" y="233" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="start" >N. Pole</text>
<path d="M355.0 290.0 A135 135 0 0 0 355.0 100.0" fill="none" stroke="#047857" stroke-width="3.5" marker-end="url(#ag)"/>
<text x="410" y="105" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" >Earth turns</text>
<text x="410" y="123" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" >anticlockwise</text>
<text x="410" y="141" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#047857" text-anchor="start" >(west to east)</text>
<text x="260" y="72" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" >Sunrise (dawn)</text>
<text x="260" y="330" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" >Sunset (dusk)</text>
<text x="205" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Noon</text>
<text x="315" y="209" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" >Midnight</text>
<text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle" >Rotation gives day and night (view from above the North Pole)</text>
<text x="280" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle" >Not to scale. One full turn takes about 24 hours.</text>
</svg>
