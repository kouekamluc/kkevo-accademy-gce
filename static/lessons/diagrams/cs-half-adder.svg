">AND</text><path d="M340 115 L450 115" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round"/><path d="M330 235 L450 235" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round"/><text x="462" y="121" font-size="18" font-weight="bold" fill="#047857">S</text><text x="462" y="241" font-size="18" font-weight="bold" fill="#047857">C</text><text x="395" y="105" font-size="15" text-anchor="middle" fill="#047857">S = A &#8853; B</text><text x="395" y="225" font-size="15" text-anchor="middle" fill="#047857">C = A &#183; B</text></svg>
