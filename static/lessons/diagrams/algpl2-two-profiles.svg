<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="30.0" y="60.0" width="230.0" height="30.0" rx="0" fill="#A16207" stroke="#102A43" stroke-width="2"/><text x="145.0" y="80.0" font-size="14" text-anchor="middle" fill="#FFFFFF">A: thin humus layer</text><rect x="30.0" y="90.0" width="230.0" height="110.0" rx="0" fill="#FCA5A5" stroke="#102A43" stroke-width="2"/><text x="145.0" y="150.0" font-size="14" text-anchor="middle" fill="#102A43">B: red-yellow, iron and</text><rect x="30.0" y="200.0" width="230.0" height="40.0" rx="0" fill="#FECACA" stroke="#102A43" stroke-width="2"/><text x="145.0" y="225.0" font-size="14" text-anchor="middle" fill="#102A43">mottled zone (may harden)</text><rect x="30.0" y="240.0" width="230.0" height="90.0" rx="0" fill="#E5E7EB" stroke="#102A43" stroke-width="2"/><text x="145.0" y="290.0" font-size="14" text-anchor="middle" fill="#102A43">C: deep rotted rock</text><rect x="300.0" y="60.0" width="230.0" height="35.0" rx="0" fill="#D9F99D" stroke="#102A43" stroke-width="2"/><text x="415.0" y="82.5" font-size="14" text-anchor="middle" fill="#102A43">O: thick acid litter (mor)</text><rect x="300.0" y="95.0" width="230.0" height="20.0" rx="0" fill="#78716C" stroke="#102A43" stroke-width="2"/><text x="415.0" y="110.0" font-size="14" text-anchor="middle" fill="#FFFFFF">A: thin, dark</text><rect x="300.0" y="115.0" width="230.0" height="70.0" rx="0" fill="#F5F5F4" stroke="#102A43" stroke-width="2"/><text x="415.0" y="155.0" font-size="14" text-anchor="middle" fill="#102A43">E: bleached ash-grey</text><rect x="300.0" y="185.0" width="230.0" height="20.0" rx="0" fill="#57534E" stroke="#102A43" stroke-width="2"/><text x="415.0" y="200.0" font-size="14" text-anchor="middle" fill="#FFFFFF">Bh: humus collects</text><rect x="300.0" y="205.0" width="230.0" height="35.0" rx="0" fill="#FDBA74" stroke="#102A43" stroke-width="2"/><text x="415.0" y="227.5" font-size="14" text-anchor="middle" fill="#102A43">Bs: iron, may form a pan</text><rect x="300.0" y="240.0" width="230.0" height="90.0" rx="0" fill="#E5E7EB" stroke="#102A43" stroke-width="2"/><text x="415.0" y="290.0" font-size="14" text-anchor="middle" fill="#102A43">C: parent material</text><text x="145.0" y="168.0" font-size="14" text-anchor="middle" fill="#102A43">aluminium oxides</text><text x="145.0" y="40.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">Ferralitic soil (hot, wet)</text><text x="415.0" y="40.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">Podzol (cool, wet)</text><text x="145.0" y="352.0" font-size="14" text-anchor="middle" fill="#047857">Ferralitization: silica leached</text><text x="415.0" y="352.0" font-size="14" text-anchor="middle" fill="#047857">Podzolization: acid cheluviation</text></svg>