<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>A floating boat with weight and upthrust equal</title><rect width="560" height="360" fill="#FFFFFF"/><rect x="40.0" y="200.0" width="480.0" height="120.0" rx="0" fill="#BFDBFE" stroke="none" stroke-width="0"/><line x1="40.0" y1="200.0" x2="520.0" y2="200.0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/><polygon points="150.0,150.0 410.0,150.0 370.0,232.0 190.0,232.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="150.0" y1="150.0" x2="150.0" y2="150.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="60.0" y="190.0" font-size="13" fill="#2563EB" text-anchor="start" font-weight="normal">water surface</text><line x1="240.0" y1="170.0" x2="240.0" y2="250.0" stroke="#B45309" stroke-width="3" stroke-linecap="round"/><polygon points="240.0,250.0 235.2,240.1 244.8,240.1" fill="#B45309"/><text x="232.0" y="264.0" font-size="14" fill="#B45309" text-anchor="end" font-weight="bold">weight W</text><line x1="320.0" y1="262.0" x2="320.0" y2="172.0" stroke="#047857" stroke-width="3" stroke-linecap="round"/><polygon points="320.0,172.0 324.8,181.9 315.2,181.9" fill="#047857"/><text x="330.0" y="264.0" font-size="14" fill="#047857" text-anchor="start" font-weight="bold">upthrust U</text><text x="280.0" y="100.0" font-size="16" fill="#102A43" text-anchor="middle" font-weight="bold">floating: U = W</text><text x="280.0" y="126.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="normal">(the two forces are equal and opposite)</text></svg>