<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>Malaria cycle between mosquito and person</title><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="32" text-anchor="middle" font-size="16" fill="#102A43" font-weight="700">The malaria cycle</text><rect x="20" y="70" width="200" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="120" y="99" text-anchor="middle" font-weight="700" font-size="15">Infected mosquito</text><text x="120" y="119" text-anchor="middle" font-size="13">has Plasmodium</text><rect x="340" y="70" width="200" height="66" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="440" y="99" text-anchor="middle" font-weight="700" font-size="15">Person bitten</text><text x="440" y="119" text-anchor="middle" font-size="13">parasites enter blood</text><rect x="340" y="230" width="200" height="66" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="440" y="259" text-anchor="middle" font-weight="700" font-size="15">Person has malaria</text><text x="440" y="279" text-anchor="middle" font-size="13">fever, chills, anaemia</text><rect x="20" y="230" width="200" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="120" y="259" text-anchor="middle" font-weight="700" font-size="15">Mosquito bites</text><text x="120" y="279" text-anchor="middle" font-size="13">the sick person</text><line x1="220" y1="103" x2="340" y2="103" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="440" y1="136" x2="440" y2="230" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="263" x2="220" y2="263" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="120" y1="230" x2="120" y2="136" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="92" text-anchor="middle" font-size="13" fill="#102A43">bites</text><text x="280" y="252" text-anchor="middle" font-size="13" fill="#102A43">blood taken up</text><text x="280" y="170" text-anchor="middle" font-size="13" fill="#047857">parasite develops in mosquito</text><text x="280" y="190" text-anchor="middle" font-size="13" fill="#047857">and the cycle repeats</text></g></svg>