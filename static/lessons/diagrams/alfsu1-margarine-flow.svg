<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="24.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">Margarine manufacture (water-in-oil emulsion)</text><rect x="30.0" y="50.0" width="200.0" height="64.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="130.0" y="70.5" font-size="13" text-anchor="middle" fill="#102A43">Oil phase: blended</text><text x="130.0" y="86.5" font-size="13" text-anchor="middle" fill="#102A43">oils, fat, emulsifier,</text><text x="130.0" y="102.5" font-size="13" text-anchor="middle" fill="#102A43">vitamins A and D, colour</text><rect x="330.0" y="50.0" width="200.0" height="64.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="430.0" y="70.5" font-size="13" text-anchor="middle" fill="#102A43">Water phase: water,</text><text x="430.0" y="86.5" font-size="13" text-anchor="middle" fill="#102A43">salt, skim milk,</text><text x="430.0" y="102.5" font-size="13" text-anchor="middle" fill="#102A43">preservative, flavour</text><rect x="180.0" y="150.0" width="200.0" height="50.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="171.6" font-size="13" text-anchor="middle" fill="#102A43">Mix and emulsify</text><text x="280.0" y="187.6" font-size="13" text-anchor="middle" fill="#102A43">(pre-emulsion)</text><line x1="130.0" y1="114.0" 