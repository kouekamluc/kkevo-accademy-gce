<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>A satellite relays a signal between two distant places on Earth</title><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><path d="M0 360.6 A440 440 0 0 1 560 360.6" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="280.0" y="312.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748B">Earth (curved surface blocks a straight signal)</text><rect x="250" y="50" width="60" height="28" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="218" y="56" width="24" height="16" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><rect x="318" y="56" width="24" height="16" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="34.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Communication satellite</text><rect x="46" y="290.949" width="28" height="28" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><line x1="60.0" y1="290.9" x2="60.0" y2="274.9" stroke="#047857" stroke-width="2" stroke-linecap="round"/><text x="60.0" y="340.9" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Sender</text><rect x="486" y="290.949" width="28" height="28" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><line x1="500.0" y1="290.9" x2="500.0" y2="274.9" stroke="#047857" stroke-width="2" stroke-linecap="round"/><text x="500.0" y="340.9" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Receiver</text><line x1="66.0" y1="272.9" x2="258.0" y2="80.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ab)" stroke-linecap="round"/><line x1="302.0" y1="80.0" x2="494.0" y2="272.9" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ab)" stroke-linecap="round"/><text x="130.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Signal goes up</text><text x="440.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Signal comes down</text></svg>