<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>Refuse disposal methods</title><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="32" text-anchor="middle" font-size="16" fill="#102A43" font-weight="700">Dealing with household refuse</text><rect x="215" y="150" width="130" height="60" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="280" y="176" text-anchor="middle" font-weight="700" font-size="15">Refuse</text><text x="280" y="196" text-anchor="middle" font-size="13">household waste</text><rect x="20" y="60" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95" y="84" text-anchor="middle" font-weight="700" font-size="15">Sanitary landfill</text><text x="95" y="104" text-anchor="middle" font-size="13">covered with soil</text><rect x="210" y="60" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="285" y="84" text-anchor="middle" font-weight="700" font-size="15">Incineration</text><text x="285" y="104" text-anchor="middle" font-size="13">burnt in furnace</text><rect x="400" y="60" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="475" y="84" text-anchor="middle" font-weight="700" font-size="15">Composting</text><text x="475" y="104" text-anchor="middle" font-size="13">becomes manure</text><rect x="60" y="260" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="135" y="284" text-anchor="middle" font-weight="700" font-size="15">Recycling</text><text x="135" y="304" text-anchor="middle" font-size="13">glass, metal, paper</text><rect x="330" y="260" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="405" y="284" text-anchor="middle" font-weight="700" font-size="15">Reduce and reuse</text><text x="405" y="304" text-anchor="middle" font-size="13">make less waste</text><line x1="250" y1="150" x2="110" y2="116" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="150" x2="285" y2="116" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="310" y1="150" x2="460" y2="116" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="250" y1="210" x2="170" y2="260" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="310" y1="210" x2="390" y2="260" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/></g></svg>