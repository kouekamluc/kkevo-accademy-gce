<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Worked example 2: D to E 30 km east, E to F 40 km south</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="150" y1="100" x2="150" y2="25" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="150,25 154.3,35.1 145.7,35.1" fill="#102A43"/>
<text x="150" y="13" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<line x1="312" y1="100" x2="312" y2="25" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="312,25 316.3,35.1 307.7,35.1" fill="#102A43"/>
<text x="312" y="13" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<polygon points="150,100 312,100 312,316" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="150" y1="100" x2="312" y2="316" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polyline points="298,100 298,114 312,114" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/>
<path d="M150,72 A28,28 0 0 1 166.8,122.4" fill="none" stroke="#047857" stroke-width="2.5"/>
<text x="178.2" y="47" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">143.1°</text>
<path d="M212,100 A62,62 0 0 1 187.2,149.6" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="226.9" y="138.5" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="600">53.1°</text>
<circle cx="150" cy="100" r="4" fill="#102A43"/>
<text x="130" y="100" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">D</text>
<circle cx="312" cy="100" r="4" fill="#102A43"/>
<text x="330" y="106" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">E</text>
<circle cx="312" cy="316" r="4" fill="#102A43"/>
<text x="330" y="322" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<text x="266.6" y="84" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle">30 km</text>
<text x="358" y="208" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle">40 km</text>
<text x="191" y="226" font-size="16" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">50 km</text>
<text x="400" y="250" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle">Bearing of F from D</text>
<text x="400" y="272" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle">= 090° + 53.1°</text>
<text x="400" y="294" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">= 143.1°</text>
</svg>
