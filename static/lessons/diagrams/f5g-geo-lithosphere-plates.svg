<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><rect x="20" y="170" width="520" height="130" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="20" y="130" width="520" height="40" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><polygon points="20,130 20,92 285,92 285,130" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><polygon points="285,130 285,116 540,116 540,130" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><line x1="285" y1="70" x2="285" y2="170" stroke="#102A43" stroke-width="2" stroke-dasharray="7 5"/><line x1="250.0" y1="60.0" x2="156.0" y2="60.0" stroke="#B45309" stroke-width="3"/><polygon points="150.0,60.0 159.9,55.2 159.9,64.8" fill="#B45309"/><line x1="320.0" y1="60.0" x2="414.0" y2="60.0" stroke="#B45309" stroke-width="3"/><polygon points="420.0,60.0 410.1,64.8 410.1,55.2" fill="#B45309"/><text x="285.0" y="36.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#102A43">Plates move a few centimetres a year</text><text x="285.0" y="192.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#64748B">Plate boundary (dashed line)</text><text x="152.0" y="118.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#047857">Continental crust (thicker)</text><text x="412.0" y="106.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#2563EB">Oceanic crust (thinner, denser)</text><text x="150.0" y="155.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#102A43">Upper mantle (rigid)</text><text x="412.0" y="155.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#102A43">Upper mantle (rigid)</text><text x="285.0" y="240.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">Asthenosphere: hot, soft rock that flows slowly</text><text x="285.0" y="346.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Lithosphere = crust + rigid upper mantle (about 100 km), broken into plates.</text></svg>