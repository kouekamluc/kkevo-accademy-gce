<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Three parts of the Human Development Index</title><defs><marker id="g2n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="g2b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="g2g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="g2a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="28.0" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700">The idea of the Human Development Index</text><rect x="25.0" y="55.0" width="150.0" height="120.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="82.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">HEALTH</text><text x="100.0" y="108.0" font-size="14" text-anchor="middle" fill="#102A43">A long and healthy life</text><text x="100.0" y="128.0" font-size="14" text-anchor="middle" fill="#102A43">(life expectancy)</text><line x1="100.0" y1="177.0" x2="217.0" y2="235.0" stroke="#047857" stroke-width="2" marker-end="url(#g2n)"/><rect x="205.0" y="55.0" width="150.0" height="120.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="82.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">EDUCATION</text><text x="280.0" y="108.0" font-size="14" text-anchor="middle" fill="#102A43">Knowledge</text><text x="280.0" y="128.0" font-size="14" text-anchor="middle" fill="#102A43">(years of schooling,</text><text x="280.0" y="148.0" font-size="14" text-anchor="middle" fill="#102A43">literacy)</text><line x1="280.0" y1="177.0" x2="280.0" y2="235.0" stroke="#2563EB" stroke-width="2" marker-end="url(#g2n)"/><rect x="385.0" y="55.0" width="150.0" height="120.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="460.0" y="82.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">INCOME</text><text x="460.0" y="108.0" font-size="14" text-anchor="middle" fill="#102A43">A decent standard</text><text x="460.0" y="128.0" font-size="14" text-anchor="middle" fill="#102A43">of living (income</text><text x="460.0" y="148.0" font-size="14" text-anchor="middle" fill="#102A43">per person)</text><line x1="460.0" y1="177.0" x2="343.0" y2="235.0" stroke="#B45309" stroke-width="2" marker-end="url(#g2n)"/><rect x="110.0" y="240.0" width="340.0" height="70.0" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="268.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Human Development Index</text><text x="280.0" y="290.9" font-size="14" text-anchor="middle" fill="#102A43">one score between 0 and 1 for each country</text><text x="280.0" y="340.0" font-size="14" text-anchor="middle" fill="#102A43">Higher score = people live better lives on average.</text></svg>