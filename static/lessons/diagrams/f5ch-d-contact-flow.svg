<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a102A43" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker><marker id="a047857" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#047857"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="15" y="40" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="70" y="63" font-size="13" text-anchor="middle" fill="#102A43">Burn sulfur</text><text x="70" y="80" font-size="13" text-anchor="middle" fill="#102A43">in dry air</text><text x="70" y="97" font-size="13" text-anchor="middle" fill="#102A43">S + O<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan> &#8594; SO<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="150" y="40" width="100" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="200" y="72" font-size="13" text-anchor="middle" fill="#102A43">Purify and</text><text x="200" y="88" font-size="13" text-anchor="middle" fill="#102A43">dry the gases</text><rect x="275" y="30" width="135" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="342" y="51" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700">Converter</text><text x="342" y="68" font-size="13" text-anchor="middle" fill="#102A43">V<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan>O<tspan dy="4" font-size="13">5</tspan><tspan dy="-4">&#8203;</tspan> catalyst</text><text x="342" y="85" font-size="13" text-anchor="middle" fill="#102A43">about 450 &#176;C</text><text x="342" y="102" font-size="13" text-anchor="middle" fill="#102A43">1 to 2 atm</text><text x="342" y="119" font-size="13" text-anchor="middle" fill="#102A43">2SO<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan> + O<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan> &#8652; 2SO<tspan dy="4" font-size="13">3</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="435" y="40" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="490" y="63" font-size="13" text-anchor="middle" fill="#102A43">Absorb SO<tspan dy="4" font-size="13">3</tspan><tspan dy="-4">&#8203;</tspan> in</text><text x="490" y="80" font-size="13" text-anchor="middle" fill="#102A43">98% H<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan>SO<tspan dy="4" font-size="13">4</tspan><tspan dy="-4">&#8203;</tspan></text><text x="490" y="97" font-size="13" text-anchor="middle" fill="#102A43">gives oleum</text><rect x="435" y="170" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="490" y="193" font-size="13" text-anchor="middle" fill="#102A43">Add water to</text><text x="490" y="210" font-size="13" text-anchor="middle" fill="#102A43">oleum</text><text x="490" y="227" font-size="13" text-anchor="middle" fill="#102A43">gives H<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan>SO<tspan dy="4" font-size="13">4</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="435" y="290" width="110" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="490" y="312" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700">Sulfuric acid</text><text x="490" y="328" font-size="13" text-anchor="middle" fill="#102A43">(product)</text><line x1="125" y1="75" x2="150" y2="75" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="250" y1="75" x2="275" y2="75" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="410" y1="75" x2="435" y2="75" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="490" y1="110" x2="490" y2="170" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="490" y1="240" x2="490" y2="290" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="342" y1="130" x2="342" y2="200" stroke="#102A43" stroke-width="2"/><line x1="342" y1="200" x2="200" y2="200" stroke="#102A43" stroke-width="2"/><line x1="200" y1="200" x2="200" y2="110" stroke="#2563EB" stroke-width="2" marker-end="url(#a2563EB)"/><text x="272" y="222" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">unreacted SO<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan> and O<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan> are recycled</text><text x="70" y="150" font-size="13" text-anchor="middle" fill="#B45309" font-weight="600">Not SO<tspan dy="4" font-size="13">3</tspan><tspan dy="-4">&#8203;</tspan> + water</text><text x="70" y="167" font-size="13" text-anchor="middle" fill="#B45309" font-weight="600">directly: it makes</text><text x="70" y="184" font-size="13" text-anchor="middle" fill="#B45309" font-weight="600">a fine acid mist</text></svg>