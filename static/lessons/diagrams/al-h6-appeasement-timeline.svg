<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Timeline of crises and appeasement, 1931 to 1939</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Crises and appeasement, 1931 to 1939</text><line x1="25" y1="190" x2="535" y2="190" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><circle cx="62" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="62" y1="183" x2="62" y2="162" stroke="#2563EB" stroke-width="2"/><text x="62" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Japan in</text><text x="62" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Manchuria</text><text x="62" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1931</text><circle cx="124" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="124" y1="197" x2="124" y2="218" stroke="#B45309" stroke-width="2"/><text x="124" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1935</text><text x="124" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Abyssinia;</text><text x="124" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">naval agreement</text><circle cx="187" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="187" y1="183" x2="187" y2="162" stroke="#B45309" stroke-width="2"/><text x="187" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Rhineland</text><text x="187" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">remilitarised</text><text x="187" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">Mar 1936</text><circle cx="249" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="249" y1="197" x2="249" y2="218" stroke="#2563EB" stroke-width="2"/><text x="249" y="236" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">Mar 1938</text><text x="249" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Anschluss</text><circle cx="311" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="311" y1="183" x2="311" y2="162" stroke="#B45309" stroke-width="2"/><text x="311" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Munich</text><text x="311" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Agreement</text><text x="311" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">Sep 1938</text><circle cx="373" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="373" y1="197" x2="373" y2="218" stroke="#2563EB" stroke-width="2"/><text x="373" y="236" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">Mar 1939</text><text x="373" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Prague</text><text x="373" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">occupied</text><circle cx="436" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="436" y1="183" x2="436" y2="162" stroke="#B45309" stroke-width="2"/><text x="436" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Nazi-Soviet</text><text x="436" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Pact</text><text x="436" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">Aug 1939</text><circle cx="498" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="498" y1="197" x2="498" y2="218" stroke="#047857" stroke-width="2"/><text x="498" y="236" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">Sep 1939</text><text x="498" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">War begins</text><text x="280" y="348" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Not to scale: events evenly spaced.</text></svg>