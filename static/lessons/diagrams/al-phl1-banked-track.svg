<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Cross-section of a banked track: normal reaction N tilted towards the centre, weight W downwards, and the horizontal resultant that provides the centripetal force</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<polygon points="50.0,330.0 476.0,330.0 476.0,131.4" fill="#EFF6FF" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="294.7,215.9 367.2,182.1 347.1,138.9 274.6,172.8" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="320.9" y1="177.4" x2="320.9" y2="266.4" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
<polygon points="320.9,277.4 316.3,266.4 325.5,266.4" fill="#B45309"/>
<line x1="320.9" y1="177.4" x2="278.9" y2="87.4" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polygon points="274.3,77.4 283.1,85.4 274.7,89.3" fill="#047857"/>
<line x1="320.9" y1="177.4" x2="285.3" y2="177.4" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="274.3,177.4 285.3,172.8 285.3,182.0" fill="#2563EB"/>
<line x1="274.3" y1="77.4" x2="274.3" y2="177.4" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="274.3" y1="177.4" x2="320.9" y2="177.4" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<circle cx="320.9" cy="177.4" r="3.5" fill="#102A43" stroke="#102A43" stroke-width="1"/>
<text x="332.9" y="277.4" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="600">W = mg</text>
<text x="260.3" y="85.4" font-size="15" fill="#047857" text-anchor="end" dominant-baseline="middle" font-weight="600">N</text>
<text x="268.3" y="195.4" font-size="14" fill="#2563EB" text-anchor="end" dominant-baseline="middle" font-weight="600">resultant = mv&#178;/r</text>
<line x1="190.9" y1="87.4" x2="116.9" y2="87.4" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="105.9,87.4 116.9,82.8 116.9,92.0" fill="#2563EB"/>
<text x="150.9" y="69.4" font-size="14" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="600">towards the centre of the circle</text>
<path d="M120.0,330.0 A70,70 0 0 0 113.4,300.4" fill="none" stroke="#B45309" stroke-width="2"/>
<text x="154.0" y="318.0" font-size="15" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="600">&#952;</text>
</svg>
