<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Unpolarised light passes through a polariser and becomes plane polarised with half the intensity, then passes through a second polariser (analyser) whose axis is at angle theta, giving intensity I1 cos squared theta"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
<text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Polariser and analyser (Malus's law)</text>
<line x1="30.0" y1="160.0" x2="535.0" y2="160.0" stroke="#64748B" stroke-width="2"/>
<line x1="70.0" y1="138.0" x2="70.0" y2="182.0" stroke="#2563EB" stroke-width="2"/>
<line x1="59.0" y1="140.9" x2="81.0" y2="179.1" stroke="#2563EB" stroke-width="2"/>
<line x1="50.9" y1="149.0" x2="89.1" y2="171.0" stroke="#2563EB" stroke-width="2"/>
<line x1="48.0" y1="160.0" x2="92.0" y2="160.0" stroke="#2563EB" stroke-width="2"/>
<line x1="50.9" y1="171.0" x2="89.1" y2="149.0" stroke="#2563EB" stroke-width="2"/>
<line x1="59.0" y1="179.1" x2="81.0" y2="140.9" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="216.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">unpolarised</text>
<text x="70.0" y="234.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">I0</text>
<path d="M190.0 100 A16 60 0 1 0 190.0 220 A16 60 0 1 0 190.0 100" fill="#EFF6FF" stroke="#047857" stroke-width="3" stroke-linejoin="round"/>
<line x1="190.0" y1="120.0" x2="190.0" y2="200.0" stroke="#047857" stroke-width="3"/>
<text x="190.0" y="250.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">polariser</text>
<path d="M380.0 100 A16 60 0 1 0 380.0 220 A16 60 0 1 0 380.0 100" fill="#EFF6FF" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/>
<line x1="354.3" y1="129.4" x2="405.7" y2="190.6" stroke="#B45309" stroke-width="3"/>
<text x="380.0" y="250.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">analyser</text>
<line x1="280.0" y1="196.0" x2="280.0" y2="124.0" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
<line x1="280.0" y1="124.0" x2="280.0" y2="196.0" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
<text x="280.0" y="216.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">plane polarised</text>
<text x="280.0" y="234.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">I1 = I0 / 2</text>
<line x1="470.7" y1="137.0" x2="509.3" y2="183.0" stroke="#B45309" stroke-width="3" marker-end="url(#am)"/>
<line x1="509.3" y1="183.0" x2="470.7" y2="137.0" stroke="#B45309" stroke-width="3" marker-end="url(#am)"/>
<text x="490.0" y="216.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">I2 = I1 cos&#178;(&#952;)</text>
<path d="M380 130 A30 30 0 0 1 399.3 137.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/>
<text x="396.0" y="124.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="start">&#952;</text>
<text x="280.0" y="330.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">&#952; = angle between the two transmission axes</text>
</svg>
