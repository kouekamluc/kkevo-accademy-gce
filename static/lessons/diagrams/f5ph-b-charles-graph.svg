<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Volume against temperature for a gas at constant pressure</title><rect width="560" height="360" fill="#FFFFFF"/><line x1="30.0" y1="300.0" x2="548.0" y2="300.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="548.0,300.0 538.1,304.8 538.1,295.2" fill="#102A43"/><line x1="400.0" y1="300.0" x2="400.0" y2="30.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="400.0,30.0 404.8,39.9 395.2,39.9" fill="#102A43"/><text x="548.0" y="340.0" font-size="14" fill="#102A43" text-anchor="end" font-weight="normal">temperature t (&#176;C)</text><text x="410.0" y="38.0" font-size="14" fill="#102A43" text-anchor="start" font-weight="normal">volume V</text><line x1="72.4" y1="300.0" x2="72.4" y2="306.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="72.4" y="322.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="normal">-273</text><line x1="400.0" y1="300.0" x2="400.0" y2="306.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="400.0" y="322.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="normal">0</text><line x1="520.0" y1="300.0" x2="520.0" y2="306.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="520.0" y="322.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="normal">100</text><line x1="72.4" y1="300.0" x2="400.0" y2="180.0" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 5" stroke-linecap="round"/><line x1="400.0" y1="180.0" x2="520.0" y2="136.0" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/><circle cx="72.4" cy="300.0" r="6" fill="#B45309" stroke="#B45309" stroke-width="2"/><text x="76.4" y="246.0" font-size="14" fill="#B45309" text-anchor="start" font-weight="normal">absolute zero</text><text x="76.4" y="228.0" font-size="14" fill="#B45309" text-anchor="start" font-weight="normal">-273 &#176;C</text><text x="150.0" y="170.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">dashed: extended (extrapolated)</text><text x="150.0" y="190.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">backwards, never measured</text><text x="420.0" y="235.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">gas at constant</text><text x="420.0" y="253.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">pressure</text></svg>