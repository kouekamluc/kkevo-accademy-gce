<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Four common weather instruments</title><defs><marker id="i1i" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="i1b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="i1g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="i1r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="i1s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="135" y="24" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Rain gauge (mm of rain)</text><line x1="20" y1="120" x2="250" y2="120" stroke="#047857" stroke-width="3"/><polygon points="64,62 136,62 107,102 93,102" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/><rect x="83" y="122" width="34" height="46" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><text x="100" y="54" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Funnel</text><text x="122" y="150" font-size="13" text-anchor="start" fill="#102A43">Bottle</text><rect x="190" y="80" width="24" height="80" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><line x1="190" y1="90" x2="198" y2="90" stroke="#102A43" stroke-width="2"/><line x1="190" y1="100" x2="198" y2="100" stroke="#102A43" stroke-width="2"/><line x1="190" y1="110" x2="198" y2="110" stroke="#102A43" stroke-width="2"/><line x1="190" y1="120" x2="198" y2="120" stroke="#102A43" stroke-width="2"/><line x1="190" y1="130" x2="198" y2="130" stroke="#102A43" stroke-width="2"/><line x1="190" y1="140" x2="198" y2="140" stroke="#102A43" stroke-width="2"/><line x1="190" y1="150" x2="198" y2="150" stroke="#102A43" stroke-width="2"/><text x="202" y="72" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Measuring</text><text x="202" y="178" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">cylinder</text><text x="24" y="112" font-size="13" text-anchor="start" fill="#047857" font-weight="bold">Ground</text><text x="415" y="24" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Maximum-minimum thermometer</text><rect x="374" y="44" width="12" height="100" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><rect x="434" y="44" width="12" height="100" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><path d="M374,144 Q410.0,180 446,144" fill="none" stroke="#102A43" stroke-width="2.5"/><rect x="377" y="76" width="6" height="68" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><rect x="437" y="98" width="6" height="46" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><rect x="374" y="64" width="12" height="8" rx="0" fill="#B45309" stroke="#B45309" stroke-width="1"/><rect x="434" y="90" width="12" height="8" rx="0" fill="#B45309" stroke="#B45309" stroke-width="1"/><text x="366" y="72" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">Min index</text><text x="454" y="98" font-size="13" text-anchor="start" fill="#B45309" font-weight="bold">Max index</text><text x="366" y="128" font-size="13" text-anchor="end" fill="#102A43">Scale rises</text><text x="366" y="144" font-size="13" text-anchor="end" fill="#102A43">downwards</text><text x="454" y="128" font-size="13" text-anchor="start" fill="#102A43">Scale rises</text><text x="454" y="144" font-size="13" text-anchor="start" fill="#102A43">upwards</text><text x="135" y="214" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Wind vane (direction)</text><line x1="135" y1="350" x2="135" y2="268" stroke="#102A43" stroke-width="4"/><line x1="70" y1="262" x2="200" y2="262" stroke="#102A43" stroke-width="4"/><polygon points="70,262 92,250 92,274" fill="#102A43" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><polygon points="200,262 178,244 178,280" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/><text x="70" y="238" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Head</text><text x="200" y="238" font-size="13" text-anchor="end" fill="#2563EB" font-weight="bold">Tail</text><text x="150" y="316" font-size="13" text-anchor="start" fill="#102A43">Head points to where</text><text x="150" y="332" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">the wind comes FROM</text><text x="415" y="214" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Cup anemometer (speed)</text><circle cx="350" cy="290" r="6" fill="#102A43" stroke="#102A43" stroke-width="2"/><line x1="350" y1="290" x2="350" y2="248" stroke="#102A43" stroke-width="3"/><circle cx="350" cy="248" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><line x1="350" y1="290" x2="313.627" y2="311" stroke="#102A43" stroke-width="3"/><circle cx="313.627" cy="311" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><line x1="350" y1="290" x2="386.373" y2="311" stroke="#102A43" stroke-width="3"/><circle cx="386.373" cy="311" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><text x="415" y="276" font-size="13" text-anchor="start" fill="#102A43">Cups catch the wind</text><text x="415" y="292" font-size="13" text-anchor="start" fill="#102A43">and spin: faster</text><text x="415" y="308" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">spin, stronger wind</text></svg>