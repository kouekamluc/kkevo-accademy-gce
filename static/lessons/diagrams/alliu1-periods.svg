<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Literary periods in time</title><desc id="d">Bars for Chaucer, Metaphysical, Romantic, Victorian and Modernist periods on a timeline from 1300 to 1950.</desc>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="32" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">English poetry periods (approximate dates)</text>
<rect x="63.1" y="62" width="43.8" height="26" rx="5" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="116.9" y="74" font-size="15" font-weight="700" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Chaucer</text>
<text x="116.9" y="91" font-size="13" font-weight="400" fill="#B45309" text-anchor="start" font-family="Inter, Arial, sans-serif">c. 1343 to 1400</text>
<rect x="260.8" y="108" width="61.5" height="26" rx="5" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="332.3" y="120" font-size="15" font-weight="700" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Metaphysical</text>
<text x="332.3" y="137" font-size="13" font-weight="400" fill="#B45309" text-anchor="start" font-family="Inter, Arial, sans-serif">c. 1600 to 1680</text>
<rect x="413.1" y="154" width="26.2" height="26" rx="5" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="403.1" y="166" font-size="15" font-weight="700" fill="#102A43" text-anchor="end" font-family="Inter, Arial, sans-serif">Romantic</text>
<text x="403.1" y="183" font-size="13" font-weight="400" fill="#B45309" text-anchor="end" font-family="Inter, Arial, sans-serif">c. 1798 to 1832</text>
<rect x="443.1" y="200" width="49.2" height="26" rx="5" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="433.1" y="212" font-size="15" font-weight="700" fill="#102A43" text-anchor="end" font-family="Inter, Arial, sans-serif">Victorian</text>
<text x="433.1" y="229" font-size="13" font-weight="400" fill="#B45309" text-anchor="end" font-family="Inter, Arial, sans-serif">1837 to 1901</text>
<rect x="499.2" y="246" width="26.9" height="26" rx="5" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="489.2" y="258" font-size="15" font-weight="700" fill="#102A43" text-anchor="end" font-family="Inter, Arial, sans-serif">Modernist</text>
<text x="489.2" y="275" font-size="13" font-weight="400" fill="#B45309" text-anchor="end" font-family="Inter, Arial, sans-serif">c. 1910 to 1945</text>
<line x1="30" y1="314" x2="530" y2="314" stroke="#102A43" stroke-width="2"/>
<line x1="30.0" y1="308" x2="30.0" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="30.0" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1300</text>
<line x1="106.9" y1="308" x2="106.9" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="106.9" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1400</text>
<line x1="183.8" y1="308" x2="183.8" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="183.8" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1500</text>
<line x1="260.8" y1="308" x2="260.8" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="260.8" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1600</text>
<line x1="337.7" y1="308" x2="337.7" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="337.7" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1700</text>
<line x1="414.6" y1="308" x2="414.6" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="414.6" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1800</text>
<line x1="491.5" y1="308" x2="491.5" y2="320" stroke="#102A43" stroke-width="2"/>
<text x="491.5" y="338" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1900</text>
</svg>