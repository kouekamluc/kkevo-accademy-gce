<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Types of trade: internal or external, bilateral or multilateral, free trade or protection, visible or invisible"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#ffffff"/><text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Types of trade</text><rect x="15" y="40" width="255" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="142.0" y="66.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">By place</text><rect x="23.0" y="84.0" width="117" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="81.5" y="120.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Internal</text><text x="81.5" y="136.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">inside a country</text><rect x="145.0" y="84.0" width="117" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="203.5" y="120.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">External</text><text x="203.5" y="136.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">across borders</text><rect x="290" y="40" width="255" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="417.0" y="66.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">By partners</text><rect x="298.0" y="84.0" width="117" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="356.5" y="120.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Bilateral</text><text x="356.5" y="136.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">2 countries</text><rect x="420.0" y="84.0" width="117" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="478.5" y="120.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Multilateral</text><text x="478.5" y="136.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">many countries</text><rect x="15" y="200" width="255" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="142.0" y="226.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">By policy</text><rect x="23.0" y="244.0" width="117" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="81.5" y="280.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Free trade</text><text x="81.5" y="296.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">no barriers</text><rect x="145.0" y="244.0" width="117" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="203.5" y="280.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Protection</text><text x="203.5" y="296.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">tariffs, quotas</text><rect x="290" y="200" width="255" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="417.0" y="226.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">By item</text><rect x="298.0" y="244.0" width="117" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="356.5" y="280.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Visible</text><text x="356.5" y="296.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">goods</text><rect x="420.0" y="244.0" width="117" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="478.5" y="280.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">Invisible</text><text x="478.5" y="296.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">services</text></svg>