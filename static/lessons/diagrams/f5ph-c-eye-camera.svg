<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A simple eye and a simple camera: each has a converging lens that focuses an inverted image on a light-sensitive surface</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="150" y="24" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Human eye</text>
<text x="430" y="24" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Simple camera</text>
<path d="M95,108 A82,82 0 1 1 95,212" fill="#F8FAFC" stroke="#102A43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M95,108 Q62,160 95,212" fill="#EFF6FF" stroke="#102A43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M232,116 Q244,160 232,204" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="98" y1="108" x2="98" y2="142" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
<line x1="98" y1="178" x2="98" y2="212" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
<path d="M120,130 Q142,160 120,190 Q98,160 120,130 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="238" y1="160" x2="268" y2="160" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<line x1="20" y1="146" x2="120" y2="146" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="146" x2="235" y2="160" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="20" y1="174" x2="120" y2="174" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="174" x2="235" y2="160" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="56" y="120" font-size="13" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="700">cornea</text>
<line x1="58" y1="120" x2="72" y2="130" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="238" font-size="13" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">iris</text>
<line x1="62" y1="238" x2="98" y2="204" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="264" font-size="13" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">lens</text>
<line x1="120" y1="254" x2="120" y2="190" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="240" y="232" font-size="13" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">retina</text>
<line x1="240" y1="222" x2="236" y2="190" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="240" y="84" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">optic nerve</text>
<line x1="255" y1="94" x2="262" y2="156" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<rect x="340" y="100" width="180" height="120" rx="0" fill="#F8FAFC" stroke="#102A43" stroke-width="3"/>
<path d="M334,130 Q354,160.0 334,190 Q314,160.0 334,130 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="395" y1="100" x2="395" y2="146" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
<line x1="395" y1="174" x2="395" y2="220" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
<line x1="514" y1="110" x2="514" y2="210" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
<line x1="300" y1="144" x2="334" y2="144" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="334" y1="144" x2="514" y2="160" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="300" y1="176" x2="334" y2="176" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="334" y1="176" x2="514" y2="160" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="320" y="82" font-size="13" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">lens</text>
<line x1="326" y1="92" x2="332" y2="136" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="400" y="82" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">diaphragm</text>
<line x1="395" y1="92" x2="395" y2="100" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="470" y="246" font-size="13" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">film or sensor</text>
<line x1="500" y1="234" x2="514" y2="208" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="430" y="274" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">light-tight box</text>
<text x="280" y="342" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Eye: lens changes shape. Camera: lens moves to focus.</text>
</svg>
