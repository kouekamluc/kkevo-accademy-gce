<path d="M458.0,188.0 Q451.0,210.0 458.0,232.0" fill="none" stroke="#047857" stroke-width="2"/>
<path d="M478.0,188.0 Q485.0,210.0 478.0,232.0" fill="none" stroke="#047857" stroke-width="2"/>
<text x="370.0" y="262.0" font-size="14" fill="#102A43" text-anchor="start" dominant-baseline="middle">Join a and b nose to tail.</text>
<text x="370.0" y="284.0" font-size="14" fill="#102A43" text-anchor="start" dominant-baseline="middle">a + b goes from the start</text>
<text x="370.0" y="306.0" font-size="14" fill="#102A43" text-anchor="start" dominant-baseline="middle">of a to the end of b.</text>
