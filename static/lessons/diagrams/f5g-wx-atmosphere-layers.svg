<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Layers of the atmosphere and how temperature changes with height</title><defs><marker id="ati" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="atb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="atg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="atr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="ats" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="70" y="284.64" width="120" height="33.36" rx="0" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><rect x="70" y="179" width="120" height="105.64" rx="0" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><rect x="70" y="81.7" width="120" height="97.3" rx="0" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><rect x="70" y="40" width="120" height="41.7" rx="0" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><rect x="70" y="220.7" width="120" height="55.6" rx="0" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><text x="130" y="262" font-size="13" text-anchor="middle" fill="#047857" font-weight="bold">Ozone layer</text><text x="130" y="306.32" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Troposphere</text><text x="130" y="199.68" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Stratosphere</text><text x="130" y="132.96" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Mesosphere</text><text x="130" y="66.24" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Thermosphere</text><text x="62" y="323" font-size="13" text-anchor="end" fill="#102A43">0</text><text x="62" y="289.64" font-size="13" text-anchor="end" fill="#102A43">12</text><text x="62" y="184" font-size="13" text-anchor="end" fill="#102A43">50</text><text x="62" y="86.7" font-size="13" text-anchor="end" fill="#102A43">85</text><text x="62" y="45" font-size="13" text-anchor="end" fill="#102A43">100</text><text x="14" y="26" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Height (km)</text><line x1="190" y1="284.64" x2="520" y2="284.64" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/><text x="196" y="279.64" font-size="13" text-anchor="start" fill="#64748B">Tropopause</text><line x1="190" y1="179" x2="520" y2="179" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/><text x="196" y="174" font-size="13" text-anchor="start" fill="#64748B">Stratopause</text><line x1="190" y1="81.7" x2="520" y2="81.7" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/><text x="196" y="76.7" font-size="13" text-anchor="start" fill="#64748B">Mesopause</text><polyline points="510.833,318 382.5,284.64 382.5,262.4 483.333,179 318.333,81.7 428.333,40" fill="none" stroke="#B45309" stroke-width="3.5" stroke-linejoin="round"/><line x1="300" y1="318" x2="300" y2="324" stroke="#102A43" stroke-width="2"/><text x="300" y="340" font-size="13" text-anchor="middle" fill="#102A43">-100</text><line x1="391.667" y1="318" x2="391.667" y2="324" stroke="#102A43" stroke-width="2"/><text x="391.667" y="340" font-size="13" text-anchor="middle" fill="#102A43">-50</text><line x1="483.333" y1="318" x2="483.333" y2="324" stroke="#102A43" stroke-width="2"/><text x="483.333" y="340" font-size="13" text-anchor="middle" fill="#102A43">0</text><line x1="300" y1="318" x2="520" y2="318" stroke="#102A43" stroke-width="2"/><text x="410" y="358" font-size="13" text-anchor="middle" fill="#B45309" font-weight="bold">Temperature (degrees C, approximate)</text><text x="520" y="68" font-size="13" text-anchor="end" fill="#B45309">rises again</text><text x="404" y="282" font-size="13" text-anchor="start" fill="#B45309" font-weight="bold">falls with height</text><text x="420" y="222" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">rises (ozone</text><text x="410" y="238" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">absorbs sun)</text></svg>