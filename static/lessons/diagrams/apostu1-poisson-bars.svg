<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Bar chart of the Poisson distribution with mean 3, bars for 0, 1 and 2 highlighted</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="50.0" y1="300.0" x2="490.0" y2="300.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="56" y="250.2" width="32" height="49.8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="72.0" y="242.2" font-size="13" fill="#102A43" text-anchor="middle">0.050</text>
<text x="72.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">0</text>
<rect x="100" y="150.6" width="32" height="149.4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="116.0" y="142.6" font-size="13" fill="#102A43" text-anchor="middle">0.149</text>
<text x="116.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">1</text>
<rect x="144" y="76.0" width="32" height="224.0" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="160.0" y="68.0" font-size="13" fill="#102A43" text-anchor="middle">0.224</text>
<text x="160.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">2</text>
<rect x="188" y="76.0" width="32" height="224.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="204.0" y="68.0" font-size="13" fill="#102A43" text-anchor="middle">0.224</text>
<text x="204.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">3</text>
<rect x="232" y="132.0" width="32" height="168.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="248.0" y="124.0" font-size="13" fill="#102A43" text-anchor="middle">0.168</text>
<text x="248.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">4</text>
<rect x="276" y="199.2" width="32" height="100.8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="292.0" y="191.2" font-size="13" fill="#102A43" text-anchor="middle">0.101</text>
<text x="292.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">5</text>
<rect x="320" y="249.6" width="32" height="50.4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="336.0" y="241.6" font-size="13" fill="#102A43" text-anchor="middle">0.050</text>
<text x="336.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">6</text>
<rect x="364" y="278.4" width="32" height="21.6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="380.0" y="270.4" font-size="13" fill="#102A43" text-anchor="middle">0.022</text>
<text x="380.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">7</text>
<rect x="408" y="291.9" width="32" height="8.1" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="424.0" y="283.9" font-size="13" fill="#102A43" text-anchor="middle">0.008</text>
<text x="424.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">8</text>
<rect x="452" y="297.3" width="32" height="2.7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="468.0" y="289.3" font-size="13" fill="#102A43" text-anchor="middle">0.003</text>
<text x="468.0" y="322.0" font-size="14" fill="#102A43" text-anchor="middle">9</text>
<text x="270.0" y="348.0" font-size="14" fill="#102A43" text-anchor="middle">r (number of events in the interval)</text>
<text x="300.0" y="28.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Poisson, mean 3: P(X = r)</text>
<text x="430.0" y="120.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">Dark bars: X is 0, 1 or 2</text>
<text x="430.0" y="140.0" font-size="14" fill="#2563EB" text-anchor="middle">total probability 0.423</text>
</svg>
