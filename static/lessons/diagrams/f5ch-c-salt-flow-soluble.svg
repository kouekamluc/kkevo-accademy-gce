<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#102A43"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#047857"/></marker><marker id="m" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#B45309"/></marker></defs><text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Making a soluble salt: choose the method</text><rect x="170" y="40" width="220" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="280.0" y="60.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Does the salt contain</text><text x="280.0" y="77.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Na, K or NH4 ions?</text><line x1="230.0" y1="84.0" x2="120.0" y2="124.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="158" y="104" font-size="13" text-anchor="end" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">yes</text><line x1="330.0" y1="84.0" x2="440.0" y2="124.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="402" y="104" font-size="13" text-anchor="start" fill="#B45309" font-weight="700" font-family="Inter, Arial, sans-serif">no</text><rect x="20" y="124" width="200" height="56" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="120.0" y="150.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Titration</text><text x="120.0" y="167.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">alkali + acid + indicator</text><line x1="120.0" y1="180.0" x2="120.0" y2="204.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="204" width="200" height="56" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="120.0" y="230.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Repeat, no indicator</text><text x="120.0" y="247.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">mix exact volumes</text><line x1="120.0" y1="260.0" x2="120.0" y2="284.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="284" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="120.0" y="314.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Evaporate, crystallise</text><rect x="340" y="124" width="200" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="440.0" y="150.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Add excess solid</text><text x="440.0" y="167.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">metal, oxide or carbonate</text><line x1="440.0" y1="180.0" x2="440.0" y2="204.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="204" width="200" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="440.0" y="230.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Warm with the acid</text><text x="440.0" y="247.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">until no more reacts</text><line x1="440.0" y1="260.0" x2="440.0" y2="284.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="284" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="440.0" y="314.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Filter, evaporate, crystallise</text></svg>