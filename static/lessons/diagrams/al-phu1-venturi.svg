<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280.0" y="24.0" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Flow through a narrowing pipe (venturi)</text>
<polyline points="40.0,120.0 180.0,120.0 260.0,150.0 340.0,150.0 420.0,120.0 520.0,120.0" fill="none" stroke="#102A43" stroke-width="3"/>
<polyline points="40.0,240.0 180.0,240.0 260.0,210.0 340.0,210.0 420.0,240.0 520.0,240.0" fill="none" stroke="#102A43" stroke-width="3"/>
<line x1="60.0" y1="180.0" x2="150.0" y2="180.0" stroke="#2563EB" stroke-width="2"/>
<polygon points="150.0,180.0 140.8,183.9 140.8,176.1" fill="#2563EB"/>
<text x="105.0" y="168.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">v1 (slow)</text>
<line x1="270.0" y1="180.0" x2="330.0" y2="180.0" stroke="#047857" stroke-width="2"/>
<polygon points="330.0,180.0 320.8,183.9 320.8,176.1" fill="#047857"/>
<text x="300.0" y="168.0" font-size="13" text-anchor="middle" fill="#047857" font-weight="700">v2 (fast)</text>
<rect x="101.0" y="66.0" width="18.0" height="54.0" rx="0" fill="#DBEAFE" stroke="none" stroke-width="0"/>
<line x1="101.0" y1="120.0" x2="101.0" y2="46.0" stroke="#102A43" stroke-width="2"/>
<line x1="119.0" y1="120.0" x2="119.0" y2="46.0" stroke="#102A43" stroke-width="2"/>
<line x1="94.0" y1="66.0" x2="126.0" y2="66.0" stroke="#2563EB" stroke-width="2"/>
<rect x="291.0" y="112.0" width="18.0" height="38.0" rx="0" fill="#DBEAFE" stroke="none" stroke-width="0"/>
<line x1="291.0" y1="150.0" x2="291.0" y2="92.0" stroke="#102A43" stroke-width="2"/>
<line x1="309.0" y1="150.0" x2="309.0" y2="92.0" stroke="#102A43" stroke-width="2"/>
<line x1="284.0" y1="112.0" x2="316.0" y2="112.0" stroke="#2563EB" stroke-width="2"/>
<text x="145.0" y="60.0" font-size="13" text-anchor="start" fill="#2563EB" font-weight="700">high pressure: higher column</text>
<text x="335.0" y="100.0" font-size="13" text-anchor="start" fill="#047857" font-weight="700">low pressure: lower column</text>
<text x="280.0" y="285.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Wide section: slow, high pressure.  Narrow section: fast, low pressure.</text>
<text x="280.0" y="312.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">A1 v1 = A2 v2</text>
<text x="280.0" y="334.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">p1 + (1/2) &#961; v1&#178; = p2 + (1/2) &#961; v2&#178;</text>
</svg>
