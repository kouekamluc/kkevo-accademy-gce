<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A parallel circuit: a 6 volt cell with a 6 ohm resistor and a 3 ohm resistor in separate branches, and an ammeter in the main wire</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="62" y1="184" x2="98" y2="184" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="71" y1="196" x2="89" y2="196" stroke="#102A43" stroke-width="5" stroke-linecap="round"/>
<text x="50" y="182" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">+</text>
<text x="50" y="200" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">&#8722;</text>
<line x1="80" y1="70" x2="80" y2="184" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="196" x2="80" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="70" x2="184" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<circle cx="200" cy="70" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="70" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<line x1="216" y1="70" x2="430" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="300" x2="430" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="290" y1="140" x2="290" y2="160" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="290" y1="220" x2="290" y2="240" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="278" y="160" width="24" height="60" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="310" y="190" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">R1 = 6 &#937;</text>
<line x1="430" y1="140" x2="430" y2="160" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="430" y1="220" x2="430" y2="240" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="418" y="160" width="24" height="60" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="450" y="190" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">R2 = 3 &#937;</text>
<line x1="290" y1="70" x2="290" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="290" y1="240" x2="290" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="430" y1="70" x2="430" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="430" y1="240" x2="430" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<circle cx="290" cy="70" r="5" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<circle cx="290" cy="300" r="5" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="96" y="225" font-size="15" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">6 V</text>
<text x="200" y="102" font-size="13" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="400">ammeter</text>
<text x="360" y="342" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Same p.d. across each branch</text>
</svg>
