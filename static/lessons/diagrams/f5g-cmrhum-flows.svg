<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><text x="280" y="24" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold" >Flows between countryside and town</text><rect x="10" y="44" width="120" height="270" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="70" y="80" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#047857" font-weight="bold" >Countryside</text><text x="70" y="100" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >farms and</text><text x="70" y="117" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >villages</text><rect x="430" y="44" width="120" height="270" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="490" y="80" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B45309" font-weight="bold" >Town</text><text x="490" y="100" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >markets, shops,</text><text x="490" y="117" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >offices, services</text><line x1="136" y1="86" x2="424" y2="86" stroke="#2563EB" stroke-width="3.5" marker-end="url(#a4)"/><text x="280" y="76" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Food and cash crops</text><line x1="136" y1="132" x2="424" y2="132" stroke="#2563EB" stroke-width="3.5" marker-end="url(#a4)"/><text x="280" y="122" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Workers and migrants</text><line x1="136" y1="178" x2="424" y2="178" stroke="#2563EB" stroke-width="3.5" marker-end="url(#a4)"/><text x="280" y="168" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Timber, firewood, raw materials</text><line x1="424" y1="224" x2="136" y2="224" stroke="#B45309" stroke-width="3.5" marker-end="url(#a5)"/><text x="280" y="214" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Goods and farm inputs</text><line x1="424" y1="270" x2="136" y2="270" stroke="#B45309" stroke-width="3.5" marker-end="url(#a5)"/><text x="280" y="260" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Schools, clinics, banks</text><line x1="424" y1="316" x2="136" y2="316" stroke="#B45309" stroke-width="3.5" marker-end="url(#a5)"/><text x="280" y="306" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal" >Wages and remittances (money)</text><text x="280" y="342" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748B" font-weight="normal" >Blue: country to town. Orange: town to country.</text></svg>