<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#ffffff"/><text x="280" y="26" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle">The life of a bill of exchange</text><rect x="16" y="50" width="160" height="100" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="96.0" y="96.0" font-size="14" font-weight="bold" fill="#102A43" text-anchor="middle">Drawer (tireur)</text><text x="96.0" y="115.0" font-size="13" fill="#102A43" text-anchor="middle">seller, creditor</text><rect x="384" y="50" width="160" height="100" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="464.0" y="96.0" font-size="14" font-weight="bold" fill="#102A43" text-anchor="middle">Drawee (tire)</text><text x="464.0" y="115.0" font-size="13" fill="#102A43" text-anchor="middle">buyer, debtor</text><rect x="200" y="250" width="160" height="64" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="278.0" font-size="14" font-weight="bold" fill="#102A43" text-anchor="middle">Holder at maturity</text><text x="280.0" y="297.0" font-size="13" fill="#102A43" text-anchor="middle">bank or supplier</text><polyline points="178,75 382,75" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><text x="280" y="69" font-size="13" fill="#102A43" text-anchor="middle">1 goods sold on credit</text><polyline points="178,105 382,105" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><text x="280" y="99" font-size="13" fill="#102A43" text-anchor="middle">2 bill sent to accept</text><polyline points="382,135 178,135" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><text x="280" y="129" font-size="13" fill="#102A43" text-anchor="middle">3 accepted bill back</text><polyline points="96,150 96,282 198,282" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#ah)"/><text x="106" y="205" font-size="13" fill="#B45309" text-anchor="start">4 discounted</text><text x="106" y="222" font-size="13" fill="#B45309" text-anchor="start">or endorsed</text><polyline points="360,282 464,282 464,152" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah)"/><text x="454" y="205" font-size="13" fill="#047857" text-anchor="end">5 presented to</text><text x="454" y="222" font-size="13" fill="#047857" text-anchor="end">drawee, who pays</text><text x="280" y="346" font-size="13" fill="#102A43" text-anchor="middle">Promissory note: the debtor himself writes the promise to pay</text></svg>