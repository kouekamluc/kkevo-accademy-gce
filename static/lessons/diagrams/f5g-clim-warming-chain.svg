<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Inter, Arial, sans-serif">
<rect width="560" height="380" fill="#FFFFFF"/>
<defs><marker id="a102A43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<text x="280" y="24" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >Global warming: from causes to effects</text>
<rect x="10" y="50" width="170" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
<text x="95" y="72.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Burning coal, oil, gas</text>
<text x="95" y="88.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >(factories, cars, power)</text>
<rect x="10" y="114" width="170" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
<text x="95" y="136.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Cutting and burning</text>
<text x="95" y="152.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >forests</text>
<rect x="10" y="178" width="170" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
<text x="95" y="200.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Farming: cattle, rice,</text>
<text x="95" y="216.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >fertilisers; landfills</text>
<text x="95" y="262" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700" >CAUSES (human)</text>
<rect x="225" y="90" width="120" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="285" y="120.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >More</text>
<text x="285" y="136.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >greenhouse</text>
<text x="285" y="152.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >gases in</text>
<text x="285" y="168.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >the air</text>
<text x="285" y="215" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" >Stronger greenhouse</text>
<text x="285" y="231" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" >effect</text>
<rect x="392" y="50" width="160" height="52" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2" />
<text x="472" y="72.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Hotter climate,</text>
<text x="472" y="88.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >more heat waves</text>
<rect x="392" y="114" width="160" height="52" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2" />
<text x="472" y="136.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Ice melts, sea</text>
<text x="472" y="152.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >level rises</text>
<rect x="392" y="178" width="160" height="52" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2" />
<text x="472" y="200.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Changing rainfall:</text>
<text x="472" y="216.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >floods and droughts</text>
<text x="472" y="262" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" >EFFECTS</text>
<line x1="182" y1="76" x2="222" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<line x1="347" y1="140" x2="388" y2="76" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<line x1="182" y1="140" x2="222" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<line x1="347" y1="140" x2="388" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<line x1="182" y1="204" x2="222" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<line x1="347" y1="140" x2="388" y2="204" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)" stroke-linecap="round"/>
<rect x="10" y="292" width="540" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
<text x="280" y="310" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" >Responses</text>
<text x="280" y="328" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Mitigation = reduce the causes (clean energy, plant trees).</text>
<text x="280" y="344" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Adaptation = live with the effects (tougher crops, flood defences).</text>
</svg>
