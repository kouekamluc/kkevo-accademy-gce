<text x="60" y="272" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Q2</text>
<path d="M100,280 L152,280 L152,280 L204,280 L204,280 L256,280 L256,280 L308,280 L308,254 L360,254 L360,254 L412,254 L412,254 L464,254 L464,254 L516,254" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<line x1="100" y1="60" x2="100" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="152" y1="60" x2="152" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="204" y1="60" x2="204" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="256" y1="60" x2="256" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="308" y1="60" x2="308" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="360" y1="60" x2="360" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="412" y1="60" x2="412" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="464" y1="60" x2="464" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="516" y1="60" x2="516" y2="285" stroke="#B0B8C4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="126.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">0</text>
<text x="178.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">1</text>
<text x="230.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">2</text>
