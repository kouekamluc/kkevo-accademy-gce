<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">3-bit counter: Q0 flips every pulse, Q1 every 2nd, Q2 every 4th</text>
