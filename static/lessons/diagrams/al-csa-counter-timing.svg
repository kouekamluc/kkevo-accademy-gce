<text x="334.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">4</text>
<text x="386.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">5</text>
<text x="438.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">6</text>
<text x="490.0" y="312" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">7</text>
<text x="60" y="312" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Count</text>
