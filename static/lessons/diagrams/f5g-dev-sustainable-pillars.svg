<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Three pillars of sustainable development</title><defs><marker id="g3n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="g3b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="g3g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="g3a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><polygon points="40.0,100.0 280.0,40.0 520.0,100.0" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/><text x="280.0" y="85.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">SUSTAINABLE DEVELOPMENT</text><rect x="50.0" y="115.0" width="150.0" height="150.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125.0" y="145.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">ECONOMIC</text><text x="125.0" y="175.0" font-size="14" text-anchor="middle" fill="#102A43">Jobs and fair</text><text x="125.0" y="197.0" font-size="14" text-anchor="middle" fill="#102A43">income, growth</text><text x="125.0" y="219.0" font-size="14" text-anchor="middle" fill="#102A43">that lasts</text><rect x="205.0" y="115.0" width="150.0" height="150.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="145.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">SOCIAL</text><text x="280.0" y="175.0" font-size="14" text-anchor="middle" fill="#102A43">Health, education,</text><text x="280.0" y="197.0" font-size="14" text-anchor="middle" fill="#102A43">fairness, equal</text><text x="280.0" y="219.0" font-size="14" text-anchor="middle" fill="#102A43">chances</text><rect x="360.0" y="115.0" width="150.0" height="150.0" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="435.0" y="145.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">ENVIRONMENTAL</text><text x="435.0" y="175.0" font-size="14" text-anchor="middle" fill="#102A43">Protect soil, water,</text><text x="435.0" y="197.0" font-size="14" text-anchor="middle" fill="#102A43">forests and air</text><text x="435.0" y="219.0" font-size="14" text-anchor="middle" fill="#102A43">for the future</text><rect x="30.0" y="275.0" width="500.0" height="40.0" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="301.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Meet today's needs without harming future generations</text><text x="280.0" y="342.0" font-size="14" text-anchor="middle" fill="#102A43">All three pillars must stand together or the roof falls.</text></svg>