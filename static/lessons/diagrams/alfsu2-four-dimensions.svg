<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102A43"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker></defs><text x="280" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43">The four dimensions of food security</text><circle cx="280" cy="190" r="52" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Food</text><text x="280" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">security</text><rect x="20" y="50" width="240" height="80" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="140" y="76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">Availability</text><text x="140" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Enough food supplied:</text><text x="140" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">production, stocks, imports</text><rect x="300" y="50" width="240" height="80" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="420" y="76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">Access</text><text x="420" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Households can obtain it:</text><text x="420" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">income, prices, roads</text><rect x="20" y="250" width="240" height="80" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="140" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">Utilization</text><text x="140" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">The body can use it:</text><text x="140" y="316" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">safe food, water, health</text><rect x="300" y="250" width="240" height="80" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="420" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">Stability</text><text x="420" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Secure over time:</text><text x="420" y="316" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">shocks, seasons, prices</text><line x1="200" y1="130" x2="245" y2="160" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="360" y1="130" x2="315" y2="160" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="200" y1="250" x2="245" y2="220" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="360" y1="250" x2="315" y2="220" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><text x="280" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">All four must hold for people to be food secure.</text></svg>