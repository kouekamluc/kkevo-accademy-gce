<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="24" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Three social contract theories</text><rect x="118" y="40" width="138" height="36" fill="#2563EB" stroke="#102A43" stroke-width="2"/><text x="187.0" y="63" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Hobbes</text><rect x="258" y="40" width="146" height="36" fill="#2563EB" stroke="#102A43" stroke-width="2"/><text x="331.0" y="63" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Locke</text><rect x="406" y="40" width="146" height="36" fill="#2563EB" stroke="#102A43" stroke-width="2"/><text x="479.0" y="63" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Rousseau</text><rect x="6" y="78" width="110" height="60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="61.0" y="113.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">State of nature</text><rect x="118" y="78" width="138" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="187.0" y="113.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">war of all</text><rect x="258" y="78" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="331.0" y="106.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">peaceful,</text><text x="331.0" y="124.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">insecure</text><rect x="406" y="78" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="479.0" y="106.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">free,</text><text x="479.0" y="124.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">then corrupted</text><rect x="6" y="140" width="110" height="60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="61.0" y="175.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Gives up</text><rect x="118" y="140" width="138" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="187.0" y="168.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">all rights</text><text x="187.0" y="186.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">to ruler</text><rect x="258" y="140" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="331.0" y="168.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">right</text><text x="331.0" y="186.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">to enforce</text><rect x="406" y="140" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="479.0" y="168.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">self to</text><text x="479.0" y="186.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">the community</text><rect x="6" y="202" width="110" height="60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="61.0" y="237.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Sovereign</text><rect x="118" y="202" width="138" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="187.0" y="237.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">absolute ruler</text><rect x="258" y="202" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="331.0" y="230.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">limited,</text><text x="331.0" y="248.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">a trust</text><rect x="406" y="202" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="479.0" y="237.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">the people</text><rect x="6" y="264" width="110" height="60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="61.0" y="299.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Resistance</text><rect x="118" y="264" width="138" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="187.0" y="299.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">not allowed</text><rect x="258" y="264" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="331.0" y="292.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">when</text><text x="331.0" y="310.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">trust broken</text><rect x="406" y="264" width="146" height="60" fill="#ffffff" stroke="#102A43" stroke-width="2"/><text x="479.0" y="292.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">people can</text><text x="479.0" y="310.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">remove government</text></svg>