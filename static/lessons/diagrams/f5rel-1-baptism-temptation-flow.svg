<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Inter, Arial, sans-serif">
<title>From the Jordan to Galilee</title>
<rect width="560" height="300" fill="#FFFFFF"/>
<text x="280" y="30" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">From the Jordan to Galilee</text>
<rect x="20" y="56" width="154" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="97.0" y="90.5" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">John</text>
<text x="97.0" y="108.5" font-size="14" fill="#102A43" text-anchor="middle">Preaches</text>
<text x="97.0" y="126.5" font-size="14" fill="#102A43" text-anchor="middle">repentance</text>
<circle cx="24" cy="60" r="12" fill="#B45309"/>
<text x="24" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<rect x="202" y="56" width="154" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="279.0" y="81.5" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Baptism</text>
<text x="279.0" y="99.5" font-size="14" fill="#102A43" text-anchor="middle">Spirit like a</text>
<text x="279.0" y="117.5" font-size="14" fill="#102A43" text-anchor="middle">dove; voice from</text>
<text x="279.0" y="135.5" font-size="14" fill="#102A43" text-anchor="middle">heaven</text>
<circle cx="206" cy="60" r="12" fill="#B45309"/>
<text x="206" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<rect x="384" y="56" width="154" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="461.0" y="90.5" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Wilderness</text>
<text x="461.0" y="108.5" font-size="14" fill="#102A43" text-anchor="middle">Forty days of</text>
<text x="461.0" y="126.5" font-size="14" fill="#102A43" text-anchor="middle">fasting</text>
<circle cx="388" cy="60" r="12" fill="#B45309"/>
<text x="388" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<rect x="20" y="185" width="154" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="97.0" y="219.5" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Three temptations</text>
<text x="97.0" y="237.5" font-size="14" fill="#102A43" text-anchor="middle">Bread, temple,</text>
<text x="97.0" y="255.5" font-size="14" fill="#102A43" text-anchor="middle">kingdoms</text>
<circle cx="24" cy="189" r="12" fill="#B45309"/>
<text x="24" y="194" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<rect x="202" y="185" width="154" height="95" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="279.0" y="219.5" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Victory</text>
<text x="279.0" y="237.5" font-size="14" fill="#102A43" text-anchor="middle">Jesus answers</text>
<text x="279.0" y="255.5" font-size="14" fill="#102A43" text-anchor="middle">with scripture</text>
<circle cx="206" cy="189" r="12" fill="#B45309"/>
<text x="206" y="194" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<rect x="384" y="185" width="154" height="95" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="461.0" y="228.5" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Galilee</text>
<text x="461.0" y="246.5" font-size="14" fill="#102A43" text-anchor="middle">Begins to preach</text>
<circle cx="388" cy="189" r="12" fill="#B45309"/>
<text x="388" y="194" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
<line x1="174" y1="103.5" x2="192.0" y2="103.5" stroke="#102A43" stroke-width="2"/>
<polygon points="202,103.5 192.0,98.5 192.0,108.5" fill="#102A43"/>
<line x1="356" y1="103.5" x2="374.0" y2="103.5" stroke="#102A43" stroke-width="2"/>
<polygon points="384,103.5 374.0,98.5 374.0,108.5" fill="#102A43"/>
<polyline points="461.0,151 461.0,168 97.0,168" fill="none" stroke="#102A43" stroke-width="2"/>
<line x1="97.0" y1="168" x2="97.0" y2="175.0" stroke="#102A43" stroke-width="2"/>
<polygon points="97.0,185 102.0,175.0 92.0,175.0" fill="#102A43"/>
<line x1="174" y1="232.5" x2="192.0" y2="232.5" stroke="#102A43" stroke-width="2"/>
<polygon points="202,232.5 192.0,227.5 192.0,237.5" fill="#102A43"/>
<line x1="356" y1="232.5" x2="374.0" y2="232.5" stroke="#102A43" stroke-width="2"/>
<polygon points="384,232.5 374.0,227.5 374.0,237.5" fill="#102A43"/>
</svg>
