<text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43" text-anchor="middle" >Time zones: hours ahead (+) or behind (−) Greenwich</text>
<text x="280" y="58" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" >Each zone is about 15° wide and its time is based on a central meridian.</text>
<text x="280" y="78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" >Numbers along the top: standard time compared with Greenwich (UTC).</text>
