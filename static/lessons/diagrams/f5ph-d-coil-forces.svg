<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>End view of a coil between magnet poles, with the forces on its sides</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280.0" y="28.0" font-size="17" font-weight="700" fill="#102A43" text-anchor="middle">A coil in a magnetic field (end view)</text>
<rect x="30.0" y="100.0" width="90.0" height="130.0" rx="4" fill="#FEE2E2" stroke="#102A43" stroke-width="2.5"/>
<text x="75.0" y="172.0" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle">N</text>
<rect x="440.0" y="100.0" width="90.0" height="130.0" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<text x="485.0" y="172.0" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle">S</text>
<line x1="135.0" y1="120.0" x2="419.0" y2="120.0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/><polygon points="425.0,120.0 416.0,124.3 416.0,115.7" fill="#2563EB"/>
<line x1="135.0" y1="140.0" x2="419.0" y2="140.0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/><polygon points="425.0,140.0 416.0,144.3 416.0,135.7" fill="#2563EB"/>
<line x1="135.0" y1="190.0" x2="419.0" y2="190.0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/><polygon points="425.0,190.0 416.0,194.3 416.0,185.7" fill="#2563EB"/>
<line x1="135.0" y1="210.0" x2="419.0" y2="210.0" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/><polygon points="425.0,210.0 416.0,214.3 416.0,205.7" fill="#2563EB"/>
<line x1="210.0" y1="165.0" x2="350.0" y2="165.0" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<circle cx="210.0" cy="165.0" r="15" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5"/>
<circle cx="210.0" cy="165.0" r="3.5" fill="#102A43" stroke="#102A43" stroke-width="2.5"/>
<circle cx="350.0" cy="165.0" r="15" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5"/>
<line x1="341.0" y1="156.0" x2="359.0" y2="174.0" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="359.0" y1="156.0" x2="341.0" y2="174.0" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="210.0" y1="100.0" x2="210.0" y2="63.2" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/><polygon points="210.0,56.0 215.2,66.8 204.8,66.8" fill="#047857"/>
<text x="262.0" y="62.0" font-size="14" font-weight="700" fill="#047857" text-anchor="start">force up</text>
<line x1="350.0" y1="230.0" x2="350.0" y2="266.8" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/><polygon points="350.0,274.0 344.8,263.2 355.2,263.2" fill="#047857"/>
<text x="296.0" y="280.0" font-size="14" font-weight="700" fill="#047857" text-anchor="end">force down</text>
<text x="280.0" y="316.0" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Left side: current towards you (dot). Right side: current away (cross).</text>
<text x="280.0" y="340.0" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">The two forces turn the coil clockwise.</text>
</svg>