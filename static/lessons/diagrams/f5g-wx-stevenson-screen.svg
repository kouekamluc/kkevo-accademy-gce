<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>A Stevenson screen</title><defs><marker id="sti" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="stb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="stg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="str" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="sts" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><line x1="30" y1="320" x2="340" y2="320" stroke="#047857" stroke-width="4"/><line x1="36" y1="320" x2="32" y2="310" stroke="#047857" stroke-width="2"/><line x1="58" y1="320" x2="54" y2="310" stroke="#047857" stroke-width="2"/><line x1="80" y1="320" x2="76" y2="310" stroke="#047857" stroke-width="2"/><line x1="102" y1="320" x2="98" y2="310" stroke="#047857" stroke-width="2"/><line x1="124" y1="320" x2="120" y2="310" stroke="#047857" stroke-width="2"/><line x1="146" y1="320" x2="142" y2="310" stroke="#047857" stroke-width="2"/><line x1="168" y1="320" x2="164" y2="310" stroke="#047857" stroke-width="2"/><line x1="190" y1="320" x2="186" y2="310" stroke="#047857" stroke-width="2"/><line x1="212" y1="320" x2="208" y2="310" stroke="#047857" stroke-width="2"/><line x1="234" y1="320" x2="230" y2="310" stroke="#047857" stroke-width="2"/><line x1="256" y1="320" x2="252" y2="310" stroke="#047857" stroke-width="2"/><line x1="278" y1="320" x2="274" y2="310" stroke="#047857" stroke-width="2"/><line x1="300" y1="320" x2="296" y2="310" stroke="#047857" stroke-width="2"/><line x1="322" y1="320" x2="318" y2="310" stroke="#047857" stroke-width="2"/><rect x="126" y="228" width="10" height="92" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><rect x="304" y="228" width="10" height="92" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><rect x="120" y="128" width="200" height="100" rx="0" fill="#fff" stroke="#102A43" stroke-width="3"/><line x1="120" y1="140.5" x2="320" y2="140.5" stroke="#64748B" stroke-width="2"/><line x1="120" y1="153" x2="320" y2="153" stroke="#64748B" stroke-width="2"/><line x1="120" y1="165.5" x2="320" y2="165.5" stroke="#64748B" stroke-width="2"/><line x1="120" y1="178" x2="320" y2="178" stroke="#64748B" stroke-width="2"/><line x1="120" y1="190.5" x2="320" y2="190.5" stroke="#64748B" stroke-width="2"/><line x1="120" y1="203" x2="320" y2="203" stroke="#64748B" stroke-width="2"/><line x1="120" y1="215.5" x2="320" y2="215.5" stroke="#64748B" stroke-width="2"/><rect x="220" y="128" width="100" height="100" rx="0" fill="none" stroke="#102A43" stroke-width="3.5"/><circle cx="232" cy="178" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/><rect x="110" y="112" width="220" height="12" rx="0" fill="#fff" stroke="#102A43" stroke-width="3"/><rect x="100" y="94" width="240" height="12" rx="0" fill="#fff" stroke="#102A43" stroke-width="3"/><text x="372" y="92" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Double roof, painted white:</text><text x="372" y="108" font-size="13" text-anchor="start" fill="#102A43">keeps off sun and rain, air</text><text x="372" y="124" font-size="13" text-anchor="start" fill="#102A43">can pass between layers</text><line x1="368" y1="100" x2="344" y2="100" stroke="#64748B" stroke-width="2" marker-end="url(#sts)"/><text x="372" y="172" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Louvred (slatted) sides:</text><text x="372" y="188" font-size="13" text-anchor="start" fill="#102A43">air flows through, rain and</text><text x="372" y="204" font-size="13" text-anchor="start" fill="#102A43">sun are kept out</text><line x1="368" y1="180" x2="324" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#sts)"/><text x="372" y="246" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Door faces away from the</text><text x="372" y="262" font-size="13" text-anchor="start" fill="#102A43">sun (north in the northern</text><text x="372" y="278" font-size="13" text-anchor="start" fill="#102A43">hemisphere)</text><line x1="368" y1="244" x2="324" y2="212" stroke="#64748B" stroke-width="2" marker-end="url(#sts)"/><text x="372" y="314" font-size="13" text-anchor="start" fill="#047857" font-weight="bold">Short grass, open site</text><line x1="368" y1="310" x2="340" y2="316" stroke="#047857" stroke-width="2" marker-end="url(#stg)"/><line x1="70" y1="275" x2="70" y2="230" stroke="#B45309" stroke-width="2" marker-end="url(#str)"/><line x1="70" y1="275" x2="70" y2="318" stroke="#B45309" stroke-width="2" marker-end="url(#str)"/><line x1="60" y1="228" x2="80" y2="228" stroke="#B45309" stroke-width="2"/><text x="60" y="262" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">about</text><text x="60" y="278" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">1.25 m</text><text x="220" y="58" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Thermometers sit inside, in the shade</text><text x="220" y="76" font-size="13" text-anchor="middle" fill="#64748B">White paint reflects sunlight</text></svg>