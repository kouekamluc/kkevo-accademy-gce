<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#ffffff"/><text x="280" y="26" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle">The centralising system: from document to statements</text><rect x="16" y="50" width="160" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="96.0" y="70" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Source documents</text><text x="96.0" y="87" font-size="13" fill="#102A43" text-anchor="middle">invoices, cheques,</text><text x="96.0" y="104" font-size="13" fill="#102A43" text-anchor="middle">receipts, slips</text><rect x="200" y="50" width="160" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="70" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Auxiliary journals</text><text x="280.0" y="87" font-size="13" fill="#102A43" text-anchor="middle">sales, purchases,</text><text x="280.0" y="104" font-size="13" fill="#102A43" text-anchor="middle">bank, cash, OD</text><rect x="384" y="50" width="160" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="464.0" y="70" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Centralisation</text><text x="464.0" y="87" font-size="13" fill="#102A43" text-anchor="middle">monthly totals to</text><text x="464.0" y="104" font-size="13" fill="#102A43" text-anchor="middle">the general journal</text><rect x="200" y="160" width="160" height="64" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="180" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Auxiliary ledgers</text><text x="280.0" y="197" font-size="13" fill="#102A43" text-anchor="middle">one account per</text><text x="280.0" y="214" font-size="13" fill="#102A43" text-anchor="middle">customer, supplier</text><rect x="384" y="160" width="160" height="64" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="464.0" y="180" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">General ledger</text><text x="464.0" y="197" font-size="13" fill="#102A43" text-anchor="middle">collective accounts</text><text x="464.0" y="214" font-size="13" fill="#102A43" text-anchor="middle">401 and 411</text><rect x="384" y="270" width="160" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="464.0" y="290" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Trial balance</text><text x="464.0" y="307" font-size="13" fill="#102A43" text-anchor="middle">six columns:</text><text x="464.0" y="324" font-size="13" fill="#102A43" text-anchor="middle">opening, flows, closing</text><rect x="200" y="270" width="160" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="290" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Financial statements</text><text x="280.0" y="307" font-size="13" fill="#102A43" text-anchor="middle">balance sheet, result,</text><text x="280.0" y="324" font-size="13" fill="#102A43" text-anchor="middle">cash flow, notes</text><rect x="16" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/><text x="96.0" y="180" font-size="13" font-weight="bold" fill="#102A43" text-anchor="middle">Computerised:</text><text x="96.0" y="197" font-size="13" fill="#102A43" text-anchor="middle">one validated entry</text><text x="96.0" y="214" font-size="13" fill="#102A43" text-anchor="middle">updates everything</text><line x1="176" y1="82" x2="198" y2="82" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="360" y1="82" x2="382" y2="82" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="280" y1="114" x2="280" y2="158" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="464" y1="114" x2="464" y2="158" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="464" y1="224" x2="464" y2="268" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="384" y1="302" x2="362" y2="302" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/><line x1="360" y1="192" x2="384" y2="192" stroke="#B45309" stroke-width="2" stroke-dasharray="5 3"/></svg>