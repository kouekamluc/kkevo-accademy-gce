<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Convectional rainfall</title><defs><marker id="cvi" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="cvb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="cvg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="cvr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="cvs" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="0" y="300" width="560" height="60" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="0"/><line x1="0" y1="300" x2="560" y2="300" stroke="#B45309" stroke-width="3"/><circle cx="44" cy="44" r="20" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><line x1="60" y1="70" x2="90" y2="290" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#cvr)"/><line x1="75" y1="75" x2="140" y2="290" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#cvr)"/><line x1="90" y1="80" x2="190" y2="290" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#cvr)"/><rect x="0" y="300" width="560" height="0" rx="0" fill="none" stroke="#102A43" stroke-width="0"/><line x1="160" y1="285" x2="175" y2="150" stroke="#B45309" stroke-width="3" marker-end="url(#cvr)"/><line x1="215" y1="285" x2="230" y2="150" stroke="#B45309" stroke-width="3" marker-end="url(#cvr)"/><line x1="270" y1="285" x2="285" y2="150" stroke="#B45309" stroke-width="3" marker-end="url(#cvr)"/><line x1="60" y1="140" x2="380" y2="140" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/><text x="76" y="50" font-size="13" text-anchor="start" fill="#64748B" font-weight="bold">Condensation level</text><line x1="150" y1="58" x2="150" y2="136" stroke="#64748B" stroke-width="2" marker-end="url(#cvs)"/><circle cx="246.8" cy="111.4" r="30.4" fill="#64748B"/><circle cx="288.6" cy="84.8" r="41.8" fill="#64748B"/><circle cx="341.8" cy="103.8" r="34.2" fill="#64748B"/><circle cx="307.6" cy="119" r="30.4" fill="#64748B"/><circle cx="246.8" cy="111.4" r="28.2" fill="#E2E8F0"/><circle cx="288.6" cy="84.8" r="39.6" fill="#E2E8F0"/><circle cx="341.8" cy="103.8" r="32" fill="#E2E8F0"/><circle cx="307.6" cy="119" r="28.2" fill="#E2E8F0"/><line x1="310" y1="160" x2="302" y2="250" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cvb)"/><line x1="335" y1="160" x2="327" y2="250" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cvb)"/><line x1="360" y1="160" x2="352" y2="250" stroke="#2563EB" stroke-width="2.5" marker-end="url(#cvb)"/><text x="350" y="270" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="bold">Heavy rain</text><text x="150" y="322" font-size="13" text-anchor="start" fill="#B45309" font-weight="bold">Hot ground (heated by the sun)</text><circle cx="404" cy="152" r="11" fill="#102A43" stroke="#102A43" stroke-width="2"/><text x="404" y="157" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="424" y="154" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Strong sun heats</text><text x="424" y="170" font-size="13" text-anchor="start" fill="#102A43">the ground</text><circle cx="404" cy="190" r="11" fill="#102A43" stroke="#102A43" stroke-width="2"/><text x="404" y="195" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="424" y="192" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Warm air rises</text><text x="424" y="208" font-size="13" text-anchor="start" fill="#102A43">(convection)</text><circle cx="404" cy="228" r="11" fill="#102A43" stroke="#102A43" stroke-width="2"/><text x="404" y="233" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="424" y="230" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Air cools, vapour</text><text x="424" y="246" font-size="13" text-anchor="start" fill="#102A43">condenses: cloud</text><circle cx="404" cy="266" r="11" fill="#102A43" stroke="#102A43" stroke-width="2"/><text x="404" y="271" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="424" y="268" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">Heavy rain,</text><text x="424" y="284" font-size="13" text-anchor="start" fill="#102A43">often with thunder</text></svg>