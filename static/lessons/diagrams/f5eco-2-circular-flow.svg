<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="24" text-anchor="middle" fill="#102A43" font-size="14" font-weight="700">Circular flow of income: three sectors</text><rect x="30" y="150" width="130" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95.0" y="185.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Households</text><rect x="400" y="150" width="130" height="60" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="465.0" y="185.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Firms</text><rect x="215" y="48" width="130" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="78.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Government</text><rect x="215" y="262" width="130" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="292.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">Banks (savings)</text><line x1="160" y1="165" x2="400" y2="165" stroke="#102A43" stroke-width="2"/><polygon points="400,165 390.8,168.9 390.8,161.1" fill="#102A43"/><text x="280" y="157" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Spending on goods</text><line x1="400" y1="198" x2="160" y2="198" stroke="#102A43" stroke-width="2"/><polygon points="160,198 169.2,194.1 169.2,201.9" fill="#102A43"/><text x="280" y="218" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Wages, rent, interest, profit</text><line x1="90" y1="212" x2="214" y2="285" stroke="#B45309" stroke-width="2"/><polygon points="214,285 204.1,283.7 208.0,277.0" fill="#B45309"/><text x="70" y="262" text-anchor="middle" fill="#B45309" font-size="13" font-weight="400">Saving</text><line x1="346" y1="285" x2="470" y2="212" stroke="#047857" stroke-width="2"/><polygon points="470,212 464.0,220.0 460.1,213.3" fill="#047857"/><text x="490" y="262" text-anchor="middle" fill="#047857" font-size="13" font-weight="400">Investment</text><line x1="90" y1="148" x2="214" y2="80" stroke="#B45309" stroke-width="2"/><polygon points="214,80 207.8,87.8 204.1,81.0" fill="#B45309"/><text x="70" y="112" text-anchor="middle" fill="#B45309" font-size="13" font-weight="400">Taxes</text><line x1="346" y1="80" x2="470" y2="148" stroke="#047857" stroke-width="2"/><polygon points="470,148 460.1,147.0 463.8,140.2" fill="#047857"/><text x="490" y="112" text-anchor="middle" fill="#047857" font-size="13" font-weight="400">Public spending</text><text x="280" y="346" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Brown arrows: leakages. Green arrows: injections.</text></g></svg>