<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Court ladder from customary courts up to the Supreme Court</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="130" y="14" width="300" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="30.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Supreme Court</text>
<text x="280.0" y="48.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(Yaounde)</text>
<rect x="130" y="80" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="96.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Court of Appeal</text>
<text x="280.0" y="114.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(in each region)</text>
<rect x="130" y="146" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="162.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">High Court</text>
<text x="280.0" y="180.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(in each division)</text>
<rect x="130" y="212" width="300" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="228.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Court of First Instance</text>
<text x="280.0" y="246.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(in a sub-division or town)</text>
<rect x="130" y="278" width="300" height="50" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
<text x="280.0" y="294.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Customary / traditional courts</text>
<text x="280.0" y="312.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(local, customary law)</text>
<line x1="280" y1="80" x2="280" y2="64" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="64" x2="284.6" y2="71.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="64" x2="275.4" y2="71.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="146" x2="280" y2="130" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="130" x2="284.6" y2="137.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="130" x2="275.4" y2="137.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="212" x2="280" y2="196" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="196" x2="284.6" y2="203.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="196" x2="275.4" y2="203.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="278" x2="280" y2="262" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="262" x2="284.6" y2="269.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="262" x2="275.4" y2="269.7" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="300" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">Lowest</text>
<text x="60" y="40" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">Highest</text>
</svg>
