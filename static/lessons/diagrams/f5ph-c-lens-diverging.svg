<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A diverging lens forms a virtual, upright, smaller image on the same side as the object</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="20" y1="180" x2="545" y2="180" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<path d="M291,85 Q302,180 291,275 L309,275 Q298,180 309,85 Z" fill="#EFF6FF" stroke="#102A43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="50" y1="180" x2="50" y2="130" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<text x="50" y="116" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">object</text>
<line x1="228.6" y1="180" x2="228.6" y2="165.7" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="140" y="224" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">image</text>
<line x1="158" y1="216" x2="226" y2="169.7" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<line x1="50" y1="130" x2="300" y2="130" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="184,130 167.1,134.3 167.1,125.7" fill="#2563EB"/>
<line x1="300" y1="130" x2="460" y2="50" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="388,86 374.9,97.4 371,89.7" fill="#2563EB"/>
<line x1="300" y1="130" x2="200" y2="180" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="50" y1="130" x2="300" y2="180" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="183.8,156.8 166.4,157.7 168.1,149.2" fill="#B45309"/>
<line x1="300" y1="180" x2="460" y2="212" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="200" cy="180" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="200" y="198" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<circle cx="400" cy="180" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="400" y="162" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<text x="280" y="340" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Diverging lens: image virtual, upright, smaller, between lens and F</text>
<text x="20" y="25" font-size="13" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">blue: parallel to axis, spreads as if from F</text>
<text x="20" y="45" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">amber: through the centre, straight on</text>
</svg>
