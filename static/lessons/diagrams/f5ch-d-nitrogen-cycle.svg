rifying</text><text x="165" y="203" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">bacteria</text><line x1="370" y1="175" x2="410" y2="175" stroke="#047857" stroke-width="2" marker-end="url(#a047857)"/><line x1="480" y1="200" x2="480" y2="245" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="410" y1="270" x2="140" y2="270" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><text x="275" y="263" font-size="13" text-anchor="middle" fill="#102A43">death and waste</text><line x1="70" y1="245" x2="70" y2="206" stroke="#2563EB" stroke-width="2" marker-end="url(#a2563EB)"/><text x="78" y="232" font-size="13" text-anchor="start" fill="#2563EB" font-weight="600">decay</text></svg>