<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a102A43" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker><marker id="a047857" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#047857"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="180" y="8" width="200" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="27" font-size="14" text-anchor="middle" fill="#102A43">Nitrogen gas, N<tspan dy="4" font-size="13">2</tspan><tspan dy="-4">&#8203;</tspan>,</text><text x="280" y="45" font-size="14" text-anchor="middle" fill="#102A43">in the air</text><rect x="10" y="12" width="140" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="80" y="32" font-size="13" text-anchor="middle" fill="#102A43">Fertilisers</text><text x="80" y="48" font-size="13" text-anchor="middle" fill="#102A43">(Haber process)</text><rect x="200" y="150" width="170" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="285" y="180" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Nitrates in the soil</text><rect x="10" y="150" width="120" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="70" y="174" font-size="13" text-anchor="middle" fill="