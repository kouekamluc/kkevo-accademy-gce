<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="22.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">HACCP: preparation, then seven principles</text><text x="100.0" y="50.0" font-size="14" text-anchor="middle" fill="#B45309" font-weight="bold">Preliminary tasks</text><rect x="10.0" y="60.0" width="180.0" height="40.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="100.0" y="84.5" font-size="13" text-anchor="middle" fill="#102A43">Assemble the HACCP team</text><rect x="10.0" y="114.0" width="180.0" height="40.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="100.0" y="138.6" font-size="13" text-anchor="middle" fill="#102A43">Describe the product</text><rect x="10.0" y="168.0" width="180.0" height="40.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="100.0" y="192.6" font-size="13" text-anchor="middle" fill="#102A43">Identify intended use</text><rect x="10.0" y="222.0" width="180.0" height="40.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="100.0" y="246.6" font-size="13" text-anchor="middle" fill="#102A43">Draw the flow diagram</text><rect x="10.0" y="276.0" width="180.0" height="40.0" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="100.0" y="300.6" font-size="13" text-anchor="middle" fill="#102A43">Confirm it on site</text><line x1="190.0" y1="200.0" x2="209.0" y2="200.0" stroke="#102A43" stroke-width="2"/><line x1="209.0" y1="200.0" x2="209.0" y2="75.0" stroke="#102A43" stroke-width="2"/><line x1="209.0" y1="75.0" x2="226.0" y2="75.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="400.0" y="50.0" font-size="14" text-anchor="middle" fill="#047857" font-weight="bold">Seven principles</text><rect x="228.0" y="58.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="79.5" font-size="13" text-anchor="middle" fill="#102A43">1 Hazard analysis</text><rect x="228.0" y="101.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="122.5" font-size="13" text-anchor="middle" fill="#102A43">2 Determine the CCPs</text><rect x="228.0" y="144.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="165.6" font-size="13" text-anchor="middle" fill="#102A43">3 Set critical limits</text><rect x="228.0" y="187.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="208.6" font-size="13" text-anchor="middle" fill="#102A43">4 Monitor each CCP</text><rect x="228.0" y="230.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="251.6" font-size="13" text-anchor="middle" fill="#102A43">5 Corrective actions</text><rect x="228.0" y="273.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="294.6" font-size="13" text-anchor="middle" fill="#102A43">6 Verification</text><rect x="228.0" y="316.0" width="300.0" height="34.0" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="378.0" y="337.6" font-size="13" text-anchor="middle" fill="#102A43">7 Records and documents</text></svg>