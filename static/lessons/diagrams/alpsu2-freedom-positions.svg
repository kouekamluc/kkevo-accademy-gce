<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Freedom and determinism: three positions</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" text-anchor="middle" font-size="15" fill="#102A43" font-weight="700">Two questions sort the three positions</text><rect x="180" y="44" width="200" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="62.4" text-anchor="middle" font-size="14" fill="#102A43">Is determinism true</text><text x="280.0" y="81.4" text-anchor="middle" font-size="14" fill="#102A43">of human choice?</text><line x1="230" y1="90" x2="120" y2="130" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="330" y1="90" x2="440" y2="130" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="150" y="112" text-anchor="middle" font-size="14" fill="#047857" font-weight="700">Yes</text><text x="410" y="112" text-anchor="middle" font-size="14" fill="#B45309" font-weight="700">No</text><rect x="20" y="132" width="200" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="120.0" y="153.4" text-anchor="middle" font-size="14" fill="#102A43">Does freedom need the</text><text x="120.0" y="172.4" text-anchor="middle" font-size="14" fill="#102A43">power to do otherwise?</text><rect x="350" y="140" width="190" height="90" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="445.0" y="161.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Libertarianism</text><text x="445.0" y="180.4" text-anchor="middle" font-size="14" fill="#102A43">Choices are not fully</text><text x="445.0" y="199.4" text-anchor="middle" font-size="14" fill="#102A43">caused; the agent is</text><text x="445.0" y="218.4" text-anchor="middle" font-size="14" fill="#102A43">the author</text><line x1="80" y1="184" x2="80" y2="244" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="160" y1="184" x2="220" y2="244" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="60" y="222" text-anchor="middle" font-size="14" fill="#047857" font-weight="700">Yes</text><text x="212" y="222" text-anchor="middle" font-size="14" fill="#B45309" font-weight="700">No</text><rect x="8" y="246" width="152" height="84" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="84.0" y="273.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Hard determinism</text><text x="84.0" y="292.9" text-anchor="middle" font-size="14" fill="#102A43">No real freedom or</text><text x="84.0" y="311.9" text-anchor="middle" font-size="14" fill="#102A43">responsibility</text><rect x="170" y="246" width="175" height="84" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="257.5" y="273.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Compatibilism</text><text x="257.5" y="292.9" text-anchor="middle" font-size="14" fill="#102A43">Freedom is acting</text><text x="257.5" y="311.9" text-anchor="middle" font-size="14" fill="#102A43">from your own reasons</text><text x="280" y="352" text-anchor="middle" font-size="13" fill="#102A43">Positions only: attribute each to its philosophers in your essay</text></svg>