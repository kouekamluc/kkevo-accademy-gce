<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Two panels: a small distortion of a large anion cloud by a weakly polarising cation, and a large distortion by a highly charged small cation</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280.0" y="26.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700" >Polarisation of an anion by a cation</text>
<circle cx="90.0" cy="140.0" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="90.0" y="145.0" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700" >+</text>
<circle cx="185.0" cy="140.0" r="44" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5" />
<text x="185.0" y="145.0" font-size="16" fill="#B45309" text-anchor="middle" font-weight="700" >-</text>
<text x="137.0" y="230.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >Low-charge cation (1+),</text>
<text x="137.0" y="248.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >large anion: cloud</text>
<text x="137.0" y="266.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >stays almost spherical</text>
<text x="137.0" y="292.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >Mostly ionic, e.g. NaCl</text>
<circle cx="360.0" cy="140.0" r="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="360.0" y="145.0" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700" >3+</text>
<path d="M372,118 C410,100 470,110 495,140 C470,172 410,182 372,162 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5" />
<text x="450.0" y="145.0" font-size="16" fill="#B45309" text-anchor="middle" font-weight="700" >I-</text>
<text x="430.0" y="230.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >Small cation, charge 3+, large anion:</text>
<text x="430.0" y="248.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >cloud pulled towards the cation,</text>
<text x="430.0" y="266.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >electron density shared between them</text>
<text x="430.0" y="292.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >Partly covalent, e.g. AlI3</text>
<line x1="285.0" y1="60.0" x2="285.0" y2="320.0" stroke="#9CA3AF" stroke-width="1.5" />
<text x="137.0" y="70.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700" >Little distortion</text>
<text x="430.0" y="70.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700" >Large distortion</text>
</svg>
