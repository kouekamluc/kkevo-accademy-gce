<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-label="Three cases of material index: weight-losing 4, weight-gaining 0.5 and footloose 1"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="350" fill="#ffffff"/><text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Material index and where the factory goes</text><text x="95.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">Weight-losing</text><text x="280.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">Weight-gaining</text><text x="465.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">Footloose</text><rect x="40" y="72" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="70" y="72" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="40" y="102" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="70" y="102" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><line x1="104.0" y1="100.0" x2="134.0" y2="100.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="142" y="87" width="26" height="26" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><rect x="220" y="72" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><rect x="220" y="102" width="26" height="26" rx="3" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/><line x1="252.0" y1="100.0" x2="282.0" y2="100.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="290" y="72" width="26" height="26" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><rect x="290" y="102" width="26" height="26" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><rect x="400" y="87" width="26" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><line x1="432.0" y1="100.0" x2="462.0" y2="100.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="470" y="87" width="26" height="26" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95.0" y="160.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">4 units of raw</text><text x="95.0" y="178.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">material give 1</text><text x="95.0" y="196.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">unit of product</text><text x="95.0" y="226.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">MI = 4 ÷ 1 = 4</text><text x="95.0" y="246.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">MI is more than 1</text><text x="95.0" y="280.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Site near the</text><text x="95.0" y="298.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">raw material</text><text x="280.0" y="160.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">1 unit of raw material</text><text x="280.0" y="178.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">plus water gives 2</text><text x="280.0" y="196.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">units of product</text><text x="280.0" y="226.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">MI = 1 ÷ 2 = 0.5</text><text x="280.0" y="246.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">MI is less than 1</text><text x="280.0" y="280.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Site near the</text><text x="280.0" y="298.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">market</text><text x="465.0" y="160.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">1 unit of raw</text><text x="465.0" y="178.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">material gives 1</text><text x="465.0" y="196.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">unit of product</text><text x="465.0" y="226.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">MI = 1 ÷ 1 = 1</text><text x="465.0" y="246.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">MI is about 1</text><text x="465.0" y="280.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Site is flexible</text><text x="465.0" y="298.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">(footloose)</text><text x="280.0" y="334.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">Amber: localised raw material.  Blue: water, found everywhere.  Green: product.</text></svg>