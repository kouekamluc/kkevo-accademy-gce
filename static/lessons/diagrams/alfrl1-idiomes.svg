<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="15" y="10" width="240" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="135.0" y="34.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Est-ce une expression</text><text x="135.0" y="53.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">idiomatique ?</text><line x1="255" y1="39" x2="305" y2="39" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="30" text-anchor="middle" font-size="13" fill="#B45309">non</text><rect x="305" y="10" width="240" height="58" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425.0" y="34.4" text-anchor="middle" font-size="14" fill="#102A43">Traduction ordinaire,</text><text x="425.0" y="53.4" text-anchor="middle" font-size="14" fill="#102A43">attention aux collocations</text><line x1="135" y1="68" x2="135" y2="100" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="145" y="90" text-anchor="start" font-size="13" fill="#B45309">oui</text><rect x="15" y="100" width="240" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="135.0" y="124.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">M&#234;me image dans</text><text x="135.0" y="143.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">l'autre langue ?</text><line x1="255" y1="129" x2="305" y2="129" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="120" text-anchor="middle" font-size="13" fill="#B45309">oui</text><rect x="305" y="100" width="240" height="58" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425.0" y="124.4" text-anchor