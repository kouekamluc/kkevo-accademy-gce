<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#102A43"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#047857"/></marker><marker id="m" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#B45309"/></marker></defs><text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">A simple calorimeter for a temperature change</text><rect x="170" y="96" width="220" height="200" rx="14" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><rect x="186" y="130" width="188" height="150" rx="6" fill="#DBEAFE" stroke="#102A43" stroke-width="2"/><rect x="162" y="86" width="236" height="14" rx="4" fill="#E2E8F0" stroke="#102A43" stroke-width="2"/><line x1="280.0" y1="56.0" x2="280.0" y2="196.0" stroke="#102A43" stroke-width="4"/><rect x="273" y="192" width="14" height="30" rx="7" fill="#B45309" stroke="#102A43" stroke-width="2"/><text x="300" y="64" font-size="14" text-anchor="start" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">thermometer</text><text x="430" y="96" font-size="14" text-anchor="start" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">lid</text><text x="430" y="200" font-size="14" text-anchor="start" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">insulated</text><text x="430" y="218" font-size="14" text-anchor="start" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">cup</text><text x="280" y="250" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">solution</text><text x="280" y="268" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">(mass m)</text><text x="280" y="322" font-size="16" text-anchor="middle" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">Q = m c &#916;T</text><text x="280" y="344" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">c of water = 4.2 J per g per K</text></svg>