<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">The twelve pure vowels of British English</title><desc id="d">Vowel chart with twelve pure vowels, close at the top, open at the bottom, front on the left, back on the right.</desc><rect width="560" height="360" fill="#FFFFFF"/><polygon points="80,60 490,60 490,290 270,290" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><line x1="143.3" y1="136.7" x2="490" y2="136.7" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5" opacity="0.45"/><line x1="206.7" y1="213.3" x2="490" y2="213.3" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5" opacity="0.45"/><text x="80" y="42" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">front</text><text x="490" y="42" font-size="14" fill="#102A43" text-anchor="end" font-family="Inter, Arial, sans-serif">back</text><text x="285" y="42" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">central</text><text x="14" y="70" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">close</text><text x="14" y="296" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">open</text><circle cx="80.0" cy="60.0" r="5" fill="#047857"/><text x="92.0" y="84.0" font-size="18" font-weight="700" fill="#047857" text-anchor="start" font-family="Inter, Arial, sans-serif">i&#x2D0;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">fleece</tspan></text><circle cx="225.6" cy="99.1" r="5" fill="#2563EB"/><text x="237.6" y="104.1" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">&#x26A;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">kit</tspan></text><circle cx="175.0" cy="175.0" r="5" fill="#2563EB"/><text x="187.0" y="180.0" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">e<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">dress</tspan></text><circle cx="251.0" cy="267.0" r="5" fill="#2563EB"/><text x="263.0" y="272.0" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">&#xE6;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">trap</tspan></text><circle cx="361.6" cy="99.1" r="5" fill="#2563EB"/><text x="373.6" y="104.1" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">&#x28A;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">foot</tspan></text><circle cx="490.0" cy="60.0" r="5" fill="#047857"/><text x="478.0" y="84.0" font-size="18" font-weight="700" fill="#047857" text-anchor="end" font-family="Inter, Arial, sans-serif">u&#x2D0;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">goose</tspan></text><circle cx="323.0" cy="152.0" r="5" fill="#047857"/><text x="335.0" y="157.0" font-size="18" font-weight="700" fill="#047857" text-anchor="start" font-family="Inter, Arial, sans-serif">&#x25C;&#x2D0;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">nurse</tspan></text><circle cx="343.9" cy="202.6" r="5" fill="#2563EB"/><text x="355.9" y="207.6" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">&#x259;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">about</tspan></text><circle cx="415.6" cy="234.8" r="5" fill="#2563EB"/><text x="403.6" y="239.8" font-size="18" font-weight="700" fill="#2563EB" text-anchor="end" font-family="Inter, Arial, sans-serif">&#x28C;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">strut</tspan></text><circle cx="490.0" cy="152.0" r="5" fill="#047857"/><text x="478.0" y="157.0" font-size="18" font-weight="700" fill="#047857" text-anchor="end" font-family="Inter, Arial, sans-serif">&#x254;&#x2D0;<tspan font-size="13" font-weight="400" fill="#102A43" dx="5">thought</tspan></text><circle cx="490.0" cy="257.8" r="5" fill=