<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold" >Push and pull factors in migration</text><rect x="12" y="50" width="236" height="250" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="130.0" y="76" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B45309" font-weight="bold" >Origin: a village (PUSH)</text><text x="26" y="104" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Shortage of farmland</text><text x="26" y="128" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Tired soils, low harvests</text><text x="26" y="152" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Low farm incomes</text><text x="26" y="176" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Few schools and clinics</text><text x="26" y="200" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Drought or flooding</text><text x="26" y="224" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Few jobs for young people</text><rect x="312" y="50" width="236" height="250" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="430.0" y="76" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#047857" font-weight="bold" >Destination: a town (PULL)</text><text x="326" y="104" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Jobs and wages</text><text x="326" y="128" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Schools and training</text><text x="326" y="152" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Hospitals and clinics</text><text x="326" y="176" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Electricity, water, shops</text><text x="326" y="200" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Plantation work, markets</text><text x="326" y="224" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="start" fill="#102A43" font-weight="normal" >Relatives already there</text><line x1="252" y1="175" x2="306" y2="175" stroke="#102A43" stroke-width="4" marker-end="url(#a3)"/><text x="280" y="328" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748B" font-weight="normal" >Push: reasons for leaving. Pull: reasons for choosing a place.</text></svg>