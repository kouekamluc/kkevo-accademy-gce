<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><line x1="30" y1="180" x2="530" y2="180" stroke="#102A43" stroke-width="3"/><circle cx="70" cy="180" r="8" fill="#2563EB" stroke="#102A43" stroke-width="2"/><line x1="70" y1="172" x2="70" y2="120" stroke="#102A43" stroke-width="2"/><rect x="0" y="46" width="140" height="74" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="70" y="68" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Lantern Yard:</text><text x="70" y="88" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">false accusation</text><text x="70" y="108" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">by lot</text><circle cx="175" cy="180" r="8" fill="#2563EB" stroke="#102A43" stroke-width="2"/><line x1="175" y1="188" x2="175" y2="230" stroke="#102A43" stroke-width="2"/><rect x="105" y="230" width="140" height="74" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="175" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Raveloe:</text><text x="175" y="272" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">15 years of</text><text x="175" y="292" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">weaving, hoarding</text><circle cx="280" cy="180" r="8" fill="#2563EB" stroke="#102A43" stroke-width="2"/><line x1="280" y1="172" x2="280" y2="120" stroke="#102A43" stroke-width="2"/><rect x="210" y="66" width="140" height="54" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="88" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Gold stolen</text><text x="280" y="108" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">by Dunstan</text><circle cx="385" cy="180" r="8" fill="#2563EB" stroke="#102A43" stroke-width="2"/><line x1="385" y1="188" x2="385" y2="230" stroke="#102A43" stroke-width="2"/><rect x="315" y="230" width="140" height="54" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="385" y="252" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Eppie arrives</text><text x="385" y="272" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">at the hearth</text><circle cx="490" cy="180" r="8" fill="#2563EB" stroke="#102A43" stroke-width="2"/><line x1="490" y1="172" x2="490" y2="120" stroke="#102A43" stroke-width="2"/><rect x="420" y="46" width="140" height="74" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="490" y="68" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">16 years later:</text><text x="490" y="88" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">gold found;</text><text x="490" y="108" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Eppie stays</text><text x="30" y="345" font-size="13" text-anchor="start" fill="#B45309" font-weight="bold">Part One (to Eppie's arrival)</text><text x="530" y="345" font-size="13" text-anchor="end" fill="#B45309" font-weight="bold">Part Two</text></svg>