chor="middle" fill="#2563EB">NOT</text><text x="380" y="190" font-size="14" text-anchor="middle" fill="#2563EB">OR</text><text x="280" y="330" font-size="15" text-anchor="middle" fill="#047857" font-weight="bold">X = A AND B     Y = NOT C     Q = X OR Y</text></svg>