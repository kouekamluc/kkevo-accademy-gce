<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43">Oruka's four trends</text>
<rect x="20" y="50" width="250" height="130" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="145.0" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">1. Ethnophilosophy</text>
