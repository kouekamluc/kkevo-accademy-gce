<rect x="20" y="200" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="145.0" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">3. Nationalist-ideological</text>
<text x="145.0" y="254" text-anchor="middle" font-size="13" fill="#102A43">Liberation and development</text>
<text x="145.0" y="274" text-anchor="middle" font-size="13" fill="#102A43">Senghor, Nkrumah, Nyerere</text>
<rect x="290" y="200" width="250" height="130" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="415.0" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">4. Professional</text>
<text x="415.0" y="254" text-anchor="middle" font-size="13" fill="#102A43">Critical, written, academic</text>
<text x="415.0" y="274" text-anchor="middle" font-size="13" fill="#102A43">Towa, Hountondji</text>
