<rect x="290" y="50" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="415.0" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">2. Philosophic sagacity</text>
<text x="415.0" y="104" text-anchor="middle" font-size="13" fill="#102A43">Individual critical sages</text>
