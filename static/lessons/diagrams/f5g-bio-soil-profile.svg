<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="24" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">The soil profile (a vertical slice through the soil)</text><rect x="50" y="40" width="170" height="30" fill="#4B3621" stroke="#102A43" stroke-width="2"/><text x="135" y="61.0" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">O</text><rect x="50" y="70" width="170" height="70" fill="#92400E" stroke="#102A43" stroke-width="2"/><text x="135" y="111.0" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text><rect x="50" y="140" width="170" height="90" fill="#D97706" stroke="#102A43" stroke-width="2"/><text x="135" y="191.0" font-family="Inter, Arial, sans-serif" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">B</text><rect x="50" y="230" width="170" height="80" fill="#FDE68A" stroke="#102A43" stroke-width="2"/><text x="135" y="276.0" font-family="Inter, Arial, sans-serif" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">C</text><rect x="50" y="310" width="170" height="38" fill="#CBD5E1" stroke="#102A43" stroke-width="2"/><text x="135" y="335.0" font-family="Inter, Arial, sans-serif" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">R</text><path d="M185,70 L185,115 M185,100 L165,125 M185,95 L205,120" stroke="#047857" stroke-width="3" fill="none"/><line x1="220" y1="55" x2="262" y2="55" stroke="#64748B" stroke-width="2"/><text x="268" y="59" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">O horizon: leaf litter and humus</text><line x1="220" y1="107" x2="262" y2="107" stroke="#64748B" stroke-width="2"/><text x="268" y="103" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">A horizon: topsoil. Dark, rich in humus,</text><text x="268" y="121" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">full of roots and living things.</text><line x1="220" y1="187" x2="262" y2="187" stroke="#64748B" stroke-width="2"/><text x="268" y="183" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">B horizon: subsoil. Lighter, holds minerals</text><text x="268" y="201" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">washed down from above.</text><line x1="220" y1="272" x2="262" y2="272" stroke="#64748B" stroke-width="2"/><text x="268" y="268" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">C horizon: broken pieces of rock,</text><text x="268" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">weathered from the bedrock.</text><line x1="220" y1="329" x2="262" y2="329" stroke="#64748B" stroke-width="2"/><text x="268" y="333" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">R: solid bedrock</text><line x1="30" y1="45" x2="30" y2="340" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" transform="translate(22,150) rotate(-90)" text-anchor="middle">Depth</text></svg>