<text x="325" y="296" font-size="13" text-anchor="start" font-weight="normal" fill="#B45309">plus HAO result (XH), less tax</text>
<rect x="20" y="300" width="290" height="40" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="165" y="325" font-size="14" text-anchor="middle" font-weight="bold" fill="#102A43">XI Net result</text></svg>
