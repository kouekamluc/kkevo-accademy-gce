<text x="325" y="238" font-size="13" text-anchor="start" font-weight="normal" fill="#B45309">plus financial result (XF)</text>
<rect x="20" y="242" width="290" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="165" y="267" font-size="14" text-anchor="middle" font-weight="bold" fill="#102A43">XG Result of ordinary activities</text>
