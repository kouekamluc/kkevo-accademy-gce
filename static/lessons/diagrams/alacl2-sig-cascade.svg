<line x1="165" y1="108" x2="165" y2="125" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<text x="325" y="122" font-size="13" text-anchor="start" font-weight="normal" fill="#B45309">less personnel costs</text>
<rect x="20" y="126" width="290" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="165" y="151" font-size="14" text-anchor="middle" font-weight="bold" fill="#102A43">XD Gross operating surplus</text>
<line x1="165" y1="166" x2="165" y2="183" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<text x="325" y="180" font-size="13" text-anchor="start" font-weight="normal" fill="#B45309">less depreciation, provisions</text>
