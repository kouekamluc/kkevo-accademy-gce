<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="560" height="360" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs>
<rect x="30" y="150" width="130" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="95.0" y="174.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">6 RuBP</text>
<text x="95.0" y="192.0" text-anchor="middle" fill="#102A43" font-size="13">5C each = 30 C</text>
<rect x="215" y="50" width="130" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="74.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">12 GP</text>
<text x="280.0" y="92.0" text-anchor="middle" fill="#102A43" font-size="13">3C each = 36 C</text>
