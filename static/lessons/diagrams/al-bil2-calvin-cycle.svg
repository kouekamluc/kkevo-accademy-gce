<text x="280" y="325" text-anchor="middle" fill="#B45309" font-size="13" font-weight="600">Regeneration: 10 TP + 6 ATP make 6 RuBP</text>
<path d="M500 206 L500 236" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
<text x="548" y="256" text-anchor="end" fill="#102A43" font-size="13" font-weight="600">2 TP leave:</text>
