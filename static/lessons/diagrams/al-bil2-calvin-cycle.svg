<text x="465.0" y="174.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="600">12 TP</text>
<text x="465.0" y="192.0" text-anchor="middle" fill="#102A43" font-size="13">3C each = 36 C</text>
<path d="M95 150 C95 85 150 78 215 78" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="40" text-anchor="start" fill="#2563EB" font-size="13" font-weight="600">Fixation (rubisco)</text>
<text x="20" y="58" text-anchor="start" fill="#2563EB" font-size="13" font-weight="400">6 CO2 join 6 RuBP</text>
