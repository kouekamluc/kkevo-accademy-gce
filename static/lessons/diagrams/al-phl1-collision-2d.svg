<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Momentum vectors for a two-dimensional collision: the momentum before, 10 kg m/s along x, equals the vector sum of the two momenta afterwards</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="60.0" y1="250.0" x2="429.0" y2="250.0" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="440.0,250.0 429.0,254.6 429.0,245.4" fill="#2563EB"/>
<text x="250.0" y="274.0" font-size="14" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="600">momentum before = 10 kg m/s</text>
<line x1="60.0" y1="160.0" x2="247.9" y2="51.5" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<polygon points="257.5,46.0 250.2,55.5 245.6,47.5" fill="#047857"/>
<line x1="257.5" y1="46.0" x2="430.7" y2="154.2" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
<polygon points="440.0,160.0 428.2,158.1 433.1,150.3" fill="#B45309"/>
<line x1="60.0" y1="160.0" x2="440.0" y2="160.0" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="146.7" y="91.0" font-size="14" fill="#047857" text-anchor="end" dominant-baseline="middle" font-weight="600">p1 = 6.0</text>
<text x="362.7" y="93.0" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="600">p2 = 5.7</text>
<path d="M120.0,160.0 A60,60 0 0 0 112.0,130.0" fill="none" stroke="#047857" stroke-width="2"/>
<text x="142.0" y="152.0" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="600">30&#176;</text>
<text x="300.0" y="196.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">x: 5.2 + 4.8 = 10     y: +3.0 &#8722; 3.0 = 0</text>
<text x="300.0" y="218.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">p1 + p2 = p before</text>
<text x="280.0" y="320.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="500">Closed triangle: no momentum is lost</text>
</svg>
