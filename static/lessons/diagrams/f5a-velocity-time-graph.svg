<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Velocity-time graph: 0 to 12 m/s in 4 s, constant for 10 s, then to rest in 6 s</title>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="560" height="360" fill="#FFFFFF"/>
<polygon points="75,295 155,79 355,79 475,295" fill="#EFF6FF" stroke="none"/>
<line x1="45" y1="295" x2="530" y2="295" stroke="#102A43" stroke-width="2" stroke-linecap="round" marker-end="url(#an)"/>
<line x1="75" y1="330" x2="75" y2="40" stroke="#102A43" stroke-width="2" stroke-linecap="round" marker-end="url(#an)"/>
<text x="534" y="313" font-size="16" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="600" font-style="italic"></text>
<text x="61" y="44" font-size="16" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="600" font-style="italic"></text>
<text x="63" y="311" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">O</text>
<text x="550" y="313" font-size="15" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="600" font-style="italic">t (s)</text>
<text x="69" y="30" font-size="15" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="600" font-style="italic">v (m/s)</text>
<polyline points="75,295 155,79 355,79 475,295" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
<line x1="155" y1="79" x2="155" y2="295" stroke="#102A43" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="355" y1="79" x2="355" y2="295" stroke="#102A43" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="75" y1="79" x2="155" y2="79" stroke="#102A43" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="155" y="313" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">4</text>
<text x="355" y="313" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">14</text>
<text x="475" y="313" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">20</text>
<text x="63" y="79" font-size="15" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="600">12</text>
<text x="127" y="232" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">A₁</text>
<text x="255" y="187" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">A₂</text>
<text x="395" y="232" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">A₃</text>
</svg>
