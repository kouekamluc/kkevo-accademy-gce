<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" font-size="15">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">Arab-Israeli conflict: key dates</text>
<line x1="150" y1="58" x2="150" y2="320" stroke="#102A43" stroke-width="3"/>
<text x="136" y="63" text-anchor="end" font-weight="700" fill="#102A43">1917</text>
<circle cx="150" cy="58" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="63" fill="#102A43">Balfour Declaration</text>
<text x="136" y="96" text-anchor="end" font-weight="700" fill="#102A43">Nov 1947</text>
<circle cx="150" cy="91" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="96" fill="#102A43">UN partition plan</text>
<text x="136" y="128" text-anchor="end" font-weight="700" fill="#102A43">14 May 1948</text>
<circle cx="150" cy="124" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="128" fill="#102A43">Israel declares independence</text>
<text x="136" y="161" text-anchor="end" font-weight="700" fill="#102A43">1956</text>
<circle cx="150" cy="156" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="161" fill="#102A43">Suez Crisis</text>
<text x="136" y="194" text-anchor="end" font-weight="700" fill="#102A43">June 1967</text>
<circle cx="150" cy="189" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="194" fill="#102A43">Six-Day War</text>
<text x="136" y="227" text-anchor="end" font-weight="700" fill="#102A43">Oct 1973</text>
<circle cx="150" cy="222" r="7" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="168" y="227" fill="#102A43">Yom Kippur War</text>
<text x="136" y="260" text-anchor="end" font-weight="700" fill="#2563EB">1978-79</text>
<circle cx="150" cy="254" r="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="168" y="260" fill="#102A43">Camp David, Egypt-Israel treaty</text>
<text x="136" y="292" text-anchor="end" font-weight="700" fill="#2563EB">1993</text>
<circle cx="150" cy="287" r="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="168" y="292" fill="#102A43">Oslo Accords: Israel and PLO</text>
<text x="136" y="325" text-anchor="end" font-weight="700" fill="#2563EB">1994</text>
<circle cx="150" cy="320" r="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="168" y="325" fill="#102A43">Israel-Jordan peace treaty</text>
<text x="280" y="352" text-anchor="middle" font-size="14" fill="#2563EB">Blue: peace agreements</text>
</svg>