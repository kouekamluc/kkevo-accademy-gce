<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Three ways heat travels: conduction, convection and radiation</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="7" y="14" width="176" height="332" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="95" y="44" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">Conduction</text>
<text x="95" y="64" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">through the metal pan</text>
<text x="95" y="86" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">particles pass heat on</text>
<text x="95" y="104" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">by contact</text>
<rect x="192" y="14" width="176" height="332" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280" y="44" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">Convection</text>
<text x="280" y="64" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">currents in the water</text>
<text x="280" y="86" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">hot water rises,</text>
<text x="280" y="104" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">cool water sinks</text>
<rect x="377" y="14" width="176" height="332" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="465" y="44" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">Radiation</text>
<text x="465" y="64" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">rays from the coals</text>
<text x="465" y="86" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">rays cross the air</text>
<text x="465" y="104" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">without contact</text>
<polygon points="45,190 145,190 133,255 57,255" fill="#FFFFFF" stroke="#102A43" stroke-width="3"/>
<line x1="145.0" y1="196.0" x2="179.0" y2="186.0" stroke="#102A43" stroke-width="6" stroke-linecap="round"/>
<text x="95" y="175" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">metal pan</text>
<path d="M71,310 q-9,-14 0,-28 q9,14 0,28 z" fill="#B45309"/>
<path d="M95,310 q-9,-14 0,-28 q9,14 0,28 z" fill="#B45309"/>
