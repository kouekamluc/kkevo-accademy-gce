<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Contrary terms have a middle; contradictory terms do not</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280" y="32" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Contrary terms: opposite ends, with a middle between</text><rect x="30" y="50" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="105" y="86" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">hot</text><rect x="205" y="50" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="280" y="78" font-size="14" fill="#102A43" text-anchor="middle">warm, cool,</text><text x="280" y="98" font-size="14" fill="#102A43" text-anchor="middle">lukewarm...</text><rect x="380" y="50" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="455" y="86" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">cold</text><text x="280" y="135" font-size="14" fill="#102A43" text-anchor="middle">Both cannot be true of the same water, but both can be false.</text><path d="M30 165 L530 165" fill="none" stroke="#B45309" stroke-width="2"/><text x="280" y="200" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Contradictory terms: no middle, they split everything</text><rect x="30" y="218" width="250" height="60" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="155" y="255" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">even number</text><rect x="280" y="218" width="250" height="60" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="405" y="255" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">not even</text><text x="280" y="308" font-size="14" fill="#102A43" text-anchor="middle">Every number is in one box and only one.</text><text x="280" y="332" font-size="14" fill="#102A43" text-anchor="middle">Not both, and not neither.</text></svg>