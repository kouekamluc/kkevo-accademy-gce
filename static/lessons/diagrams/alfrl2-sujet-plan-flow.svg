<polygon points="388,253.0 378,247.0 378,259.0" fill="#102A43"/>
<polyline points="465,146 465,178 95,178 95,208" fill="none" stroke="#102A43" stroke-width="2"/>
<polygon points="95,210 89,200 101,200" fill="#102A43"/>
<text x="280" y="332" text-anchor="middle" font-size="13" fill="#B45309">Le plan r&#233;pond &#224; la probl&#233;matique ; la conclusion y revient.</text>
