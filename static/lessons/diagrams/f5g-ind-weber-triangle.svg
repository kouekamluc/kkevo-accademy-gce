<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" role="img" aria-label="Triangle with two raw material sources R1 and R2, a market M and the least-cost factory site L inside"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="366" fill="#ffffff"/><text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Weber's location triangle</text><polygon points="90,290 470,290 280,60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><line x1="250.0" y1="205.0" x2="90.0" y2="290.0" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/><line x1="250.0" y1="205.0" x2="470.0" y2="290.0" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/><line x1="250.0" y1="205.0" x2="280.0" y2="60.0" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5"/><circle cx="90" cy="290" r="12" fill="#B45309" stroke="#ffffff" stroke-width="2"/><circle cx="470" cy="290" r="12" fill="#B45309" stroke="#ffffff" stroke-width="2"/><circle cx="280" cy="60" r="12" fill="#2563EB" stroke="#ffffff" stroke-width="2"/><text x="90.0" y="326.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">R1: raw material 1</text><text x="470.0" y="326.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">R2: raw material 2</text><text x="302.0" y="65.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="start">M: market</text><circle cx="250" cy="205" r="12" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="241.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">L: least-cost</text><text x="250.0" y="258.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">factory site</text><text x="280.0" y="356.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">Dashed lines: transport. L is where total transport cost is lowest.</text></svg>