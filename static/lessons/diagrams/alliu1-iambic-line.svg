<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">An iambic pentameter line</title><desc id="d">Five feet, each a weak syllable then a strong one, shown on a line of Chaucer.</desc>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="36" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Iambic pentameter: five feet, each weak then strong</text>
<rect x="18" y="80" width="100" height="110" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="68" y="70" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">foot 1</text>
<text x="40" y="125" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">a</text>
<text x="40" y="165" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x</text>
<text x="78" y="125" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">KNYGHT</text>
<text x="78" y="165" font-size="22" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">/</text>
<rect x="124" y="80" width="100" height="110" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="174" y="70" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">foot 2</text>
<text x="146" y="125" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">ther</text>
<text x="146" y="165" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x</text>
<text x="184" y="125" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">WAS</text>
<text x="184" y="165" font-size="22" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">/</text>
<rect x="230" y="80" width="100" height="110" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280" y="70" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">foot 3</text>
<text x="252" y="125" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">and</text>
<text x="252" y="165" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x</text>
<text x="290" y="125" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">THAT</text>
<text x="290" y="165" font-size="22" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">/</text>
<rect x="336" y="80" width="100" height="110" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="386" y="70" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">foot 4</text>
<text x="358" y="125" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">a</text>
<text x="358" y="165" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x</text>
<text x="396" y="125" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">WOR</text>
<text x="396" y="165" font-size="22" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">/</text>
<rect x="442" y="80" width="100" height="110" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="492" y="70" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">foot 5</text>
<text x="464" y="125" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">thy</text>
<text x="464" y="165" font-size="22" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x</text>
<text x="502" y="125" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">MAN</text>
<text x="502" y="165" font-size="22" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">/</text>
<text x="280" y="236" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">x = weak (unstressed) syllable     / = strong (stressed) syllable</text>
<text x="280" y="268" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">10 syllables = 5 feet: ten beats of weak, strong.</text>
<text x="280" y="296" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Pairs of rhyming lines like this are heroic couplets.</text>
<text x="280" y="330" font-size="13" font-weight="400" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">Line: a Knyght ther was, and that a worthy man (the Knight)</text>
</svg>