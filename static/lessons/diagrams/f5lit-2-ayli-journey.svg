<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#102A43" font-weight="700" font-size="17">As You Like It: from court to forest and back</text>
<rect x="24" y="64" width="190" height="220" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="3"/>
<text x="119" y="92" text-anchor="middle" fill="#102A43" font-weight="700">Court and</text>
<text x="119" y="110" text-anchor="middle" fill="#102A43" font-weight="700">Oliver's house</text>
<text x="119" y="144" text-anchor="middle" fill="#102A43">Duke Frederick rules</text>
<text x="119" y="170" text-anchor="middle" fill="#102A43">Oliver ill-treats</text>
<text x="119" y="188" text-anchor="middle" fill="#102A43">Orlando</text>
<text x="119" y="214" text-anchor="middle" fill="#102A43">Rosalind is banished</text>
<text x="119" y="240" text-anchor="middle" fill="#102A43">Danger and jealousy</text>
<rect x="346" y="64" width="190" height="220" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="3"/>
<text x="441" y="92" text-anchor="middle" fill="#102A43" font-weight="700">Forest of Arden</text>
<text x="441" y="144" text-anchor="middle" fill="#102A43">Duke Senior and lords</text>
<text x="441" y="170" text-anchor="middle" fill="#102A43">Disguise: Ganymede</text>
<text x="441" y="188" text-anchor="middle" fill="#102A43">and Aliena</text>
<text x="441" y="214" text-anchor="middle" fill="#102A43">Songs, wit, shepherds</text>
<text x="441" y="240" text-anchor="middle" fill="#102A43">Love is tested</text>
<line x1="222" y1="120" x2="326" y2="120" stroke="#2563EB" stroke-width="3"/>
<polygon points="338,120 326,113 326,127" fill="#2563EB"/>
<text x="280" y="106" text-anchor="middle" fill="#2563EB" font-weight="700">Flight</text>
<text x="280" y="144" text-anchor="middle" fill="#102A43">Acts 1-2</text>
<line x1="338" y1="224" x2="234" y2="224" stroke="#B45309" stroke-width="3"/>
<polygon points="222,224 234,217 234,231" fill="#B45309"/>
<text x="280" y="210" text-anchor="middle" fill="#B45309" font-weight="700">Return</text>
<text x="280" y="250" text-anchor="middle" fill="#102A43">Act 5</text>
<text x="280" y="320" text-anchor="middle" fill="#102A43" font-weight="700">Order is restored and four couples are joined</text>
<text x="280" y="341" text-anchor="middle" fill="#102A43">(check your text for the exact final scene)</text>
</svg>
