<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="28" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">Manufacturing account to income statement</text>
<rect x="20" y="50" width="150" height="44" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="95" y="77" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Direct materials</text>
<line x1="170" y1="72" x2="200" y2="130" stroke="#102A43" stroke-width="2"/>
<rect x="20" y="110" width="150" height="44" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="95" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Direct labour</text>
<line x1="170" y1="132" x2="200" y2="130" stroke="#102A43" stroke-width="2"/>
<rect x="20" y="170" width="150" height="44" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="95" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Direct expenses</text>
<line x1="170" y1="192" x2="200" y2="130" stroke="#102A43" stroke-width="2"/>
<rect x="200" y="100" width="130" height="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="265" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">PRIME COST</text>
<text x="265" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">direct costs</text>
<line x1="330" y1="130" x2="360" y2="130" stroke="#2563EB" stroke-width="2"/>
<rect x="360" y="100" width="180" height="60" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="450" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">+ Factory overheads</text>
<text x="450" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">+/- work in progress</text>
<line x1="450" y1="160" x2="450" y2="200" stroke="#2563EB" stroke-width="2"/>
<rect x="360" y="200" width="180" height="56" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="450" y="224" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">COST OF PRODUCTION</text>
<text x="450" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">(cost of goods made)</text>
<line x1="450" y1="256" x2="450" y2="290" stroke="#2563EB" stroke-width="2"/>
<rect x="360" y="290" width="180" height="46" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="450" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">To the trading account</text>
<text x="150" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Other costs: office,</text>
<text x="150" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">selling, distribution</text>
<text x="150" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">go to the income statement</text>
</svg>
