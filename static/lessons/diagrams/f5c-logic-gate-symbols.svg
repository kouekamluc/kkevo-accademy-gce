<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>Logic gate symbols: AND, OR, NOT, NAND, NOR, XOR</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><path d="M60 60 H90 A22 22 0 0 1 90 104 H60 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><path d="M38 71 L60 71" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M38 93 L60 93" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M112 82 L134 82" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="90" y="140" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">AND</text><text x="90" y="162" font-size="14" text-anchor="middle" fill="#102A43">Q = A AND B</text><path d="M250 60 Q284 60 310 82 Q284 104 250 104 Q264 82 250 60Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><path d="M228 71 L250 71" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M228 93 L250 93" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M310 82 L332 82" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="280" y="140" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">OR</text><text x="280" y="162" font-size="14" text-anchor="middle" fill="#102A43">Q = A OR B</text><path d="M440 62 L480 82 L440 102Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="484" cy="82" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><path d="M418 82 L440 82" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M489 82 L511 82" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="470" y="140" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">NOT</text><text x="470" y="162" font-size="14" text-anchor="middle" fill="#102A43">Q = NOT A</text><path d="M60 220 H90 A22 22 0 0 1 90 264 H60 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="116" cy="242" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><path d="M38 231 L60 231" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M38 253 L60 253" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M121 242 L143 242" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="90" y="300" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">NAND</text><text x="90" y="322" font-size="14" text-anchor="middle" fill="#102A43">Q = NOT (A AND B)</text><path d="M250 220 Q284 220 310 242 Q284 264 250 264 Q264 242 250 220Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><circle cx="314" cy="242" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><path d="M228 231 L250 231" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M228 253 L250 253" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M319 242 L341 242" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="280" y="300" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">NOR</text><text x="280" y="322" font-size="14" text-anchor="middle" fill="#102A43">Q = NOT (A OR B)</text><path d="M440 220 Q474 220 500 242 Q474 264 440 264 Q454 242 440 220Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><path d="M432 220 Q446 242 432 264" fill="none" stroke="#2563EB" stroke-width="2.5"/><path d="M410 231 L432 231" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M410 253 L432 253" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M500 242 L522 242" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="470" y="300" font-size="18" text-anchor="middle" fill="#2563EB" font-weight="bold">XOR</text><text x="470" y="322" font-size="14" text-anchor="middle" fill="#102A43">Q = A XOR B</text></svg>