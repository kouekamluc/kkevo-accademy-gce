<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="30.0" y="20.0" width="190.0" height="48.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125.0" y="40.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">1 Hormone binds receptor</text><text x="125.0" y="58.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">glucagon or adrenaline</text><rect x="30.0" y="100.0" width="190.0" height="48.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125.0" y="120.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">2 G protein activated</text><text x="125.0" y="138.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">inside the membrane</text><rect x="30.0" y="180.0" width="190.0" height="48.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125.0" y="200.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">3 Adenylyl cyclase active</text><text x="125.0" y="218.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">enzyme in the membrane</text><rect x="30.0" y="260.0" width="190.0" height="48.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125.0" y="280.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">4 ATP becomes cAMP</text><text x="125.0" y="298.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">second messenger</text><rect x="340.0" y="260.0" width="190.0" height="48.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="435.0" y="280.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">5 Protein kinase A active</text><text x="435.0" y="298.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">cAMP binds to it</text><rect x="340.0" y="180.0" width="190.0" height="48.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="435.0" y="200.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">6 Phosphorylase kinase</text><text x="435.0" y="218.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">activated by phosphorylation</text><rect x="340.0" y="100.0" width="190.0" height="48.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="435.0" y="120.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">7 Glycogen phosphorylase</text><text x="435.0" y="138.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">activated by phosphorylation</text><rect x="340.0" y="20.0" width="190.0" height="48.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="435.0" y="40.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">8 Glycogen to glucose</text><text x="435.0" y="58.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">glucose released from liver</text><line x1="125.0" y1="68.0" x2="125.0" y2="100.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="125.0" y1="148.0" x2="125.0" y2="180.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="125.0" y1="228.0" x2="125.0" y2="260.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="435.0" y1="252.0" x2="435.0" y2="220.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="435.0" y1="172.0" x2="435.0" y2="140.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="435.0" y1="92.0" x2="435.0" y2="60.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="220.0" y1="284.0" x2="340.0" y2="284.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280.0" y="270.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">cAMP</text><text x="280.0" y="336.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Each step makes many product molecules: a small signal gives a large response.</text></svg>