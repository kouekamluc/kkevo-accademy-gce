<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Flow diagram of export-led industrial growth in a newly industrialising country"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#ffffff"/><text x="280.0" y="24.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">How a NIC grows by making goods for export</text><rect x="10.0" y="44.0" width="170" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95.0" y="73.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Cheap, trainable labour</text><line x1="180.0" y1="69.0" x2="230.0" y2="142.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="10.0" y="110.0" width="170" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95.0" y="139.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Government support</text><line x1="180.0" y1="135.0" x2="230.0" y2="142.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="10.0" y="176.0" width="170" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95.0" y="205.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Foreign investment</text><line x1="180.0" y1="201.0" x2="230.0" y2="142.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="234.0" y="106.0" width="140" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="304.0" y="129.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Factories</text><text x="304.0" y="146.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">making goods</text><text x="304.0" y="163.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">for export</text><line x1="374.0" y1="142.0" x2="412.0" y2="142.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="414.0" y="106.0" width="136" height="72" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="482.0" y="138.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Export</text><text x="482.0" y="155.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">earnings</text><path d="M482,178 L482,262 L304,262 L304,184" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arb)"/><text x="393.0" y="288.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#2563EB" text-anchor="middle">Earnings reinvested in schools, ports,</text><text x="393.0" y="306.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#2563EB" text-anchor="middle">roads and newer technology</text><text x="280.0" y="344.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">More advanced industry follows, and the cycle repeats</text></svg>