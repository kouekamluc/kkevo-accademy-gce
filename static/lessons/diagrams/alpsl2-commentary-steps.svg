<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="24" font-size="16" text-anchor="middle" fill="#102A43" font-weight="800">Method for a philosophical text commentary</text><rect x="10" y="50" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="70" y="80" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">1. Situate</text><text x="70" y="104" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">author,</text><text x="70" y="122" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">work, school</text><line x1="130" y1="94" x2="148" y2="94" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="148" y="50" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="208" y="80" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">2. Theme</text><text x="208" y="104" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">what it is about</text><line x1="268" y1="94" x2="286" y2="94" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="286" y="50" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="346" y="80" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">3. Problem</text><text x="346" y="104" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">question</text><text x="346" y="122" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">it answers</text><line x1="406" y1="94" x2="424" y2="94" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="424" y="50" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="484" y="80" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">4. Thesis</text><text x="484" y="104" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">author's answer</text><rect x="10" y="180" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="70" y="210" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">5. Structure</text><text x="70" y="234" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">how it is argued</text><line x1="130" y1="224" x2="148" y2="224" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="148" y="180" width="120" height="88" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2.5"/><text x="208" y="210" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">6. Internal</text><text x="208" y="234" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">does it</text><text x="208" y="252" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">hold together?</text><line x1="268" y1="224" x2="286" y2="224" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="286" y="180" width="120" height="88" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2.5"/><text x="346" y="210" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">7. External</text><text x="346" y="234" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">other views</text><line x1="406" y1="224" x2="424" y2="224" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="424" y="180" width="120" height="88" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="484" y="210" font-size="15" text-anchor="middle" fill="#102A43" font-weight="800">8. Conclusion</text><text x="484" y="234" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="600">what we learn</text><text x="280" y="330" font-size="14" text-anchor="middle" fill="#047857" font-weight="700">Steps 6 and 7 carry the evaluation: keep them separate</text></svg>