<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 355" font-family="Inter, Arial, sans-serif">
<title>Causes and environmental impacts of deforestation, with solutions</title>
<rect width="560" height="355" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<text x="95.0" y="24.0" font-size="15" fill="#B45309" text-anchor="middle" font-weight="700">CAUSES</text>
<rect x="10.0" y="40.0" width="170.0" height="50.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="95.0" y="62.0" font-size="14" fill="#102A43" text-anchor="middle">Clearing land for</text>
<text x="95.0" y="80.0" font-size="14" fill="#102A43" text-anchor="middle">farms, plantations</text>
<line x1="180.0" y1="65.0" x2="205.0" y2="150.0" stroke="#B45309" stroke-width="2"/>
<rect x="10.0" y="100.0" width="170.0" height="50.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="95.0" y="122.0" font-size="14" fill="#102A43" text-anchor="middle">Logging for</text>
<text x="95.0" y="140.0" font-size="14" fill="#102A43" text-anchor="middle">timber (often illegal)</text>
<line x1="180.0" y1="125.0" x2="205.0" y2="150.0" stroke="#B45309" stroke-width="2"/>
<rect x="10.0" y="160.0" width="170.0" height="50.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="95.0" y="182.0" font-size="14" fill="#102A43" text-anchor="middle">Firewood and</text>
<text x="95.0" y="200.0" font-size="14" fill="#102A43" text-anchor="middle">charcoal burning</text>
<line x1="180.0" y1="185.0" x2="205.0" y2="150.0" stroke="#B45309" stroke-width="2"/>
<rect x="10.0" y="220.0" width="170.0" height="50.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="95.0" y="242.0" font-size="14" fill="#102A43" text-anchor="middle">Roads, mines,</text>
<text x="95.0" y="260.0" font-size="14" fill="#102A43" text-anchor="middle">towns and dams</text>
<line x1="180.0" y1="245.0" x2="205.0" y2="150.0" stroke="#B45309" stroke-width="2"/>
<rect x="205.0" y="112.0" width="150.0" height="76.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="280.0" y="142.0" font-size="15" fill="#B91C1C" text-anchor="middle" font-weight="700">DEFORESTATION</text>
<text x="280.0" y="164.0" font-size="14" fill="#102A43" text-anchor="middle">Trees cleared</text>
<text x="280.0" y="182.0" font-size="13" fill="#102A43" text-anchor="middle">faster than regrowth</text>
<text x="465.0" y="24.0" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">IMPACTS</text>
<rect x="380.0" y="40.0" width="170.0" height="50.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="465.0" y="62.0" font-size="14" fill="#102A43" text-anchor="middle">Soil erosion</text>
<text x="465.0" y="80.0" font-size="14" fill="#102A43" text-anchor="middle">and floods</text>
<line x1="355.0" y1="150.0" x2="378.0" y2="65.0" stroke="#047857" stroke-width="2"/>
<rect x="380.0" y="100.0" width="170.0" height="50.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="465.0" y="122.0" font-size="14" fill="#102A43" text-anchor="middle">Loss of wildlife</text>
<text x="465.0" y="140.0" font-size="14" fill="#102A43" text-anchor="middle">and habitats</text>
<line x1="355.0" y1="150.0" x2="378.0" y2="125.0" stroke="#047857" stroke-width="2"/>
<rect x="380.0" y="160.0" width="170.0" height="50.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="465.0" y="182.0" font-size="14" fill="#102A43" text-anchor="middle">Less rainfall,</text>
<text x="465.0" y="200.0" font-size="14" fill="#102A43" text-anchor="middle">hotter local climate</text>
<line x1="355.0" y1="150.0" x2="378.0" y2="185.0" stroke="#047857" stroke-width="2"/>
<rect x="380.0" y="220.0" width="170.0" height="50.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="465.0" y="242.0" font-size="14" fill="#102A43" text-anchor="middle">More carbon dioxide</text>
<text x="465.0" y="260.0" font-size="14" fill="#102A43" text-anchor="middle">in the air</text>
<line x1="355.0" y1="150.0" x2="378.0" y2="245.0" stroke="#047857" stroke-width="2"/>
<rect x="10.0" y="290.0" width="540.0" height="56.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="313.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">SOLUTIONS: replanting, protected areas, sustainable logging,</text>
<text x="280.0" y="334.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">improved cooking stoves, law enforcement, education</text>
</svg>
