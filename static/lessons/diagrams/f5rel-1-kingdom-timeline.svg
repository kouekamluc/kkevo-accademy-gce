<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<title>The united kingdom (dates approximate)</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="28" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">The united kingdom (dates approximate)</text>
<line x1="20" y1="190" x2="540" y2="190" stroke="#102A43" stroke-width="3"/>
<line x1="72.0" y1="190" x2="72.0" y2="172" stroke="#2563EB" stroke-width="2"/>
<circle cx="72.0" cy="190" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<rect x="8" y="62" width="170" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="93.0" y="113.0" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Samuel</text>
<text x="93.0" y="131.0" font-size="14" fill="#102A43" text-anchor="middle">Judge and prophet</text>
<line x1="176.0" y1="190" x2="176.0" y2="208" stroke="#2563EB" stroke-width="2"/>
<circle cx="176.0" cy="190" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<rect x="91.0" y="208" width="170" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="176.0" y="250.0" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Saul</text>
<text x="176.0" y="268.0" font-size="14" fill="#102A43" text-anchor="middle">First king; dies at</text>
<text x="176.0" y="286.0" font-size="14" fill="#102A43" text-anchor="middle">Gilboa</text>
<line x1="280.0" y1="190" x2="280.0" y2="172" stroke="#2563EB" stroke-width="2"/>
<circle cx="280.0" cy="190" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<rect x="195.0" y="62" width="170" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="104.0" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">David</text>
<text x="280.0" y="122.0" font-size="14" fill="#102A43" text-anchor="middle">Jerusalem the</text>
<text x="280.0" y="140.0" font-size="14" fill="#102A43" text-anchor="middle">capital; 40 years</text>
<line x1="384.0" y1="190" x2="384.0" y2="208" stroke="#2563EB" stroke-width="2"/>
<circle cx="384.0" cy="190" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<rect x="299.0" y="208" width="170" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="384.0" y="250.0" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Solomon</text>
<text x="384.0" y="268.0" font-size="14" fill="#102A43" text-anchor="middle">Builds the temple;</text>
<text x="384.0" y="286.0" font-size="14" fill="#102A43" text-anchor="middle">40 years</text>
<line x1="488.0" y1="190" x2="488.0" y2="172" stroke="#2563EB" stroke-width="2"/>
<circle cx="488.0" cy="190" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<rect x="382" y="62" width="170" height="110" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="467.0" y="113.0" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">About 930 BC</text>
<text x="467.0" y="131.0" font-size="14" fill="#102A43" text-anchor="middle">Kingdom divides</text>
</svg>
