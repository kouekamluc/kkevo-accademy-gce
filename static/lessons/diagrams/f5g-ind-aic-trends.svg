<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Three trends in AIC industry: heavy industry declines, factories relocate, work is automated"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#ffffff"/><text x="280.0" y="24.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Recent changes in industry in AICs</text><text x="135.0" y="56.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Declining</text><text x="425.0" y="56.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">Growing or changing to</text><rect x="20.0" y="72.0" width="230" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="135.0" y="103.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Heavy industry:</text><text x="135.0" y="120.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">steel, shipyards</text><line x1="250.0" y1="107.0" x2="310.0" y2="107.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="310.0" y="72.0" width="230" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425.0" y="103.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">High-tech industry</text><text x="425.0" y="120.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">and services</text><rect x="20.0" y="164.0" width="230" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="135.0" y="195.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Factories in</text><text x="135.0" y="212.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">the home country</text><line x1="250.0" y1="199.0" x2="310.0" y2="199.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="310.0" y="164.0" width="230" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425.0" y="195.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Factories moved</text><text x="425.0" y="212.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">abroad (relocation)</text><rect x="20.0" y="256.0" width="230" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="135.0" y="287.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Many workers on</text><text x="135.0" y="304.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">assembly lines</text><line x1="250.0" y1="291.0" x2="310.0" y2="291.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="310.0" y="256.0" width="230" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425.0" y="287.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Robots and computers</text><text x="425.0" y="304.4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">(automation)</text></svg>