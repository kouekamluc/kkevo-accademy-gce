<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="Inter, Arial, sans-serif" role="img" aria-label="Old and new profit-sharing ratios on admission">
<title>Old and new profit-sharing ratios on admission</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<rect x="0" y="0" width="560" height="330" fill="#FFFFFF"/>
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Old and new profit-sharing ratios (admission)</text>
<text x="100" y="88.0" font-size="14" text-anchor="end" fill="#102A43" font-weight="bold">Old</text>
<rect x="110" y="60" width="252.0" height="46" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="236.0" y="88.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Eko 3/5</text>
<rect x="362.0" y="60" width="168.0" height="46" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="446.0" y="88.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Tabi 2/5</text>
<text x="100" y="198.0" font-size="14" text-anchor="end" fill="#102A43" font-weight="bold">New</text>
<rect x="110" y="170" width="168.0" height="46" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="194.0" y="198.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Eko 2/5</text>
<rect x="278.0" y="170" width="168.0" height="46" rx="4" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="362.0" y="198.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Tabi 2/5</text>
<rect x="446.0" y="170" width="84.0" height="46" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="488.0" y="198.0" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">Manga 1/5</text>
<rect x="278.0" y="60" width="84.0" height="46" rx="4" fill="none" stroke="#B45309" stroke-width="3"/>
<line x1="320.0" y1="110" x2="488.0" y2="166" stroke="#B45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="280" y="140" font-size="14" text-anchor="middle" fill="#B45309" font-weight="normal">Eko gives up 1/5 (sacrifice)</text>
<text x="280" y="250" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Sacrifice = old share − new share</text>
<text x="280" y="272" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Eko: 3/5 − 2/5 = 1/5;  Tabi: 2/5 − 2/5 = 0</text>
<text x="280" y="300" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="normal">The gaining partner compensates the sacrificing partner for goodwill.</text>
</svg>
