<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>A Wheatstone bridge</title><desc>Four resistors P, Q, R and S form a diamond between points A, B, C and D. A galvanometer G joins B to D and a cell is connected across A and C.</desc><rect width="560" height="360" fill="#FFFFFF"/><polyline points="150.0,175.0 186.4,147.0 196.4,148.1 199.3,128.3 219.3,130.5 222.2,110.7 242.1,112.9 243.6,103.0 280.0,75.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="191.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#102A43" font-weight="bold">P</text><polyline points="280.0,75.0 316.4,103.0 317.9,112.9 337.8,110.7 340.7,130.5 360.7,128.3 363.6,148.1 373.6,147.0 410.0,175.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="369.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#102A43" font-weight="bold">Q</text><polyline points="150.0,175.0 186.4,203.0 187.9,212.9 207.8,210.7 210.7,230.5 230.7,228.3 233.6,248.1 243.6,247.0 280.0,275.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="191.0" y="251.0" font-family="Inter, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#102A43" font-weight="bold">R</text><polyline points="280.0,275.0 316.4,247.0 326.4,248.1 329.3,228.3 349.3,230.5 352.2,210.7 372.1,212.9 373.6,203.0 410.0,175.0" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="369.0" y="251.0" font-family="Inter, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#102A43" font-weight="bold">S</text><line x1="280" y1="75" x2="280" y2="153" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><circle cx="280" cy="175" r="22" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="280" y="181" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#102A43" font-weight="bold">G</text><line x1="280" y1="197" x2="280" y2="275" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><circle cx="150" cy="175" r="5" fill="#102A43"/><text x="142" y="161" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">A</text><circle cx="280" cy="75" r="5" fill="#102A43"/><text x="280" y="63" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">B</text><circle cx="410" cy="175" r="5" fill="#102A43"/><text x="418" y="161" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">C</text><circle cx="280" cy="275" r="5" fill="#102A43"/><text x="280" y="299" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">D</text><line x1="150" y1="175" x2="50" y2="175" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="175" x2="50" y2="335" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="335" x2="265" y2="335" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="270" y1="319" x2="270" y2="351" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="280" y1="327" x2="280" y2="343" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><line x1="285" y1="335" x2="510" y2="335" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="510" y1="335" x2="510" y2="175" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><line x1="510" y1="175" x2="410" y2="175" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="280" y="22" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#047857" font-weight="bold">Balanced when P/Q = R/S (galvanometer reads zero)</text></svg>