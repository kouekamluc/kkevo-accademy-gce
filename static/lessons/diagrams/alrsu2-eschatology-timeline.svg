<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="30" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">When does the kingdom come?</text><line x1="40" y1="170" x2="520" y2="170" stroke="#102A43" stroke-width="3"/><rect x="40" y="150" width="130" height="40" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="105" y="175" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Ministry of Jesus</text><rect x="185" y="150" width="155" height="40" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="262" y="175" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Cross, Easter, Spirit</text><rect x="400" y="150" width="120" height="40" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="460" y="175" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">Parousia (end)</text><text x="360" y="212" font-size="13" text-anchor="middle" fill="#B45309" font-weight="400">time of the church</text><rect x="60" y="60" width="260" height="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="78" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400">Realized: mostly here already</text><rect x="330" y="100" width="190" height="26" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425" y="118" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Futuristic: mostly to come</text><rect x="60" y="230" width="260" height="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="190" y="248" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Already: kingdom begun</text><rect x="330" y="230" width="190" height="26" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="425" y="248" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Not yet: completed at the end</text><line x1="320" y1="243" x2="330" y2="243" stroke="#B45309" stroke-width="2"/><text x="280" y="290" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">Inaugurated view: already and not yet</text><text x="280" y="330" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">The three views place the kingdom at different points on the line.</text></svg>