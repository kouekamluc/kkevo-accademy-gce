<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">Six steps for any unseen text</text>
<rect x="25" y="45" width="240" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="51" y="95" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">1</text>
<text x="165" y="81" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Read for sense</text>
<text x="165" y="103" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Who, what, where, when?</text>
<rect x="295" y="45" width="240" height="84" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="321" y="95" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">2</text>
<text x="435" y="81" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Form and voice</text>
<text x="435" y="103" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Poem or prose; who</text>
<text x="435" y="121" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">speaks?</text>
<rect x="25" y="149" width="240" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="51" y="199" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">3</text>
<text x="165" y="185" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Shifts</text>
<text x="165" y="207" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Mark turns of mood or</text>
<text x="165" y="225" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">subject</text>
<rect x="295" y="149" width="240" height="84" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="321" y="199" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">4</text>
<text x="435" y="185" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Images and sounds</text>
<text x="435" y="207" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Group them into patterns</text>
<rect x="25" y="253" width="240" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="51" y="303" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">5</text>
<text x="165" y="289" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Structure and unity</text>
<text x="165" y="311" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">How do the parts fit?</text>
<rect x="295" y="253" width="240" height="84" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="321" y="303" font-family="Inter, Arial, sans-serif" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">6</text>
<text x="435" y="289" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Answer each task</text>
<text x="435" y="311" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Quote, explain effect</text>
</svg>
