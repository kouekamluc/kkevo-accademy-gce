<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Circle with centre C and point P on the circle: the tangent at P is perpendicular to the radius CP</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<circle cx="220" cy="190" r="125" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<line x1="247.8" y1="11.8" x2="397.0" y2="224.8" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<line x1="220.0" y1="190.0" x2="322.4" y2="118.3" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<polyline points="310.9,126.3 319.0,137.8 330.4,129.8" fill="none" stroke="#102A43" stroke-width="2"/>
<circle cx="220.0" cy="190.0" r="4" fill="#102A43"/>
<circle cx="322.4" cy="118.3" r="4" fill="#2563EB"/>
<text x="206.0" y="208.0" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text>
<text x="316.4" y="98.3" font-size="18" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">P</text>
<text x="277.2" y="172.2" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">radius</text>
<text x="405.0" y="218.8" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">tangent</text>
<text x="280.0" y="340.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">gradient of radius × gradient of tangent = −1</text>
</svg>