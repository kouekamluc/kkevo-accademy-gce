idth="2" marker-end="url(#ao)"/><line x1="64" y1="272" x2="104" y2="272" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><text x="114" y="138" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Mushroom rock</text><text x="114" y="154" font-size="13" text-anchor="middle" fill="#047857">(wider top, narrow base)</text><text x="20" y="326" font-size="13" text-anchor="start" fill="#B45309" font-weight="700">Wind-blown sand wears the base most,</text><text x="20" y="342" font-size="13" text-anchor="start" fill="#B45309" font-weight="700">close to the ground</text><path d="M290,300 C300,250 330,170 370,140 C410,118 450,130 470,170 C490,210 505,260 530,300 Z" fill="#E2E8F0" stroke="#102A43" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,300 C270,296 285,292 300,282 L300,300 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="98" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Inselberg</text><text x="420" y="114" font-size="13" text-anchor="middle" fill="#047857">(isolated steep hill)</text><text x="400" y="330" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700">Flat desert plain around it</text><text x="330" y="262" font-size="13" text-anchor="end" fill="#102A43" font-weight="700" stroke="#E2E8F0" stroke-width="5" paint-order="stroke">Steep sides</text></svg>