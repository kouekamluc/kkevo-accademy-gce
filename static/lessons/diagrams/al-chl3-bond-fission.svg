<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#FFFFFF"/>
<defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#102A43"/></marker>
<marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#2563EB"/></marker>
<marker id="aha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#B45309"/></marker>
</defs>
<text x="280.0" y="28.0" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" >Two ways a covalent bond can break</text>
<marker id="hh" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,7 L12,7 L3,0 Z" fill="#B45309"/></marker>
<rect x="10" y="42" width="540" height="140" rx="8" fill="#EFF6FF" stroke="#9FB3C8" stroke-width="2"/>
<text x="24.0" y="66.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="700" >Homolytic fission</text>
<text x="24.0" y="86.0" font-size="13" fill="#102A43" text-anchor="start" font-weight="400" >each atom keeps one electron</text>
<text x="100.0" y="136.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Cl</text>
<text x="180.0" y="136.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Cl</text>
<line x1="118.0" y1="130.0" x2="162.0" y2="130.0" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<path d="M138.0,124.0 Q116.0,78.0 100.0,110.0" fill="none" stroke="#B45309" stroke-width="2.5" marker-end="url(#hh)"/>
<path d="M142.0,124.0 Q164.0,78.0 180.0,110.0" fill="none" stroke="#B45309" stroke-width="2.5" marker-end="url(#hh)"/>
<line x1="235.0" y1="130.0" x2="335.0" y2="130.0" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/>
<text x="285.0" y="120.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="600" >UV light</text>
<text x="380.0" y="136.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Cl</text>
<circle cx="400" cy="122" r="3.5" fill="#102A43"/>
<text x="450.0" y="136.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Cl</text>
<circle cx="470" cy="122" r="3.5" fill="#102A43"/>
<text x="510.0" y="108.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >two</text>
<text x="510.0" y="124.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >radicals</text>
<text x="24.0" y="166.0" font-size="13" fill="#B45309" text-anchor="start" font-weight="400" >half-headed (fish-hook) arrow = movement of ONE electron</text>
<rect x="10" y="196" width="540" height="150" rx="8" fill="#ECFDF5" stroke="#9FB3C8" stroke-width="2"/>
<text x="24.0" y="220.0" font-size="15" fill="#047857" text-anchor="start" font-weight="700" >Heterolytic fission</text>
<text x="24.0" y="240.0" font-size="13" fill="#102A43" text-anchor="start" font-weight="400" >both electrons go to the more electronegative atom</text>
<text x="78.0" y="290.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >H<tspan baseline-shift="sub" font-size="13">3</tspan>C</text>
<text x="172.0" y="290.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Br</text>
<line x1="104.0" y1="284.0" x2="150.0" y2="284.0" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<path d="M128.0,280.0 Q152.0,238.0 172.0,266.0" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ahb)"/>
<text x="88.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" >&#948;+</text>
<text x="176.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" >&#948;&#8722;</text>
<line x1="235.0" y1="284.0" x2="335.0" y2="284.0" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/>
<text x="285.0" y="274.0" font-size="13" fill="#B45309" text-anchor="middle" font-weight="600" >heat or solvent</text>
<text x="385.0" y="290.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >CH<tspan baseline-shift="sub" font-size="13">3</tspan><tspan baseline-shift="super" font-size="13">+</tspan></text>
<text x="470.0" y="290.0" font-size="20" fill="#102A43" text-anchor="middle" font-weight="700" >Br<tspan baseline-shift="super" font-size="13">&#8722;</tspan></text>
<text x="385.0" y="314.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >carbocation</text>
<text x="470.0" y="314.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" >bromide ion</text>
<text x="24.0" y="332.0" font-size="13" fill="#2563EB" text-anchor="start" font-weight="400" >full-headed curly arrow = movement of an electron PAIR</text>
</svg>
