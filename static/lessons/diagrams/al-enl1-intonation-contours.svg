<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">The four nuclear tunes</title><desc id="d">Four pitch graphs: fall, rise, fall-rise and rise-fall.</desc><rect width="560" height="360" fill="#FFFFFF"/><rect x="20" y="8" width="250" height="152" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="145" y="36" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Fall</text><path d="M50.0 56.7 C83.2 56.7 83.2 55.0 116.5 55.0 C140.2 55.0 140.2 59.6 164.0 59.6 C202.0 59.6 202.0 100.2 240.0 100.2 " fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><circle cx="116.5" cy="55.0" r="8" fill="#B45309"/><text x="145" y="146" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">statements, commands</text><rect x="290" y="8" width="250" height="152" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="415" y="36" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Rise</text><path d="M320.0 94.4 C358.0 94.4 358.0 97.3 396.0 97.3 C419.8 97.3 419.8 94.4 443.5 94.4 C476.8 94.4 476.8 53.8 510.0 53.8 " fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><circle cx="396.0" cy="97.3" r="8" fill="#B45309"/><text x="415" y="146" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">yes/no questions</text><rect x="20" y="172" width="250" height="152" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="145" y="200" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Fall-rise</text><path d="M50.0 220.7 C88.0 220.7 88.0 223.6 126.0 223.6 C145.0 223.6 145.0 264.2 164.0 264.2 C202.0 264.2 202.0 226.5 240.0 226.5 " fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><circle cx="164.0" cy="264.2" r="8" fill="#B45309"/><text x="145" y="310" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">doubt, reservation</text><rect x="290" y="172" width="250" height="152" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="415" y="200" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Rise-fall</text><path d="M320.0 252.6 C358.0 252.6 358.0 249.7 396.0 249.7 C416.9 249.7 416.9 217.8 437.8 217.8 C473.9 217.8 473.9 264.2 510.0 264.2 " fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><circle cx="437.8" cy="217.8" r="8" fill="#B45309"/><text x="415" y="310" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">strong feeling</text><text x="280" y="348" font-size="13" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">Orange dot = nucleus (the main stressed syllable)</text></svg>