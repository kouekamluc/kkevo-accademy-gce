<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Timeline of the July Crisis of 1914</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">The July Crisis, 1914</text><line x1="25" y1="190" x2="535" y2="190" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><circle cx="62" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="62" y1="183" x2="62" y2="162" stroke="#2563EB" stroke-width="2"/><text x="62" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Sarajevo</text><text x="62" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">assassination</text><text x="62" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">28 June</text><circle cx="135" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="135" y1="197" x2="135" y2="218" stroke="#B45309" stroke-width="2"/><text x="135" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">5-6 July</text><text x="135" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">German</text><text x="135" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">blank cheque</text><circle cx="207" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="207" y1="183" x2="207" y2="162" stroke="#B45309" stroke-width="2"/><text x="207" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Austrian</text><text x="207" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">ultimatum</text><text x="207" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">23 July</text><circle cx="280" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="280" y1="197" x2="280" y2="218" stroke="#2563EB" stroke-width="2"/><text x="280" y="236" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">28 July</text><text x="280" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Austria declares</text><text x="280" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">war on Serbia</text><circle cx="353" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="353" y1="183" x2="353" y2="162" stroke="#B45309" stroke-width="2"/><text x="353" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Germany v</text><text x="353" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Russia</text><text x="353" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1 Aug</text><circle cx="425" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="425" y1="197" x2="425" y2="218" stroke="#B45309" stroke-width="2"/><text x="425" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">3 Aug</text><text x="425" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Germany v</text><text x="425" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">France</text><circle cx="498" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="498" y1="183" x2="498" y2="162" stroke="#047857" stroke-width="2"/><text x="498" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Britain v</text><text x="498" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Germany</text><text x="498" y="118" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">4 Aug</text><text x="280" y="348" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Not to scale. Check the 5-6 July date of the blank cheque in your textbook.</text></svg>