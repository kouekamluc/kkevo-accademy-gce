<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="190" y="15" width="180" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="42.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Volont&#233;, sentiment,</text><text x="280.0" y="61.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">doute ou n&#233;cessit&#233; ?</text><line x1="370" y1="47" x2="400" y2="47" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="385" y="38" text-anchor="middle" font-size="13" fill="#B45309">non</text><rect x="400" y="15" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475.0" y="42.4" text-anchor="middle" font-size="14" fill="#102A43">Fait, certitude :</text><text x="475.0" y="61.4" text-anchor="middle" font-size="14" fill="#102A43">indicatif</text><line x1="280" y1="79" x2="280" y2="121" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="300" y="105" text-anchor="start" font-size="13" fill="#B45309">oui</text><rect x="190" y="121" width="180" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="148.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">M&#234;me sujet pour</text><text x="280.0" y="167.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">les deux verbes ?</text><line x1="190" y1="153" x2="160" y2="153" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="175" y="144" text-anchor="middle" font-size="13" fill="#B45309">oui</text><rect x="10" y="121" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="85.0" y="148.4" text-anchor="middle" font-size="14" fill="#102A43">Infinitif</text><text x="85.0" y="167.4" text-anchor="middle" font-size="14" fill="#102A43">Je veux partir.</text><line x1="280" y1="185" x2="280" y2="227" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="300" y="211" text-anchor="start" font-size="13" fill="#B45309">non</text><rect x="190" y="227" width="180" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="254.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">L'action est-elle</text><text x="280.0" y="273.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">d&#233;j&#224; termin&#233;e ?</text><line x1="190" y1="259" x2="160" y2="259" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="175" y="250" text-anchor="middle" font-size="13" fill="#B45309">oui</text><rect x="10" y="227" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="85.0" y="254.4" text-anchor="middle" font-size="14" fill="#102A43">Subjonctif pass&#233;</text><text x="85.0" y="273.4" text-anchor="middle" font-size="14" fill="#102A43">qu'il soit venu</text><line x1="370" y1="259" x2="400" y2="259" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="385" y="250" text-anchor="middle" font-size="13" fill="#B45309">non</text><rect x="400" y="227" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475.0" y="254.4" text-anchor="middle" font-size="14" fill="#102A43">Subjonctif pr&#233;sent</text><text x="475.0" y="273.4" text-anchor="middle" font-size="14" fill="#102A43">qu'il vienne</text><text x="280" y="330" text-anchor="middle" font-size="14" fill="#102A43">Apr&#232;s le d&#233;clencheur, v&#233;rifier toujours le sujet et le moment.</text></svg>