<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><path d="M160,190 L160.0,80.0 A110,110 0 0 1 194.0,294.6 Z" fill="#FCD9B6" stroke="#102A43" stroke-width="2"/><text x="225.2" y="184.7" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">45%</text><path d="M160,190 L194.0,294.6 A110,110 0 0 1 55.4,224.0 Z" fill="#BFDBFE" stroke="#102A43" stroke-width="2"/><text x="130.0" y="253.8" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">25%</text><path d="M160,190 L55.4,224.0 A110,110 0 0 1 126.0,85.4 Z" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="101.2" y="165.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">25%</text><path d="M160,190 L126.0,85.4 A110,110 0 0 1 160.0,80.0 Z" fill="#86EFAC" stroke="#102A43" stroke-width="2"/><rect x="320" y="96" width="20" height="20" fill="#FCD9B6" stroke="#102A43" stroke-width="2"/><text x="348" y="112" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Mineral particles: 45%</text><rect x="320" y="132" width="20" height="20" fill="#BFDBFE" stroke="#102A43" stroke-width="2"/><text x="348" y="148" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Water: 25%</text><rect x="320" y="168" width="20" height="20" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="348" y="184" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Air: 25%</text><rect x="320" y="204" width="20" height="20" fill="#86EFAC" stroke="#102A43" stroke-width="2"/><text x="348" y="220" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Organic matter (humus): 5%</text><text x="320" y="270" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">Living things (roots, worms, termites,</text><text x="320" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">bacteria, fungi) live in the humus and</text><text x="320" y="306" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">in the air and water spaces.</text><text x="160" y="28" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Typical good soil, by volume</text><text x="280" y="345" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Approximate figures; they vary from soil to soil.</text></svg>