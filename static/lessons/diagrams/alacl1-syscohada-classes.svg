<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect x="0" y="0" width="560" height="360" fill="#ffffff"/><text x="280" y="24" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle">Revised SYSCOHADA chart: nine classes</text><text x="16" y="54" font-size="14" font-weight="bold" fill="#2563EB">Balance sheet accounts</text><text x="290" y="54" font-size="14" font-weight="bold" fill="#047857">Result accounts</text><text x="290" y="252" font-size="14" font-weight="bold" fill="#B45309">Off balance sheet, analysis</text><rect x="16" y="64" width="260" height="48" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="26" y="84" font-size="14" font-weight="bold" fill="#102A43">1  Long-term resources</text><text x="26" y="103" font-size="13" fill="#102A43">capital, reserves, result, loans</text><rect x="16" y="121" width="260" height="48" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="26" y="141" font-size="14" font-weight="bold" fill="#102A43">2  Fixed assets</text><text x="26" y="160" font-size="13" fill="#102A43">intangibles, land, buildings, equipment</text><rect x="16" y="178" width="260" height="48" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="26" y="198" font-size="14" font-weight="bold" fill="#102A43">3  Stocks</text><text x="26" y="217" font-size="13" fill="#102A43">goods, materials, products</text><rect x="16" y="235" width="260" height="48" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="26" y="255" font-size="14" font-weight="bold" fill="#102A43">4  Third parties</text><text x="26" y="274" font-size="13" fill="#102A43">suppliers, customers, staff, State</text><rect x="16" y="292" width="260" height="48" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="26" y="312" font-size="14" font-weight="bold" fill="#102A43">5  Treasury</text><text x="26" y="331" font-size="13" fill="#102A43">banks, cash, bills to collect</text><rect x="290" y="64" width="254" height="48" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="300" y="84" font-size="14" font-weight="bold" fill="#102A43">6  Ordinary expenses</text><text x="300" y="103" font-size="13" fill="#102A43">purchases, services, staff costs</text><rect x="290" y="121" width="254" height="48" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="300" y="141" font-size="14" font-weight="bold" fill="#102A43">7  Ordinary income</text><text x="300" y="160" font-size="13" fill="#102A43">sales, financial income, reversals</text><rect x="290" y="178" width="254" height="48" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="300" y="198" font-size="14" font-weight="bold" fill="#102A43">8  Other expenses and income</text><text x="300" y="217" font-size="13" fill="#102A43">HAO items, disposals, profit tax</text><rect x="290" y="262" width="254" height="48" rx="6" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="300" y="282" font-size="14" font-weight="bold" fill="#102A43">9  Commitments, analysis</text><text x="300" y="301" font-size="13" fill="#102A43">off-balance sheet, cost accounting</text><text x="290" y="342" font-size="13" fill="#102A43">First digit = class; more digits = detail</text></svg>