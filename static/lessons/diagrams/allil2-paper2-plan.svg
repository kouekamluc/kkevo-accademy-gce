<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Essay routine</title><desc id="d">Six steps for each Paper 2 essay.</desc>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="30" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">A routine for each essay</text>
<rect x="40" y="60" width="230" height="65" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="155" y="100" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1. Read</text>
<rect x="290" y="60" width="230" height="65" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="405" y="100" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">2. Underline tag and focus</text>
<rect x="40" y="155" width="230" height="65" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="155" y="195" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">3. Plan 5 minutes</text>
<rect x="290" y="155" width="230" height="65" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="405" y="195" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">4. Introduction: thesis</text>
<rect x="40" y="250" width="230" height="65" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="155" y="290" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">5. Body: evidence + effect</text>
<rect x="290" y="250" width="230" height="65" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="405" y="290" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">6. Conclusion, check</text>
</svg>
