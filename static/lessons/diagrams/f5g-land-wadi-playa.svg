<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="10" width="540" height="340" rx="0" fill="#EFF6FF" stroke="#EFF6FF" stroke-width="0"/><path d="M10,340 L10,130 L60,110 L110,130 L170,190 L230,235 L290,268 L340,282 L550,284 L550,340 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M112,134 L170,192 L230,237 L290,270 L338,284" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="10 6" stroke-linejoin="round" stroke-linecap="round"/><path d="M400,284 L520,284 L512,292 L408,292 Z" fill="#fff" stroke="#102A43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M400,276 L440,270 L480,270 L520,276" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="100" font-size="14" text-anchor="start" fill="#102A43" font-weight="700">Dry hills or plateau</text><text x="330" y="44" font-size="14" text-anchor="start" fill="#047857" font-weight="700">Wadi: dry valley, flooded</text><text x="330" y="62" font-size="14" text-anchor="start" fill="#047857" font-weight="700">briefly after heavy rain</text><line x1="326" y1="56" x2="196" y2="200" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><text x="330" y="124" font-size="14" text-anchor="start" fill="#B45309" font-weight="700">Fan of sand and gravel</text><text x="330" y="142" font-size="13" text-anchor="start" fill="#B45309">dropped where the flood slows</text><line x1="326" y1="138" x2="300" y2="266" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><text x="350" y="196" font-size="14" text-anchor="start" fill="#047857" font-weight="700">Playa: flat basin where</text><text x="350" y="214" font-size="14" text-anchor="start" fill="#047857" font-weight="700">a temporary lake forms</text><line x1="450" y1="222" x2="450" y2="262" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><text x="420" y="318" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Salt pan: white salt crust left</text><text x="420" y="336" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">when the lake water evaporates</text><line x1="450" y1="304" x2="450" y2="296" stroke="#102A43" stroke-width="2" marker-end="url(#ai)"/></svg>