<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><text x="140" y="50" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">Mutually exclusive</text><text x="420" y="50" font-size="18" text-anchor="middle" fill="#102A43" font-weight="700">Overlapping</text><circle cx="90" cy="180" r="62" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><circle cx="195" cy="180" r="62" fill="#ECFDF5" stroke="#047857" stroke-width="3"/><text x="90" y="187" font-size="22" text-anchor="middle" fill="#2563EB" font-weight="700">A</text><text x="195" y="187" font-size="22" text-anchor="middle" fill="#047857" font-weight="700">B</text><text x="140" y="290" font-size="15" text-anchor="middle" fill="#102A43" font-weight="400">no common outcomes</text><text x="140" y="312" font-size="15" text-anchor="middle" fill="#B45309" font-weight="700">P(A and B) = 0</text><circle cx="385" cy="180" r="62" fill="#EFF6FF" fill-opacity="0.85" stroke="#2563EB" stroke-width="3"/><circle cx="455" cy="180" r="62" fill="#ECFDF5" fill-opacity="0.75" stroke="#047857" stroke-width="3"/><text x="360" y="187" font-size="22" text-anchor="middle" fill="#2563EB" font-weight="700">A</text><text x="482" y="187" font-size="22" text-anchor="middle" fill="#047857" font-weight="700">B</text><text x="420" y="290" font-size="15" text-anchor="middle" fill="#102A43" font-weight="400">some common outcomes</text><text x="420" y="312" font-size="15" text-anchor="middle" fill="#B45309" font-weight="700">P(A and B) &gt; 0</text></svg>