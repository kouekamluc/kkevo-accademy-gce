<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>The fetch-decode-execute cycle</title><defs><marker id="fdn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="fdb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="fdg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/><rect x="90" y="20" width="440" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="110" y="50" font-size="18" font-weight="bold" fill="#2563EB">1. Fetch</text><text x="130" y="82" font-size="16" fill="#102A43">MAR &#8592; [PC]</text><text x="130" y="110" font-size="16" fill="#102A43">PC &#8592; [PC] + 1  and  MDR &#8592; [[MAR]]</text><text x="130" y="138" font-size="16" fill="#102A43">CIR &#8592; [MDR]</text><path d="M310 160 L310 196" fill="none" stroke="#102A43" stroke-width="3" stroke-linejoin="round" marker-end="url(#fdn)"/><rect x="90" y="200" width="440" height="70" rx="10" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="110" y="228" font-size="18" font-weight="bold" fill="#102A43">2. Decode</text><text x="110" y="254" font-size="14" fill="#102A43">CU splits the instruction in the CIR into opcode and operand</text><path d="M310 270 L310 306" fill="none" stroke="#102A43" stroke-width="3" stroke-linejoin="round" marker-end="url(#fdn)"/><rect x="90" y="310" width="440" height="70" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="110" y="338" font-size="18" font-weight="bold" fill="#047857">3. Execute</text><text x="110" y="364" font-size="14" fill="#102A43">CU sends signals: load, use the ALU, store or jump</text><path d="M90 345 L40 345 L40 90 L86 90" fill="none" stroke="#102A43" stroke-width="3" stroke-linejoin="round" marker-end="url(#fdn)"/><text x="30" y="218" font-size="14" text-anchor="middle" fill="#102A43" transform="rotate(-90 30 218)">next instruction</text></svg>
