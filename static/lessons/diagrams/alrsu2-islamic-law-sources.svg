<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Sources of Islamic law (Sunni)</text><rect x="90" y="55" width="380" height="54" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="78" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">1. The Quran</text><text x="280" y="98" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">word of God</text><rect x="90" y="123" width="380" height="54" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="146" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">2. The Sunna</text><text x="280" y="166" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">example of the Prophet (Hadith)</text><rect x="90" y="191" width="380" height="54" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280" y="214" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">3. Ijma</text><text x="280" y="234" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">consensus of scholars</text><rect x="90" y="259" width="380" height="54" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280" y="282" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">4. Qiyas</text><text x="280" y="302" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">analogy to a new case</text><text x="280" y="340" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Scholars (fiqh) use these to reach rulings; Sharia is God's way.</text></svg>