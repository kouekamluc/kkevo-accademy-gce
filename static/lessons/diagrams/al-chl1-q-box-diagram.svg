<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Orbital box diagram: 2s has two paired electrons; of the three 2p boxes the first has a pair, the second a single up electron, the third is empty</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280.0" y="34.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700" >Box diagram of an atom (2s and 2p only)</text>
<text x="150.0" y="130.0" font-size="15" fill="#102A43" text-anchor="end" font-weight="700" >2s</text>
<rect x="165.0" y="105.0" width="40.0" height="40.0" fill="#FFFFFF" stroke="#102A43" stroke-width="2" rx="0" />
<line x1="180.0" y1="135.0" x2="180.0" y2="115.0" stroke="#2563EB" stroke-width="2.2" />
<polygon points="176.0,119 184.0,119 180.0,112" fill="#2563EB"/>
<line x1="190.0" y1="115.0" x2="190.0" y2="135.0" stroke="#2563EB" stroke-width="2.2" />
<polygon points="186.0,131 194.0,131 190.0,138" fill="#2563EB"/>
<text x="150.0" y="210.0" font-size="15" fill="#102A43" text-anchor="end" font-weight="700" >2p</text>
<rect x="165.0" y="185.0" width="40.0" height="40.0" fill="#FFFFFF" stroke="#102A43" stroke-width="2" rx="0" />
<line x1="180.0" y1="215.0" x2="180.0" y2="195.0" stroke="#2563EB" stroke-width="2.2" />
<polygon points="176.0,199 184.0,199 180.0,192" fill="#2563EB"/>
<line x1="190.0" y1="195.0" x2="190.0" y2="215.0" stroke="#2563EB" stroke-width="2.2" />
<polygon points="186.0,211 194.0,211 190.0,218" fill="#2563EB"/>
<rect x="205.0" y="185.0" width="40.0" height="40.0" fill="#FFFFFF" stroke="#102A43" stroke-width="2" rx="0" />
<line x1="225.0" y1="215.0" x2="225.0" y2="195.0" stroke="#2563EB" stroke-width="2.2" />
<polygon points="221.0,199 229.0,199 225.0,192" fill="#2563EB"/>
<rect x="245.0" y="185.0" width="40.0" height="40.0" fill="#FFFFFF" stroke="#102A43" stroke-width="2" rx="0" />
<text x="330.0" y="130.0" font-size="14" fill="#102A43" text-anchor="start" font-weight="600" >Each arrow is one electron</text>
</svg>
