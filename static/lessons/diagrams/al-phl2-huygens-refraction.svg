<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Huygens construction for refraction: a plane wavefront AB meets a boundary, the wavelet from A in the slower second medium has a smaller radius, and the new wavefront is the tangent from C to that wavelet"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
<text x="280.0" y="22.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Huygens construction for refraction</text>
<rect x="20.0" y="190.0" width="520.0" height="150.0" fill="#EFF6FF" stroke="none" stroke-width="0" rx="0"/>
<line x1="20.0" y1="190.0" x2="540.0" y2="190.0" stroke="#102A43" stroke-width="3"/>
<text x="540.0" y="60.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="end">medium 1 (faster)</text>
<text x="540.0" y="340.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="end">medium 2 (slower)</text>
<line x1="150.0" y1="80.0" x2="150.0" y2="280.0" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="150.0" y1="190.0" x2="220.1" y2="106.4" stroke="#2563EB" stroke-width="3"/>
<line x1="319.7" y1="190.0" x2="194.3" y2="264.5" stroke="#047857" stroke-width="3"/>
<path d="M236.7 190 A86.7 86.7 0 0 1 63.3 190" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>
<line x1="220.1" y1="106.4" x2="319.7" y2="190.0" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
<line x1="150.0" y1="190.0" x2="194.3" y2="264.5" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
<text x="136.0" y="182.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">A</text>
<text x="208.1" y="110.4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">B</text>
<text x="325.7" y="182.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">C</text>
<text x="182.3" y="280.5" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43" text-anchor="middle">T</text>
<text x="291.9" y="142.2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start">v1 t</text>
<text x="160.1" y="233.3" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="end">v2 t</text>
<text x="232.1" y="98.4" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">wavefront AB</text>
<text x="300.0" y="306.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">new wavefront CT</text>
<text x="178.0" y="182.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">i</text>
<text x="285.7" y="210.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">r</text>
<text x="430.0" y="160.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">boundary</text>
</svg>
