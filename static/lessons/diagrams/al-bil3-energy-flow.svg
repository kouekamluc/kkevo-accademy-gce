<text x="280.0" y="246.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Dead material and faeces pass to decomposers</text>
<text x="280.0" y="300.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">NPP = GPP - R = 25 000 - 10 000 = 15 000</text>
<text x="280.0" y="326.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">About 10% is passed on at each step; the rest is lost.</text>
