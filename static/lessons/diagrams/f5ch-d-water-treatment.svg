<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a102A43" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker><marker id="a047857" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#047857"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="25" y="40" width="130" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="90" y="86" font-size="14" text-anchor="middle" fill="#102A43">River or</text><text x="90" y="104" font-size="14" text-anchor="middle" fill="#102A43">reservoir</text><rect x="215" y="40" width="130" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="86" font-size="14" text-anchor="middle" fill="#102A43">Screen removes</text><text x="280" y="104" font-size="14" text-anchor="middle" fill="#102A43">large objects</text><rect x="405" y="40" width="130" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="470" y="68" font-size="14" text-anchor="middle" fill="#102A43">Settling tank:</text><text x="470" y="86" font-size="14" text-anchor="middle" fill="#102A43">alum added, small</text><text x="470" y="104" font-size="14" text-anchor="middle" fill="#102A43">particles clump</text><text x="470" y="122" font-size="14" text-anchor="middle" fill="#102A43">and sink</text><rect x="405" y="200" width="130" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="470" y="237" font-size="14" text-anchor="middle" fill="#102A43">Sand filter</text><text x="470" y="255" font-size="14" text-anchor="middle" fill="#102A43">removes the</text><text x="470" y="273" font-size="14" text-anchor="middle" fill="#102A43">remaining particles</text><rect x="215" y="200" width="130" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="246" font-size="14" text-anchor="middle" fill="#102A43">Chlorine added</text><text x="280" y="264" font-size="14" text-anchor="middle" fill="#102A43">to kill germs</text><rect x="25" y="200" width="130" height="100" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="90" y="237" font-size="14" text-anchor="middle" fill="#102A43">Storage and</text><text x="90" y="255" font-size="14" text-anchor="middle" fill="#102A43">supply pipes</text><text x="90" y="273" font-size="14" text-anchor="middle" fill="#102A43">to homes</text><line x1="155" y1="90" x2="215" y2="90" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="345" y1="90" x2="405" y2="90" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="470" y1="140" x2="470" y2="200" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="405" y1="250" x2="345" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><line x1="215" y1="250" x2="155" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#a102A43)"/><text x="280" y="335" font-size="14" text-anchor="middle" fill="#102A43">Each step removes something: objects, then particles, then germs.</text></svg>