<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Inter, Arial, sans-serif" role="img" aria-label="Partnership appropriation flow">
<title>Partnership appropriation flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<rect x="0" y="0" width="560" height="380" fill="#FFFFFF"/>
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Partnership appropriation account</text>
<rect x="20" y="44" width="320" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="180.0" y="68.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">Net profit (from the income statement)</text>
<rect x="20" y="98" width="320" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="180.0" y="122.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">+ Interest on drawings</text>
<line x1="180.0" y1="84" x2="180.0" y2="97" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="152" width="320" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="180.0" y="176.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">− Partners' salaries</text>
<line x1="180.0" y1="138" x2="180.0" y2="151" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="206" width="320" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="180.0" y="230.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">− Interest on capital</text>
<line x1="180.0" y1="192" x2="180.0" y2="205" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="260" width="320" height="40" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="180.0" y="284.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">= Residual profit (or loss)</text>
<line x1="180.0" y1="246" x2="180.0" y2="259" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="314" width="320" height="40" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="180.0" y="338.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">Shared in the profit-sharing ratio</text>
<line x1="180.0" y1="300" x2="180.0" y2="313" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="390" y="98" width="150" height="256" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="465.0" y="162.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Each partner's</text>
<text x="465.0" y="179.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">current account</text>
<text x="465.0" y="196.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal"></text>
<text x="465.0" y="213.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">debit: drawings,</text>
<text x="465.0" y="230.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">interest on drawings</text>
<text x="465.0" y="247.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal"></text>
<text x="465.0" y="264.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">credit: salary,</text>
<text x="465.0" y="281.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">interest on capital,</text>
<text x="465.0" y="298.6" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">profit share</text>
<line x1="340" y1="118.0" x2="388" y2="118.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="340" y1="172.0" x2="388" y2="172.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="340" y1="226.0" x2="388" y2="226.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="340" y1="334.0" x2="388" y2="334.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
