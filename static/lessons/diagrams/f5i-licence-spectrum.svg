<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#102A43">Software from restricted to open</text><line x1="40" y1="90" x2="520" y2="90" stroke="#102A43" stroke-width="3"/><polygon points="520,90 508,83 508,97" fill="#102A43"/><text x="40" y="76" font-size="14" fill="#102A43">Most restricted</text><text x="520" y="76" text-anchor="end" font-size="14" fill="#102A43">Most open</text><line x1="96" y1="84" x2="96" y2="104" stroke="#2563EB" stroke-width="2"/><rect x="40" y="110" width="112" height="90" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="96.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43">Proprietary</text><text x="96.0" y="166" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Pay,</text><text x="96.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">closed code</text><line x1="219" y1="84" x2="219" y2="104" stroke="#2563EB" stroke-width="2"/><rect x="163" y="110" width="112" height="90" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="219.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43">Shareware</text><text x="219.0" y="166" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Trial,</text><text x="219.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">then pay</text><line x1="341" y1="84" x2="341" y2="104" stroke="#2563EB" stroke-width="2"/><rect x="285" y="110" width="112" height="90" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="341.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43">Freeware</text><text x="341.0" y="166" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Free,</text><text x="341.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">closed code</text><line x1="464" y1="84" x2="464" y2="104" stroke="#2563EB" stroke-width="2"/><rect x="408" y="110" width="112" height="90" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="464.0" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43">Open source</text><text x="464.0" y="166" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Free,</text><text x="464.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">open code</text><rect x="40" y="240" width="480" height="80" rx="10" fill="#ffffff" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">Always read the licence: how many computers?</text><text x="280.0" y="295" text-anchor="middle" font-size="15" font-weight="400" fill="#102A43">Who may use it? May you copy or change it?</text></svg>