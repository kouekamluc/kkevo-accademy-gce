<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>From power on to operating system</title><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="15" y="12" width="270" height="40" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="37" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">1  Power on: PSU gives power-good</text><line x1="150" y1="52" x2="150" y2="68" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="287" y1="32" x2="312" y2="32" stroke="#B45309" stroke-width="2"/><text x="318" y="37" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#B45309">No light or fan: power fault</text><rect x="15" y="68" width="270" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="93" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">2  Firmware starts (BIOS or UEFI)</text><line x1="150" y1="108" x2="150" y2="124" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="15" y="124" width="270" height="40" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="149" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">3  POST tests CPU, RAM, graphics</text><line x1="150" y1="164" x2="150" y2="180" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="287" y1="144" x2="312" y2="144" stroke="#B45309" stroke-width="2"/><text x="318" y="149" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#B45309">Beeps, no picture: hardware</text><rect x="15" y="180" width="270" height="40" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="205" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">4  Boot order: find a boot device</text><line x1="150" y1="220" x2="150" y2="236" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="287" y1="200" x2="312" y2="200" stroke="#B45309" stroke-width="2"/><text x="318" y="205" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#B45309">No boot device: disk or order</text><rect x="15" y="236" width="270" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="261" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">5  Boot loader starts</text><line x1="150" y1="276" x2="150" y2="292" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="15" y="292" width="270" height="40" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="317" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">6  Operating system loads</text><line x1="287" y1="312" x2="312" y2="312" stroke="#B45309" stroke-width="2"/><text x="318" y="317" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#B45309">Error or freeze: OS fault</text></svg>