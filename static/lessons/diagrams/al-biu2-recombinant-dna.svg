<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><text x="280" y="24" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700" >Making recombinant DNA</text><rect x="20" y="44" width="150" height="300" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><rect x="205" y="44" width="150" height="300" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><rect x="390" y="44" width="150" height="300" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95" y="70" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >1. Cut</text><text x="95" y="90" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >same enzyme</text><text x="280" y="70" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >2. Join</text><text x="280" y="90" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >with ligase</text><text x="465" y="70" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >3. Transform</text><text x="465" y="90" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >a bacterium</text><path d="M65,170 A32,32 0 1,0 125,170" fill="none" stroke="#102A43" stroke-width="4" /><line x1="65" y1="166" x2="58" y2="160" stroke="#B45309" stroke-width="3"/><line x1="125" y1="166" x2="132" y2="160" stroke="#B45309" stroke-width="3"/><text x="95" y="234" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Plasmid opened</text><rect x="50" y="262" width="90" height="14" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95" y="300" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Gene of interest</text><text x="95" y="322" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >with matching ends</text><circle cx="280" cy="190" r="42" fill="none" stroke="#102A43" stroke-width="4"/><path d="M262,152 A42,42 0 0,1 298,152" fill="none" stroke="#047857" stroke-width="8" /><text x="280" y="128" font-size="14" text-anchor="middle" fill="#047857" font-weight="700" >gene inserted</text><text x="280" y="262" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" >Recombinant plasmid</text><text x="280" y="296" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >Sticky ends pair;</text><text x="280" y="314" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >ligase seals the</text><text x="280" y="332" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >backbone</text><rect x="415" y="140" width="100" height="56" rx="28" fill="#FFFFFF" stroke="#102A43" stroke-width="3"/><circle cx="465" cy="168" r="12" fill="none" stroke="#047857" stroke-width="3"/><text x="465" y="224" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Bacterium</text><text x="465" y="252" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >multiplies and</text><text x="465" y="270" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >copies the plasmid</text><text x="465" y="304" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >A marker gene lets</text><text x="465" y="322" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" >us select it</text><line x1="172" y1="190" x2="200" y2="190" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/><line x1="358" y1="190" x2="386" y2="190" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/></svg>