<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">From revelation to the standard copies</text>
<rect x="70" y="44" width="420" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="67.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">1 Revelation through Jibril</text>
<text x="280.0" y="85.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">over about 23 years, in Arabic</text>
<line x1="280" y1="102" x2="280" y2="120" stroke="#102A43" stroke-width="2"/>
<polygon points="280,120 276.1,111.9 283.9,111.9" fill="#102A43"/>
<rect x="70" y="122" width="420" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="145.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">2 Memorised and written down</text>
<text x="280.0" y="163.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">in the Prophet's lifetime</text>
<line x1="280" y1="180" x2="280" y2="198" stroke="#102A43" stroke-width="2"/>
<polygon points="280,198 276.1,189.9 283.9,189.9" fill="#102A43"/>
<rect x="70" y="200" width="420" height="56" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="223.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">3 Collected in one volume</text>
<text x="280.0" y="241.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">under Abu Bakr (Zayd ibn Thabit)</text>
<line x1="280" y1="258" x2="280" y2="276" stroke="#102A43" stroke-width="2"/>
<polygon points="280,276 276.1,267.9 283.9,267.9" fill="#102A43"/>
<rect x="70" y="278" width="420" height="56" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="301.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">4 Standard copies sent to cities</text>
<text x="280.0" y="319.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">under Uthman</text>
</svg>
