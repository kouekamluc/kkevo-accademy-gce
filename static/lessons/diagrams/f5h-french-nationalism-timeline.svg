<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">Nationalism in French Cameroun, 1944-1952</text>
<line x1="30" y1="190" x2="530" y2="190" stroke="#102A43" stroke-width="3"/>
<line x1="50" y1="190" x2="50" y2="140" stroke="#102A43" stroke-width="2"/>
<circle cx="50" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="30" y="96" text-anchor="start" font-size="14" font-weight="700" fill="#102A43">1944</text>
<text x="30" y="116" text-anchor="start" font-size="14" fill="#102A43">USCC unions</text>
<text x="30" y="134" text-anchor="start" font-size="14" fill="#102A43">grow</text>
<line x1="127" y1="190" x2="127" y2="240" stroke="#102A43" stroke-width="2"/>
<circle cx="127" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="127" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Sep 1945</text>
<text x="127" y="282" text-anchor="middle" font-size="14" fill="#102A43">Douala strikes</text>
<text x="127" y="300" text-anchor="middle" font-size="14" fill="#102A43">and riots</text>
<line x1="203" y1="190" x2="203" y2="140" stroke="#102A43" stroke-width="2"/>
<circle cx="203" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="203" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">1946</text>
<text x="203" y="116" text-anchor="middle" font-size="14" fill="#102A43">Trusteeship</text>
<text x="203" y="134" text-anchor="middle" font-size="14" fill="#102A43">Agreement</text>
<line x1="280" y1="190" x2="280" y2="240" stroke="#2563EB" stroke-width="2"/>
<circle cx="280" cy="190" r="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="280" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">10 Apr 1948</text>
<text x="280" y="282" text-anchor="middle" font-size="14" fill="#102A43">UPC founded</text>
<text x="280" y="300" text-anchor="middle" font-size="14" fill="#102A43">in Douala</text>
<line x1="357" y1="190" x2="357" y2="140" stroke="#102A43" stroke-width="2"/>
<circle cx="357" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="357" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">1949</text>
<text x="357" y="116" text-anchor="middle" font-size="14" fill="#102A43">ESOCAM</text>
<text x="357" y="134" text-anchor="middle" font-size="14" fill="#102A43">formed</text>
<line x1="433" y1="190" x2="433" y2="240" stroke="#102A43" stroke-width="2"/>
<circle cx="433" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="433" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">1951</text>
<text x="433" y="282" text-anchor="middle" font-size="14" fill="#102A43">BDC founded</text>
<text x="433" y="300" text-anchor="middle" font-size="14" fill="#102A43">(Aujoulat)</text>
<line x1="510" y1="190" x2="510" y2="140" stroke="#102A43" stroke-width="2"/>
<circle cx="510" cy="190" r="7" fill="#ECFDF5" stroke="#102A43" stroke-width="3"/>
<text x="530" y="96" text-anchor="end" font-size="14" font-weight="700" fill="#102A43">Dec 1952</text>
<text x="530" y="116" text-anchor="end" font-size="14" fill="#102A43">Um Nyobè at</text>
<text x="530" y="134" text-anchor="end" font-size="14" fill="#102A43">the UN</text>
<text x="280" y="345" text-anchor="middle" font-size="14" fill="#102A43">Events are evenly spaced, not drawn to scale</text></svg>