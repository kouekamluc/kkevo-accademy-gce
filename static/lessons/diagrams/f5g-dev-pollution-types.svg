<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Types of pollution, sources and effects</title><defs><marker id="gAn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="gAb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="gAg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="gAa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320.0" y="26.0" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700">Four types of pollution</text><rect x="15.0" y="40.0" width="100.0" height="32.0" rx="0" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="65.0" y="61.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Type</text><rect x="115.0" y="40.0" width="245.0" height="32.0" rx="0" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="237.0" y="61.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Main sources</text><rect x="360.0" y="40.0" width="265.0" height="32.0" rx="0" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="492.0" y="61.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Main effects</text><rect x="15.0" y="72.0" width="100.0" height="74.0" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="65.0" y="115.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">AIR</text><rect x="115.0" y="72.0" width="245.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="122.0" y="106.0" font-size="13" text-anchor="start" fill="#102A43">Vehicle exhaust, factory smoke,</text><text x="122.0" y="126.0" font-size="13" text-anchor="start" fill="#102A43">gas flaring, bush burning</text><rect x="360.0" y="72.0" width="265.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="367.0" y="106.0" font-size="13" text-anchor="start" fill="#102A43">Breathing illness, acid rain,</text><text x="367.0" y="126.0" font-size="13" text-anchor="start" fill="#102A43">smog, global warming</text><rect x="15.0" y="146.0" width="100.0" height="74.0" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="65.0" y="189.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">WATER</text><rect x="115.0" y="146.0" width="245.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="122.0" y="180.0" font-size="13" text-anchor="start" fill="#102A43">Sewage, oil spills, chemicals,</text><text x="122.0" y="200.0" font-size="13" text-anchor="start" fill="#102A43">farm fertiliser, plastic waste</text><rect x="360.0" y="146.0" width="265.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="367.0" y="180.0" font-size="13" text-anchor="start" fill="#102A43">Dead fish, unsafe drinking water,</text><text x="367.0" y="200.0" font-size="13" text-anchor="start" fill="#102A43">water-borne diseases</text><rect x="15.0" y="220.0" width="100.0" height="74.0" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="65.0" y="263.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">SOIL</text><rect x="115.0" y="220.0" width="245.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="122.0" y="254.0" font-size="13" text-anchor="start" fill="#102A43">Rubbish dumps, pesticides,</text><text x="122.0" y="274.0" font-size="13" text-anchor="start" fill="#102A43">mining waste, oil spills</text><rect x="360.0" y="220.0" width="265.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="367.0" y="254.0" font-size="13" text-anchor="start" fill="#102A43">Poor crops, poisoned food and</text><text x="367.0" y="274.0" font-size="13" text-anchor="start" fill="#102A43">groundwater, lost fertility</text><rect x="15.0" y="294.0" width="100.0" height="74.0" rx="0" fill="#EFF6FF" stroke="#64748B" stroke-width="2"/><text x="65.0" y="337.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">NOISE</text><rect x="115.0" y="294.0" width="245.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="122.0" y="328.0" font-size="13" text-anchor="start" fill="#102A43">Traffic, loud music, generators,</text><text x="122.0" y="348.0" font-size="13" text-anchor="start" fill="#102A43">factories, aircraft</text><rect x="360.0" y="294.0" width="265.0" height="74.0" rx="0" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="367.0" y="328.0" font-size="13" text-anchor="start" fill="#102A43">Stress, poor sleep, hearing</text><text x="367.0" y="348.0" font-size="13" text-anchor="start" fill="#102A43">loss, disturbed wildlife</text><text x="320.0" y="392.0" font-size="13" text-anchor="middle" fill="#102A43">Pollution = harmful substances or energy added to the environment.</text></svg>