<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Inter, Arial, sans-serif">
<title>Timeline of political liberalization in Cameroon, 1990 to 1992</title>
<rect width="560" height="300" fill="#FFFFFF"/>
<line x1="20" y1="150" x2="540" y2="150" stroke="#102A43" stroke-width="3"/>
<text x="540" y="172" font-size="14" fill="#102A43" text-anchor="end">time</text>
<line x1="50" y1="116" x2="50" y2="150" stroke="#2563EB" stroke-width="2"/>
<rect x="8" y="36" width="121" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="69" y="60" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">26 May 1990</text>
<text x="69" y="82" font-size="14" fill="#102A43" text-anchor="middle">SDF launched</text>
<text x="69" y="104" font-size="14" fill="#102A43" text-anchor="middle">in Bamenda</text>
<circle cx="50" cy="150" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<line x1="160" y1="150" x2="160" y2="184" stroke="#2563EB" stroke-width="2"/>
<rect x="102" y="184" width="116" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="160" y="208" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Dec 1990</text>
<text x="160" y="230" font-size="14" fill="#102A43" text-anchor="middle">Liberty laws</text>
<text x="160" y="252" font-size="14" fill="#102A43" text-anchor="middle">passed</text>
<circle cx="160" cy="150" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<line x1="275" y1="116" x2="275" y2="150" stroke="#2563EB" stroke-width="2"/>
<rect x="221" y="36" width="108" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="275" y="60" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">1991</text>
<text x="275" y="82" font-size="14" fill="#102A43" text-anchor="middle">Ghost towns</text>
<text x="275" y="104" font-size="14" fill="#102A43" text-anchor="middle">campaign</text>
<circle cx="275" cy="150" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<line x1="385" y1="150" x2="385" y2="184" stroke="#2563EB" stroke-width="2"/>
<rect x="320" y="184" width="130" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="385" y="208" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">Oct-Nov 1991</text>
<text x="385" y="230" font-size="14" fill="#102A43" text-anchor="middle">Tripartite</text>
<text x="385" y="252" font-size="14" fill="#102A43" text-anchor="middle">Conference</text>
<circle cx="385" cy="150" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<line x1="500" y1="116" x2="500" y2="150" stroke="#047857" stroke-width="2"/>
<rect x="450" y="36" width="100" height="80" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="500" y="60" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">1992</text>
<text x="500" y="82" font-size="14" fill="#102A43" text-anchor="middle">Multiparty</text>
<text x="500" y="104" font-size="14" fill="#102A43" text-anchor="middle">elections</text>
<circle cx="500" cy="150" r="8" fill="#047857" stroke="#FFFFFF" stroke-width="2"/>
<text x="20" y="290" font-size="14" fill="#102A43">Not drawn to scale</text>
</svg>