<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>Alarm circuit for Q equals (W OR D) AND A</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><path d="M150 80 Q184 80 210 102 Q184 124 150 124 Q164 102 150 80Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><path d="M350 150 H380 A22 22 0 0 1 380 194 H350 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><path d="M60 91 L150 91" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M60 113 L150 113" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="45" y="97" font-size="18" text-anchor="middle" fill="#102A43" font-weight="bold">W</text><text x="45" y="119" font-size="18" text-anchor="middle" fill="#102A43" font-weight="bold">D</text><path d="M210 102 L290 102 L290 161 L350 161" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><path d="M60 205 L300 205 L300 183 L350 183" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="45" y="211" font-size="18" text-anchor="middle" fill="#102A43" font-weight="bold">A</text><path d="M402 172 L500 172" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><text x="520" y="178" font-size="18" text-anchor="middle" fill="#047857" font-weight="bold">Q</text><text x="180" y="150" font-size="14" text-anchor="middle" fill="#2563EB">OR</text><text x="380" y="220" font-size="14" text-anchor="middle" fill="#2563EB">AND</text><text x="265" y="94" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="bold">X</text><text x="280" y="310" font-size="15" text-anchor="middle" fill="#047857" font-weight="bold">X = W OR D     Q = X AND A</text><text x="280" y="335" font-size="14" text-anchor="middle" fill="#102A43">W window sensor, D door sensor, A alarm armed</text></svg>