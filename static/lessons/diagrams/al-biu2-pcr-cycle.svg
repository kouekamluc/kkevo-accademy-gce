<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><text x="280" y="24" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" >One cycle of the polymerase chain reaction</text><rect x="5" y="44" width="160" height="210" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="85" y="72" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700" >Denature</text><text x="85" y="94" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700" >95&#176;C</text><text x="85" y="238" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Strands separate</text><rect x="200" y="44" width="160" height="210" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="72" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700" >Anneal</text><text x="280" y="94" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700" >55&#176;C</text><text x="280" y="238" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Primers bind</text><rect x="395" y="44" width="160" height="210" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="475" y="72" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700" >Extend</text><text x="475" y="94" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700" >72&#176;C</text><text x="475" y="238" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >Taq copies strands</text><line x1="40" y1="140" x2="130" y2="140" stroke="#102A43" stroke-width="4"/><line x1="40" y1="176" x2="130" y2="176" stroke="#2563EB" stroke-width="4"/><line x1="235" y1="140" x2="325" y2="140" stroke="#102A43" stroke-width="4"/><line x1="235" y1="176" x2="325" y2="176" stroke="#2563EB" stroke-width="4"/><line x1="240" y1="150" x2="262" y2="150" stroke="#047857" stroke-width="5"/><line x1="298" y1="166" x2="320" y2="166" stroke="#047857" stroke-width="5"/><text x="251" y="128" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" >primer</text><text x="309" y="198" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" >primer</text><line x1="430" y1="140" x2="520" y2="140" stroke="#102A43" stroke-width="4"/><line x1="430" y1="176" x2="520" y2="176" stroke="#2563EB" stroke-width="4"/><line x1="440" y1="150" x2="516" y2="150" stroke="#047857" stroke-width="5"/><line x1="444" y1="166" x2="520" y2="166" stroke="#047857" stroke-width="5"/><line x1="166" y1="150" x2="194" y2="150" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/><line x1="362" y1="150" x2="390" y2="150" stroke="#102A43" stroke-width="3" marker-end="url(#ah)"/><text x="280" y="292" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >Each cycle doubles the target DNA</text><text x="280" y="316" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >After n cycles: 2 to the power n copies (ideal)</text></svg>