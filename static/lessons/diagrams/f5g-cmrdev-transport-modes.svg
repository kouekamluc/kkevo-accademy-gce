<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Transport systems in Cameroon</text><rect x="10" y="55" width="260" height="115" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="140" y="87" font-family="Inter, Arial, sans-serif" font-size="17" fill="#B45309" text-anchor="middle" font-weight="700">Road</text><text x="140" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">most goods and</text><text x="140" y="137" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">people move by road</text><rect x="285" y="55" width="260" height="115" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="415" y="87" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2563EB" text-anchor="middle" font-weight="700">Rail</text><text x="415" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">heavy goods, long</text><text x="415" y="137" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">trips, Douala to north</text><rect x="10" y="190" width="260" height="115" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="140" y="222" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2563EB" text-anchor="middle" font-weight="700">Water</text><text x="140" y="252" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">sea ports, rivers,</text><text x="140" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">coastal boats</text><rect x="285" y="190" width="260" height="115" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="415" y="222" font-family="Inter, Arial, sans-serif" font-size="17" fill="#047857" text-anchor="middle" font-weight="700">Air</text><text x="415" y="252" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">fast, costly,</text><text x="415" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">few airports</text><text x="280" y="340" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Pipelines and motorbike taxis also play a part.</text></svg>