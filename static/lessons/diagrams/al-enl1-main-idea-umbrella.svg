<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Main idea umbrella</title><desc id="d">An umbrella labelled main idea with three supporting details hanging below.</desc><rect width="560" height="360" fill="#FFFFFF"/><path d="M60 170 Q280 -10 500 170 Z" fill="#EFF6FF" stroke="#102A43" stroke-width="3"/><line x1="280" y1="22" x2="280" y2="60" stroke="#102A43" stroke-width="3"/><text x="280" y="118" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">MAIN IDEA</text><text x="280" y="145" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">the key point of the paragraph</text><line x1="130" y1="170" x2="130" y2="225" stroke="#102A43" stroke-width="3"/><rect x="65" y="225" width="130" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="130" y="251" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">Detail 1</text><text x="130" y="274" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">a reason</text><line x1="280" y1="170" x2="280" y2="225" stroke="#102A43" stroke-width="3"/><rect x="215" y="225" width="130" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="280" y="251" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">Detail 2</text><text x="280" y="274" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">an example</text><line x1="430" y1="170" x2="430" y2="225" stroke="#102A43" stroke-width="3"/><rect x="365" y="225" width="130" height="64" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="430" y="251" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">Detail 3</text><text x="430" y="274" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">a fact or number</text><text x="280" y="330" font-size="14" fill="#B45309" text-anchor="middle" font-family="Inter, Arial, sans-serif">Every major detail must fit under the main idea.</text></svg>