<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A concave mirror forms a real, inverted, smaller image of an object placed beyond the centre of curvature</title>
