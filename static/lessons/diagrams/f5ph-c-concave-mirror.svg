<line x1="140" y1="120" x2="140" y2="170" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<text x="140" y="106" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">object</text>
<line x1="338.3" y1="170" x2="338.3" y2="190.8" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
<text x="338.3" y="148" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">image</text>
<line x1="140" y1="120" x2="480" y2="120" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="319,120 302.1,124.3 302.1,115.7" fill="#2563EB"/>
<line x1="480" y1="120" x2="338.3" y2="190.8" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="120" x2="338.3" y2="190.8" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="408.2,155.9 421.4,144.5 425.2,152.2" fill="#2563EB"/>
<line x1="140" y1="120" x2="480" y2="241.4" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="318.5,183.7 301.1,182.1 304,174" fill="#B45309"/>
<circle cx="280" cy="170" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="280" y="190" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text>
<circle cx="380" cy="170" r="4" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="380" y="190" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">F</text>
<text x="280" y="330" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Object beyond C: image between F and C, real, inverted, smaller</text>
<text x="20" y="25" font-size="13" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">blue ray: parallel to axis, reflects through F</text>
<text x="20" y="45" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">amber ray: through C, reflects back along itself</text>
</svg>
