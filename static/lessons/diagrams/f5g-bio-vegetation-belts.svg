<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="640" height="400" fill="#fff"/><text x="320.0" y="24" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Idealised vegetation belts, northern hemisphere</text><rect x="80" y="306.7" width="400" height="33.3" fill="#86EFAC" stroke="#102A43" stroke-width="2"/><text x="280" y="328.3" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Tropical rainforest</text><rect x="80" y="273.3" width="400" height="33.3" fill="#FDE68A" stroke="#102A43" stroke-width="2"/><text x="280" y="295.0" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Tropical grassland (savanna)</text><rect x="80" y="240.0" width="400" height="33.3" fill="#FED7AA" stroke="#102A43" stroke-width="2"/><text x="280" y="261.7" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Hot desert</text><rect x="80" y="206.7" width="400" height="33.3" fill="#D9F99D" stroke="#102A43" stroke-width="2"/><text x="280" y="228.3" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Mediterranean scrub</text><rect x="80" y="156.7" width="400" height="50.0" fill="#6EE7B7" stroke="#102A43" stroke-width="2"/><text x="280" y="186.7" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Temperate forest and grassland</text><rect x="80" y="123.3" width="400" height="33.3" fill="#34D399" stroke="#102A43" stroke-width="2"/><text x="280" y="145.0" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Coniferous forest</text><rect x="80" y="73.3" width="400" height="50.0" fill="#CBD5E1" stroke="#102A43" stroke-width="2"/><text x="280" y="103.3" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Tundra</text><rect x="80" y="40.0" width="400" height="33.3" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="280" y="61.7" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Polar ice</text><line x1="68" y1="340.0" x2="92" y2="340.0" stroke="#2563EB" stroke-width="3"/><line x1="468" y1="340.0" x2="492" y2="340.0" stroke="#2563EB" stroke-width="3"/><line x1="68" y1="261.7" x2="92" y2="261.7" stroke="#2563EB" stroke-width="3"/><line x1="468" y1="261.7" x2="492" y2="261.7" stroke="#2563EB" stroke-width="3"/><line x1="68" y1="118.3" x2="92" y2="118.3" stroke="#2563EB" stroke-width="3"/><line x1="468" y1="118.3" x2="492" y2="118.3" stroke="#2563EB" stroke-width="3"/><text x="8" y="345.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="400">0</text><text x="6" y="266.7" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="400">23.5</text><text x="6" y="123.3" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="400">66.5</text><text x="8" y="45.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">90</text><text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" transform="translate(52,190) rotate(-90)" text-anchor="middle">Latitude (degrees N)</text><path d="M500,296.7 L510,296.7 L510,333.3 L500,333.3" stroke="#047857" stroke-width="3" fill="none"/><text x="518" y="311.0" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="start" font-weight="700">Cameroon</text><text x="518" y="327.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="400">(about 2 to</text><text x="518" y="343.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="400">13 degrees N)</text><text x="280" y="365" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">The southern hemisphere has a similar pattern, but with much less land</text><text x="280" y="383" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">in the high latitudes. Mountains and ocean currents break the pattern.</text></svg>