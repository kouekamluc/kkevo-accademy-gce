<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>The three operations of the mind and their products</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="10" y="20" width="160" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="90" y="50" text-anchor="middle" font-size="16" font-weight="700">1. Simple</text><text x="90" y="70" text-anchor="middle" font-size="16" font-weight="700">apprehension</text><line x1="90" y1="90" x2="90" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="100" y="122" font-size="13" fill="#2563EB">gives</text><rect x="10" y="142" width="160" height="60" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="90" y="177" text-anchor="middle" font-size="16" font-weight="700">Idea (term)</text><line x1="90" y1="202" x2="90" y2="252" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="100" y="234" font-size="13" fill="#B45309">example</text><rect x="10" y="254" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="90" y="304" text-anchor="middle" font-size="14">mango</text><rect x="200" y="20" width="160" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="60" text-anchor="middle" font-size="16" font-weight="700">2. Judging</text><line x1="280" y1="90" x2="280" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="290" y="122" font-size="13" fill="#2563EB">gives</text><rect x="200" y="142" width="160" height="60" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="177" text-anchor="middle" font-size="16" font-weight="700">Proposition</text><line x1="280" y1="202" x2="280" y2="252" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="290" y="234" font-size="13" fill="#B45309">example</text><rect x="200" y="254" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="280" y="294" text-anchor="middle" font-size="14">This mango</text><text x="280" y="314" text-anchor="middle" font-size="14">is ripe.</text><rect x="390" y="20" width="160" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="470" y="60" text-anchor="middle" font-size="16" font-weight="700">3. Reasoning</text><line x1="470" y1="90" x2="470" y2="140" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="480" y="122" font-size="13" fill="#2563EB">gives</text><rect x="390" y="142" width="160" height="60" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="470" y="177" text-anchor="middle" font-size="16" font-weight="700">Argument</text><line x1="470" y1="202" x2="470" y2="252" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="480" y="234" font-size="13" fill="#B45309">example</text><rect x="390" y="254" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="470" y="285" text-anchor="middle" font-size="14">Ripe fruit is sweet.</text><text x="470" y="304" text-anchor="middle" font-size="14">This mango is ripe.</text><text x="470" y="323" text-anchor="middle" font-size="14">So it is sweet.</text><line x1="172" y1="55" x2="198" y2="55" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="362" y1="55" x2="388" y2="55" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/></svg>