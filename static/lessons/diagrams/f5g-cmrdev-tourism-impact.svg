<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Impact of tourism</text><rect x="205" y="150" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="186" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">TOURISM</text><rect x="10" y="50" width="240" height="85" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="130" y="81" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Economy (positive):</text><text x="130" y="97" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">jobs, income, foreign exchange,</text><text x="130" y="113" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">markets for crafts and food</text><rect x="310" y="50" width="240" height="85" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="430" y="81" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Environment (positive):</text><text x="430" y="97" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">pays for parks and reserves,</text><text x="430" y="113" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">gives a reason to protect nature</text><rect x="10" y="225" width="240" height="85" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="130" y="256" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Economy (negative):</text><text x="130" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">prices rise, money may leave</text><text x="130" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">the area, jobs are seasonal</text><rect x="310" y="225" width="240" height="85" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="430" y="256" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Environment (negative):</text><text x="430" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">litter, damaged trails and</text><text x="430" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">beaches, disturbed wildlife</text><line x1="230" y1="150" x2="169.8" y2="137.1" stroke="#102A43" stroke-width="2"/><polygon points="160,135 168.7,142.0 170.8,132.2" fill="#102A43"/><line x1="330" y1="150" x2="390.2" y2="137.1" stroke="#102A43" stroke-width="2"/><polygon points="400,135 389.2,132.2 391.3,142.0" fill="#102A43"/><line x1="230" y1="210" x2="169.8" y2="222.9" stroke="#102A43" stroke-width="2"/><polygon points="160,225 170.8,227.8 168.7,218.0" fill="#102A43"/><line x1="330" y1="210" x2="390.2" y2="222.9" stroke="#102A43" stroke-width="2"/><polygon points="400,225 391.3,218.0 389.2,227.8" fill="#102A43"/><text x="280" y="345" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Good management keeps the gains and reduces the harm.</text></svg>