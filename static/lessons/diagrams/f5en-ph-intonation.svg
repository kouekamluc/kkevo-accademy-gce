<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Three pitch contours: a statement that falls, a yes or no question that rises, and a list that rises on each item and falls on the last">
<rect width="560" height="360" fill="#fff"/>
<rect x="12" y="8" width="536" height="104" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="26" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">1  Statement: the voice falls at the end</text>
<polyline points="70,64 150,52 225,64 305,42 355,86" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">She</text>
<text x="150" y="106" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">lives</text>
<text x="225" y="106" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">in</text>
<text x="330" y="106" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">TOWN</text>
<rect x="12" y="120" width="536" height="104" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="26" y="142" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">2  Yes/no question: the voice rises at the end</text>
<polyline points="60,182 125,182 190,172 255,182 310,190 365,150" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="218" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">Does</text>
<text x="125" y="218" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">she</text>
<text x="190" y="218" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">live</text>
<text x="255" y="218" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">in</text>
<text x="335" y="218" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">TOWN</text>
<rect x="12" y="232" width="536" height="104" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="26" y="254" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">3  List: rise, rise, rise, then fall on the last item</text>
<polyline points="48,298 92,268 150,298 192,268 250,298 292,268 345,284 398,262 442,310" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="70" y="330" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">rice</text>
<text x="170" y="330" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">beans</text>
<text x="270" y="330" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">fish</text>
<text x="345" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle">and</text>
<text x="420" y="330" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">YAM</text>
<text x="26" y="354" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Orange words carry the main pitch movement. The blue line is the pitch of the voice.</text>
</svg>