<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>OSI layers mapped to TCP/IP layers</title><defs><marker id="otn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="otb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="otg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="390" fill="#FFFFFF"/><text x="130" y="38" font-size="18" text-anchor="middle" font-weight="bold" fill="#102A43">OSI model</text><text x="410" y="38" font-size="18" text-anchor="middle" font-weight="bold" fill="#2563EB">TCP/IP model</text><rect x="40" y="55" width="180" height="46" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="56" y="84" font-size="16" fill="#102A43">7  Application</text><rect x="40" y="101" width="180" height="46" rx="0" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="56" y="130" font-size="16" fill="#102A43">6  Presentation</text><rect x="40" y="147" width="180" height="46" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="56" y="176" font-size="16" fill="#102A43">5  Session</text><rect x="40" y="193" width="180" height="46" rx="0" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="56" y="222" font-size="16" fill="#102A43">4  Transport</text><rect x="40" y="239" width="180" height="46" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="56" y="268" font-size="16" fill="#102A43">3  Network</text><rect x="40" y="285" width="180" height="46" rx="0" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="56" y="314" font-size="16" fill="#102A43">2  Data link</text><rect x="40" y="331" width="180" height="46" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="56" y="360" font-size="16" fill="#102A43">1  Physical</text><rect x="300" y="55" width="220" height="138" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="410" y="121.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#102A43">Application</text><text x="410" y="141.0" font-size="14" text-anchor="middle" fill="#475569">HTTP, DNS, SMTP, FTP</text><path d="M226 124.0 L294 124.0" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#otn)"/><rect x="300" y="193" width="220" height="46" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="410" y="213.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#102A43">Transport</text><text x="410" y="233.0" font-size="14" text-anchor="middle" fill="#475569">TCP, UDP</text><path d="M226 216.0 L294 216.0" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#otn)"/><rect x="300" y="239" width="220" height="46" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="410" y="259.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#102A43">Internet</text><text x="410" y="279.0" font-size="14" text-anchor="middle" fill="#475569">IP, ICMP</text><path d="M226 262.0 L294 262.0" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#otn)"/><rect x="300" y="285" width="220" height="92" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="410" y="328.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#102A43">Network access (link)</text><text x="410" y="348.0" font-size="14" text-anchor="middle" fill="#475569">Ethernet, Wi-Fi</text><path d="M226 331.0 L294 331.0" fill="none" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#otn)"/></svg>
