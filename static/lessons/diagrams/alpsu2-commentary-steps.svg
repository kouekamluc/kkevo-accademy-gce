<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Six steps of a text commentary</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="14" y="30" width="170" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="99.0" y="65.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">1 Situate</text><text x="99.0" y="84.9" text-anchor="middle" font-size="14" fill="#102A43">author, type,</text><text x="99.0" y="103.9" text-anchor="middle" font-size="14" fill="#102A43">context</text><line x1="184" y1="80" x2="196" y2="80" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="196" y="30" width="170" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="281.0" y="65.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">2 Theme</text><text x="281.0" y="84.9" text-anchor="middle" font-size="14" fill="#102A43">general</text><text x="281.0" y="103.9" text-anchor="middle" font-size="14" fill="#102A43">subject</text><line x1="366" y1="80" x2="378" y2="80" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="30" width="170" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="463.0" y="65.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">3 Problem</text><text x="463.0" y="84.9" text-anchor="middle" font-size="14" fill="#102A43">the question</text><text x="463.0" y="103.9" text-anchor="middle" font-size="14" fill="#102A43">asked</text><rect x="14" y="170" width="170" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="99.0" y="205.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">4 Thesis</text><text x="99.0" y="224.9" text-anchor="middle" font-size="14" fill="#102A43">the author's</text><text x="99.0" y="243.9" text-anchor="middle" font-size="14" fill="#102A43">answer</text><line x1="184" y1="220" x2="196" y2="220" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="196" y="170" width="170" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="281.0" y="205.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">5 Structure</text><text x="281.0" y="224.9" text-anchor="middle" font-size="14" fill="#102A43">premises and</text><text x="281.0" y="243.9" text-anchor="middle" font-size="14" fill="#102A43">conclusions</text><line x1="366" y1="220" x2="378" y2="220" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="170" width="170" height="100" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="463.0" y="205.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">6 Critique</text><text x="463.0" y="224.9" text-anchor="middle" font-size="14" fill="#102A43">internal, external,</text><text x="463.0" y="243.9" text-anchor="middle" font-size="14" fill="#102A43">judgement</text><text x="280" y="335" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Anchor each point to lines of the text</text></svg>