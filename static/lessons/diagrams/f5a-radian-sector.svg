<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Sector of a circle: radius r, angle theta at the centre, arc length s, and the segment between the chord and the arc</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<path d="M190,260 L387.0,225.3 A200,200 0 0 0 241.8,66.8 Z" fill="#EFF6FF" stroke="none"/>
<path d="M387.0,225.3 A200,200 0 0 0 241.8,66.8 Z" fill="#ECFDF5" stroke="#047857" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="190.0" y1="260.0" x2="387.0" y2="225.3" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="190.0" y1="260.0" x2="241.8" y2="66.8" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<path d="M387.0,225.3 A200,200 0 0 0 241.8,66.8" fill="none" stroke="#2563EB" stroke-width="4"/>
<path d="M237.3,251.7 A48,48 0 0 0 202.4,213.6" fill="none" stroke="#102A43" stroke-width="2.5"/>
<text x="240.1" y="214.1" font-size="19" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">θ</text>
<text x="292.5" y="260.6" font-size="19" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">r</text>
<text x="197.9" y="161.4" font-size="19" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">r</text>
<text x="376.5" y="101.9" font-size="18" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">arc s = rθ</text>
<line x1="327.1" y1="134.3" x2="405.0" y2="168.0" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<text x="410.0" y="178.0" font-size="16" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">segment</text>
<circle cx="190.0" cy="260.0" r="4" fill="#102A43"/>
<text x="174.0" y="266.0" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">O</text>
<text x="450.0" y="296.0" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Sector area = ½r²θ</text>
<text x="450.0" y="324.0" font-size="15" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="600">(θ in radians)</text>
</svg>