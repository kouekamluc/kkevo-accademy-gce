<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="93" y="30" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Over water</text>
<rect x="15" y="225" width="156" height="85" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<rect x="17" y="245" width="152" height="63" fill="#BFDBFE"/>
<rect x="63" y="130" width="60" height="150" fill="#ffffff" stroke="#102A43" stroke-width="2.5"/>
<rect x="65" y="132" width="56" height="52" fill="#ECFDF5"/>
<rect x="65" y="245" width="56" height="33" fill="#BFDBFE"/>
<path d="M3 70 L3 295 L93 295 L93 190" fill="none" stroke="#102A43" stroke-width="3"/>
<text x="93" y="120" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">Gas</text>
<text x="93" y="335" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Insoluble gas:</text>
<text x="93" y="352" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">H2, O2</text>
<text x="280" y="30" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Downward delivery</text>
<rect x="250" y="150" width="60" height="140" fill="#ffffff" stroke="#102A43" stroke-width="2.5"/>
<rect x="252" y="215" width="56" height="73" fill="#ECFDF5"/>
<path d="M190 80 L280 80 L280 270" fill="none" stroke="#102A43" stroke-width="3"/>
<line x1="297" y1="140" x2="297" y2="118" stroke="#B45309" stroke-width="3"/>
<polygon points="297,110 291,124 303,124" fill="#B45309"/>
<text x="317" y="125" font-size="13" fill="#B45309" text-anchor="start" font-weight="400">air out</text>
<text x="280" y="335" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Gas denser than air:</text>
<text x="280" y="352" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">CO2, Cl2, HCl</text>
<text x="466" y="30" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Upward delivery</text>
<rect x="436" y="110" width="60" height="140" fill="#ffffff" stroke="#102A43" stroke-width="2.5"/>
<rect x="438" y="112" width="56" height="70" fill="#ECFDF5"/>
<path d="M376 300 L466 300 L466 125" fill="none" stroke="#102A43" stroke-width="3"/>
<line x1="523" y1="200" x2="523" y2="260" stroke="#B45309" stroke-width="3"/>
<polygon points="523,268 517,254 529,254" fill="#B45309"/>
<text x="528" y="190" font-size="13" fill="#B45309" text-anchor="middle" font-weight="400">air out</text>
<text x="466" y="335" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Gas lighter than air:</text>
<text x="466" y="352" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">NH3</text>
</svg>
