<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#102A43" font-weight="bold">Food tests: reagent and positive result</text><rect x="20" y="48" width="520" height="34" fill="#2563EB"/><text x="95" y="70" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Nutrient</text><text x="265" y="70" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Test</text><text x="455" y="70" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Positive result</text><rect x="20" y="82" width="520" height="46" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95" y="110" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Starch</text><text x="265" y="110" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Iodine solution</text><text x="455" y="110" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Yellow-brown to black</text><rect x="20" y="128" width="520" height="46" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="95" y="156" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Reducing sugar</text><text x="265" y="156" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Benedict's, heat</text><text x="455" y="148" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Blue to green, yellow,</text><text x="455" y="165" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">orange, brick-red</text><rect x="20" y="174" width="520" height="46" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95" y="202" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Non-reducing sugar</text><text x="265" y="194" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Boil with dilute HCl,</text><text x="265" y="211" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">neutralise, then Benedict's</text><text x="455" y="194" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Brick-red only after</text><text x="455" y="211" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">hydrolysis</text><rect x="20" y="220" width="520" height="46" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="95" y="248" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Protein</text><text x="265" y="240" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Biuret: NaOH, then drops of</text><text x="265" y="257" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">copper sulphate</text><text x="455" y="248" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Blue to violet or purple</text><rect x="20" y="266" width="520" height="46" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95" y="294" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Fat or oil</text><text x="265" y="294" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Ethanol, then add water</text><text x="455" y="294" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Cloudy white emulsion</text><rect x="20" y="312" width="520" height="46" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="95" y="340" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Vitamin C</text><text x="265" y="340" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">DCPIP solution</text><text x="455" y="340" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#047857" font-weight="normal">Blue DCPIP is decolourised</text><line x1="170" y1="82" x2="170" y2="358" stroke="#102A43" stroke-width="2"/></svg>