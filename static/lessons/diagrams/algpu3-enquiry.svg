<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="28.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">The route of a geographical enquiry</text><rect x="30" y="60" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="105.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">1. Aim and</text><text x="105.0" y="110.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">hypotheses</text><rect x="210" y="60" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="285.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">2. Site and</text><text x="285.0" y="110.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">sampling</text><rect x="390" y="60" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465.0" y="101.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">3. Data collection</text><rect x="390" y="220" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465.0" y="251.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">4. Processing and</text><text x="465.0" y="270.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">presentation</text><rect x="210" y="220" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="285.0" y="251.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">5. Analysis and</text><text x="285.0" y="270.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">tests</text><rect x="30" y="220" width="150" height="70" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="105.0" y="251.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">6. Conclusion and</text><text x="105.0" y="270.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#102A43">evaluation</text><line x1="180.0" y1="95.0" x2="210.0" y2="95.0" stroke="#2563EB" stroke-width="3"/><polygon points="200,89 200,101 210,95" fill="#2563EB"/><line x1="360.0" y1="95.0" x2="390.0" y2="95.0" stroke="#2563EB" stroke-width="3"/><polygon points="380,89 380,101 390,95" fill="#2563EB"/><line x1="465.0" y1="130.0" x2="465.0" y2="220.0" stroke="#2563EB" stroke-width="3"/><polygon points="459,210 471,210 465,220" fill="#2563EB"/><line x1="390.0" y1="255.0" x2="360.0" y2="255.0" stroke="#2563EB" stroke-width="3"/><polygon points="370,249 370,261 360,255" fill="#2563EB"/><line x1="210.0" y1="255.0" x2="180.0" y2="255.0" stroke="#2563EB" stroke-width="3"/><polygon points="190,249 190,261 180,255" fill="#2563EB"/><line x1="105.0" y1="220.0" x2="105.0" y2="130.0" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/><polygon points="99,140 111,140 105,130" fill="#B45309"/><text x="115.0" y="180.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#B45309">Results tested against the hypothesis</text><text x="280.0" y="330.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Risk assessment and permission come before step 3</text></svg>