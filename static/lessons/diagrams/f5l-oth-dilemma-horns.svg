<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#102A43"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#ffffff"/>
  <rect x="170" y="20" width="220" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="280" y="42" text-anchor="middle" font-size="15" fill="#102A43">Choice: p or r</text>
  <text x="280" y="60" text-anchor="middle" font-size="13" fill="#102A43">(the disjunction)</text>
  <line x1="240" y1="68" x2="130" y2="150" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="68" x2="430" y2="150" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="122" text-anchor="end" font-size="14" fill="#B45309">horn 1: if p then q</text>
  <text x="410" y="122" text-anchor="start" font-size="14" fill="#B45309">horn 2: if r then s</text>
  <rect x="60" y="155" width="140" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
  <text x="130" y="185" text-anchor="middle" font-size="16" fill="#102A43">result q</text>
  <rect x="360" y="155" width="140" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
  <text x="430" y="185" text-anchor="middle" font-size="16" fill="#102A43">result s</text>
  <line x1="130" y1="203" x2="240" y2="270" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="203" x2="320" y2="270" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/>
  <rect x="150" y="275" width="260" height="56" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
  <text x="280" y="300" text-anchor="middle" font-size="16" fill="#047857">Conclusion: q or s</text>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#047857">one unwelcome result either way</text>
</svg>
