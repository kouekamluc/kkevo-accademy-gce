<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<text x="145" y="28" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Seven signs</text>
<text x="415" y="28" font-size="16" font-weight="bold" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Seven I am sayings</text>
<rect x="15" y="42" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="27" y="63" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">1. Water into wine (2:1-11)</text>
<rect x="285" y="42" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="297" y="63" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Bread of life (6:35)</text>
<rect x="15" y="80" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="27" y="101" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">2. Official's son (4:46-54)</text>
<rect x="285" y="80" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="297" y="101" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Light of the world (8:12)</text>
<rect x="15" y="118" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="27" y="139" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">3. Paralysed man (5:1-15)</text>
<rect x="285" y="118" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="297" y="139" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">The door (10:7, 9)</text>
<rect x="15" y="156" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="27" y="177" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">4. Five thousand fed (6:1-14)</text>
<rect x="285" y="156" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="297" y="177" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">The good shepherd (10:11)</text>
<rect x="15" y="194" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="27" y="215" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">5. Walking on water (6:16-21)</text>
<rect x="285" y="194" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="297" y="215" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Resurrection and life (11:25)</text>
<rect x="15" y="232" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="27" y="253" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">6. Man born blind (9:1-41)</text>
<rect x="285" y="232" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="297" y="253" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">Way, truth, life (14:6)</text>
<rect x="15" y="270" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="27" y="291" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">7. Lazarus raised (11:1-44)</text>
<rect x="285" y="270" width="260" height="32" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="297" y="291" font-size="14" font-weight="normal" fill="#102A43" text-anchor="start" font-family="Inter, Arial, sans-serif">The true vine (15:1)</text>
<text x="280" y="328" font-size="13" font-weight="normal" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Blue border: the sign and the saying are linked in the text.</text>
<text x="280" y="348" font-size="13" font-weight="normal" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">Feeding and bread; blind man and light; Lazarus and life.</text>
</svg>
