<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="215" y="150" width="130" height="60" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280.0" y="168.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Blood glucose</text><text x="280.0" y="184.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >about 4 to 6</text><text x="280.0" y="200.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >mmol per litre</text><rect x="10" y="10" width="170" height="40" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95.0" y="26.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >High blood glucose</text><text x="95.0" y="42.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >(after a meal)</text><rect x="10" y="80" width="170" height="44" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95.0" y="98.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Beta cells in pancreas</text><text x="95.0" y="114.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >release INSULIN</text><rect x="10" y="156" width="170" height="62" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95.0" y="175.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Liver, muscle and fat cells</text><text x="95.0" y="191.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >take up glucose; glycogen</text><text x="95.0" y="207.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >and fat are made</text><line x1="95" y1="50" x2="95" y2="80" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="95" y1="124" x2="95" y2="156" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="180" y1="187" x2="215" y2="180" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><rect x="380" y="10" width="170" height="40" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465.0" y="26.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Low blood glucose</text><text x="465.0" y="42.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >(fasting, exercise)</text><rect x="380" y="80" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="465.0" y="98.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Alpha cells in pancreas</text><text x="465.0" y="114.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >release GLUCAGON</text><rect x="380" y="156" width="170" height="62" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465.0" y="175.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Liver: glycogen breakdown</text><text x="465.0" y="191.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >and gluconeogenesis</text><text x="465.0" y="207.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >release glucose</text><line x1="465" y1="50" x2="465" y2="80" stroke="#B45309" stroke-width="2" marker-end="url(#m)"/><line x1="465" y1="124" x2="465" y2="156" stroke="#B45309" stroke-width="2" marker-end="url(#m)"/><line x1="380" y1="187" x2="345" y2="180" stroke="#B45309" stroke-width="2" marker-end="url(#m)"/><text x="95" y="250" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="bold" >glucose FALLS</text><text x="465" y="250" font-size="13" text-anchor="middle" fill="#B45309" font-weight="bold" >glucose RISES</text><text x="280" y="300" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Negative feedback: each hormone reverses</text><text x="280" y="320" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >the change that triggered its release.</text></svg>