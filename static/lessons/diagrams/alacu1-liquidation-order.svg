<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img" aria-label="Order of payments in the liquidation of a company">
<title>Order of payments in the liquidation of a company</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Liquidation: order in which the cash is used</text>
<rect x="70" y="44" width="420" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="71.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">1. Liquidation costs</text>
<rect x="70" y="104" width="420" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="122.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">2. Preferential and secured creditors</text>
<text x="280.0" y="140.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">e.g. staff, State, secured lenders</text>
<line x1="280.0" y1="90" x2="280.0" y2="103" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="164" width="420" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="191.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">3. Ordinary creditors</text>
<line x1="280.0" y1="150" x2="280.0" y2="163" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="224" width="420" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="242.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">4. Repay shareholders' capital</text>
<text x="280.0" y="260.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">paid-up, not yet amortized</text>
<line x1="280.0" y1="210" x2="280.0" y2="223" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="284" width="420" height="46" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="302.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="bold">5. Liquidation surplus (boni)</text>
<text x="280.0" y="320.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">shared among shares as the statutes say</text>
<line x1="280.0" y1="270" x2="280.0" y2="283" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
</svg>
