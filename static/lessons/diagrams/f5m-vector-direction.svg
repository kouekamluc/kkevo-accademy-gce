<text x="350.0" y="300.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">E</text>
<text x="90.0" y="82.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<polyline points="90,300 298,300 298,144" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
