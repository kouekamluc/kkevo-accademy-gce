<text x="115.9" y="244.1" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">β</text>
<text x="360.0" y="60.0" font-size="17" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">OP =</text>
<text x="426.0" y="49.0" font-size="16" fill="#047857" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="426.0" y="71.0" font-size="16" fill="#047857" text-anchor="middle" dominant-baseline="middle">3</text>
<path d="M416.0,38.0 Q409.0,60.0 416.0,82.0" fill="none" stroke="#047857" stroke-width="2"/>
<path d="M436.0,38.0 Q443.0,60.0 436.0,82.0" fill="none" stroke="#047857" stroke-width="2"/>
<text x="360.0" y="120.0" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">|OP| = √(4² + 3²) = 5</text>
<text x="360.0" y="160.0" font-size="15" fill="#2563EB" text-anchor="start" dominant-baseline="middle">tan θ = 3 ÷ 4</text>
<text x="360.0" y="184.0" font-size="15" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">θ = 36.9° (from east)</text>
<text x="360.0" y="224.0" font-size="15" fill="#102A43" text-anchor="start" dominant-baseline="middle">β = 90° − 36.9° = 53.1°</text>
<text x="360.0" y="248.0" font-size="15" fill="#102A43" text-anchor="start" dominant-baseline="middle">Bearing of P from O</text>
<text x="360.0" y="272.0" font-size="15" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">= 053.1°</text>
