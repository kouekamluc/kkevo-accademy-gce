<line x1="90.0" y1="300.0" x2="287.6" y2="151.8" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
<polygon points="298.0,144.0 291.1,156.5 284.1,147.1" fill="#047857"/>
<text x="180.0" y="206.0" font-size="17" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">5</text>
<circle cx="90" cy="300" r="4" fill="#102A43"/>
<text x="76.0" y="314.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">O</text>
<text x="312.0" y="132.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">P</text>
