<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="24" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Two methods of conserving soil on slopes</text><text x="135" y="50" font-family="Inter, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">A. Terracing (side view)</text><polygon points="20,310 20,270 66,270 66,230 112,230 112,190 158,190 158,150 204,150 204,110 250,110 250,310" fill="#FDE68A" stroke="#102A43" stroke-width="2"/><line x1="28" y1="270" x2="58" y2="270" stroke="#047857" stroke-width="4"/><line x1="34" y1="270" x2="34" y2="256" stroke="#047857" stroke-width="3"/><line x1="50" y1="270" x2="50" y2="256" stroke="#047857" stroke-width="3"/><line x1="74" y1="230" x2="104" y2="230" stroke="#047857" stroke-width="4"/><line x1="80" y1="230" x2="80" y2="216" stroke="#047857" stroke-width="3"/><line x1="96" y1="230" x2="96" y2="216" stroke="#047857" stroke-width="3"/><line x1="120" y1="190" x2="150" y2="190" stroke="#047857" stroke-width="4"/><line x1="126" y1="190" x2="126" y2="176" stroke="#047857" stroke-width="3"/><line x1="142" y1="190" x2="142" y2="176" stroke="#047857" stroke-width="3"/><line x1="166" y1="150" x2="196" y2="150" stroke="#047857" stroke-width="4"/><line x1="172" y1="150" x2="172" y2="136" stroke="#047857" stroke-width="3"/><line x1="188" y1="150" x2="188" y2="136" stroke="#047857" stroke-width="3"/><line x1="212" y1="110" x2="242" y2="110" stroke="#047857" stroke-width="4"/><line x1="218" y1="110" x2="218" y2="96" stroke="#047857" stroke-width="3"/><line x1="234" y1="110" x2="234" y2="96" stroke="#047857" stroke-width="3"/><text x="135" y="335" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Flat steps slow the water down</text><text x="420" y="50" font-family="Inter, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">B. Contour ploughing (from above)</text><ellipse cx="420" cy="175" rx="120" ry="90" fill="#ECFDF5" stroke="#B45309" stroke-width="2" stroke-dasharray="0"/><ellipse cx="420" cy="175" rx="90" ry="66" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="0"/><ellipse cx="420" cy="175" rx="60" ry="42" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="0"/><ellipse cx="420" cy="175" rx="30" ry="18" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="0"/><text x="420" y="180" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Hilltop</text><line x1="505" y1="130" x2="505" y2="185" stroke="#2563EB" stroke-width="3" marker-end="url(#arb)" stroke-dasharray="6 4"/><text x="420" y="305" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Furrows follow the contour lines,</text><text x="420" y="323" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">so water is held and soaks in</text><text x="420" y="341" font-family="Inter, Arial, sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="400">Brown rings are contour lines</text></svg>