<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="25.0" y="42.0" width="150.0" height="56.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="67.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Stimulus</text><text x="100.0" y="85.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">variable moves away</text><rect x="205.0" y="42.0" width="150.0" height="56.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="67.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Receptor</text><text x="280.0" y="85.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">detects the change</text><rect x="385.0" y="42.0" width="150.0" height="56.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="460.0" y="67.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Control centre</text><text x="460.0" y="85.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">compares with target</text><rect x="385.0" y="182.0" width="150.0" height="56.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="460.0" y="207.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Effector</text><text x="460.0" y="225.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">muscle or gland</text><rect x="205.0" y="182.0" width="150.0" height="56.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="207.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Response</text><text x="280.0" y="225.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">acts to reverse change</text><rect x="25.0" y="182.0" width="150.0" height="56.0" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="207.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Variable returns</text><text x="100.0" y="225.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">towards set point</text><line x1="175.0" y1="70.0" x2="203.0" y2="70.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="355.0" y1="70.0" x2="383.0" y2="70.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="460.0" y1="98.0" x2="460.0" y2="182.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="385.0" y1="210.0" x2="357.0" y2="210.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="205.0" y1="210.0" x2="177.0" y2="210.0" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="100.0" y1="182.0" x2="100.0" y2="98.0" stroke="#B45309" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#m)"/><text x="112.0" y="140.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Negative</text><text x="112.0" y="156.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">feedback</text><text x="280.0" y="300.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">The response reduces the original stimulus.</text><text x="280.0" y="322.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">The loop keeps the variable close to its set point.</text></svg>