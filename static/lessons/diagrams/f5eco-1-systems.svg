<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><text x="280" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Who answers: what, how and for whom?</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#047857"/></linearGradient></defs><rect x="50" y="150" width="460" height="14" rx="7" fill="url(#g)"/><text x="50" y="134" text-anchor="start" font-size="14" font-weight="600" fill="#2563EB" font-family="Inter, Arial, sans-serif">Private individuals decide</text><text x="510" y="134" text-anchor="end" font-size="14" font-weight="600" fill="#047857" font-family="Inter, Arial, sans-serif">The state decides</text><circle cx="100" cy="157" r="9" fill="#2563EB" stroke="#fff" stroke-width="2"/><rect x="30" y="190" width="140" height="84" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB" font-family="Inter, Arial, sans-serif">Market</text><text x="100" y="242" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">Prices and</text><text x="100" y="262" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">profit decide</text><circle cx="280" cy="157" r="9" fill="#B45309" stroke="#fff" stroke-width="2"/><rect x="210" y="190" width="140" height="84" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="280" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#B45309" font-family="Inter, Arial, sans-serif">Mixed</text><text x="280" y="242" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">Prices and</text><text x="280" y="262" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">government</text><circle cx="460" cy="157" r="9" fill="#047857" stroke="#fff" stroke-width="2"/><rect x="390" y="190" width="140" height="84" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="460" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#047857" font-family="Inter, Arial, sans-serif">Planned</text><text x="460" y="242" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">Central plan</text><text x="460" y="262" text-anchor="middle" font-size="14" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">decides</text><rect x="150" y="62" width="260" height="46" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43" font-family="Inter, Arial, sans-serif">Traditional: custom decides</text><text x="280" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#102A43" font-family="Inter, Arial, sans-serif">Family and elders, inherited methods</text><text x="280" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#102A43" font-family="Inter, Arial, sans-serif">Most real economies, including Cameroon, are mixed.</text></svg>