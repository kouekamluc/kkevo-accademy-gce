<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Forces on a particle: 8 N along the x-axis, 10 N at 60 degrees, 6 N downwards</title>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="70" y1="190" x2="500" y2="190" stroke="#9FB3C8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="250" y1="335" x2="250" y2="30" stroke="#9FB3C8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="505" y="176" font-size="16" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="600" font-style="italic">x</text>
<text x="262" y="34" font-size="16" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="600" font-style="italic">y</text>
<line x1="250" y1="190" x2="450" y2="190" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ab)"/>
<line x1="250" y1="190" x2="335" y2="42.8" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ab)"/>
<line x1="250" y1="190" x2="250" y2="315" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ab)"/>
<circle cx="250" cy="190" r="6" fill="#102A43"/>
<path d="M298,190 A48,48 0 0 0 274,148.4" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="312" y="160" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">60°</text>
<text x="425" y="214" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">8 N</text>
<text x="349" y="46.8" font-size="17" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">10 N</text>
<text x="264" y="308" font-size="17" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">6 N</text>
</svg>
