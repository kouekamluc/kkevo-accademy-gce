F5" stroke="#047857" stroke-width="2"/><text x="140.0" y="174.0" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">Domestic</text><text x="140.0" y="193.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748B">inside own country</text><rect x="40" y="214" width="200" height="50" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="140.0" y="236.0" text-anchor="middle" font-size="15" font-weight="700" fill="#102A43">International</text><text x="140.0" y="255.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748B">crosses a border</text><rect x="290" y="152" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="350.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Leisure</text><rect x="420" y="152" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="480.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Business</text><rect x="290" y="208" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="350.0" y="237.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Eco-tourism</text><rect x="420" y="208" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="480.0" y="237.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Cultural</text><rect x="290" y="264" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="350.0" y="293.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Religious</text><rect x="420" y="264" width="120" height="46" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="480.0" y="293.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Health</text><text x="280.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#64748B">One trip can fit more 