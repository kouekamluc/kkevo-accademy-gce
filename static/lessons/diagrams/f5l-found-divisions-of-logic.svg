<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Common divisions of logic</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="205" y="16" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="43" text-anchor="middle" font-size="17" font-weight="700">Logic</text><path d="M280 60 L280 78 L94 78 L94 100" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="8" y="102" width="172" height="48" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="94" y="131" text-anchor="middle" font-size="15" font-weight="700">Method</text><line x1="48" y1="150" x2="48" y2="196" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="140" y1="150" x2="140" y2="196" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="8" y="198" width="82" height="44" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="49" y="225" text-anchor="middle" font-size="15">Traditional</text><rect x="98" y="198" width="82" height="44" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="139" y="225" text-anchor="middle" font-size="15">Symbolic</text><path d="M280 60 L280 78 L280 78 L280 100" fill="none" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="194" y="102" width="172" height="48" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="131" text-anchor="middle" font-size="15" font-weight="700">Form or content</text><line x1="234" y1="150" x2="234" y2="196" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="326" y1="150" x2="326" y2="196" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="194" y="198" width="82" height="44" rx="