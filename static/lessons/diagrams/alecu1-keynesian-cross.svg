<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">
<text x="280" y="24" text-anchor="middle" font-weight="700">The Keynesian cross (income-expenditure model)</text>
<line x1="80.0" y1="300.0" x2="80.0" y2="48.0" stroke="#102A43" stroke-width="2"/><polygon points="80.0,42.0 75.5,52.0 84.5,52.0" fill="#102A43"/>
<line x1="80.0" y1="300.0" x2="514.0" y2="300.0" stroke="#102A43" stroke-width="2"/><polygon points="520.0,300.0 510.0,295.5 510.0,304.5" fill="#102A43"/>
<text x="86.0" y="44.0" text-anchor="start" fill="#102A43" font-size="14" font-weight="600">Aggregate expenditure (AE)</text>
<text x="520.0" y="322.0" text-anchor="end" fill="#102A43" font-size="14" font-weight="600">National income (Y)</text>
<text x="70.0" y="318.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">0</text>
<path d="M80.0,300.0 L317.6,62.4" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="323.6" y="66.4" text-anchor="start" fill="#102A43" font-size="13" font-weight="400">AE = Y (45&#176; line)</text>
<path d="M80.0,234.0 L300.0,124.0" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="306.0" y="129.0" text-anchor="start" fill="#2563EB" font-size="13" font-weight="600">AE = C + I + G + (X &#8722; M)</text>
<line x1="212.0" y1="168.0" x2="212.0" y2="300.0" stroke="#102A43" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="212.0" cy="168.0" r="4.5" fill="#047857"/>
<text x="212.0" y="320.0" text-anchor="middle" fill="#047857" font-size="14" font-weight="600">Ye</text>
<text x="202.0" y="158.0" text-anchor="end" fill="#047857" font-size="14" font-weight="700">E</text>
<text x="74.0" y="239.0" text-anchor="end" fill="#102A43" font-size="14" font-weight="600">A</text>
<text x="300.0" y="346.0" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Equilibrium where planned spending equals output: AE = Y</text>
</g></svg>