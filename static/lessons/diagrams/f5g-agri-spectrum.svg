<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">From extensive to intensive farming</text><line x1="40" y1="90" x2="520" y2="90" stroke="#102A43" stroke-width="3" marker-end="url(#a)"/><text x="70" y="66" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" font-family="Inter, Arial, sans-serif">EXTENSIVE</text><text x="490" y="66" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700" font-family="Inter, Arial, sans-serif">INTENSIVE</text><line x1="70" y1="97" x2="70" y2="150" stroke="#64748B" stroke-width="2"/><rect x="4" y="150" width="136" height="34" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="72.0" y="172" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Nomadic pastoralism</text><line x1="160" y1="97" x2="160" y2="195" stroke="#64748B" stroke-width="2"/><rect x="92.0" y="195" width="136" height="34" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="160.0" y="217" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Shifting cultivation</text><line x1="235" y1="97" x2="235" y2="150" stroke="#64748B" stroke-width="2"/><rect x="167.0" y="150" width="136" height="34" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="235.0" y="172" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Commercial ranching</text><line x1="335" y1="97" x2="335" y2="195" stroke="#64748B" stroke-width="2"/><rect x="285.0" y="195" width="100" height="34" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="335.0" y="217" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Plantation</text><line x1="420" y1="97" x2="420" y2="150" stroke="#64748B" stroke-width="2"/><rect x="365.0" y="150" width="110" height="34" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="420.0" y="172" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Rice farming</text><line x1="505" y1="97" x2="505" y2="195" stroke="#64748B" stroke-width="2"/><rect x="432" y="195" width="124" height="34" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="494.0" y="217" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Market gardening</text><circle cx="70" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="160" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="235" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="335" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="420" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><circle cx="505" cy="90" r="7" fill="#2563EB" stroke="#102A43" stroke-width="2"/><rect x="60" y="245" width="440" height="100" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="270" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Moving towards INTENSIVE:</text><text x="280" y="292" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">more labour, capital and fertiliser on each hectare</text><text x="280" y="312" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">smaller farms, higher yield per hectare</text><text x="280" y="334" font-size="13" text-anchor="middle" fill="#047857" font-weight="400" font-family="Inter, Arial, sans-serif">Moving towards EXTENSIVE: the opposite</text></svg>