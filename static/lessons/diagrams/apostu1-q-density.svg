<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A triangular probability density curve on 0 to 4 with peak height k at x equals 2</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<polygon points="70.0,290.0 285.0,158.0 500.0,290.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
<line x1="70.0" y1="290.0" x2="510.0" y2="290.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="290.0" x2="70.0" y2="45.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="290.0" x2="70.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="70.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">0</text>
<line x1="285.0" y1="290.0" x2="285.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="285.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">2</text>
<line x1="500.0" y1="290.0" x2="500.0" y2="296.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="500.0" y="314.0" font-size="14" fill="#102A43" text-anchor="middle">4</text>
<line x1="285.0" y1="290.0" x2="285.0" y2="158.0" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="295.0" y="150.0" font-size="18" fill="#B45309" text-anchor="start" font-weight="700">k</text>
<text x="285.0" y="340.0" font-size="14" fill="#102A43" text-anchor="middle">x</text>
<text x="62.0" y="56.0" font-size="14" fill="#102A43" text-anchor="end">f(x)</text>
<text x="300.0" y="28.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">f(x) = 0 outside 0 to 4</text>
</svg>
