<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Two bearings read from diagrams: B is 50 degrees anticlockwise from north, so the bearing is 310; C is 35 degrees west of south, so the bearing is 215</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="150" y1="200" x2="150" y2="100" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="150,100 154.3,110 145.7,110" fill="#102A43"/>
<text x="150" y="88" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<line x1="150" y1="200" x2="65.7" y2="129.3" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="150" cy="200" r="4" fill="#102A43"/>
<circle cx="65.7" cy="129.3" r="4" fill="#102A43"/>
<text x="55" y="119" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">B</text>
<path d="M116.3,171.7 A44,44 0 0 1 150,156" fill="none" stroke="#102A43" stroke-width="2.5"/>
<text x="123.8" y="143.8" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">50°</text>
<path d="M150,172 A28,28 0 1 1 128.6,182" fill="none" stroke="#047857" stroke-width="2.5"/>
<polygon points="128.6,182 118.3,186.4 126,192.9" fill="#047857"/>
<text x="173" y="239.8" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<line x1="420" y1="175" x2="420" y2="75" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="420,75 424.3,85 415.7,85" fill="#102A43"/>
<text x="420" y="63" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<line x1="420" y1="175" x2="420" y2="275" stroke="#102A43" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="420" y="289" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">S</text>
<line x1="420" y1="175" x2="356.9" y2="265.1" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="420" cy="175" r="4" fill="#102A43"/>
<circle cx="356.9" cy="265.1" r="4" fill="#102A43"/>
<text x="348.9" y="278.2" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text>
<path d="M420,219 A44,44 0 0 1 394.8,211" fill="none" stroke="#102A43" stroke-width="2.5"/>
<text x="401.4" y="234.1" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">35°</text>
<path d="M420,147 A28,28 0 1 1 403.9,197.9" fill="none" stroke="#047857" stroke-width="2.5"/>
<polygon points="403.9,197.9 409.3,207.8 415,199.6" fill="#047857"/>
<text x="376.8" y="159.3" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<text x="150" y="330" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">Bearing = 360° − 50° = 310°</text>
<text x="420" y="330" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">Bearing = 180° + 35° = 215°</text>
</svg>