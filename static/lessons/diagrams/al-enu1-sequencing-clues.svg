<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Reference links between sentences</title><desc id="d">Sentence 1 introduces a new footbridge. Sentence 2 begins The bridge, which points back to it.</desc><rect width="560" height="360" fill="#FFFFFF"/><rect x="40" y="24" width="480" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><text x="58" y="50" font-size="14" font-weight="700" fill="#2563EB" font-family="Inter, Arial, sans-serif">Sentence 1: opening</text><text x="58" y="78" font-size="17" fill="#102A43" font-family="Inter, Arial, sans-serif"><tspan font-weight="700" fill="#2563EB">A new footbridge</tspan> was opened on Monday.</text><rect x="40" y="220" width="480" height="120" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="58" y="246" font-size="14" font-weight="700" fill="#047857" font-family="Inter, Arial, sans-serif">Sentence 2: follows</text><text x="58" y="274" font-size="17" fill="#102A43" font-family="Inter, Arial, sans-serif"><tspan font-weight="700" fill="#047857">The bridge</tspan>, which is 40 metres long,</text><text x="58" y="300" font-size="17" fill="#102A43" font-family="Inter, Arial, sans-serif">replaces a wooden one.</text><line x1="150" y1="212" x2="150" y2="128" stroke="#B45309" stroke-width="3"/><path d="M142 140 L150 124 L158 140 Z" fill="#B45309"/><text x="175" y="160" font-size="15" font-weight="700" fill="#B45309" font-family="Inter, Arial, sans-serif">a new footbridge &#8594; the bridge</text><text x="175" y="184" font-size="14" fill="#B45309" font-family="Inter, Arial, sans-serif">first mention: a. later mention: the</text></svg>