<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>Birds and animals that fly overlap but do not coincide</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><circle cx="200" cy="175" r="120" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><circle cx="360" cy="175" r="120" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="150" y="36" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="bold">Birds (defined)</text><text x="410" y="36" font-size="15" fill="#047857" text-anchor="middle" font-weight="bold">Animals that fly (definiens)</text><text x="160" y="160" font-size="15" fill="#102A43" text-anchor="middle">ostrich</text><text x="160" y="184" font-size="15" fill="#102A43" text-anchor="middle">penguin</text><text x="280" y="160" font-size="15" fill="#102A43" text-anchor="middle">sparrow</text><text x="280" y="184" font-size="15" fill="#102A43" text-anchor="middle">eagle</text><text x="400" y="160" font-size="15" fill="#102A43" text-anchor="middle">bat</text><text x="400" y="184" font-size="15" fill="#102A43" text-anchor="middle">bee</text><text x="165" y="232" font-size="13" fill="#B45309" text-anchor="middle" font-weight="bold">left out:</text><text x="165" y="250" font-size="13" fill="#B45309" text-anchor="middle" font-weight="bold">too narrow</text><text x="395" y="232" font-size="13" fill="#B45309" text-anchor="middle" font-weight="bold">let in:</text><text x="395" y="250" font-size="13" fill="#B45309" text-anchor="middle" font-weight="bold">too wide</text><text x="280" y="325" font-size="14" fill="#102A43" text-anchor="middle" font-weight="bold">A bird is an animal that flies: wrong both ways.</text><text x="280" y="347" font-size="13" fill="#102A43" text-anchor="middle">Ostriches are birds that do not fly. Bats fly but are not birds.</text></svg>