<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="22" text-anchor="middle" font-size="15" fill="#102A43" font-weight="700">Du plus litt&#233;ral au plus libre</text><rect x="10" y="36" width="180" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="59.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Emprunt</text><rect x="196" y="36" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="306.0" y="59.9" text-anchor="middle" font-size="14" fill="#102A43">le week-end</text><rect x="10" y="82" width="180" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="105.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Calque</text><rect x="196" y="82" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="306.0" y="105.9" text-anchor="middle" font-size="14" fill="#102A43">gratte-ciel</text><rect x="10" y="128" width="180" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="100.0" y="151.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Traduction litt&#233;rale</text><rect x="196" y="128" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="306.0" y="151.9" text-anchor="middle" font-size="14" fill="#102A43">J'aime ce livre</text><rect x="10" y="174" width="180" height="38" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="197.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Transposition</text><rect x="196" y="174" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="306.0" y="197.9" text-anchor="middle" font-size="14" fill="#102A43">D&#232;s son retour</text><rect x="10" y="220" width="180" height="38" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="243.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Modulation</text><rect x="196" y="220" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="306.0" y="243.9" text-anchor="middle" font-size="14" fill="#102A43">Il est facile de montrer</text><rect x="10" y="266" width="180" height="38" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="289.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">&#201;quivalence</text><rect x="196" y="266" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="306.0" y="289.9" text-anchor="middle" font-size="14" fill="#102A43">Peinture fra&#238;che</text><rect x="10" y="312" width="180" height="38" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="100.0" y="335.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Adaptation</text><rect x="196" y="312" width="220" height="38" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/><text x="306.0" y="335.9" text-anchor="middle" font-size="14" fill="#102A43">Monsieur,</text><line x1="436" y1="40" x2="436" y2="170" stroke="#2563EB" stroke-width="2"/><text x="445" y="110" text-anchor="start" font-size="14" fill="#2563EB" font-weight="700">directs</text><line x1="436" y1="178" x2="436" y2="352" stroke="#047857" stroke-width="2"/><text x="445" y="268" text-anchor="start" font-size="14" fill="#047857" font-weight="700">obliques</text></svg>