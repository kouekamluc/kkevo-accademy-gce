<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><text x="280.0" y="24.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Myrdal: cumulative causation in a growing core region</text><line x1="323.0" y1="95.0" x2="367.7" y2="121.0" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="399.9" y1="172.7" x2="371.7" y2="242.3" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="281.8" y1="269.0" x2="278.2" y2="269.0" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="188.3" y1="242.3" x2="160.1" y2="172.7" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="192.3" y1="121.0" x2="237.0" y2="95.0" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><rect x="205.0" y="47.0" width="150.0" height="46.0" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280.0" y="66.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">New industry</text><text x="280.0" y="83.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">locates in core</text><rect x="335.8" y="123.0" width="150.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="410.8" y="142.1" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">More jobs</text><text x="410.8" y="159.1" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">and incomes</text><rect x="285.8" y="246.0" width="150.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="360.8" y="265.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">Bigger market,</text><text x="360.8" y="282.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">more tax revenue</text><rect x="124.2" y="246.0" width="150.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="199.2" y="265.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">Better services and</text><text x="199.2" y="282.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">infrastructure</text><rect x="74.2" y="123.0" width="150.0" height="46.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="149.2" y="142.1" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">More firms and</text><text x="149.2" y="159.1" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">workers attracted</text><text x="280.0" y="176.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">upward</text><text x="280.0" y="194.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">spiral</text><text x="280.0" y="330.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">Backwash: labour and capital are drawn from the periphery.</text><text x="280.0" y="348.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">Spread: the core's demand and ideas help the periphery.</text></svg>