<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Ship sails 10 km due east from P to Q. Lighthouse L is on a bearing of 040 from P and 330 from Q. Angles of the triangle: 50 at P, 60 at Q, 70 at L</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="120" y1="290" x2="120" y2="210" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="120,210 124.3,220 115.7,220" fill="#102A43"/>
<text x="120" y="198" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<line x1="420" y1="290" x2="420" y2="210" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="420,210 424.3,220 415.7,220" fill="#102A43"/>
<text x="420" y="198" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N</text>
<polygon points="120,290 420,290 297.7,78.2" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="420" y1="290" x2="297.7" y2="78.2" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
<path d="M120,246 A44,44 0 0 1 148.3,256.3" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="140.5" y="233.6" font-size="14" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">040°</text>
<path d="M395,246.7 A50,50 0 0 1 420,240" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="402.9" y="226.2" font-size="14" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">30°</text>
<path d="M141.9,264 A34,34 0 0 1 154,290" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="167.1" y="268" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">50°</text>
<path d="M390,290 A30,30 0 0 1 405,264" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="378.4" y="266" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">60°</text>
<path d="M310.7,100.7 A26,26 0 0 1 281,98.1" fill="none" stroke="#102A43" stroke-width="2.5"/>
<text x="293.9" y="122" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">70°</text>
<circle cx="120" cy="290" r="4" fill="#102A43"/>
<circle cx="420" cy="290" r="4" fill="#102A43"/>
<circle cx="297.7" cy="78.2" r="4" fill="#102A43"/>
<text x="102" y="296" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">P</text>
<text x="438" y="296" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Q</text>
<text x="297.7" y="60.2" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">L</text>
<text x="270" y="314" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">10 km due east</text>
<text x="329.4" y="201.1" font-size="16" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">QL = ?</text>
<text x="392" y="40" font-size="14" fill="#2563EB" text-anchor="start" dominant-baseline="middle">Bearing of L from Q</text>
<text x="392" y="60" font-size="14" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">= 360° − 30° = 330°</text>
</svg>