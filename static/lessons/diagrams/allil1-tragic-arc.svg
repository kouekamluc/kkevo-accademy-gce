<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Tragic plot arc</title><rect width="560" height="360" fill="#fff"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">The shape of a tragic plot</text><line x1="40" y1="300" x2="530" y2="300" stroke="#102A43" stroke-width="2"/><path d="M40 260 L170 190 L280 100 L390 190 L510 285" fill="none" stroke="#2563EB" stroke-width="4"/><circle cx="280" cy="100" r="7" fill="#B45309"/><circle cx="510" cy="285" r="7" fill="#B45309"/><text x="110" y="268" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Good fortune</text><text x="110" y="286" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">and complication</text><text x="280" y="70" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Turning point</text><text x="280" y="54" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">peripeteia + anagnorisis</text><text x="420" y="150" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Falling action</text><text x="440" y="325" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Catastrophe, then catharsis</text><text x="280" y="345" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Pity and fear rise as the hero falls</text></svg>