<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<title>Conventional signs used on the Mbanga Plain map</title>
<style>.h{stroke:#FFFFFF;stroke-width:4;paint-order:stroke;stroke-linejoin:round}</style>
<defs><circle id="t" r="4" fill="none" stroke="#047857" stroke-width="2"/><circle id="p" r="2.5" fill="#047857"/></defs>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="24" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Conventional signs: small pictures that stand for real features</text>
<line x1="48" y1="57" x2="76" y2="57" stroke="#102A43" stroke-width="5"/>
<text x="96" y="62" font-size="14" fill="#102A43">Tarred road</text>
<line x1="48" y1="91" x2="76" y2="91" stroke="#64748B" stroke-width="3"/>
<text x="96" y="96" font-size="14" fill="#102A43">Murram road</text>
<line x1="48" y1="125" x2="76" y2="125" stroke="#102A43" stroke-width="2" stroke-dasharray="7 5"/>
<text x="96" y="130" font-size="14" fill="#102A43">Track</text>
<line x1="48" y1="159" x2="76" y2="159" stroke="#102A43" stroke-width="2.5"/><line x1="53" y1="153" x2="53" y2="165" stroke="#102A43" stroke-width="2.5"/><line x1="62" y1="153" x2="62" y2="165" stroke="#102A43" stroke-width="2.5"/><line x1="71" y1="153" x2="71" y2="165" stroke="#102A43" stroke-width="2.5"/>
<text x="96" y="164" font-size="14" fill="#102A43">Railway</text>
<path d="M48 193q7 -8 14 0t14 0" fill="none" stroke="#2563EB" stroke-width="3.5"/>
<text x="96" y="198" font-size="14" fill="#102A43">River</text>
<rect x="53" y="221" width="18" height="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><path d="M53 221h18M53 233h18" stroke="#102A43" stroke-width="3"/>
<text x="96" y="232" font-size="14" fill="#102A43">Bridge</text>
<rect x="47" y="254" width="30" height="14" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
<text x="96" y="266" font-size="14" fill="#102A43">Built-up area</text>
<rect x="53" y="288" width="7" height="7" fill="#102A43"/><rect x="63" y="288" width="7" height="7" fill="#102A43"/><rect x="58" y="297" width="7" height="7" fill="#102A43"/>
<text x="96" y="300" font-size="14" fill="#102A43">Village</text>
<path d="M62 321v16M57 326h10" stroke="#102A43" stroke-width="2.5" fill="none"/>
<text x="96" y="334" font-size="14" fill="#102A43">Church</text>
<circle cx="342" cy="57" r="9" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="342" y="61.5" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">S</text>
<text x="376" y="62" font-size="14" fill="#102A43">School</text>
<circle cx="342" cy="91" r="9" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="342" y="95.5" font-size="13" font-weight="700" fill="#102A43" text-anchor="middle">M</text>
<text x="376" y="96" font-size="14" fill="#102A43">Market</text>
<circle cx="342" cy="125" r="9" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><path d="M342 120v10M337 125h10" stroke="#102A43" stroke-width="3" fill="none"/>
<text x="376" y="130" font-size="14" fill="#102A43">Health centre</text>
<rect x="334" y="154.5" width="16" height="9" fill="#102A43"/>
<text x="376" y="164" font-size="14" fill="#102A43">Railway station</text>
<path d="M342 185l8 14h-16z" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5" stroke-linejoin="round"/><circle cx="342" cy="195" r="2" fill="#102A43"/>
<text x="376" y="198" font-size="14" fill="#102A43">Trig station (height)</text>
<path d="M328 227q7 -9 14 0t14 0" fill="none" stroke="#B45309" stroke-width="2"/>
<text x="376" y="232" font-size="14" fill="#102A43">Contour line</text>
<rect x="327" y="253" width="30" height="16" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><use href="#t" x="335" y="261"/><use href="#t" x="349" y="261"/>
<text x="376" y="266" font-size="14" fill="#102A43">Forest</text>
<rect x="327" y="287" width="30" height="16" fill="#F0FDF4" stroke="#047857" stroke-width="2" stroke-dasharray="3 3"/><use href="#p" x="334" y="295"/><use href="#p" x="342" y="295"/><use href="#p" x="350" y="295"/>
<text x="376" y="300" font-size="14" fill="#102A43">Plantation</text>
</svg>
