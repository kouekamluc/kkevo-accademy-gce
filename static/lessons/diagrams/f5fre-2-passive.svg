<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="30" y="40" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">Active</text>
<rect x="30" y="56" width="160" height="44" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="110.0" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">la directrice</text>
<rect x="200" y="56" width="160" height="44" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">félicite</text>
<rect x="370" y="56" width="160" height="44" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="450.0" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">les élèves</text>
<text x="110" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">subject</text><text x="280" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">verb</text><text x="450" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">object</text>
<line x1="110" y1="140" x2="440" y2="226" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/>
<line x1="450" y1="140" x2="120" y2="226" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/>
<text x="30" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">Passive</text>
<rect x="30" y="232" width="160" height="44" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="110.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">les élèves</text>
<rect x="200" y="232" width="160" height="44" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">sont félicités</text>
<rect x="370" y="232" width="160" height="44" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="450.0" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43">par la directrice</text>
<text x="110" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">new subject</text><text x="280" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">être + participle</text><text x="450" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">agent</text>
<text x="280" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Same tense. The participle agrees with the new subject.</text>
</svg>