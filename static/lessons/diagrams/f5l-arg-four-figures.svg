<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>The four figures of the categorical syllogism: the middle term M is placed as subject or predicate in the major and minor premises</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="12" y="12" width="262" height="160" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="26" y="38" font-size="15" font-weight="700" fill="#102A43">Figure 1: sub-pre</text>
<text x="26" y="80" font-size="13" fill="#102A43">Major</text>
<text x="124" y="80" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">M</text>
<text x="164" y="80" font-size="13" fill="#102A43" text-anchor="middle">are</text>
<text x="212" y="80" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">P</text>
<text x="26" y="116" font-size="13" fill="#102A43">Minor</text>
<text x="124" y="116" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">S</text>
<text x="164" y="116" font-size="13" fill="#102A43" text-anchor="middle">are</text>
<text x="212" y="116" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">M</text>
<path d="M124 86 L212 94" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<line x1="26" y1="128" x2="260" y2="128" stroke="#102A43" stroke-width="2"/>
<text x="26" y="156" font-size="13" fill="#102A43">Conclusion</text>
<text x="124" y="156" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">S</text>
<text x="164" y="156" font-size="13" fill="#102A43" text-anchor="middle">are</text>
<text x="212" y="156" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">P</text>
