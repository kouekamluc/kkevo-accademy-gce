<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">The inconsistent triad</text><polygon points="280,60 110,290 450,290" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><rect x="190" y="52" width="180" height="40" fill="#ffffff" stroke="#2563EB" stroke-width="2"/><text x="280" y="69" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">God is all-powerful</text><text x="280" y="86" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">(can prevent evil)</text><rect x="20" y="268" width="180" height="40" fill="#ffffff" stroke="#2563EB" stroke-width="2"/><text x="110" y="285" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">God is all-good</text><text x="110" y="302" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">(wants to prevent evil)</text><rect x="360" y="268" width="180" height="40" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="450" y="285" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Evil exists</text><text x="450" y="302" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">(suffering is real)</text><text x="280" y="185" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">All three seem</text><text x="280" y="205" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">hard to hold</text><text x="280" y="225" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">at the same time</text><text x="280" y="340" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Defences and theodicies deny or reinterpret one claim.</text></svg>