<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Act and rule utilitarianism compared</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" text-anchor="middle" font-size="15" fill="#102A43" font-weight="700">Both judge by consequences; they differ in what they judge</text><rect x="20" y="50" width="250" height="170" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="145.0" y="82.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Act utilitarianism</text><text x="145.0" y="101.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="145.0" y="120.9" text-anchor="middle" font-size="14" fill="#102A43">Judge each single act</text><text x="145.0" y="139.9" text-anchor="middle" font-size="14" fill="#102A43">by its results</text><text x="145.0" y="158.9" text-anchor="middle" font-size="14" fill="#102A43">Strength: flexible</text><text x="145.0" y="177.9" text-anchor="middle" font-size="14" fill="#102A43">Risk: may allow injustice</text><text x="145.0" y="196.9" text-anchor="middle" font-size="14" fill="#102A43">when the total is larger</text><rect x="290" y="50" width="250" height="170" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="415.0" y="82.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Rule utilitarianism</text><text x="415.0" y="101.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="415.0" y="120.9" text-anchor="middle" font-size="14" fill="#102A43">Judge the rule by results</text><text x="415.0" y="139.9" text-anchor="middle" font-size="14" fill="#102A43">if everyone followed it</text><text x="415.0" y="158.9" text-anchor="middle" font-size="14" fill="#102A43">Strength: protects promises</text><text x="415.0" y="177.9" text-anchor="middle" font-size="14" fill="#102A43">and justice</text><text x="415.0" y="196.9" text-anchor="middle" font-size="14" fill="#102A43">Risk: rule worship</text><rect x="80" y="250" width="400" height="60" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="275.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Common test: greatest happiness</text><text x="280.0" y="294.4" text-anchor="middle" font-size="14" fill="#102A43">of all those affected, counted equally</text><line x1="145" y1="220" x2="200" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="415" y1="220" x2="360" y2="250" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/></svg>