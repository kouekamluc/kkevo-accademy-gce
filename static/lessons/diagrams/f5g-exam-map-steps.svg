<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Six steps for the map reading question</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="34" font-size="17" font-weight="700" fill="#102A43" text-anchor="middle">Six steps for the map reading question</text>
<rect x="30" y="66" width="150" height="96" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<circle cx="54" cy="90" r="15" fill="#B45309"/><text x="54" y="96" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="115" y="128" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Read the whole</text>
<text x="115" y="148" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">question first</text>
<rect x="200" y="66" width="150" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="224" cy="90" r="15" fill="#2563EB"/><text x="224" y="96" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="285" y="128" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Study the key,</text>
<text x="285" y="148" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">scale and grid</text>
<rect x="370" y="66" width="150" height="96" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<circle cx="394" cy="90" r="15" fill="#047857"/><text x="394" y="96" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="455" y="128" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Locate</text>
<text x="455" y="148" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">grid references</text>
<rect x="30" y="206" width="150" height="96" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<circle cx="54" cy="230" r="15" fill="#B45309"/><text x="54" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="115" y="268" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Measure</text>
<text x="115" y="288" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">distance, bearing</text>
<rect x="200" y="206" width="150" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="224" cy="230" r="15" fill="#2563EB"/><text x="224" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="285" y="268" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Describe</text>
<text x="285" y="288" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">relief, drainage</text>
<rect x="370" y="206" width="150" height="96" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<circle cx="394" cy="230" r="15" fill="#047857"/><text x="394" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="455" y="268" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Link</text>
<text x="455" y="288" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">nature to people</text>
<line x1="183" y1="114" x2="188.3" y2="114" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="196,114 186.1,118.8 186.1,109.2" fill="#102A43"/>
<line x1="183" y1="254" x2="188.3" y2="254" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="196,254 186.1,258.8 186.1,249.2" fill="#102A43"/>
<line x1="353" y1="114" x2="358.3" y2="114" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="366,114 356.1,118.8 356.1,109.2" fill="#102A43"/>
<line x1="353" y1="254" x2="358.3" y2="254" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="366,254 356.1,258.8 356.1,249.2" fill="#102A43"/>
<line x1="445" y1="164" x2="112.6" y2="203.1" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="105,204 114.3,198.1 115.4,207.6" fill="#64748B"/>
<text x="280" y="340" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">Use the figures and the key in the question in every answer.</text>
</svg>
