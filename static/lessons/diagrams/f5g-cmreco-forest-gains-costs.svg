<text x="418" y="146" font-size="14" fill="#102A43" text-anchor="middle">Soil erosion and floods</text>
<text x="142" y="186" font-size="14" fill="#102A43" text-anchor="middle">Taxes for government</text>
<text x="418" y="186" font-size="14" fill="#102A43" text-anchor="middle">Loss of animal habitat</text>
<text x="142" y="226" font-size="14" fill="#102A43" text-anchor="middle">Fuelwood, food, medicine</text>
<text x="418" y="226" font-size="14" fill="#102A43" text-anchor="middle">Illegal logging</text>
<text x="142" y="266" font-size="14" fill="#102A43" text-anchor="middle">Cleared land for farming</text>
<text x="418" y="266" font-size="14" fill="#102A43" text-anchor="middle">Less carbon storage</text>
<text x="142" y="306" font-size="14" fill="#102A43" text-anchor="middle">Income for local villages</text>
<text x="418" y="306" font-size="14" fill="#102A43" text-anchor="middle">Conflicts over land</text>
