<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">What happens after fertiliser reaches a lake</text><rect x="20.0" y="72.0" width="150" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="95" y="89.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">1</text><text x="95" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Fertiliser and</text><text x="95" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">sewage wash</text><text x="95" y="140.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">into the lake</text><rect x="205.0" y="72.0" width="150" height="76" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280" y="89.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">2</text><text x="280" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Algae grow very</text><text x="280" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">fast and cover</text><text x="280" y="140.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">the surface</text><rect x="390.0" y="72.0" width="150" height="76" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="465" y="89.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">3</text><text x="465" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Light cannot reach</text><text x="465" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">plants below;</text><text x="465" y="140.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">they die</text><rect x="390.0" y="212.0" width="150" height="76" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="465" y="229.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">4</text><text x="465" y="246.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Bacteria feed on</text><text x="465" y="263.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">dead matter and</text><text x="465" y="280.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">use up oxygen</text><rect x="205.0" y="212.0" width="150" height="76" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280" y="229.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">5</text><text x="280" y="246.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Fish and other</text><text x="280" y="263.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">animals die from</text><text x="280" y="280.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">lack of oxygen</text><line x1="173.0" y1="110.0" x2="200.0" y2="110.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="358.0" y1="110.0" x2="385.0" y2="110.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="465.0" y1="151.0" x2="465.0" y2="207.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="387.0" y1="250.0" x2="360.0" y2="250.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><text x="95" y="230" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Nitrates and</text><text x="95" y="248" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">phosphates</text><text x="95" y="266" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">(plant nutrients)</text></svg>