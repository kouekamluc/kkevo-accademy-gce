 stroke-width="3" marker-end="url(#ag)"/><text x="465" y="140" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Rock cliff</text><text x="465" y="158" font-size="13" text-anchor="middle" fill="#047857">(steep face)</text><text x="460" y="262" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700">Wave-cut notch</text><line x1="420" y1="252" x2="364" y2="226" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><text x="150" y="120" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="700">Waves attack</text><text x="150" y="138" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="700">the foot of the cliff</text><path d="M110,168 C170,150 240,170 340,222" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="228" font-size="13" text-anchor="start" fill="#2563EB" font-weight="700">Sea level (high tide)</text><text x="190" y="306" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Wave-cut platform:</text><text x="190" y="324" font-size="13" text-anchor="middle" fill="#047857">gently sloping rock shelf</text><line x1="190" y1="290" x2="190" y2="258" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/></svg>