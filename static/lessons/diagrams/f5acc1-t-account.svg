<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="34" font-family="Inter, Arial, sans-serif" font-size="18" fill="#102A43" text-anchor="middle" font-weight="700">A T-account (ledger account)</text>
<text x="280" y="66" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700">Name of the account</text>
<line x1="40" y1="78" x2="520" y2="78" stroke="#102A43" stroke-width="3"/>
<line x1="280" y1="78" x2="280" y2="200" stroke="#102A43" stroke-width="3"/>
<text x="160" y="106" font-family="Inter, Arial, sans-serif" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">DEBIT (Dr)</text>
<text x="400" y="106" font-family="Inter, Arial, sans-serif" font-size="17" fill="#102A43" text-anchor="middle" font-weight="700">CREDIT (Cr)</text>
<text x="160" y="130" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">left side</text>
<text x="400" y="130" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400">right side</text>
<rect x="40" y="215" width="230" height="110" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="155" y="242" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2563EB" text-anchor="middle" font-weight="700">Debit to increase:</text>
<text x="155" y="268" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Assets</text>
<text x="155" y="290" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Expenses</text>
<text x="155" y="312" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Drawings</text>
<rect x="290" y="215" width="230" height="110" rx="10" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/>
<text x="405" y="242" font-family="Inter, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Credit to increase:</text>
<text x="405" y="268" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Liabilities</text>
<text x="405" y="290" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Capital</text>
<text x="405" y="312" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="400">Income</text>
