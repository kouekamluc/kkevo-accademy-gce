<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img"><rect width="560" height="350" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Climate-smart agriculture: three aims</text><rect x="190" y="45" width="180" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="66" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">CLIMATE-SMART</text><text x="280" y="84" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">AGRICULTURE</text><line x1="280" y1="95" x2="100" y2="130" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="130" width="160" height="200" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="100" y="158" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">1. Productivity</text><text x="100" y="180" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">raise yields, income</text><line x1="35" y1="194" x2="165" y2="194" stroke="#64748B" stroke-width="2"/><text x="100" y="225" font-size="13" text-anchor="middle" fill="#64748B" font-weight="400" font-family="Inter, Arial, sans-serif">Example:</text><text x="100" y="250" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif">Drought-resistant seed</text><text x="100" y="290" font-size="13" text-anchor="middle" fill="#64748B" font-weight="400" font-family="Inter, Arial, sans-serif">Example:</text><text x="100" y="312" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400" font-family="Inter, Arial, sans-serif"