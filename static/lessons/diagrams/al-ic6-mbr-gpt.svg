<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>MBR and GPT disk layouts</title><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#102A43">MBR disk</text><rect x="20" y="45" width="50" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="45.0" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">MBR</text><rect x="70" y="45" width="120" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="130.0" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 1</text><rect x="190" y="45" width="140" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="260.0" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 2</text><rect x="330" y="45" width="110" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="385.0" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 3</text><rect x="440" y="45" width="100" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="490.0" y="76" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 4</text><text x="20" y="125" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#102A43">One table, 4 primary partitions</text><text x="20" y="145" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#B45309">32-bit sectors: 2 TiB limit (512-byte sectors)</text><text x="20" y="195" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#102A43">GPT disk</text><rect x="20" y="210" width="50" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="45.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">PMBR</text><rect x="70" y="210" width="80" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="110.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Table</text><rect x="150" y="210" width="90" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="195.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 1</text><rect x="240" y="210" width="100" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="290.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 2</text><rect x="340" y="210" width="90" height="50" rx="4" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="385.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Part 3</text><rect x="430" y="210" width="110" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="485.0" y="241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#102A43">Backup</text><text x="20" y="290" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#102A43">PMBR = protective MBR; Backup = copy of the table</text><text x="20" y="312" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#047857">128 partitions by default, 64-bit sectors</text><text x="20" y="334" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#047857">The table is checked with a checksum</text></svg>