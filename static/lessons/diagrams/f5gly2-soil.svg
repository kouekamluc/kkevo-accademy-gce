<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="560" height="360" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102A43"/></marker></defs>
<text x="280" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43">A soil profile</text>
<rect x="110" y="60" width="200" height="30" fill="#A1887F" stroke="#102A43" stroke-width="2"/>
<text x="130" y="81" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">O</text>
<text x="330" y="80" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">leaf litter and humus</text>
<rect x="110" y="90" width="200" height="55" fill="#BCAAA4" stroke="#102A43" stroke-width="2"/>
<text x="130" y="123" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">A</text>
<text x="330" y="122" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">topsoil: dark, humus and minerals</text>
<rect x="110" y="145" width="200" height="70" fill="#FDBA74" stroke="#102A43" stroke-width="2"/>
<text x="130" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">B</text>
<text x="330" y="185" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">subsoil: clay and iron collect</text>
<rect x="110" y="215" width="200" height="60" fill="#E5E7EB" stroke="#102A43" stroke-width="2"/>
<text x="130" y="251" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">C</text>
<text x="330" y="250" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">weathered rock fragments</text>
<rect x="110" y="275" width="200" height="50" fill="#9CA3AF" stroke="#102A43" stroke-width="2"/>
<text x="130" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">R</text>
<text x="330" y="305" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">solid bedrock (parent rock)</text>

<line x1="70.0" y1="65.0" x2="70.0" y2="320.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/>

</svg>
