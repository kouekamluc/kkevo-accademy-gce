<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Three cases for a line and a circle: the line misses the circle when the discriminant is negative, touches it when the discriminant is zero, and cuts it at two points when the discriminant is positive</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<circle cx="95" cy="150" r="62" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<circle cx="95.0" cy="150.0" r="4" fill="#102A43"/>
<line x1="52.4" y1="33.1" x2="211.9" y2="107.4" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<text x="95.0" y="262.0" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Line misses</text>
<text x="95.0" y="290.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">b² − 4ac &lt; 0</text>
<text x="95.0" y="316.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">no points</text>
<circle cx="280" cy="150" r="62" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<circle cx="280.0" cy="150.0" r="4" fill="#102A43"/>
<line x1="226.4" y1="56.6" x2="386.0" y2="131.0" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
<circle cx="306.2" cy="93.8" r="4" fill="#047857"/>
<text x="280.0" y="262.0" font-size="17" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">Line touches</text>
<text x="280.0" y="290.0" font-size="16" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="600">b² − 4ac = 0</text>
<text x="280.0" y="316.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">one point</text>
<circle cx="465" cy="150" r="62" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<circle cx="465.0" cy="150.0" r="4" fill="#102A43"/>
<line x1="397.1" y1="87.4" x2="556.6" y2="161.8" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<circle cx="527.0" cy="148.0" r="4" fill="#2563EB"/>
<circle cx="426.7" cy="101.2" r="4" fill="#2563EB"/>
<text x="465.0" y="262.0" font-size="17" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">Line cuts</text>
<text x="465.0" y="290.0" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="600">b² − 4ac &gt; 0</text>
<text x="465.0" y="316.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">two points</text>
</svg>