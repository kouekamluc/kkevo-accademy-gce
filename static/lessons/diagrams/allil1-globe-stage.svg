<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Elizabethan stage plan</title><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">An open-air public stage (plan view, simplified)</text><rect x="150" y="50" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="76" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Back wall and doors (tiring house)</text><rect x="150" y="100" width="260" height="36" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="124" font-size="14" fill="#047857" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Balcony above the stage</text><rect x="190" y="150" width="180" height="110" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="280" y="196" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Thrust stage</text><rect x="258" y="215" width="44" height="30" fill="#EFF6FF" stroke="#B45309" stroke-width="2"/><text x="280" y="235" font-size="13" fill="#B45309" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Trap</text><text x="90" y="215" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Standing</text><text x="90" y="233" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">audience</text><text x="470" y="215" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Standing</text><text x="470" y="233" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">audience</text><text x="280" y="296" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Galleries (seated audience) ring the yard</text><text x="280" y="322" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Open sky: daylight, no scenery, words make the place</text></svg>