<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Reasons why a country becomes a newly industrialising country</title><defs><marker id="g5n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="g5b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="g5g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="g5a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><text x="280.0" y="26.0" font-size="17" text-anchor="middle" fill="#102A43" font-weight="700">How a NIC emerges</text><rect x="15.0" y="50.0" width="185.0" height="60.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="107.5" y="75.4" font-size="14" text-anchor="middle" fill="#102A43">Cheap, willing,</text><text x="107.5" y="94.4" font-size="14" text-anchor="middle" fill="#102A43">trainable workers</text><line x1="200.0" y1="80.0" x2="253.0" y2="150.0" stroke="#2563EB" stroke-width="2" marker-end="url(#g5b)"/><rect x="15.0" y="135.0" width="185.0" height="60.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="107.5" y="160.4" font-size="14" text-anchor="middle" fill="#102A43">Stable government</text><text x="107.5" y="179.4" font-size="14" text-anchor="middle" fill="#102A43">policy and education</text><line x1="200.0" y1="165.0" x2="253.0" y2="175.0" stroke="#2563EB" stroke-width="2" marker-end="url(#g5b)"/><rect x="15.0" y="220.0" width="185.0" height="60.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="107.5" y="245.4" font-size="14" text-anchor="middle" fill="#102A43">Foreign investment,</text><text x="107.5" y="264.4" font-size="14" text-anchor="middle" fill="#102A43">technology, ports</text><line x1="200.0" y1="250.0" x2="253.0" y2="200.0" stroke="#2563EB" stroke-width="2" marker-end="url(#g5b)"/><rect x="255.0" y="125.0" width="130.0" height="100.0" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="320.0" y="169.2" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">Export-led</text><text x="320.0" y="191.2" font-size="15" text-anchor="middle" fill="#102A43">factories</text><text x="320.0" y="208.0" font-size="13" text-anchor="middle" fill="#102A43">(cloth, goods)</text><line x1="385.0" y1="175.0" x2="425.0" y2="175.0" stroke="#047857" stroke-width="2" marker-end="url(#g5g)"/><rect x="425.0" y="105.0" width="125.0" height="140.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="487.5" y="146.9" font-size="14" text-anchor="middle" fill="#102A43">More jobs,</text><text x="487.5" y="168.9" font-size="14" text-anchor="middle" fill="#102A43">higher incomes,</text><text x="487.5" y="190.9" font-size="14" text-anchor="middle" fill="#102A43">more taxes and</text><text x="487.5" y="212.9" font-size="14" text-anchor="middle" fill="#102A43">savings</text><path d="M487 245 L487 300 L100 300 L100 285" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#g5n)"/><text x="290.0" y="322.0" font-size="14" text-anchor="middle" fill="#64748B">Savings and taxes pay for more schools, roads and factories</text><text x="290.0" y="344.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Result: a Newly Industrialising Country (NIC)</text></svg>