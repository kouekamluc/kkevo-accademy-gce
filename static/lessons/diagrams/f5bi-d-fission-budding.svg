<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Two kinds of asexual reproduction</text><text x="140" y="60" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Binary fission (bacterium)</text><ellipse cx="55" cy="130" rx="36" ry="22" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><path d="M30,120 Q55,110 80,122" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">1 DNA copied</text><line x1="95" y1="130" x2="115" y2="130" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><ellipse cx="170" cy="130" rx="52" ry="22" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><line x1="170" y1="108" x2="170" y2="152" stroke="#102A43" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/><text x="170" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">2 cell splits</text><line x1="228" y1="130" x2="250" y2="130" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><ellipse cx="285" cy="110" rx="28" ry="18" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><ellipse cx="285" cy="152" rx="28" ry="18" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="285" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">3 two new cells</text><text x="285" y="206" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">(identical)</text><line x1="20" y1="225" x2="540" y2="225" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><text x="140" y="252" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Budding (yeast)</text><circle cx="60" cy="305" r="26" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="60" y="355" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">1 small bud</text><circle cx="78" cy="288" r="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><line x1="105" y1="300" x2="135" y2="300" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><circle cx="175" cy="305" r="26" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><circle cx="205" cy="285" r="14" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="185" y="355" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">2 bud grows</text><line x1="235" y1="300" x2="265" y2="300" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><circle cx="305" cy="305" r="26" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><circle cx="345" cy="300" r="16" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="325" y="355" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">3 bud breaks off</text><text x="470" y="128" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">One parent only.</text><text x="470" y="148" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">No gametes.</text><text x="470" y="168" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="700">Offspring are clones.</text></svg>