<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Branches of philosophy</text><circle cx="280" cy="190" r="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="188" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Philosophy</text><text x="280" y="206" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">love of wisdom</text><line x1="280" y1="136" x2="280" y2="85" stroke="#102A43" stroke-width="2"/><rect x="212" y="39" width="136" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="58" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Metaphysics</text><text x="280" y="77" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">what is real?</text><line x1="331" y1="173" x2="393" y2="151" stroke="#102A43" stroke-width="2"/><rect x="384" y="127" width="136" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="452" y="146" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Epistemology</text><text x="452" y="165" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">what can we know?</text><line x1="312" y1="234" x2="350" y2="293" stroke="#102A43" stroke-width="2"/><rect x="318" y="269" width="136" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="386" y="288" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Ethics</text><text x="386" y="307" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">what should we do?</text><line x1="248" y1="234" x2="210" y2="293" stroke="#102A43" stroke-width="2"/><rect x="106" y="269" width="136" height="48" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="174" y="288" font-size="14" f