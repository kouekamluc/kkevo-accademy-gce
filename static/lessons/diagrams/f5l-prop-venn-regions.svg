<text x="160" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">S but</text><text x="160" y="187" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">not P</text><text x="280" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">S and</text><text x="280" y="187" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">P</text><text x="400" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">P but</text><text x="400" y="187" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">not S</text><text x="280" y="285.8528137423857" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43"></text><text x="520" y="345" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43">Outside both: neither S nor P</text></svg>