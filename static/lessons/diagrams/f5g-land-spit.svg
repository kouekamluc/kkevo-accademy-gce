<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="10" width="540" height="340" rx="0" fill="#DBEAFE" stroke="#DBEAFE" stroke-width="0"/><path d="M10,130 L360,130 C470,130 500,170 505,240 L508,350 L550,350 L550,10 L10,10 Z" fill="#ECFDF5" stroke="#047857" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M352,142 C390,146 430,150 450,170 C462,182 464,196 462,214" fill="none" stroke="#B45309" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><path d="M352,142 C390,146 430,150 450,170 C462,182 464,196 462,214" fill="none" stroke="#FEF3C7" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="56" font-size="14" text-anchor="start" fill="#047857" font-weight="700">Land</text><text x="300" y="70" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Coast changes direction here</text><line x1="340" y1="78" x2="372" y2="124" stroke="#102A43" stroke-width="2" marker-end="url(#ai)"/><text x="250" y="218" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">Spit: a ridge of sand</text><text x="250" y="236" font-size="13" text-anchor="middle" fill="#047857">joined to the land at one end</text><line x1="300" y1="204" x2="380" y2="154" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><text x="480" y="300" font-size="14" text-anchor="end" fill="#047857" font-weight="700">Curved (recurved) end</text><line x1="450" y1="284" x2="460" y2="228" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><path d="M30,150 L62,172 L96,150 L128,172 L162,150 L194,172 L228,150 L260,172 L294,150 L326,172" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="30" y1="112" x2="330" y2="112" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/><text x="180" y="104" font-size="13" text-anchor="middle" fill="#047857" font-weight="700" stroke="#ECFDF5" stroke-width="5" paint-order="stroke">Longshore drift moves sand this way</text><text x="30" y="290" font-size="14" text-anchor="start" fill="#102A43" font-weight="700">Prevailing wind and waves</text><line x1="40" y1="276" x2="90" y2="236" stroke="#102A43" stroke-width="3" marker-end="url(#ai)"/><text x="30" y="330" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">Open sea</text><text x="440" y="250" font-size="13" text-anchor="end" fill="#2563EB" font-weight="700">Sheltered</text><text x="440" y="266" font-size="13" text-anchor="end" fill="#2563EB" font-weight="700">water</text></svg>