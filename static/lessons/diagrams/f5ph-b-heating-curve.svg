<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Heating curve of ice to steam</title><rect width="560" height="360" fill="#FFFFFF"/><line x1="80.0" y1="300.0" x2="540.0" y2="300.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="540.0,300.0 530.1,304.8 530.1,295.2" fill="#102A43"/><line x1="80.0" y1="300.0" x2="80.0" y2="30.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><polygon points="80.0,30.0 84.8,39.9 75.2,39.9" fill="#102A43"/><text x="540.0" y="344.0" font-size="14" fill="#102A43" text-anchor="end" font-weight="normal">time (min)</text><text x="72.0" y="22.0" font-size="14" fill="#102A43" text-anchor="start" font-weight="normal">temperature (&#176;C)</text><line x1="74.0" y1="300.0" x2="80.0" y2="300.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="70.0" y="305.0" font-size="13" fill="#102A43" text-anchor="end" font-weight="normal">-20</text><line x1="74.0" y1="264.0" x2="80.0" y2="264.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="70.0" y="269.0" font-size="13" fill="#102A43" text-anchor="end" font-weight="normal">0</text><line x1="74.0" y1="84.0" x2="80.0" y2="84.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/><text x="70.0" y="89.0" font-size="13" fill="#102A43" text-anchor="end" font-weight="normal">100</text><line x1="80.0" y1="264.0" x2="260.0" y2="264.0" stroke="#102A43" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="80.0" y1="84.0" x2="380.0" y2="84.0" stroke="#102A43" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><polyline points="80.0,300.0 160.0,264.0 260.0,264.0 380.0,84.0 480.0,84.0 520.0,48.0" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="95.0" y="250.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">ice warms</text><text x="210.0" y="254.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">melting</text><text x="332.0" y="175.0" font-size="14" fill="#2563EB" text-anchor="start" font-weight="normal">water warms</text><text x="430.0" y="74.0" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">boiling</text><text x="498.0" y="114.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="normal">steam</text></svg>