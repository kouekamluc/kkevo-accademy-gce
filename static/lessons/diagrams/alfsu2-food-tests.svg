<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102A43"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker></defs><text x="280" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43">Testing an unknown food sample</text><text x="280" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43">Use a separate portion of the extract for each test</text><rect x="14" y="80" width="158" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="93" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Iodine</text><text x="93" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">tests for starch</text><rect x="224" y="80" width="160" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="304" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Positive:</text><text x="304" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">blue-black</text><rect x="432" y="80" width="118" height="50" rx="8" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="491" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Negative:</text><text x="491" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">stays brown</text><line x1="172" y1="105" x2="222" y2="105" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="384" y1="105" x2="430" y2="105" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><rect x="14" y="146" width="158" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="93" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Benedict's</text><text x="93" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">reducing sugar</text><rect x="224" y="146" width="160" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="304" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Positive:</text><text x="304" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">green to brick-red</text><rect x="432" y="146" width="118" height="50" rx="8" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="491" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Negative:</text><text x="491" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">stays blue</text><line x1="172" y1="171" x2="222" y2="171" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="384" y1="171" x2="430" y2="171" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><rect x="14" y="212" width="158" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="93" y="233" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Biuret</text><text x="93" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">tests for protein</text><rect x="224" y="212" width="160" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="304" y="233" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Positive:</text><text x="304" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">violet</text><rect x="432" y="212" width="118" height="50" rx="8" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="491" y="233" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Negative:</text><text x="491" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">stays blue</text><line x1="172" y1="237" x2="222" y2="237" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="384" y1="237" x2="430" y2="237" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><rect x="14" y="278" width="158" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="93" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">Ethanol emulsion</text><text x="93" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">tests for fat</text><rect x="224" y="278" width="160" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="304" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Positive:</text><text x="304" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">cloudy white</text><rect x="432" y="278" width="118" height="50" rx="8" fill="#ffffff" stroke="#B45309" stroke-width="2"/><text x="491" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Negative:</text><text x="491" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">stays clear</text><line x1="172" y1="303" x2="222" y2="303" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><line x1="384" y1="303" x2="430" y2="303" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><text x="280" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Record every result, including the negative ones.</text></svg>