<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Problems of manufacturing and where they come from</text><rect x="200" y="150" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="280" y="176" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Weak industry:</text><text x="280" y="193" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">low output, high cost</text><rect x="20" y="50" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95" y="81" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Power cuts</text><rect x="205" y="50" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="81" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">High transport cost</text><rect x="390" y="50" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465" y="81" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Little capital</text><rect x="20" y="262" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95" y="293" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Few skilled workers</text><rect x="205" y="262" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="285" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Small market,</text><text x="280" y="301" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">competition</text><rect x="390" y="262" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465" y="293" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Taxes and red tape</text><line x1="95" y1="102" x2="224.3" y2="146.7" stroke="#102A43" stroke-width="2"/><polygon points="233.75,150 225.9,142.0 222.7,151.5" fill="#102A43"/><line x1="280" y1="102" x2="280.0" y2="140.0" stroke="#102A43" stroke-width="2"/><polygon points="280.0,150 285.0,140.0 275.0,140.0" fill="#102A43"/><line x1="465" y1="102" x2="335.7" y2="146.7" stroke="#102A43" stroke-width="2"/><polygon points="326.25,150 337.3,151.5 334.1,142.0" fill="#102A43"/><line x1="95" y1="262" x2="224.4" y2="213.5" stroke="#102A43" stroke-width="2"/><polygon points="233.75,210 222.6,208.8 226.1,218.2" fill="#102A43"/><line x1="280" y1="262" x2="280.0" y2="220.0" stroke="#102A43" stroke-width="2"/><polygon points="280.0,210 275.0,220.0 285.0,220.0" fill="#102A43"/><line x1="465" y1="262" x2="335.6" y2="213.5" stroke="#102A43" stroke-width="2"/><polygon points="326.25,210 333.9,218.2 337.4,208.8" fill="#102A43"/><text x="280" y="345" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Each problem raises costs or lowers sales.</text></svg>