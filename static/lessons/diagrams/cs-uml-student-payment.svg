<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>UML class diagram: Student and Payment</title><defs><marker id="usn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="usb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="usg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="290" fill="#FFFFFF"/><rect x="15" y="30" width="285" height="192" rx="0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><rect x="16.25" y="31.25" width="282.5" height="37.5" fill="#EFF6FF"/><text x="157.5" y="56" font-size="17" text-anchor="middle" font-weight="bold" fill="#2563EB">Student</text><path d="M15 70 L300 70" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><text x="27" y="96" font-size="15" fill="#102A43">- studentID : String</text><text x="27" y="120" font-size="15" fill="#102A43">- name : String</text><text x="27" y="144" font-size="15" fill="#102A43">- feeBalance : Integer</text><path d="M15 158 L300 158" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><text x="27" y="184" font-size="15" fill="#102A43">+ recordPayment(amount : Integer)</text><text x="27" y="208" font-size="15" fill="#102A43">+ getBalance() : Integer</text><path d="M15 70 L300 70" fill="none" stroke="#102A43" stroke-width="2" stroke-linejoin="round"/><rect x="370" y="30" width="180" height="168" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2.5"/><rect x="371.25" y="31.25" width="177.5" height="37.5" fill="#EFF6FF"/>