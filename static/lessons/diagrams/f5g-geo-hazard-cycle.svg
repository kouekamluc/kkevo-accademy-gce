<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><rect x="30" y="45" width="200" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="130.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">1. Monitor</text><text x="130.0" y="101.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Seismographs, gas and</text><text x="130.0" y="120.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">ground checks; hazard maps</text><rect x="330" y="45" width="200" height="100" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="430.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">2. Prepare</text><text x="430.0" y="101.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Safer buildings, drills,</text><text x="430.0" y="120.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">evacuation plans, supplies</text><rect x="330" y="215" width="200" height="100" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="430.0" y="245.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">3. Warn and respond</text><text x="430.0" y="271.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Alerts, evacuation,</text><text x="430.0" y="290.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">search, rescue, first aid</text><rect x="30" y="215" width="200" height="100" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="130.0" y="245.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#102A43">4. Recover</text><text x="130.0" y="271.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">Repair, rebuild safer,</text><text x="130.0" y="290.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#102A43">review what worked</text><line x1="235.0" y1="95.0" x2="319.0" y2="95.0" stroke="#102A43" stroke-width="3"/><polygon points="325.0,95.0 315.1,99.8 315.1,90.2" fill="#102A43"/><line x1="430.0" y1="150.0" x2="430.0" y2="204.0" stroke="#102A43" stroke-width="3"/><polygon points="430.0,210.0 425.2,200.1 434.8,200.1" fill="#102A43"/><line x1="325.0" y1="265.0" x2="241.0" y2="265.0" stroke="#102A43" stroke-width="3"/><polygon points="235.0,265.0 244.9,260.2 244.9,269.8" fill="#102A43"/><line x1="130.0" y1="210.0" x2="130.0" y2="156.0" stroke="#102A43" stroke-width="3"/><polygon points="130.0,150.0 134.8,159.9 125.2,159.9" fill="#102A43"/><text x="280.0" y="336.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#64748B">The cycle repeats: lessons learned improve the next round of monitoring.</text></svg>