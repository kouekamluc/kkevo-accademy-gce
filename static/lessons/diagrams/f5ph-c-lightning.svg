<text x="95" y="56" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">&#8722;</text>
<text x="125" y="56" font-size="18" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">&#8722;</text>
