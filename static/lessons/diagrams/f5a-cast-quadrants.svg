<line x1="280.0" y1="180.0" x2="181.7" y2="248.8" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="181.7" cy="248.8" r="4" fill="#047857"/>
<line x1="280.0" y1="180.0" x2="378.3" y2="248.8" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="378.3" cy="248.8" r="4" fill="#047857"/>
<text x="470.0" y="55.0" font-size="30" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="800">A</text>
<text x="470.0" y="85.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">all positive</text>
<text x="470.0" y="107.0" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">α</text>
<text x="90.0" y="55.0" font-size="30" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="800">S</text>
<text x="90.0" y="85.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">sin positive</text>
<text x="90.0" y="107.0" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">180° − α</text>
<text x="90.0" y="270.0" font-size="30" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="800">T</text>
<text x="90.0" y="300.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">tan positive</text>
<text x="90.0" y="322.0" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">180° + α</text>
<text x="470.0" y="270.0" font-size="30" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="800">C</text>
<text x="470.0" y="300.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">cos positive</text>
<text x="470.0" y="322.0" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">360° − α</text>
<path d="M316.0,180.0 A36,36 0 0 0 309.5,159.4" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="329.6" y="164.4" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">α</text>
<text x="458.0" y="198.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">x</text>
<text x="296.0" y="22.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">y</text>
<text x="266.0" y="196.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">O</text>
