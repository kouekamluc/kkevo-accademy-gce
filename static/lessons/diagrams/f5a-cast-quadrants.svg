<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>The four quadrants and CAST: All positive in the first, sin positive in the second, tan positive in the third, cos positive in the fourth; related angles alpha, 180 minus alpha, 180 plus alpha, 360 minus alpha</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="110.0" y1="180.0" x2="455.0" y2="180.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="280.0" y1="345.0" x2="280.0" y2="15.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="455.0,180.0 445.0,175.0 445.0,185.0" fill="#102A43"/>
<polygon points="280.0,15.0 275.0,25.0 285.0,25.0" fill="#102A43"/>
<circle cx="280" cy="180" r="120" fill="none" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="280.0" y1="180.0" x2="378.3" y2="111.2" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="378.3" cy="111.2" r="4" fill="#2563EB"/>
