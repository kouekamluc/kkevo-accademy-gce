<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43"><title>A good division of triangles by their angles</title><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="190" y="25" width="180" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="57" font-size="17" fill="#102A43" text-anchor="middle" font-weight="bold">Triangles</text><text x="280" y="102" font-size="14" fill="#B45309" text-anchor="middle" font-weight="bold">basis: size of the angles</text><path d="M280 110 L105 170" fill="none" stroke="#102A43" stroke-width="2"/><rect x="30" y="170" width="150" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="105" y="202" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Acute-angled</text><path d="M280 110 L280 170" fill="none" stroke="#102A43" stroke-width="2"/><rect x="205" y="170" width="150" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="202" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Right-angled</text><path d="M280 110 L455 170" fill="none" stroke="#102A43" stroke-width="2"/><rect x="380" y="170" width="150" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="455" y="202" font-size="15" fill="#102A43" text-anchor="middle" font-weight="bold">Obtuse-angled</text><text x="280" y="262" font-size="14" fill="#102A43" text-anchor="middle">One basis. The members together make up the whole.</text><text x="280" y="285" font-size="14" fill="#102A43" text-anchor="middle">No triangle is in two members.</text><text x="280" y="320" font-size="13" fill="#2563EB" text-anchor="middle">Whole = Triangles   |   Members = three kinds   |   Basis = angles</text></svg>