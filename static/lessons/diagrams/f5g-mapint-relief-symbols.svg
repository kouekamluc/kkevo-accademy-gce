<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" role="img" font-family="Inter, Arial, sans-serif"><title>Six ways relief is shown on a map: contour, spot height, trig station, bench mark, hachures and layer tinting</title><rect width="640" height="435" fill="#fff"/><rect x="20" y="38" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><rect x="20" y="96" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><rect x="20" y="154" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><rect x="20" y="212" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><rect x="20" y="270" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><rect x="20" y="328" width="600" height="50" fill="#EFF6FF" stroke="#64748B" stroke-width="1.5"/><path d="M30,72 Q60,48 90,68 T135,56" fill="none" stroke="#B45309" stroke-width="2.6"/><circle cx="75" cy="120" r="3.2" fill="#102A43"/><path d="M75,169 L82,182 L68,182 Z" fill="none" stroke="#102A43" stroke-width="2"/><circle cx="75" cy="179" r="1.8" fill="#102A43"/><path d="M45,232 l8,8 M53,232 l-8,8" stroke="#102A43" stroke-width="2"/><path d="M36,276 l0,34M49,276 l0,20M62,276 l0,34M75,276 l0,20M88,276 l0,34M101,276 l0,20M114,276 l0,34M127,276 l0,20" stroke="#102A43" stroke-width="2" fill="none"/><rect x="28" y="343" width="26" height="18" fill="#A7F3D0" stroke="#102A43" stroke-width="1.5"/><rect x="54" y="343" width="26" height="18" fill="#FDE68A" stroke="#102A43" stroke-width="1.5"/><rect x="80" y="343" width="26" height="18" fill="#FCD34D" stroke="#102A43" stroke-width="1.5"/><rect x="106" y="343" width="26" height="18" fill="#D97706" stroke="#102A43" stroke-width="1.5"/><g font-size="15" fill="#102A43" text-anchor="middle" font-weight="700"><text x="320" y="22">How relief is shown on a map</text></g><g font-size="13" fill="#102A43" text-anchor="start" font-weight="700"><text x="150" y="66">Contour line</text><text x="150" y="124">Spot height</text><text x="150" y="182">Trig. station</text><text x="150" y="240">Bench mark</text><text x="150" y="298">Hachures</text><text x="150" y="356">Layer tinting</text></g><g font-size="13" fill="#102A43" text-anchor="start"><text x="250" y="59">Joins places of equal height above sea level.</text><text x="250" y="117">A dot with a number: the exact height of one point.</text><text x="250" y="175">A triangle with a dot: a fixed survey point.</text><text x="250" y="233">Marked BM with a height: a cut mark on a bridge,</text><text x="250" y="291">Short lines drawn down the slope, close and thick</text><text x="250" y="349">Colours between contour heights: low land green,</text><text x="86" y="125">412</text><text x="92" y="183">586</text><text x="62" y="241">BM 330</text></g><g font-size="13" fill="#64748B" text-anchor="start"><text x="250" y="77">The height is written on some lines.</text><text x="250" y="135">Often placed on hilltops, roads and junctions.</text><text x="250" y="193">Usually on high ground, with its height.</text><text x="250" y="251">building or rock, used by surveyors.</text><text x="250" y="309">where the slope is steep, thin where gentle.</text><text x="250" y="367">higher land yellow and brown, highest darker.</text><text x="28" y="374">low</text></g><g font-size="13" fill="#B45309" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><text x="98" y="56">300</text></g><g font-size="13" fill="#64748B" text-anchor="end"><text x="132" y="374">high</text></g><g font-size="13" fill="#64748B" text-anchor="middle"><text x="320" y="418">Contours and spot heights are the methods you will meet most often.</text></g></svg>