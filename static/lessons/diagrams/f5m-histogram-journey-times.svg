<line x1="344" y1="296" x2="344" y2="302" stroke="#102A43" stroke-width="2"/>
<text x="344" y="316" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">30</text>
<line x1="432" y1="296" x2="432" y2="302" stroke="#102A43" stroke-width="2"/>
