<text x="300" y="340" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Journey time t (minutes)</text>
<text x="22" y="168" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 22 168)">Frequency</text>
