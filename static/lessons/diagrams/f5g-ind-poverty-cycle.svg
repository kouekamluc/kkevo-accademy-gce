<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Cycle: low incomes lead to little saving, few factories, few skills, low output and back to low incomes"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="380" fill="#ffffff"/><text x="280.0" y="24.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">The cycle that holds back industry in many LICs</text><line x1="341.1" y1="96.2" x2="387.3" y2="119.8" stroke="#B45309" stroke-width="2" marker-end="url(#ar)"/><line x1="441.5" y1="186.1" x2="405.0" y2="264.9" stroke="#B45309" stroke-width="2" marker-end="url(#ar)"/><line x1="308.3" y1="300.2" x2="255.5" y2="300.2" stroke="#B45309" stroke-width="2" marker-end="url(#ar)"/><line x1="156.8" y1="268.9" x2="120.4" y2="190.1" stroke="#B45309" stroke-width="2" marker-end="url(#ar)"/><line x1="165.2" y1="123.6" x2="211.4" y2="100.0" stroke="#B45309" stroke-width="2" marker-end="url(#ar)"/><rect x="205.0" y="39.0" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280.0" y="69.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Low incomes</text><rect x="380.9" y="128.8" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="455.9" y="151.2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Little saving,</text><text x="455.9" y="168.2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">little capital</text><rect x="313.7" y="274.2" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="388.7" y="296.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Few factories,</text><text x="388.7" y="313.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">old technology</text><rect x="96.3" y="274.2" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="171.3" y="296.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Few skills,</text><text x="171.3" y="313.6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">weak markets</text><rect x="29.1" y="128.8" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="104.1" y="151.2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle">Low output,</text><text x="104.1" y="168.2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">few jobs</text><text x="280.0" y="200.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Poverty trap</text></svg>