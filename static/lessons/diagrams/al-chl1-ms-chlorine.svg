<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Mass spectrum of chlorine gas with peaks at m/z 35, 37, 70, 72 and 74</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="95.0" y1="45.0" x2="95.0" y2="300.0" stroke="#102A43" stroke-width="2.5" />
<line x1="95.0" y1="300.0" x2="520.0" y2="300.0" stroke="#102A43" stroke-width="2.5" />
<text x="307.5" y="346.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >m/z</text>
<text x="18" y="172.5" font-size="14" font-weight="700" fill="#102A43" text-anchor="middle" transform="rotate(-90 18 172.5)">relative abundance</text>
<rect x="131.5" y="85.2" width="12.0" height="214.8" fill="#2563EB" stroke="#2563EB" stroke-width="1" rx="0" />
<rect x="148.5" y="231.4" width="12.0" height="68.6" fill="#2563EB" stroke="#2563EB" stroke-width="1" rx="0" />
<rect x="429.0" y="140.8" width="12.0" height="159.2" fill="#2563EB" stroke="#2563EB" stroke-width="1" rx="0" />
<rect x="446.0" y="193.8" width="12.0" height="106.2" fill="#2563EB" stroke="#2563EB" stroke-width="1" rx="0" />
<rect x="463.0" y="282.1" width="12.0" height="17.9" fill="#2563EB" stroke="#2563EB" stroke-width="1" rx="0" />
<text x="133.5" y="320.0" font-size="14" fill="#102A43" text-anchor="end" font-weight="600" >35</text>
<text x="158.5" y="320.0" font-size="14" fill="#102A43" text-anchor="start" font-weight="600" >37</text>
<text x="431.0" y="320.0" font-size="14" fill="#102A43" text-anchor="end" font-weight="600" >70</text>
<text x="452.0" y="320.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="600" >72</text>
<text x="473.0" y="320.0" font-size="14" fill="#102A43" text-anchor="start" font-weight="600" >74</text>
<text x="300.0" y="30.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >Chlorine gas, Cl2: peaks at 70, 72 and 74 in the ratio 9 : 6 : 1</text>
<text x="160.0" y="96.0" font-size="13" fill="#B45309" text-anchor="start" font-weight="600" >35Cl+ and 37Cl+ in the ratio 3 : 1</text>
<text x="250.0" y="170.0" font-size="13" fill="#047857" text-anchor="start" font-weight="600" >m/z 70 = 35Cl-35Cl</text>
<text x="250.0" y="190.0" font-size="13" fill="#047857" text-anchor="start" font-weight="600" >m/z 72 = 35Cl-37Cl</text>
<text x="250.0" y="210.0" font-size="13" fill="#047857" text-anchor="start" font-weight="600" >m/z 74 = 37Cl-37Cl</text>
</svg>
