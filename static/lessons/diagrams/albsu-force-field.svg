<text x="272" y="88" font-size="13" text-anchor="end" fill="#047857">Customers want faster service (5)</text>
<line x1="190" y1="170" x2="277" y2="170" stroke="#047857" stroke-width="5" marker-end="url(#ag)"/>
<text x="272" y="158" font-size="13" text-anchor="end" fill="#047857">Lower running costs (4)</text>
<line x1="212" y1="240" x2="277" y2="240" stroke="#047857" stroke-width="5" marker-end="url(#ag)"/>
<text x="272" y="228" font-size="13" text-anchor="end" fill="#047857">Rivals already changed (3)</text>
<line x1="370" y1="100" x2="283" y2="100" stroke="#B45309" stroke-width="5" marker-end="url(#ab)"/>
<text x="288" y="88" font-size="13" fill="#B45309">Fear of job losses (4)</text>
<line x1="348" y1="170" x2="283" y2="170" stroke="#B45309" stroke-width="5" marker-end="url(#ab)"/>
<text x="288" y="158" font-size="13" fill="#B45309">Cost of training (3)</text>
