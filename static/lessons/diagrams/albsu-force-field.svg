<text x="288" y="228" font-size="13" fill="#B45309">Lack of IT skills (2)</text>
<text x="140" y="320" font-size="14" text-anchor="middle" fill="#047857">Total 12</text>
<text x="420" y="320" font-size="14" text-anchor="middle" fill="#B45309">Total 9</text>
<text x="280" y="348" font-size="13" text-anchor="middle" fill="#102A43">Scores 1 (weak) to 5 (strong); arrow length shows strength</text>
