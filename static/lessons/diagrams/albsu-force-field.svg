<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#FFFFFF"/>
<defs><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#047857"/></marker></defs>
<defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#B45309"/></marker></defs>
<line x1="280" y1="40" x2="280" y2="300" stroke="#102A43" stroke-width="3"/>
<text x="280" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#102A43">Change: new computer system</text>
<text x="140" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">Driving forces</text>
<text x="420" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#B45309">Restraining forces</text>
