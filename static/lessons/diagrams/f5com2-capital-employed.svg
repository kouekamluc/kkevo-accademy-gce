<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Two columns showing fixed assets plus working capital on the left, and long-term loan plus capital owned on the right, both totalling 16 500 000 francs"><rect width="560" height="360" fill="#fff"/>
<text x="280" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" font-weight="700">Capital employed: uses and sources (invented figures, FCFA)</text>
<text x="140" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" font-weight="700">USES of capital</text>
<text x="420" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" font-weight="700">SOURCES of capital</text>
<rect x="40" y="70" width="200" height="110" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="140.0" y="120.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Fixed assets</text><text x="140.0" y="138.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">14 000 000</text>
<rect x="40" y="180" width="200" height="70" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="140.0" y="201.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Working capital</text><text x="140.0" y="219.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">4 000 000 - 1 500 000</text><text x="140.0" y="237.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">= 2 500 000</text>
<rect x="320" y="70" width="200" height="70" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="420.0" y="100.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Long-term loan</text><text x="420.0" y="118.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">5 000 000</text>
<rect x="320" y="140" width="200" height="110" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="420.0" y="181.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">Capital owned</text><text x="420.0" y="199.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">16 500 000 - 5 000 000</text><text x="420.0" y="217.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">= 11 500 000</text>
<text x="140" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309" font-weight="700">Capital employed = 16 500 000</text>
<text x="420" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309" font-weight="700">Capital employed = 16 500 000</text>
<text x="280" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43">Both sides add up to the same total.</text>
</svg>
