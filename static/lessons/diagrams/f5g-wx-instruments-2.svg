<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Barometer, hygrometer, sunshine recorder and cloud cover</title><defs><marker id="i2i" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="i2b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="i2g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="i2r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="i2s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="135" y="24" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Aneroid barometer (pressure)</text><circle cx="80" cy="110" r="52" fill="#fff" stroke="#102A43" stroke-width="3"/><line x1="49.5944" y1="140.406" x2="44.3335" y2="145.666" stroke="#102A43" stroke-width="2"/><line x1="37.8262" y1="118.389" x2="30.5292" y2="119.84" stroke="#102A43" stroke-width="2"/><line x1="40.2732" y1="93.5446" x2="33.3995" y2="90.6974" stroke="#102A43" stroke-width="2"/><line x1="56.1105" y1="74.2468" x2="51.977" y2="68.0607" stroke="#102A43" stroke-width="2"/><line x1="80" y1="67" x2="80" y2="59.56" stroke="#102A43" stroke-width="2"/><line x1="103.89" y1="74.2468" x2="108.023" y2="68.0607" stroke="#102A43" stroke-width="2"/><line x1="119.727" y1="93.5446" x2="126.6" y2="90.6974" stroke="#102A43" stroke-width="2"/><line x1="122.174" y1="118.389" x2="129.471" y2="119.84" stroke="#102A43" stroke-width="2"/><line x1="110.406" y1="140.406" x2="115.666" y2="145.666" stroke="#102A43" stroke-width="2"/><line x1="80" y1="110" x2="97.2516" y2="76.1418" stroke="#B45309" stroke-width="3.5"/><circle cx="80" cy="110" r="4" fill="#B45309" stroke="#B45309" stroke-width="2"/><text x="80" y="146" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">hPa</text><text x="80" y="178" font-size="13" text-anchor="middle" fill="#64748B">Sealed metal box inside</text><text x="150" y="98" font-size="13" text-anchor="start" fill="#102A43">Needle shows</text><text x="150" y="114" font-size="13" text-anchor="start" fill="#102A43">the pressure</text><text x="415" y="24" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Wet-and-dry bulb hygrometer</text><rect x="325" y="44" width="10" height="90" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><circle cx="330" cy="142" r="9" fill="#102A43" stroke="#102A43" stroke-width="2.5"/><rect x="375" y="44" width="10" height="90" rx="0" fill="#fff" stroke="#102A43" stroke-width="2.5"/><circle cx="380" cy="142" r="9" fill="#2563EB" stroke="#102A43" stroke-width="2.5"/><rect x="370" y="158" width="40" height="20" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><line x1="380" y1="150" x2="384" y2="164" stroke="#2563EB" stroke-width="2.5"/><text x="330" y="38" font-size="13" text-anchor="middle" fill="#102A43" font-weight="bold">Dry</text><text x="380" y="38" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="bold">Wet</text><text x="415" y="80" font-size="13" text-anchor="start" fill="#102A43">Wet bulb reads</text><text x="415" y="96" font-size="13" text-anchor="start" fill="#102A43">lower in dry air:</text><text x="415" y="112" font-size="13" text-anchor="start" fill="#102A43">the gap gives</text><text x="415" y="128" font-size="13" text-anchor="start" fill="#102A43" font-weight="bold">humidity</text><text x="418" y="172" font-size="13" text-anchor="start" fill="#2563EB">water + wick</text><text x="135" y="214" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Sunshine recorder (hours)</text><path d="M48,254 A64,64 0 0 0 152,254" fill="none" stroke="#B45309" stroke-width="5"/><circle cx="100" cy="284" r="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><line x1="46" y1="244" x2="86" y2="268" stroke="#B45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#i2r)"/><circle cx="34" cy="234" r="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="176" y="262" font-size="13" text-anchor="start" fill="#102A43">Glass ball focuses</text><text x="176" y="278" font-size="13" text-anchor="start" fill="#102A43">the sun's rays:</text><text x="176" y="294" font-size="13" text-anchor="start" fill="#102A43">a burnt line forms</text><text x="176" y="310" font-size="13" text-anchor="start" fill="#B45309" font-weight="bold">on the card</text><text x="435" y="214" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Cloud cover in oktas (eighths)</text><circle cx="328" cy="270" r="20" fill="#fff" stroke="#102A43" stroke-width="2.5"/><text x="328" y="308" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">0</text><circle cx="378" cy="270" r="20" fill="#fff" stroke="#102A43" stroke-width="2.5"/><path d="M378,270 L378,250 A20,20 0 0 1 398.0,270.0 Z" fill="#64748B" stroke="#102A43" stroke-width="2"/><text x="378" y="308" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">2</text><circle cx="428" cy="270" r="20" fill="#fff" stroke="#102A43" stroke-width="2.5"/><path d="M428,270 L428,250 A20,20 0 0 1 428.0,290.0 Z" fill="#64748B" stroke="#102A43" stroke-width="2"/><text x="428" y="308" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">4</text><circle cx="478" cy="270" r="20" fill="#fff" stroke="#102A43" stroke-width="2.5"/><path d="M478,270 L478,250 A20,20 0 1 1 458.0,270.0 Z" fill="#64748B" stroke="#102A43" stroke-width="2"/><text x="478" y="308" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">6</text><circle cx="528" cy="270" r="20" fill="#fff" stroke="#102A43" stroke-width="2.5"/><circle cx="528" cy="270" r="20" fill="#64748B" stroke="#102A43" stroke-width="2.5"/><text x="528" y="308" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">8</text><text x="435" y="338" font-size="13" text-anchor="middle" fill="#64748B">0 = clear sky, 8 = completely covered</text></svg>