<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="10" width="540" height="340" rx="0" fill="#EFF6FF" stroke="#EFF6FF" stroke-width="0"/><path d="M10,10 L550,10 L550,170 C520,190 500,200 470,214 C440,246 400,282 330,298 C260,310 200,296 150,262 C110,230 70,214 10,200 Z" fill="#ECFDF5" stroke="#047857" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,10 L280,110" fill="none" stroke="#2563EB" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,110 C270,150 220,190 175,258" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,110 C275,170 250,220 235,292" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,110 C282,170 290,230 300,296" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,110 C300,160 350,200 395,262" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,110 C320,140 420,170 480,212" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="34" font-size="14" text-anchor="start" fill="#047857" font-weight="700">Land</text><text x="300" y="60" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">River brings sediment</text><text x="300" y="78" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">from the land</text><text x="140" y="130" font-size="14" text-anchor="end" fill="#2563EB" font-weight="700">Distributaries</text><line x1="142" y1="130" x2="215" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/><text x="110" y="334" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">Sea: waves and currents</text><text x="110" y="350" font-size="13" text-anchor="start" fill="#2563EB">are weak, so silt settles</text><text x="450" y="110" font-size="17" text-anchor="middle" fill="#047857" font-weight="700">Delta</text><text x="450" y="128" font-size="13" text-anchor="middle" fill="#047857">(flat, built of silt)</text><text x="440" y="268" font-size="14" text-anchor="start" fill="#102A43" font-weight="700">Coast pushes</text><text x="440" y="284" font-size="14" text-anchor="start" fill="#102A43" font-weight="700">out to sea</text><line x1="500" y1="292" x2="470" y2="322" stroke="#102A43" stroke-width="2" marker-end="url(#ai)"/></svg>