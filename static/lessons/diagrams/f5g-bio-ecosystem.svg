<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="22" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">An ecosystem: living things and non-living things working together</text><circle cx="60" cy="75" r="26" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><text x="60" y="118" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Sun</text><rect x="130" y="50" width="140" height="62" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="200.0" y="72" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Producers</text><text x="200.0" y="90" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">green plants</text><text x="200.0" y="108" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">make food</text><rect x="310" y="50" width="150" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="385.0" y="72" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Consumers</text><text x="385.0" y="90" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">animals eat plants</text><text x="385.0" y="108" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">or other animals</text><rect x="310" y="190" width="150" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="385.0" y="212" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Decomposers</text><text x="385.0" y="230" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">fungi, bacteria, worms</text><text x="385.0" y="248" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">rot dead matter</text><rect x="40" y="285" width="480" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="307" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Non-living (abiotic) parts: soil, water, air, sunlight, temperature</text><text x="280.0" y="325" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">They supply what plants need to grow</text><line x1="88" y1="75" x2="128" y2="75" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><line x1="272" y1="80" x2="308" y2="80" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><text x="290" y="72" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">eaten</text><line x1="385" y1="114" x2="385" y2="188" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><text x="392" y="155" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">dead bodies</text><line x1="200" y1="114" x2="330" y2="188" stroke="#64748B" stroke-width="2.5" marker-end="url(#ar)" stroke-dasharray="6 4"/><text x="240" y="175" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">dead plants</text><line x1="310" y1="235" x2="200" y2="283" stroke="#047857" stroke-width="2.5" marker-end="url(#ar)"/><text x="326" y="276" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="400">nutrients return to soil</text><line x1="150" y1="283" x2="175" y2="114" stroke="#047857" stroke-width="2.5" marker-end="url(#ar)"/><text x="14" y="188" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="400">plants take up</text><text x="14" y="204" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="start" font-weight="400">water and nutrients</text></svg>