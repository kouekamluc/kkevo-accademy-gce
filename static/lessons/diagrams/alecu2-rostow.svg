<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Rostow's five stages of economic growth drawn as a staircase">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#102A43"/></marker><marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563EB"/></marker></defs>
<rect width="560" height="360" fill="#fff"/>
<rect x="20.0" y="260.0" width="100.0" height="60.0" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="284.0" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">Traditional</text>
<text x="70.0" y="302.0" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700">society</text>
<text x="70.0" y="308.0" font-size="14" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text>
