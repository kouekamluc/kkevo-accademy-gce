<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A motor neurone: cell body with nucleus and dendrites, a long axon with myelin sheath and nodes, and nerve endings</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="95" y1="175" x2="30" y2="120" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="95" y1="175" x2="22" y2="170" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="95" y1="175" x2="30" y2="225" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="95" y1="175" x2="60" y2="100" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<line x1="95" y1="175" x2="62" y2="245" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="115" cy="175" r="42" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<circle cx="115" cy="175" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<line x1="157" y1="175" x2="440" y2="175" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<rect x="190" y="160" width="70" height="30" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<rect x="275" y="160" width="70" height="30" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<rect x="360" y="160" width="70" height="30" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<line x1="440" y1="175" x2="506" y2="130" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="130" r="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<line x1="440" y1="175" x2="516" y2="175" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="530" cy="175" r="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<line x1="440" y1="175" x2="506" y2="222" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="520" cy="222" r="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="105" y="50" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Dendrites</text>
<line x1="88" y1="62" x2="62" y2="100" stroke="#102A43" stroke-width="1.5" stroke-linecap="round"/>
<text x="115" y="262" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Cell body</text>
<line x1="115" y1="250" x2="115" y2="218" stroke="#102A43" stroke-width="1.5" stroke-linecap="round"/>
<text x="115" y="285" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(with nucleus)</text>
<text x="300" y="108" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Axon</text>
<line x1="300" y1="120" x2="300" y2="172" stroke="#102A43" stroke-width="1.5" stroke-linecap="round"/>
<text x="228" y="232" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Myelin sheath</text>
<line x1="228" y1="220" x2="228" y2="192" stroke="#102A43" stroke-width="1.5" stroke-linecap="round"/>
<text x="350" y="262" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Node of Ranvier</text>
<line x1="350" y1="250" x2="345" y2="178" stroke="#102A43" stroke-width="1.5" stroke-linecap="round"/>
<text x="495" y="100" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Nerve endings</text>
<text x="495" y="270" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">to muscle</text>
<line x1="200" y1="318" x2="400" y2="318" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
<polygon points="400,318 391.0,322.3 391.0,313.7" fill="#B45309"/>
<text x="300" y="340" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">impulse travels this way</text>
</svg>
