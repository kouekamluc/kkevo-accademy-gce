<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Push factors in rural areas and pull factors of towns cause rural-urban migration</title><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="10" y="20" width="230" height="290" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="125.0" y="50.0" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">RURAL AREA: PUSH</text><text x="125.0" y="90.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Shortage of farmland</text><text x="125.0" y="124.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Low farm incomes</text><text x="125.0" y="158.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Few schools and clinics</text><text x="125.0" y="192.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">No electricity or water</text><text x="125.0" y="226.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Drought or soil decline</text><text x="125.0" y="260.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Few non-farm jobs</text><rect x="320" y="20" width="230" height="290" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="435.0" y="50.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">TOWN OR CITY: PULL</text><text x="435.0" y="90.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Jobs and wages</text><text x="435.0" y="124.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Schools and colleges</text><text x="435.0" y="158.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Hospitals and clinics</text><text x="435.0" y="192.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Electricity and piped water</text><text x="435.0" y="226.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Markets and transport</text><text x="435.0" y="260.0" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Bright lights, new ideas</text><line x1="250.0" y1="165.0" x2="312.0" y2="165.0" stroke="#B45309" stroke-width="6" marker-end="url(#ar)" stroke-linecap="round"/><text x="280.0" y="138.0" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">Migration</text><text x="280.0" y="342.0" text-anchor="middle" font-size="14" font-weight="400" fill="#64748B">People leave because of push and are drawn by pull.</text></svg>