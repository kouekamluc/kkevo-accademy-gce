<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#102A43" font-weight="700" font-size="17">Mapping one episode in a novel</text>
<rect x="14" y="60" width="98" height="128" rx="8" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="63" y="86" text-anchor="middle" fill="#102A43" font-weight="700">Before</text>
<text x="63" y="116" text-anchor="middle" fill="#102A43">What led</text>
<text x="63" y="134" text-anchor="middle" fill="#102A43">to this</text>
<text x="63" y="152" text-anchor="middle" fill="#102A43">episode?</text>
<rect x="118" y="60" width="98" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="167" y="86" text-anchor="middle" fill="#2563EB" font-weight="700">START</text>
<text x="167" y="116" text-anchor="middle" fill="#102A43">New place,</text>
<text x="167" y="134" text-anchor="middle" fill="#102A43">time or</text>
<text x="167" y="152" text-anchor="middle" fill="#102A43">person</text>
<rect x="222" y="60" width="98" height="128" rx="8" fill="#ffffff" stroke="#102A43" stroke-width="3"/>
<text x="271" y="86" text-anchor="middle" fill="#102A43" font-weight="700">Actions</text>
<text x="271" y="116" text-anchor="middle" fill="#102A43">Who does</text>
<text x="271" y="134" text-anchor="middle" fill="#102A43">what, in</text>
<text x="271" y="152" text-anchor="middle" fill="#102A43">order</text>
<rect x="326" y="60" width="98" height="128" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="3"/>
<text x="375" y="86" text-anchor="middle" fill="#047857" font-weight="700">Outcome</text>
<text x="375" y="116" text-anchor="middle" fill="#102A43">What has</text>
<text x="375" y="134" text-anchor="middle" fill="#102A43">changed</text>
<text x="375" y="152" text-anchor="middle" fill="#102A43">by the end?</text>
<rect x="430" y="60" width="98" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="479" y="86" text-anchor="middle" fill="#2563EB" font-weight="700">END</text>
<text x="479" y="116" text-anchor="middle" fill="#102A43">Scene,</text>
<text x="479" y="134" text-anchor="middle" fill="#102A43">place or</text>
<text x="479" y="152" text-anchor="middle" fill="#102A43">mood shifts</text>
<line x1="14" y1="224" x2="528" y2="224" stroke="#102A43" stroke-width="3"/>
<text x="24" y="256" text-anchor="start" fill="#2563EB" font-weight="700">Mark where it begins</text>
<text x="526" y="256" text-anchor="end" fill="#2563EB" font-weight="700">Mark where it ends</text>
<text x="280" y="304" text-anchor="middle" fill="#102A43">Use your own copy: write the page or chapter</text>
<text x="280" y="324" text-anchor="middle" fill="#102A43">for START and END in your notes.</text>
</svg>
