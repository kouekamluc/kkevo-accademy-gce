<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Natural law and positive law</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="20" y="20" width="240" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="140.0" y="46.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Natural law</text><text x="140.0" y="65.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="140.0" y="84.9" text-anchor="middle" font-size="14" fill="#102A43">A law must respect</text><text x="140.0" y="103.9" text-anchor="middle" font-size="14" fill="#102A43">moral principles</text><text x="140.0" y="122.9" text-anchor="middle" font-size="14" fill="#102A43">known by reason</text><rect x="300" y="20" width="240" height="120" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="420.0" y="46.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Positive law</text><text x="420.0" y="65.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="420.0" y="84.9" text-anchor="middle" font-size="14" fill="#102A43">A law is valid if</text><text x="420.0" y="103.9" text-anchor="middle" font-size="14" fill="#102A43">properly enacted by</text><text x="420.0" y="122.9" text-anchor="middle" font-size="14" fill="#102A43">the authority</text><line x1="140" y1="140" x2="240" y2="200" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="420" y1="140" x2="320" y2="200" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="150" y="200" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="225.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Legitimacy and obedience</text><text x="280.0" y="244.4" text-anchor="middle" font-size="14" fill="#102A43">Why must we obey?</text><line x1="280" y1="260" x2="280" y2="288" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="290" width="440" height="56" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="280.0" y="313.4" text-anchor="middle" font-size="14" fill="#102A43">Test: is it valid? Is it just? The two</text><text x="280.0" y="332.4" text-anchor="middle" font-size="14" fill="#102A43">questions can have different answers</text></svg>