<line x1="278.0" y1="107.0" x2="278.0" y2="141.0" stroke="#B45309" stroke-width="3"/>
<text x="280.0" y="346.0" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Yf = full-employment income; Ye = equilibrium income</text>
</g></svg>