<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><text x="280.0" y="24.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">The four pillars of food security</text><rect x="40.0" y="50.0" width="480.0" height="40.0" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280.0" y="76.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="700" font-family="Inter, Arial, sans-serif">Food security: enough safe, nutritious food for all, at all times</text><rect x="40.0" y="100.0" width="114.0" height="190.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="97.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">Availability</text><text x="97.0" y="170.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">production,</text><text x="97.0" y="192.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">stocks,</text><text x="97.0" y="214.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">imports</text><rect x="162.0" y="100.0" width="114.0" height="190.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="219.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">Access</text><text x="219.0" y="170.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">income,</text><text x="219.0" y="192.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">prices,</text><text x="219.0" y="214.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">markets, roads</text><rect x="284.0" y="100.0" width="114.0" height="190.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="341.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">Utilisation</text><text x="341.0" y="170.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">diet, clean</text><text x="341.0" y="192.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">water, health,</text><text x="341.0" y="214.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">food safety</text><rect x="406.0" y="100.0" width="114.0" height="190.0" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="463.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700" font-family="Inter, Arial, sans-serif">Stability</text><text x="463.0" y="170.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">no shocks:</text><text x="463.0" y="192.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">drought, conflict,</text><text x="463.0" y="214.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">price spikes</text><rect x="30.0" y="296.0" width="500.0" height="22.0" rx="2" fill="#102A43" stroke="#102A43" stroke-width="2"/><text x="280.0" y="340.0" font-size="13" text-anchor="middle" fill="#102A43" font-family="Inter, Arial, sans-serif">All four must hold: one weak pillar brings food insecurity</text></svg>