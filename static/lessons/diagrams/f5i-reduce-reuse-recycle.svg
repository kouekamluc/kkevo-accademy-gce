<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#ffffff"/><text x="280" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#102A43">Old equipment: best action first</text><rect x="60" y="60" width="440" height="68" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">1  Reduce</text><text x="280.0" y="109" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Buy durable devices, look after them</text><line x1="280" y1="128" x2="280" y2="146" stroke="#102A43" stroke-width="2"/><polygon points="280,148 273,138 287,138" fill="#102A43"/><rect x="60" y="148" width="440" height="68" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">2  Reuse and repair</text><text x="280.0" y="197" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Fix, upgrade or give to a school</text><line x1="280" y1="216" x2="280" y2="234" stroke="#102A43" stroke-width="2"/><polygon points="280,236 273,226 287,226" fill="#102A43"/><rect x="60" y="236" width="440" height="68" rx="10" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#102A43">3  Recycle</text><text x="280.0" y="285" text-anchor="middle" font-size="14" font-weight="400" fill="#102A43">Proper collection point. Never burn it</text><text x="280" y="338" text-anchor="middle" font-size="14" fill="#102A43">First back up and erase your personal data.</text></svg>