<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="26" text-anchor="middle" fill="#102A43" font-size="14" font-weight="700">Credit creation: successive deposits</text><line x1="60" y1="300" x2="520" y2="300" stroke="#102A43" stroke-width="2"/><line x1="60" y1="50" x2="60" y2="300" stroke="#102A43" stroke-width="2"/><text x="290" y="346" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">Round of lending and re-depositing</text><text x="20" y="175" transform="rotate(-90 20 175)" text-anchor="middle">New deposit (thousand FCFA)</text><rect x="80" y="80.0" width="50" height="220.0" fill="#2563EB" stroke="#102A43" stroke-width="2"/><text x="105" y="74.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">100</text><text x="105" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">Start</text><rect x="152" y="124.0" width="50" height="176.0" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="177" y="118.0" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">80</text><text x="177" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">1</text><rect x="224" y="159.2" width="50" height="140.8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="249" y="153.2" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">64</text><text x="249" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">2</text><rect x="296" y="187.4" width="50" height="112.6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="321" y="181.4" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">51.2</text><text x="321" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">3</text><rect x="368" y="209.9" width="50" height="90.1" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="393" y="203.9" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">40.96</text><text x="393" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">4</text><rect x="440" y="227.9" width="50" height="72.1" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465" y="221.9" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">32.77</text><text x="465" y="320" text-anchor="middle" fill="#102A43" font-size="14" font-weight="400">5</text><text x="380" y="100" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">Each round the bank keeps</text><text x="380" y="118" text-anchor="middle" fill="#102A43" font-size="13" font-weight="400">part and lends the rest</text></g></svg>