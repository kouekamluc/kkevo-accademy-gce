<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<text x="280.0" y="26.0" font-size="16" text-anchor="middle" font-weight="700" fill="#102A43" >Malthus: the cycle of checks</text>
<rect x="30.0" y="60.0" width="200.0" height="76.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="130.0" y="92.0" font-size="15" text-anchor="middle" font-weight="700" fill="#102A43" >Population grows</text>
<text x="130.0" y="116.0" font-size="14" text-anchor="middle" font-weight="400" fill="#102A43" >faster than food</text>
<rect x="330.0" y="60.0" width="200.0" height="76.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="430.0" y="92.0" font-size="15" text-anchor="middle" font-weight="700" fill="#102A43" >Food runs short</text>
<text x="430.0" y="116.0" font-size="14" text-anchor="middle" font-weight="400" fill="#102A43" >hunger, high prices</text>
<rect x="330.0" y="230.0" width="200.0" height="76.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="430.0" y="262.0" font-size="15" text-anchor="middle" font-weight="700" fill="#102A43" >Checks act</text>
<text x="430.0" y="286.0" font-size="14" text-anchor="middle" font-weight="400" fill="#102A43" >famine, disease, war</text>
<rect x="30.0" y="230.0" width="200.0" height="76.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
<text x="130.0" y="262.0" font-size="15" text-anchor="middle" font-weight="700" fill="#102A43" >Population falls</text>
<text x="130.0" y="286.0" font-size="14" text-anchor="middle" font-weight="400" fill="#102A43" >and food catches up</text>
<line x1="232" y1="98" x2="326" y2="98" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/>
<line x1="430" y1="138" x2="430" y2="226" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/>
<line x1="328" y1="268" x2="234" y2="268" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/>
<line x1="130" y1="228" x2="130" y2="140" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/>
<text x="280.0" y="190.0" font-size="14" text-anchor="middle" font-weight="700" fill="#64748B" >The cycle repeats</text>
<text x="280.0" y="340.0" font-size="13" text-anchor="middle" font-weight="400" fill="#64748B" >Malthus also named 'preventive checks' such as later marriage.</text>
</svg>
