<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="10" y="6" width="250" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="135.0" y="21.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Refined oils and fats; part hardened</text><text x="135.0" y="37.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >(hydrogenated or interesterified)</text><rect x="10" y="57" width="250" height="38" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="135.0" y="72.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >FAT PHASE: blend + lecithin,</text><text x="135.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >vitamins A and D, colour</text><rect x="300" y="57" width="250" height="38" rx="6" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="425.0" y="72.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >WATER PHASE: water, salt,</text><text x="425.0" y="88.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >skimmed milk or milk solids</text><line x1="135" y1="44" x2="135" y2="57" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="108" width="300" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="123.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Pre-emulsify: mix the two phases</text><text x="280.0" y="139.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >(water droplets in oil)</text><line x1="135" y1="95" x2="200" y2="108" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="425" y1="95" x2="360" y2="108" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="159" width="300" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="182.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Pasteurise</text><line x1="280" y1="146" x2="280" y2="159" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="210" width="300" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="225.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Chill and crystallise quickly</text><text x="280.0" y="241.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >(scraped-surface cooler)</text><line x1="280" y1="197" x2="280" y2="210" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="261" width="300" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="284.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Work in a resting tube (plastic texture)</text><line x1="280" y1="248" x2="280" y2="261" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="312" width="300" height="38" rx="6" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280.0" y="335.5" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal" >Pack, then temper in store</text><line x1="280" y1="299" x2="280" y2="312" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/></svg>