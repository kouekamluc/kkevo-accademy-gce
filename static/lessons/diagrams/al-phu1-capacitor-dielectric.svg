<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280.0" y="24.0" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Parallel-plate capacitor with a dielectric</text>
<rect x="90.0" y="90.0" width="380.0" height="16.0" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="90.0" y="240.0" width="380.0" height="16.0" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="90.0" y="106.0" width="380.0" height="134.0" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="1"/>
<text x="280.0" y="82.0" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">plate with charge +Q, area A</text>
<text x="280.0" y="280.0" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">plate with charge -Q</text>
<rect x="127.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="140.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="140.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<rect x="183.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="196.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="196.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<rect x="239.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="252.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="252.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<rect x="295.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="308.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="308.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<rect x="351.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="364.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="364.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<rect x="407.0" y="128.0" width="26.0" height="84.0" rx="13" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="420.0" y="150.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="700">-</text>
<text x="420.0" y="200.0" font-size="16" text-anchor="middle" fill="#2563EB" font-weight="700">+</text>
<line x1="40.0" y1="240.0" x2="40.0" y2="106.0" stroke="#047857" stroke-width="2"/>
<polygon points="40.0,106.0 43.9,115.2 36.1,115.2" fill="#047857"/>
<text x="26.0" y="178.0" font-size="16" text-anchor="middle" fill="#047857" font-weight="700">d</text>
<text x="280.0" y="226.0" font-size="13" text-anchor="middle" fill="#047857" font-weight="700">polarised molecules (negative end towards the + plate)</text>
<text x="280.0" y="312.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">C = &#949;0 &#949;r A / d    (&#949;0 = 8.85 x 10^-12 F/m)</text>
<text x="280.0" y="338.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">Aligned molecules weaken the field inside, so more charge fits at the same voltage</text>
