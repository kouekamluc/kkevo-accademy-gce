<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>The electromagnetic spectrum from radio waves to gamma rays, with wavelength falling and frequency rising from left to right</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="35" y="150" width="70" height="60" rx="0" fill="#DBEAFE" stroke="#102A43" stroke-width="2"/>
<line x1="70" y1="150" x2="70" y2="128" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="114" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Radio</text>
<rect x="105" y="150" width="70" height="60" rx="0" fill="#BFDBFE" stroke="#102A43" stroke-width="2"/>
<line x1="140" y1="210" x2="140" y2="232" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="140" y="246" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Microwave</text>
<rect x="175" y="150" width="70" height="60" rx="0" fill="#FECACA" stroke="#102A43" stroke-width="2"/>
<line x1="210" y1="150" x2="210" y2="128" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="210" y="114" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Infrared</text>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#DC2626"/><stop offset="0.25" stop-color="#F59E0B"/><stop offset="0.5" stop-color="#16A34A"/><stop offset="0.75" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
<rect x="245" y="150" width="70" height="60" fill="url(#g)" stroke="#102A43" stroke-width="2"/>
<line x1="280" y1="210" x2="280" y2="232" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="280" y="246" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Visible</text>
<rect x="315" y="150" width="70" height="60" rx="0" fill="#DDD6FE" stroke="#102A43" stroke-width="2"/>
<line x1="350" y1="150" x2="350" y2="128" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="350" y="114" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Ultraviolet</text>
<rect x="385" y="150" width="70" height="60" rx="0" fill="#C7D2FE" stroke="#102A43" stroke-width="2"/>
<line x1="420" y1="210" x2="420" y2="232" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="420" y="246" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">X-ray</text>
<rect x="455" y="150" width="70" height="60" rx="0" fill="#BBF7D0" stroke="#102A43" stroke-width="2"/>
<line x1="490" y1="150" x2="490" y2="128" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<text x="490" y="114" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Gamma</text>
<line x1="40" y1="80" x2="520" y2="80" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="520,80 511.7,83.5 511.7,76.5" fill="#B45309"/>
<text x="280" y="62" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">frequency increases, wavelength decreases</text>
<text x="280" y="300" font-size="14" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">All travel at the same speed in a vacuum: 3 x 10&#8312; m/s</text>
<text x="280" y="330" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="400">Visible light: about 400 nm (violet) to 700 nm (red)</text>
</svg>
