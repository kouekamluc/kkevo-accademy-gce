<text x="436.0" y="229" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text>
<text x="60" y="299" font-size="14" font-weight="700" fill="#047857" text-anchor="start" font-family="Inter, Arial, sans-serif">3. Nineteen Eighty-Four (1949)</text>
<line x1="476.0" y1="190" x2="476.0" y2="156" stroke="#B45309" stroke-width="2"/>
