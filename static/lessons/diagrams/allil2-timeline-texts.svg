<text x="40.0" y="232" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1850</text>
<line x1="120.0" y1="182" x2="120.0" y2="198" stroke="#102A43" stroke-width="2"/>
