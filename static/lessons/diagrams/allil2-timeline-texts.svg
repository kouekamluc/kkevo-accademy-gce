<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="t d"><title id="t">Dates of texts</title><desc id="d">Timeline from 1850 to 1970 with five texts.</desc>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="30" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">When the texts were written</text>
<line x1="40" y1="190" x2="520" y2="190" stroke="#102A43" stroke-width="3"/>
