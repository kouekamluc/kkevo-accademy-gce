<text x="280.0" y="232" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1910</text>
<line x1="360.0" y1="182" x2="360.0" y2="198" stroke="#102A43" stroke-width="2"/>
<text x="360.0" y="232" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1930</text>
<line x1="520.0" y1="182" x2="520.0" y2="198" stroke="#102A43" stroke-width="2"/>
<text x="520.0" y="232" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle" font-family="Inter, Arial, sans-serif">1970</text>
<line x1="56.0" y1="190" x2="56.0" y2="190" stroke="#2563EB" stroke-width="2"/>
<circle cx="56.0" cy="190" r="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="56.0" y="195" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text>
<text x="60" y="255" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start" font-family="Inter, Arial, sans-serif">1. Hard Times (1854)</text>
<line x1="436.0" y1="190" x2="436.0" y2="156" stroke="#047857" stroke-width="2"/>
