<text x="60" y="321" font-size="14" font-weight="700" fill="#B45309" text-anchor="start" font-family="Inter, Arial, sans-serif">4. A Raisin in the Sun (1959)</text>
<line x1="480.0" y1="190" x2="480.0" y2="224" stroke="#B45309" stroke-width="2"/>
