<text x="60" y="277" font-size="14" font-weight="700" fill="#047857" text-anchor="start" font-family="Inter, Arial, sans-serif">2. Death of a Salesman (1949)</text>
<line x1="436.0" y1="190" x2="436.0" y2="224" stroke="#047857" stroke-width="2"/>
