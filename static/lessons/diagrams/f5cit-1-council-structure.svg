<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Structure of a municipal council: councillors elect the mayor who runs the council with deputies</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="170" y="12" width="220" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="25.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Voters</text>
<text x="280.0" y="43.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">elect the councillors</text>
<line x1="280" y1="56" x2="280" y2="86" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="86" x2="275.4" y2="78.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="86" x2="284.6" y2="78.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<rect x="170" y="86" width="220" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="99.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Municipal council</text>
<text x="280.0" y="117.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(councillors decide)</text>
<line x1="280" y1="130" x2="280" y2="160" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="160" x2="275.4" y2="152.3" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="160" x2="284.6" y2="152.3" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<rect x="170" y="160" width="220" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="173.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Mayor and deputy mayors</text>
<text x="280.0" y="191.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(carry out decisions)</text>
<line x1="280" y1="204" x2="280" y2="234" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="234" x2="275.4" y2="226.3" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="234" x2="284.6" y2="226.3" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<rect x="170" y="234" width="220" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="280.0" y="247.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Council staff and services</text>
<text x="280.0" y="265.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(civil status, markets)</text>
<rect x="20" y="160" width="130" height="44" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
<text x="85.0" y="173.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Supervision by</text>
<text x="85.0" y="190.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">State authority</text>
<line x1="150" y1="182" x2="170" y2="182" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="280" y="316" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">Check the current law on how mayors are chosen</text>
</svg>
