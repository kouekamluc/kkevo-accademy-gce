<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Administrative chain of Cameroon from the President to the sub-division</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<rect x="100" y="12" width="340" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270.0" y="25.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">President of the Republic</text>
<text x="270.0" y="43.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(appoints senior officials)</text>
<rect x="100" y="84" width="340" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="270.0" y="97.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Region: Governor</text>
<text x="270.0" y="115.0" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle">10 regions</text>
<rect x="100" y="156" width="340" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="270.0" y="169.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Division: Senior Divisional Officer</text>
<text x="270.0" y="186.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(SDO), about 58 divisions</text>
<rect x="100" y="228" width="340" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="270.0" y="241.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Sub-division: Divisional Officer</text>
<text x="270.0" y="258.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(DO), about 360 sub-divisions</text>
<rect x="100" y="300" width="340" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="270.0" y="313.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">Villages, quarters, chiefdoms</text>
<text x="270.0" y="330.5" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle">(traditional authorities help)</text>
<line x1="270" y1="56" x2="270" y2="84" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="84" x2="265.4" y2="76.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="84" x2="274.6" y2="76.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="128" x2="270" y2="156" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="156" x2="265.4" y2="148.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="156" x2="274.6" y2="148.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="200" x2="270" y2="228" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="228" x2="265.4" y2="220.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="228" x2="274.6" y2="220.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="272" x2="270" y2="300" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="300" x2="265.4" y2="292.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<line x1="270" y1="300" x2="274.6" y2="292.3" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="480" y="106" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">Numbers:</text>
<text x="480" y="126" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">check the</text>
<text x="480" y="144" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">current list</text>
</svg>
