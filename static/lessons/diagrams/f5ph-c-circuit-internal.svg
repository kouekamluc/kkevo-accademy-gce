<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A cell of EMF E with internal resistance r inside the dashed box, connected to an external resistor R, with an ammeter and a voltmeter across R</title>
