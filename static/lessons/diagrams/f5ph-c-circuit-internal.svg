<text x="114" y="165" font-size="16" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">E</text>
<text x="135" y="260" font-size="13" fill="#64748B" text-anchor="start" dominant-baseline="middle" font-weight="400">cell</text>
