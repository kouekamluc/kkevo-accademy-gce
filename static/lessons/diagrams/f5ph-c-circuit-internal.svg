<line x1="350" y1="110" x2="480" y2="110" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="110" x2="480" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="300" x2="90" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
