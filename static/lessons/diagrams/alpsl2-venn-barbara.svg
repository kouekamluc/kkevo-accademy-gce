<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><defs><mask id="noP"><rect width="560" height="360" fill="#fff"/><circle cx="345" cy="128" r="78" fill="#000"/></mask><mask id="noM"><rect width="560" height="360" fill="#fff"/><circle cx="280" cy="228" r="78" fill="#000"/></mask><clipPath id="inP"><circle cx="345" cy="128" r="78"/></clipPath></defs><circle cx="280" cy="228" r="78" fill="#2563EB" fill-opacity="0.35" mask="url(#noP)"/><circle cx="215" cy="128" r="78" fill="#B45309" fill-opacity="0.35" mask="url(#noM)"/><circle cx="215" cy="128" r="78" fill="none" stroke="#102A43" stroke-width="2.5"/><circle cx="345" cy="128" r="78" fill="none" stroke="#102A43" stroke-width="2.5"/><circle cx="280" cy="228" r="78" fill="none" stroke="#102A43" stroke-width="2.5"/><text x="141" y="66" font-size="18" text-anchor="middle" fill="#102A43" font-weight="800">S</text><text x="419" y="66" font-size="18" text-anchor="middle" fill="#102A43" font-weight="800">P</text><text x="280" y="328" font-size="18" text-anchor="middle" fill="#102A43" font-weight="800">M</text><text x="14" y="22" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">Premise 1: All M are P (blue shading)</text><text x="14" y="44" font-size="14" text-anchor="start" fill="#B45309" font-weight="700">Premise 2: All S are M (orange shading)</text><text x="280" y="352" font-size="14" text-anchor="middle" fill="#047857" font-weight="700">All of S outside P is shaded, so: All S are P</text></svg>