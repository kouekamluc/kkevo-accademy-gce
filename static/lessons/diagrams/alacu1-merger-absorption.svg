<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img" aria-label="Merger by absorption: company A takes over company B's net assets and issues shares">
<title>Merger by absorption: company A takes over company B's net assets and issues shares</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs>
<rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="26" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Merger by absorption</text>
<rect x="30" y="60" width="200" height="90" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="130.0" y="91.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Company B</text>
<text x="130.0" y="109.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">(absorbed)</text>
<text x="130.0" y="127.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">assets − liabilities</text>
<rect x="330" y="60" width="200" height="90" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="430.0" y="91.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="bold">Company A</text>
<text x="430.0" y="109.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">(absorbing)</text>
<text x="430.0" y="127.9" font-size="14" text-anchor="middle" fill="#047857" font-weight="normal">increases its capital</text>
<line x1="232" y1="90" x2="326" y2="90" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<text x="280" y="80" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">net assets</text>
<rect x="30" y="230" width="200" height="70" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="130.0" y="260.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="bold">Shareholders of B</text>
<text x="130.0" y="278.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="normal">give up B shares</text>
<line x1="430" y1="152" x2="232" y2="262" stroke="#102A43" stroke-width="2" marker-end="url(#ah)"/>
<text x="395" y="225" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="normal">new A shares</text>
<text x="395" y="243" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="normal">(exchange ratio)</text>
<line x1="130" y1="152" x2="130" y2="226" stroke="#102A43" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="140" y="195" font-size="13" text-anchor="start" fill="#B45309" font-weight="normal">B is dissolved</text>
<text x="280" y="330" font-size="13" text-anchor="middle" fill="#102A43" font-weight="normal">Merger premium = value of net assets received − nominal value of new shares</text>
</svg>
