<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Story and plot</title><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">Story and plot: the same four events</text><text x="20" y="62" font-size="14" fill="#2563EB" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Story (time order)</text><rect x="40" y="72" width="90" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="85" y="100" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event A</text><line x1="130" y1="94" x2="170" y2="94" stroke="#102A43" stroke-width="2"/><rect x="170" y="72" width="90" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="215" y="100" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event B</text><line x1="260" y1="94" x2="300" y2="94" stroke="#102A43" stroke-width="2"/><rect x="300" y="72" width="90" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="345" y="100" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event C</text><line x1="390" y1="94" x2="430" y2="94" stroke="#102A43" stroke-width="2"/><rect x="430" y="72" width="90" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="475" y="100" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event D</text><text x="20" y="170" font-size="14" fill="#2563EB" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Plot (order of telling)</text><rect x="40" y="182" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="85" y="210" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event C</text><line x1="130" y1="204" x2="170" y2="204" stroke="#047857" stroke-width="2"/><rect x="170" y="182" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="215" y="210" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event A</text><line x1="260" y1="204" x2="300" y2="204" stroke="#047857" stroke-width="2"/><rect x="300" y="182" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="345" y="210" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event D</text><line x1="390" y1="204" x2="430" y2="204" stroke="#047857" stroke-width="2"/><rect x="430" y="182" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475" y="210" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Event B</text><text x="280" y="262" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">C opens the telling; then flashback to A</text><text x="280" y="284" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">then a jump forward to D, then back to B</text><text x="280" y="326" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">The order of telling is the writer's choice</text></svg>