<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>The three papers</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="10" y="30" width="170" height="270" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95.0" y="93.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Paper 1</text><text x="95.0" y="112.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="95.0" y="131.9" text-anchor="middle" font-size="14" fill="#102A43">50 multiple-choice</text><text x="95.0" y="150.9" text-anchor="middle" font-size="14" fill="#102A43">questions</text><text x="95.0" y="169.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="95.0" y="188.9" text-anchor="middle" font-size="14" fill="#102A43">Whole syllabus</text><text x="95.0" y="207.9" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="95.0" y="226.9" text-anchor="middle" font-size="14" fill="#102A43">One correct</text><text x="95.0" y="245.9" text-anchor="middle" font-size="14" fill="#102A43">answer each</text><rect x="195" y="30" width="170" height="270" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="115.5" text-anchor="middle" font-size="13" fill="#102A43" font-weight="700">Paper 2</text><text x="280.0" y="133.6" text-anchor="middle" font-size="13" fill="#102A43"></text><text x="280.0" y="151.6" text-anchor="middle" font-size="13" fill="#102A43">Essays in three</text><text x="280.0" y="169.6" text-anchor="middle" font-size="13" fill="#102A43">sections:</text><text x="280.0" y="187.6" text-anchor="middle" font-size="13" fill="#102A43">Western philosophy</text><text x="280.0" y="205.6" text-anchor="middle" font-size="13" fill="#102A43">African philosophy</text><text x="280.0" y="223.6" text-anchor="middle" font-size="13" fill="#102A43">Textual analysis</text><rect x="380" y="30" width="170" height="270" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="465.0" y="103.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Paper 3</text><text x="465.0" y="122.4" text-anchor="middle" font-size="14" fill="#102A43"></text><text x="465.0" y="141.4" text-anchor="middle" font-size="14" fill="#102A43">Logic:</text><text x="465.0" y="160.4" text-anchor="middle" font-size="14" fill="#102A43">traditional,</text><text x="465.0" y="179.4" text-anchor="middle" font-size="14" fill="#102A43">propositional,</text><text x="465.0" y="198.4" text-anchor="middle" font-size="14" fill="#102A43">predicate</text><text x="465.0" y="217.4" text-anchor="middle" font-size="14" fill="#102A43">Philosophical</text><text x="465.0" y="236.4" text-anchor="middle" font-size="14" fill="#102A43">problems</text><text x="280" y="335" text-anchor="middle" font-size="14" fill="#102A43">Check the exact format and numbers with your teacher</text></svg>