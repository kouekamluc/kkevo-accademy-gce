<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Timelines of Italian and German unification</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Italy and Germany: stages of unification</text><line x1="25" y1="190" x2="535" y2="190" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><circle cx="62" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="62" y1="183" x2="62" y2="162" stroke="#2563EB" stroke-width="2"/><text x="62" y="120" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">War with</text><text x="62" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Austria:</text><text x="62" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Lombardy</text><text x="62" y="103" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1859</text><circle cx="124" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="124" y1="197" x2="124" y2="218" stroke="#2563EB" stroke-width="2"/><text x="124" y="236" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1860</text><text x="124" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Garibaldi in</text><text x="124" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Sicily, Naples</text><circle cx="187" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="187" y1="183" x2="187" y2="162" stroke="#047857" stroke-width="2"/><text x="187" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Kingdom of</text><text x="187" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Italy</text><text x="187" y="118" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">1861</text><circle cx="249" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="249" y1="197" x2="249" y2="218" stroke="#B45309" stroke-width="2"/><text x="249" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1864</text><text x="249" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Danish war</text><circle cx="311" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="311" y1="183" x2="311" y2="162" stroke="#2563EB" stroke-width="2"/><text x="311" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Austria beaten;</text><text x="311" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Venetia to Italy</text><text x="311" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1866</text><circle cx="373" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="373" y1="197" x2="373" y2="218" stroke="#B45309" stroke-width="2"/><text x="373" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1867</text><text x="373" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">North German</text><text x="373" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Confederation</text><circle cx="436" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="436" y1="183" x2="436" y2="162" stroke="#2563EB" stroke-width="2"/><text x="436" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Franco-Prussian</text><text x="436" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">war; Rome</text><text x="436" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1870</text><circle cx="498" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="498" y1="197" x2="498" y2="218" stroke="#047857" stroke-width="2"/><text x="498" y="236" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">1871</text><text x="498" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">German Empire</text><text x="498" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">proclaimed</text><text x="280" y="348" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Not to scale. Orange marks mainly German events.</text></svg>