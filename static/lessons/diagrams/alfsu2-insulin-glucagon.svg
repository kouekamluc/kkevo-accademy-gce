<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="560" height="360" fill="#ffffff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102A43"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563EB"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B45309"/></marker></defs><text x="280" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#102A43">Control of blood glucose</text><rect x="190" y="44" width="180" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43">Glucose rises (meal)</text><rect x="190" y="130" width="180" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">Normal glucose</text><text x="280" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">about 4 to 7 mmol/L</text><rect x="190" y="272" width="180" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43">Glucose falls (fasting)</text><line x1="280" y1="90" x2="280" y2="126" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><line x1="280" y1="200" x2="280" y2="268" stroke="#102A43" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="44" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="475" y="68" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Beta cells release</text><text x="475" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB">INSULIN</text><line x1="372" y1="66" x2="398" y2="70" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/><rect x="400" y="128" width="150" height="76" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="475" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Liver, muscle, fat</text><text x="475" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">take up glucose,</text><text x="475" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">store as glycogen</text><line x1="475" y1="102" x2="475" y2="126" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/><line x1="398" y1="166" x2="374" y2="166" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><rect x="10" y="254" width="160" height="56" rx="8" fill="#EFF6FF" stroke="#B45309" stroke-width="2"/><text x="90" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Alpha cells release</text><text x="90" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">GLUCAGON</text><line x1="188" y1="294" x2="172" y2="288" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><rect x="10" y="128" width="160" height="76" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="90" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Liver breaks glycogen</text><text x="90" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">to glucose and makes</text><text x="90" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">new glucose</text><line x1="90" y1="252" x2="90" y2="208" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/><line x1="172" y1="166" x2="188" y2="166" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/><text x="280" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43">Each hormone corrects the change that triggered it.</text></svg>