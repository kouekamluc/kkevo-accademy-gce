<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280.0" y="26.0" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700">Parallel axis theorem for a uniform rod, mass M, length L</text>
<rect x="70" y="138" width="420" height="24" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<line x1="280.0" y1="65.0" x2="280.0" y2="235.0" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 5"/>
<text x="288.0" y="55.0" font-size="14" text-anchor="start" fill="#2563EB" font-weight="700">axis through centre G</text>
<line x1="70.0" y1="65.0" x2="70.0" y2="235.0" stroke="#047857" stroke-width="3" stroke-dasharray="8 5"/>
<text x="76.0" y="252.0" font-size="14" text-anchor="start" fill="#047857" font-weight="700">parallel axis through the end</text>
<line x1="280.0" y1="195.0" x2="75.0" y2="195.0" stroke="#B45309" stroke-width="2.5"/>
<polygon points="70.0,195.0 81.1,190.3 81.1,199.7" fill="#B45309"/>
<line x1="70.0" y1="195.0" x2="275.0" y2="195.0" stroke="#B45309" stroke-width="2.5"/>
<polygon points="280.0,195.0 268.9,199.7 268.9,190.3" fill="#B45309"/>
<text x="175.0" y="218.0" font-size="15" text-anchor="middle" fill="#B45309" font-weight="700">d = L/2</text>
<text x="280.0" y="184.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400"></text>
<text x="280.0" y="298.0" font-size="15" text-anchor="middle" fill="#2563EB" font-weight="700">About G:  I = M L^2 / 12</text>
<text x="280.0" y="321.0" font-size="15" text-anchor="middle" fill="#047857" font-weight="700">About the end:  I = M L^2/12 + M (L/2)^2 = M L^2 / 3</text>
<text x="280.0" y="345.0" font-size="13" text-anchor="middle" fill="#102A43" font-weight="400">I (about any axis) = I (about parallel axis through G) + M d^2</text>
</svg>
