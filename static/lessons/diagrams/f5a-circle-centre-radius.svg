<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Circle with centre C(a, b) and radius r; a point P(x, y) on the circle makes a right-angled triangle with sides x minus a and y minus b</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="40.0" y1="330.0" x2="545.0" y2="330.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="352.0" x2="70.0" y2="15.0" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<polygon points="545.0,330.0 535.0,325.0 535.0,335.0" fill="#102A43"/>
<polygon points="70.0,15.0 65.0,25.0 75.0,25.0" fill="#102A43"/>
<circle cx="252.0" cy="187.0" r="119.6" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/>
<polygon points="252.0,187.0 320.6,187.0 320.6,89.0" fill="#ECFDF5" stroke="none"/>
<line x1="252.0" y1="187.0" x2="320.6" y2="89.0" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<line x1="252.0" y1="187.0" x2="320.6" y2="187.0" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<line x1="320.6" y1="187.0" x2="320.6" y2="89.0" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="308.6,187.0 308.6,175.0 320.6,175.0" fill="none" stroke="#102A43" stroke-width="2"/>
<circle cx="252.0" cy="187.0" r="4" fill="#102A43"/>
<circle cx="320.6" cy="89.0" r="4" fill="#2563EB"/>
<text x="218.0" y="191.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">C(a, b)</text>
<text x="366.6" y="79.0" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">P(x, y)</text>
<text x="272.3" y="126.0" font-size="19" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">r</text>
<text x="300.3" y="207.0" font-size="15" fill="#047857" text-anchor="middle" dominant-baseline="middle" font-weight="700">x − a</text>
<text x="327.6" y="146.0" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">y − b</text>
<text x="430.0" y="40.0" font-size="17" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">(x − a)² + (y − b)² = r²</text>
<text x="538.0" y="314.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">x</text>
<text x="84.0" y="22.0" font-size="16" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">y</text>
<text x="58.0" y="346.0" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="600">O</text>
</svg>