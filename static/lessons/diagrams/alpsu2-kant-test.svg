<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Kant's two tests for a maxim</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="170" y="12" width="220" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="29.4" text-anchor="middle" font-size="14" fill="#102A43">1. State the maxim</text><text x="280.0" y="48.4" text-anchor="middle" font-size="14" fill="#102A43">the rule behind the act</text><line x1="280" y1="56" x2="280" y2="80" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="82" width="220" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="99.4" text-anchor="middle" font-size="14" fill="#102A43">2. Universalise it</text><text x="280.0" y="118.4" text-anchor="middle" font-size="14" fill="#102A43">imagine everyone does it</text><line x1="280" y1="126" x2="280" y2="150" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="140" y="152" width="280" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="173.4" text-anchor="middle" font-size="14" fill="#102A43">3. Can it be willed without</text><text x="280.0" y="192.4" text-anchor="middle" font-size="14" fill="#102A43">contradiction?</text><line x1="210" y1="204" x2="120" y2="238" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="350" y1="204" x2="440" y2="238" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="135" y="224" text-anchor="middle" font-size="14" fill="#B45309" font-weight="700">No</text><text x="425" y="224" text-anchor="middle" font-size="14" fill="#047857" font-weight="700">Yes</text><rect x="20" y="240" width="200" height="44" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="120.0" y="257.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Forbidden</text><text x="120.0" y="276.4" text-anchor="middle" font-size="14" fill="#102A43">(fails the test)</text><rect x="340" y="240" width="200" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="440.0" y="257.4" text-anchor="middle" font-size="14" fill="#102A43">Passes: now apply the</text><text x="440.0" y="276.4" text-anchor="middle" font-size="14" fill="#102A43">humanity formula</text><line x1="440" y1="284" x2="440" y2="304" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="306" width="270" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="415.0" y="323.4" text-anchor="middle" font-size="14" fill="#102A43">Is anyone used merely as</text><text x="415.0" y="342.4" text-anchor="middle" font-size="14" fill="#102A43">a means? If so: forbidden</text></svg>