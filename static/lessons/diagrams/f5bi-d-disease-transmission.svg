<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">How cholera and typhoid can spread</text><rect x="20.0" y="80.0" width="150" height="60" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="95" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Faeces of a</text><text x="95" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">sick person</text><rect x="205.0" y="80.0" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Water, soil,</text><text x="280" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">flies, hands</text><rect x="390.0" y="80.0" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="465" y="106.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Food and</text><text x="465" y="123.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">drink</text><rect x="390.0" y="210.0" width="150" height="60" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="465" y="236.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Mouth of a</text><text x="465" y="253.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">healthy person</text><rect x="205.0" y="210.0" width="150" height="60" rx="8" fill="#FEF3C7" stroke="#102A43" stroke-width="2"/><text x="280" y="245.0" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700">Becomes ill</text><line x1="173.0" y1="110.0" x2="200.0" y2="110.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="358.0" y1="110.0" x2="385.0" y2="110.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="465.0" y1="143.0" x2="465.0" y2="205.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="387.0" y1="240.0" x2="360.0" y2="240.0" stroke="#102A43" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><text x="280" y="310" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">Ways to break the chain: latrines, clean water, boiling water,</text><text x="280" y="330" font-family="Inter, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">washing hands, covering food, keeping flies away</text></svg>