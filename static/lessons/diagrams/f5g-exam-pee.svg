<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Point, evidence, explain: how to build a paragraph</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="34" font-size="18" font-weight="700" fill="#102A43" text-anchor="middle">Point, Evidence, Explain</text>
<rect x="30" y="60" width="150" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="105" y="88" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">POINT</text>
<text x="105" y="114" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">Say what</text>
<text x="105" y="134" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">(one clear statement)</text>
<rect x="205" y="60" width="150" height="92" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<text x="280" y="88" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">EVIDENCE</text>
<text x="280" y="114" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">Give an example,</text>
<text x="280" y="134" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">place or figure</text>
<rect x="380" y="60" width="150" height="92" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<text x="455" y="88" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">EXPLAIN</text>
<text x="455" y="114" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">Say how or why,</text>
<text x="455" y="134" font-size="13.5" font-weight="400" fill="#102A43" text-anchor="middle">link to the question</text>
<line x1="183" y1="106" x2="194.3" y2="106" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="202,106 192.1,110.8 192.1,101.2" fill="#102A43"/>
<line x1="358" y1="106" x2="369.3" y2="106" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="377,106 367.1,110.8 367.1,101.2" fill="#102A43"/>
<text x="30" y="192" font-size="14.5" font-weight="700" fill="#102A43" text-anchor="start">Example from Cameroon (one paragraph):</text>
<rect x="30" y="204" width="500" height="120" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<text x="44" y="236" font-size="13.5" font-weight="700" fill="#2563EB" text-anchor="start">Point:</text>
<text x="122" y="236" font-size="13" font-weight="400" fill="#102A43" text-anchor="start">Heavy rain falls on the windward side of Mount Cameroon.</text>
<text x="44" y="266" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="start">Evidence:</text>
<text x="122" y="266" font-size="13" font-weight="400" fill="#102A43" text-anchor="start">The mountain rises close to the Atlantic coast near Limbe.</text>
<text x="44" y="296" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">Explain:</text>
<text x="122" y="296" font-size="13" font-weight="400" fill="#102A43" text-anchor="start">Moist air from the sea is forced up, cools and falls as rain.</text>
<text x="280" y="350" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="middle">Repeat this chain for each main point in your answer.</text>
</svg>
