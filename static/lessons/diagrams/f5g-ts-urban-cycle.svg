<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Cycle of unplanned urban growth: growth, shortages, slums, overloaded services, poverty</title><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><rect x="205" y="33" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="280.0" y="52.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Rapid growth of</text><text x="280.0" y="69.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">population</text><rect x="386" y="123" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="461.0" y="142.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Not enough</text><text x="461.0" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">houses and jobs</text><rect x="317" y="268" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="392.0" y="287.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Slums and</text><text x="392.0" y="304.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">traffic jams</text><rect x="93" y="268" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="168.0" y="287.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Water, waste and</text><text x="168.0" y="304.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">health overloaded</text><rect x="24" y="123" width="150" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="99.0" y="142.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">Poverty, crime,</text><text x="99.0" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="#102A43">pollution, disease</text><line x1="355.0" y1="58.0" x2="430.0" y2="122.0" stroke="#B45309" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><line x1="461.0" y1="169.0" x2="425.0" y2="266.0" stroke="#B45309" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><line x1="315.0" y1="290.0" x2="245.0" y2="290.0" stroke="#B45309" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><line x1="130.0" y1="266.0" x2="103.0" y2="170.0" stroke="#B45309" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><line x1="125.0" y1="123.0" x2="205.0" y2="60.0" stroke="#B45309" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><text x="280.0" y="180.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">Unplanned growth:</text><text x="280.0" y="199.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">a vicious circle</text></svg>