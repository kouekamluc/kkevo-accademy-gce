<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="22" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Two food chains (arrows show the flow of energy)</text><text x="20" y="62" font-family="Inter, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="start" font-weight="700">Savanna (Far North)</text><rect x="20" y="80" width="100" height="46" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/><text x="70.0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Grass</text><text x="70.0" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">producer</text><line x1="122" y1="103" x2="154" y2="103" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="156" y="80" width="100" height="46" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/><text x="206.0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Grasshopper</text><text x="206.0" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">primary</text><line x1="258" y1="103" x2="290" y2="103" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="292" y="80" width="100" height="46" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/><text x="342.0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Lizard</text><text x="342.0" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">secondary</text><line x1="394" y1="103" x2="426" y2="103" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="428" y="80" width="100" height="46" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/><text x="478.0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Eagle</text><text x="478.0" y="117" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">tertiary</text><text x="20" y="192" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2563EB" text-anchor="start" font-weight="700">Pond or lake</text><rect x="20" y="210" width="100" height="46" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="70.0" y="230" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Algae</text><text x="70.0" y="247" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">producer</text><line x1="122" y1="233" x2="154" y2="233" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="156" y="210" width="100" height="46" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="206.0" y="230" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Tilapia</text><text x="206.0" y="247" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">primary</text><line x1="258" y1="233" x2="290" y2="233" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="292" y="210" width="100" height="46" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="342.0" y="230" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Catfish</text><text x="342.0" y="247" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">secondary</text><line x1="394" y1="233" x2="426" y2="233" stroke="#102A43" stroke-width="3" marker-end="url(#ar)"/><rect x="428" y="210" width="100" height="46" rx="8" fill="#fff" stroke="#2563EB" stroke-width="2"/><text x="478.0" y="230" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700">Kingfisher</text><text x="478.0" y="247" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">tertiary</text><text x="280" y="310" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">Producer, then primary, secondary and tertiary consumers:</text><text x="280" y="328" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="400">each step up is the next trophic level.</text></svg>