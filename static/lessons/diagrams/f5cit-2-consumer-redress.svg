<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="560" height="360" fill="#fff"/><rect x="50" y="14" width="460" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="43" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#102A43" text-anchor="middle">1  Notice the fault or the cheating</text><path d="M280,60 L280,76" fill="none" stroke="#102A43" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="76" width="460" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="105" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#102A43" text-anchor="middle">2  Keep the receipt and the item</text><path d="M280,122 L280,138" fill="none" stroke="#102A43" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="138" width="460" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="167" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#102A43" text-anchor="middle">3  Ask the seller for redress</text><path d="M280,184 L280,200" fill="none" stroke="#102A43" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="200" width="460" height="46" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="280" y="229" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#102A43" text-anchor="middle">4  Complain to the trade office or an association</text><path d="M280,246 L280,262" fill="none" stroke="#102A43" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="262" width="460" height="46" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="291" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#102A43" text-anchor="middle">5  Use the courts if still unresolved</text></svg>