<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A glass prism splits a narrow beam of white light into a spectrum, violet bent most and red least</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<polygon points="250,91.9 165,239.1 335,239.1" fill="#EFF6FF" stroke="#102A43" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="85.3" y1="209.9" x2="207.5" y2="165.5" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<polygon points="154.9,184.6 140.5,194.4 137.5,186.3" fill="#102A43"/>
<text x="95.3" y="243.9" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">white light</text>
<line x1="207.5" y1="165.5" x2="291.9" y2="164.4" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
<line x1="291.9" y1="164.4" x2="530.7" y2="238.4" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="479.6,222.6 462.2,221.7 464.7,213.4" fill="#DC2626"/>
<line x1="207.5" y1="165.5" x2="292.5" y2="165.4" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="292.5" y1="165.4" x2="527.7" y2="250.1" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="477.3,232 460,230.3 462.9,222.2" fill="#16A34A"/>
<line x1="207.5" y1="165.5" x2="293" y2="166.3" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
<line x1="293" y1="166.3" x2="523.9" y2="262.2" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="474.5,241.7 457.2,239.2 460.5,231.2" fill="#7C3AED"/>
<text x="470" y="28" font-size="14" fill="#DC2626" text-anchor="end" dominant-baseline="middle" font-weight="700">red bent least</text>
<text x="470" y="48" font-size="14" fill="#7C3AED" text-anchor="end" dominant-baseline="middle" font-weight="700">violet bent most</text>
<text x="255" y="350" font-size="13" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="400">Spread exaggerated so the colours are easy to see</text>
</svg>
