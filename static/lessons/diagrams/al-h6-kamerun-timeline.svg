<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>Timeline of the making of Cameroon's borders, 1884 to 1922</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Making Cameroon's borders, 1884 to 1922</text><line x1="25" y1="190" x2="535" y2="190" stroke="#102A43" stroke-width="3" stroke-linecap="round"/><circle cx="62" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="62" y1="183" x2="62" y2="162" stroke="#2563EB" stroke-width="2"/><text x="62" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Duala treaty</text><text x="62" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">12 July</text><text x="62" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1884</text><circle cx="124" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="124" y1="197" x2="124" y2="218" stroke="#B45309" stroke-width="2"/><text x="124" y="236" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1885-86</text><text x="124" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Anglo-German</text><text x="124" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">and Franco-</text><text x="124" y="281" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">German talks</text><circle cx="187" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="187" y1="183" x2="187" y2="162" stroke="#B45309" stroke-width="2"/><text x="187" y="120" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Anglo-German</text><text x="187" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">and Franco-</text><text x="187" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">German deals</text><text x="187" y="103" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1893-94</text><circle cx="249" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="249" y1="197" x2="249" y2="218" stroke="#2563EB" stroke-width="2"/><text x="249" y="236" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1911</text><text x="249" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Franco-German</text><text x="249" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">treaty:</text><text x="249" y="281" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Neukamerun</text><circle cx="311" cy="190" r="7" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/><line x1="311" y1="183" x2="311" y2="162" stroke="#B45309" stroke-width="2"/><text x="311" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Anglo-German</text><text x="311" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">agreement</text><text x="311" y="118" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">1913</text><circle cx="373" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="373" y1="197" x2="373" y2="218" stroke="#047857" stroke-width="2"/><text x="373" y="236" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">1914-16</text><text x="373" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">War: Kamerun</text><text x="373" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">conquered</text><circle cx="436" cy="190" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><line x1="436" y1="183" x2="436" y2="162" stroke="#2563EB" stroke-width="2"/><text x="436" y="135" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Milner-Simon</text><text x="436" y="150" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">10 July</text><text x="436" y="118" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">1919</text><circle cx="498" cy="190" r="7" fill="#047857" stroke="#FFFFFF" stroke-width="2"/><line x1="498" y1="197" x2="498" y2="218" stroke="#047857" stroke-width="2"/><text x="498" y="236" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">1922</text><text x="498" y="251" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">League confirms</text><text x="498" y="266" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">mandates</text><text x="280" y="348" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Not to scale. Check the dates of the 1885-1894 conventions in your textbook.</text></svg>