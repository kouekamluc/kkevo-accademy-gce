<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif">
<title>Bearing of B from A is 060 degrees and the back bearing of A from B is 240 degrees</title>
<style>.h{stroke:#FFFFFF;stroke-width:4;paint-order:stroke;stroke-linejoin:round}</style>
<defs><circle id="t" r="4" fill="none" stroke="#047857" stroke-width="2"/><circle id="p" r="2.5" fill="#047857"/></defs>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="170" y1="280" x2="170" y2="110" stroke="#102A43" stroke-width="2.5" stroke-dasharray="4 4"/>
<text x="176" y="108" font-size="15" fill="#102A43" font-weight="700">N</text>
<line x1="351.9" y1="175" x2="351.9" y2="45" stroke="#102A43" stroke-width="2.5" stroke-dasharray="4 4"/>
<text x="357.9" y="43" font-size="15" fill="#102A43" font-weight="700">N</text>
<line x1="170" y1="280" x2="351.9" y2="175" stroke="#102A43" stroke-width="3.5"/>
<path d="M170 220 A60 60 0 0 1 222 250" fill="none" stroke="#2563EB" stroke-width="3.5"/>
<text x="214" y="206" font-size="15" fill="#2563EB" font-weight="700" class="h">060°</text>
<path d="M351.9 125 A50 50 0 1 1 308.6 200" fill="none" stroke="#B45309" stroke-width="3.5"/>
<text x="313.9" y="249" font-size="15" fill="#B45309" text-anchor="end" font-weight="700" class="h">240°</text>
<circle cx="170" cy="280" r="6" fill="#102A43"/>
<circle cx="351.9" cy="175" r="6" fill="#102A43"/>
<text x="152" y="302" font-size="17" fill="#102A43" text-anchor="end" font-weight="700">A</text>
<text x="363.9" y="181" font-size="17" fill="#102A43" font-weight="700">B</text>
<text x="20" y="36" font-size="15" fill="#2563EB" font-weight="700">Bearing of B from A = 060°</text>
<text x="20" y="60" font-size="15" fill="#B45309" font-weight="700">Bearing of A from B = 240°</text>
<text x="20" y="86" font-size="15" fill="#102A43" font-weight="700">240 = 060 + 180</text>
</svg>
