ont-weight="400">Oil refinery (Limbe area)</text><rect x="352" y="158" width="14" height="14" fill="#047857"/><text x="376" y="170" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">Agro-processing (Bafoussam)</text><rect x="352" y="190" width="14" height="14" fill="#B45309"/><text x="376" y="202" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="start" font-weight="400">Cotton and textiles (Garoua)</text><rect x="350" y="245" width="235" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="468" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Industry gathers where there</text><text x="468" y="302" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">are ports, power, roads,</text><text x="468" y="318" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">workers and a big market.</text><text x="468" y="334" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Douala is the main example.</text><text x="350" y="395" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">Other industries (wood, sugar,</text><text x="350" y="413" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">cement, tea, rubber): check your</text><text x="350" y="431" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">textbook for exact places.</text></g><text x="10" y="468" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">Simplified sketch map, not to scale</text></svg>