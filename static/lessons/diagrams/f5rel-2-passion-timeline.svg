<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">The last week of Jesus: order of events</text>
<rect x="4" y="60" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="67.0" y="94.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">1 Entry into</text>
<text x="67.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">Jerusalem</text>
<rect x="146" y="60" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="209.0" y="94.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">2 Cleansing</text>
<text x="209.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">of the Temple</text>
<rect x="288" y="60" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="351.0" y="94.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">3 Teaching on</text>
<text x="351.0" y="111.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">Mount of Olives</text>
<rect x="430" y="60" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="493.0" y="102.5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">4 Last Supper</text>
<rect x="4" y="210" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="67.0" y="244.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">5 Gethsemane</text>
<text x="67.0" y="261.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">and arrest</text>
<rect x="146" y="210" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="209.0" y="244.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">6 Trials:</text>
<text x="209.0" y="261.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">council, Pilate</text>
<rect x="288" y="210" width="126" height="76" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="351.0" y="244.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">7 Crucifixion</text>
<text x="351.0" y="261.1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">and burial</text>
<rect x="430" y="210" width="126" height="76" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="493.0" y="252.6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">8 Resurrection</text>
<line x1="132" y1="98.0" x2="144" y2="98.0" stroke="#102A43" stroke-width="2"/>
<polygon points="144,98.0 135.9,101.9 135.9,94.1" fill="#102A43"/>
<line x1="274" y1="98.0" x2="286" y2="98.0" stroke="#102A43" stroke-width="2"/>
<polygon points="286,98.0 277.9,101.9 277.9,94.1" fill="#102A43"/>
<line x1="416" y1="98.0" x2="428" y2="98.0" stroke="#102A43" stroke-width="2"/>
<polygon points="428,98.0 419.9,101.9 419.9,94.1" fill="#102A43"/>
<polyline points="493.0,136 493.0,172 67.0,172 67.0,208" fill="none" stroke="#102A43" stroke-width="2"/>
<line x1="67.0" y1="198" x2="67.0" y2="210" stroke="#102A43" stroke-width="2"/>
<polygon points="67.0,210 63.1,201.9 70.9,201.9" fill="#102A43"/>
<line x1="132" y1="248.0" x2="144" y2="248.0" stroke="#102A43" stroke-width="2"/>
<polygon points="144,248.0 135.9,251.9 135.9,244.1" fill="#102A43"/>
<line x1="274" y1="248.0" x2="286" y2="248.0" stroke="#102A43" stroke-width="2"/>
<polygon points="286,248.0 277.9,251.9 277.9,244.1" fill="#102A43"/>
<line x1="416" y1="248.0" x2="428" y2="248.0" stroke="#102A43" stroke-width="2"/>
<polygon points="428,248.0 419.9,251.9 419.9,244.1" fill="#102A43"/>
<text x="280" y="330" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">Peter's confession and the Transfiguration come before this week.</text>
</svg>
