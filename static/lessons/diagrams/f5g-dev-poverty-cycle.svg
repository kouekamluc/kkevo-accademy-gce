<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Vicious circle of poverty</title><defs><marker id="g4n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="g4b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="g4g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="g4a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker></defs><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><line x1="351.6" y1="102.0" x2="391.6" y2="119.9" stroke="#B45309" stroke-width="2" marker-end="url(#g4a)"/><line x1="448.6" y1="184.9" x2="412.0" y2="254.1" stroke="#B45309" stroke-width="2" marker-end="url(#g4a)"/><line x1="315.6" y1="287.1" x2="245.4" y2="287.1" stroke="#B45309" stroke-width="2" marker-end="url(#g4a)"/><line x1="148.5" y1="255.1" x2="112.0" y2="185.9" stroke="#B45309" stroke-width="2" marker-end="url(#g4a)"/><line x1="166.1" y1="120.9" x2="206.2" y2="103.0" stroke="#B45309" stroke-width="2" marker-end="url(#g4a)"/><rect x="205.0" y="42.0" width="150.0" height="56.0" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="280.0" y="74.9" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Low income</text><rect x="390.5" y="124.9" width="150.0" height="56.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465.5" y="148.8" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Little saving</text><text x="465.5" y="166.8" font-size="14" text-anchor="middle" fill="#102A43">and investment</text><rect x="319.6" y="259.1" width="150.0" height="56.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="394.6" y="283.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Poor health</text><text x="394.6" y="301.0" font-size="14" text-anchor="middle" fill="#102A43">and education</text><rect x="90.4" y="259.1" width="150.0" height="56.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="165.4" y="283.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Low skills and</text><text x="165.4" y="301.0" font-size="14" text-anchor="middle" fill="#102A43">low output</text><rect x="19.5" y="124.9" width="150.0" height="56.0" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="94.5" y="148.8" font-size="14" text-anchor="middle" fill="#102A43" font-weight="700">Few good jobs,</text><text x="94.5" y="166.8" font-size="14" text-anchor="middle" fill="#102A43">weak farms</text><text x="280.0" y="182.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">The cycle</text><text x="280.0" y="202.0" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700">of poverty</text><text x="280.0" y="350.0" font-size="14" text-anchor="middle" fill="#102A43">Each problem causes the next, so the cycle repeats.</text></svg>