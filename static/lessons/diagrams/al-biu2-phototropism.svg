<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><rect x="0" y="0" width="560" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><text x="280" y="28" font-size="16" text-anchor="middle" fill="#102A43" font-weight="700" >Phototropism: auxin moves to the shaded side</text><text x="120" y="60" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >Before</text><line x1="40" y1="300" x2="210" y2="300" stroke="#102A43" stroke-width="3"/><rect x="90" y="130" width="60" height="170" rx="0" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><line x1="90" y1="130" x2="150" y2="130" stroke="#047857" stroke-width="2"/><line x1="90" y1="164" x2="150" y2="164" stroke="#047857" stroke-width="2"/><line x1="90" y1="198" x2="150" y2="198" stroke="#047857" stroke-width="2"/><line x1="90" y1="232" x2="150" y2="232" stroke="#047857" stroke-width="2"/><line x1="90" y1="266" x2="150" y2="266" stroke="#047857" stroke-width="2"/><line x1="242" y1="150" x2="162" y2="150" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/><line x1="242" y1="200" x2="162" y2="200" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/><line x1="242" y1="250" x2="162" y2="250" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/><text x="202" y="128" font-size="14" text-anchor="middle" fill="#B45309" font-weight="700" >Light</text><line x1="140" y1="122" x2="98" y2="122" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/><text x="120" y="108" font-size="14" text-anchor="middle" fill="#2563EB" font-weight="700" >Auxin</text><text x="410" y="60" font-size="15" text-anchor="middle" fill="#102A43" font-weight="700" >After</text><line x1="320" y1="300" x2="490" y2="300" stroke="#102A43" stroke-width="3"/><path d="M385,300 C385,230 390,180 445,130" fill="#ECFDF5" stroke="#047857" stroke-width="56" stroke-linecap="round" opacity="0.35"/><path d="M385,300 C385,230 390,180 445,130" fill="none" stroke="#047857" stroke-width="3" /><text x="345" y="208" font-size="14" text-anchor="end" fill="#102A43" font-weight="700" >Shaded side:</text><text x="345" y="226" font-size="14" text-anchor="end" fill="#102A43" font-weight="400" >more auxin,</text><text x="345" y="244" font-size="14" text-anchor="end" fill="#102A43" font-weight="400" >cells longer</text><text x="462" y="218" font-size="14" text-anchor="start" fill="#102A43" font-weight="700" >Lit side:</text><text x="462" y="236" font-size="14" text-anchor="start" fill="#102A43" font-weight="400" >less auxin,</text><text x="462" y="254" font-size="14" text-anchor="start" fill="#102A43" font-weight="400" >cells shorter</text><text x="410" y="336" font-size="15" text-anchor="middle" fill="#047857" font-weight="700" >Shoot bends towards the light</text><text x="130" y="336" font-size="14" text-anchor="middle" fill="#102A43" font-weight="400" >One-sided light</text><line x1="540" y1="110" x2="494" y2="132" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/><line x1="540" y1="150" x2="494" y2="172" stroke="#B45309" stroke-width="3" marker-end="url(#aa)"/></svg>