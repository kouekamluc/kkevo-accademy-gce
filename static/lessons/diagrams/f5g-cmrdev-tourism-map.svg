text x="468" y="223" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Tourist sites are of three kinds:</text><text x="468" y="239" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">relief (Mount Cameroon),</text><text x="468" y="255" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">coast and water (Limbe, Kribi,</text><text x="468" y="271" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Lobe falls) and wildlife (Waza).</text><text x="468" y="287" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Many more sites exist.</text><text x="350" y="350" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">Other sites (lakes, reserves):</text><text x="350" y="368" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">check your textbook.</text></g><text x="10" y="468" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">Simplified sketch map, not to scale</text></svg>