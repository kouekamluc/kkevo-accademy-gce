<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>The drainage basin as a system: inputs, stores, flows and outputs</title><defs><marker id="bsi" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="bsb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="bsg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="bsr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="bss" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="640" height="440" fill="#fff"/><polygon points="0,170 440,250 500,250 640,235 640,440 0,440" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/><polygon points="0,340 470,318 640,312 640,440 0,440" fill="#DBEAFE" stroke="none" stroke-width="0" stroke-linejoin="round"/><polyline points="0,340 470,318 640,312" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 5"/><polyline points="0,170 440,250 500,250 640,235" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/><rect x="440" y="250" width="60" height="12" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><circle cx="77" cy="52" r="16" fill="#64748B"/><circle cx="99" cy="38" r="22" fill="#64748B"/><circle cx="127" cy="48" r="18" fill="#64748B"/><circle cx="109" cy="56" r="16" fill="#64748B"/><c