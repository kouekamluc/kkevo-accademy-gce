<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A 12 volt cell, a 4 ohm resistor in series with a 6 ohm resistor and a 3 ohm resistor in parallel, and an ammeter</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="52" y1="184" x2="88" y2="184" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="61" y1="196" x2="79" y2="196" stroke="#102A43" stroke-width="5" stroke-linecap="round"/>
<text x="40" y="182" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">+</text>
<text x="40" y="200" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">&#8722;</text>
<line x1="70" y1="70" x2="70" y2="184" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="70" y1="196" x2="70" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="140" y1="70" x2="160" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="220" y1="70" x2="240" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="160" y="58" width="60" height="24" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="190" y="44" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">R1 = 4 &#937;</text>
<line x1="70" y1="70" x2="140" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="240" y1="70" x2="480" y2="70" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="360" y1="140" x2="360" y2="160" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="360" y1="220" x2="360" y2="240" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="348" y="160" width="24" height="60" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="340" y="190" font-size="14" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">R2 = 6 &#937;</text>
<line x1="480" y1="140" x2="480" y2="160" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="220" x2="480" y2="240" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="468" y="160" width="24" height="60" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="460" y="190" font-size="14" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">R3 = 3 &#937;</text>
<line x1="360" y1="70" x2="360" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="360" y1="240" x2="360" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="70" x2="480" y2="140" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="240" x2="480" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<circle cx="360" cy="70" r="5" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<circle cx="360" cy="300" r="5" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<line x1="70" y1="300" x2="184" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<circle cx="200" cy="300" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="300" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<line x1="216" y1="300" x2="480" y2="300" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="86" y="225" font-size="15" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">12 V</text>
<text x="200" y="328" font-size="13" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="400">ammeter</text>
</svg>
