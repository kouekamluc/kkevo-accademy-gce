<text x="290" y="195" font-size="16" fill="#B45309" text-anchor="middle" font-weight="600">gradient = a</text>
<line x1="100" y1="220" x2="440" y2="90" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/>
