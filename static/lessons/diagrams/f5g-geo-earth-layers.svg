<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#FFFFFF"/><circle cx="170" cy="180" r="150" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><circle cx="170" cy="180" r="138" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><circle cx="170" cy="180" r="82" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><circle cx="170" cy="180" r="29" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><line x1="329" y1="44" x2="258.7" y2="66.5" stroke="#102A43" stroke-width="2"/><circle cx="258.7" cy="66.5" r="3" fill="#102A43"/><text x="335.0" y="48.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#102A43">Crust</text><text x="335.0" y="65.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">thin and solid</text><text x="335.0" y="82.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">5 to 70 km thick</text><line x1="329" y1="118" x2="270.5" y2="135.3" stroke="#102A43" stroke-width="2"/><circle cx="270.5" cy="135.3" r="3" fill="#102A43"/><text x="335.0" y="122.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#102A43">Mantle</text><text x="335.0" y="139.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">about 2,900 km thick</text><text x="335.0" y="156.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">hot rock that flows slowly</text><line x1="329" y1="204" x2="224.5" y2="187.7" stroke="#102A43" stroke-width="2"/><circle cx="224.5" cy="187.7" r="3" fill="#102A43"/><text x="335.0" y="208.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#102A43">Outer core</text><text x="335.0" y="225.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">liquid iron and nickel</text><text x="335.0" y="242.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">about 2,200 km thick</text><line x1="329" y1="286" x2="179.5" y2="187.4" stroke="#102A43" stroke-width="2"/><circle cx="179.5" cy="187.4" r="3" fill="#102A43"/><text x="335.0" y="290.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#102A43">Inner core</text><text x="335.0" y="307.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">solid iron and nickel</text><text x="335.0" y="324.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#102A43">radius about 1,200 km</text><text x="170.0" y="352.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#64748B">Not to scale: the crust is drawn thicker than it really is.</text></svg>