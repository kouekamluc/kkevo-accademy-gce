<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#FFFFFF"/>
<text x="280" y="30" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Three themes and poems named in the Board's report</text>
<rect x="15.0" y="55" width="170" height="270" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="100.0" y="85" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">The living dead</text>
<text x="100.0" y="104" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">and beliefs</text>
<text x="100.0" y="150" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Breath, Vanity (B. Diop)</text>
<text x="100.0" y="184" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">To the Living (Ntiru)</text>
<text x="100.0" y="218" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The Bond (Kunene)</text>
<text x="100.0" y="252" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Olokun (Clark)</text>
<text x="100.0" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">If (Angira)</text>
<rect x="195.0" y="55" width="170" height="270" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="280.0" y="85" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Disillusionment</text>
<text x="280.0" y="104" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">and satire</text>
<text x="280.0" y="150" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Rulers, Upheaval (Dipoko)</text>
<text x="280.0" y="184" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Cold (Brutus)</text>
<text x="280.0" y="218" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The Sounds Begin Again</text>
<text x="280.0" y="252" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Agony (Tchicaya)</text>
<text x="280.0" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The Right Road (D. Diop)</text>
<rect x="375.0" y="55" width="170" height="270" rx="8" fill="#EFF6FF" stroke="#B45309" stroke-width="2"/>
<text x="460.0" y="85" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">Cultural pride</text>
<text x="460.0" y="104" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700">and hope</text>
<text x="460.0" y="150" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Olokun, The Bond, If</text>
<text x="460.0" y="184" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Upheaval: revolt</text>
<text x="460.0" y="218" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">The Right Road: truth,</text>
<text x="460.0" y="252" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">beauty and love</text>
<text x="460.0" y="286" font-family="Inter, Arial, sans-serif" font-size="13" fill="#102A43" text-anchor="middle" font-weight="400">Hope beside protest</text>
</svg>
