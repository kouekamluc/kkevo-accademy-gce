<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="24" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Layers of a tropical rainforest</text><rect x="40" y="40" width="300" height="300" fill="#F0F9FF"/><rect x="40" y="320" width="300" height="20" fill="#7C2D12" stroke="#102A43" stroke-width="2"/><line x1="100" y1="320" x2="100" y2="85" stroke="#7C2D12" stroke-width="5"/><ellipse cx="100" cy="75" rx="36" ry="22" fill="#34D399" stroke="#047857" stroke-width="2"/><line x1="270" y1="320" x2="270" y2="85" stroke="#7C2D12" stroke-width="5"/><ellipse cx="270" cy="75" rx="36" ry="22" fill="#34D399" stroke="#047857" stroke-width="2"/><line x1="60" y1="320" x2="60" y2="150" stroke="#7C2D12" stroke-width="4"/><ellipse cx="60" cy="142" rx="34" ry="18" fill="#6EE7B7" stroke="#047857" stroke-width="2"/><line x1="140" y1="320" x2="140" y2="150" stroke="#7C2D12" stroke-width="4"/><ellipse cx="140" cy="142" rx="34" ry="18" fill="#6EE7B7" stroke="#047857" stroke-width="2"/><line x1="190" y1="320" x2="190" y2="150" stroke="#7C2D12" stroke-width="4"/><ellipse cx="190" cy="142" rx="34" ry="18" fill="#6EE7B7" stroke="#047857" stroke-width="2"/><line x1="235" y1="320" x2="235" y2="150" stroke="#7C2D12" stroke-width="4"/><ellipse cx="235" cy="142" rx="34" ry="18" fill="#6EE7B7" stroke="#047857" stroke-width="2"/><line x1="310" y1="320" x2="310" y2="150" stroke="#7C2D12" stroke-width="4"/><ellipse cx="310" cy="142" rx="34" ry="18" fill="#6EE7B7" stroke="#047857" stroke-width="2"/><line x1="90" y1="320" x2="90" y2="240" stroke="#7C2D12" stroke-width="3"/><ellipse cx="90" cy="235" rx="22" ry="12" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><line x1="165" y1="320" x2="165" y2="240" stroke="#7C2D12" stroke-width="3"/><ellipse cx="165" cy="235" rx="22" ry="12" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><line x1="215" y1="320" x2="215" y2="240" stroke="#7C2D12" stroke-width="3"/><ellipse cx="215" cy="235" rx="22" ry="12" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><line x1="290" y1="320" x2="290" y2="240" stroke="#7C2D12" stroke-width="3"/><ellipse cx="290" cy="235" rx="22" ry="12" fill="#A7F3D0" stroke="#047857" stroke-width="2"/><line x1="342" y1="75" x2="362" y2="75" stroke="#64748B" stroke-width="2"/><text x="368" y="73" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="700">Emergent layer</text><text x="368" y="89" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">tallest trees, 40 m or more</text><line x1="342" y1="145" x2="362" y2="145" stroke="#64748B" stroke-width="2"/><text x="368" y="143" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="700">Canopy</text><text x="368" y="159" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">dense roof of leaves, most life</text><line x1="342" y1="235" x2="362" y2="235" stroke="#64748B" stroke-width="2"/><text x="368" y="233" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="700">Understorey</text><text x="368" y="249" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">young trees and shrubs, shade</text><line x1="342" y1="310" x2="362" y2="310" stroke="#64748B" stroke-width="2"/><text x="368" y="308" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43" text-anchor="start" font-weight="700">Forest floor</text><text x="368" y="324" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="start" font-weight="400">dark, damp, leaf litter</text></svg>