<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>Essay plan</title><rect width="560" height="360" fill="#fff"/><text x="280" y="26" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700" font-family="Inter, Arial, sans-serif">A 45-minute essay (KKEVO practice setting)</text><rect x="40" y="50" width="480" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="60" y="78" font-size="14" fill="#102A43" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Read the question</text><text x="500" y="78" font-size="14" fill="#B45309" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">5 min</text><rect x="40" y="108" width="480" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="60" y="136" font-size="14" fill="#102A43" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Plan</text><text x="500" y="136" font-size="14" fill="#B45309" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">5 min</text><rect x="40" y="166" width="480" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="60" y="194" font-size="14" fill="#102A43" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Introduction</text><text x="500" y="194" font-size="14" fill="#B45309" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">5 min</text><rect x="40" y="224" width="480" height="44" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="60" y="252" font-size="14" fill="#102A43" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Body: 3 paragraphs</text><text x="500" y="252" font-size="14" fill="#B45309" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">25 min</text><rect x="40" y="282" width="480" height="44" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="60" y="310" font-size="14" fill="#102A43" text-anchor="start" font-weight="700" font-family="Inter, Arial, sans-serif">Conclusion</text><text x="500" y="310" font-size="14" fill="#B45309" text-anchor="end" font-weight="700" font-family="Inter, Arial, sans-serif">5 min</text><text x="280" y="345" font-size="14" fill="#102A43" text-anchor="middle" font-weight="400" font-family="Inter, Arial, sans-serif">Point, evidence, effect in every body paragraph</text></svg>