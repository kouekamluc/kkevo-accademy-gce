<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><title>Rawls's original position</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><rect width="560" height="360" fill="#FFFFFF"/><rect x="20" y="20" width="520" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280.0" y="49.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">The veil of ignorance hides your place in society</text><rect x="20" y="90" width="124" height="54" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="82.0" y="112.4" text-anchor="middle" font-size="14" fill="#102A43">Social class</text><text x="82.0" y="131.4" text-anchor="middle" font-size="14" fill="#102A43">and wealth</text><rect x="153" y="90" width="124" height="54" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="215.0" y="112.4" text-anchor="middle" font-size="14" fill="#102A43">Talents and</text><text x="215.0" y="131.4" text-anchor="middle" font-size="14" fill="#102A43">abilities</text><rect x="286" y="90" width="124" height="54" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="348.0" y="112.4" text-anchor="middle" font-size="14" fill="#102A43">Sex, race</text><text x="348.0" y="131.4" text-anchor="middle" font-size="14" fill="#102A43">and religion</text><rect x="419" y="90" width="124" height="54" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/><text x="481.0" y="112.4" text-anchor="middle" font-size="14" fill="#102A43">Your idea of</text><text x="481.0" y="131.4" text-anchor="middle" font-size="14" fill="#102A43">the good life</text><line x1="280" y1="146" x2="280" y2="176" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="178" width="360" height="52" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280.0" y="199.4" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Choosers in the original position</text><text x="280.0" y="218.4" text-anchor="middle" font-size="14" fill="#102A43">know only general facts</text><line x1="280" y1="230" x2="280" y2="260" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="262" width="255" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="147.5" y="290.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Principle 1</text><text x="147.5" y="309.9" text-anchor="middle" font-size="14" fill="#102A43">Equal basic liberties</text><text x="147.5" y="328.9" text-anchor="middle" font-size="14" fill="#102A43">for all</text><rect x="285" y="262" width="255" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="412.5" y="290.9" text-anchor="middle" font-size="14" fill="#102A43" font-weight="700">Principle 2</text><text x="412.5" y="309.9" text-anchor="middle" font-size="14" fill="#102A43">Fair opportunity; unequal</text><text x="412.5" y="328.9" text-anchor="middle" font-size="14" fill="#102A43">only if worst off gain</text></svg>