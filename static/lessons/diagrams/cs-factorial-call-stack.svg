<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" font-family="Inter, Arial, sans-serif" font-size="16" fill="#102A43"><title>Call stack for factorial(4)</title><defs><marker id="fsn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="fsb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="fsg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker></defs><rect x="0" y="0" width="560" height="385" fill="#FFFFFF"/><text x="150" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#102A43">Stack at its deepest</text><text x="420" y="30" font-size="16" text-anchor="middle" font-weight="bold" fill="#047857">Values returned while unwinding</text><rect x="50" y="50" width="200" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="81" font-size="16" text-anchor="middle" font-weight="bold" fill="#2563EB">factorial  n = 1</text><text x="330" y="81" font-size="16" fill="#047857">returns 1</text><path d="M318 76 C 300 90, 300 120, 318 132" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#fsg)"/><rect x="50" y="108" width="200" height="50" rx="4" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="150" y="139" font-size="16" text-anchor="middle" fill="#102A43">factorial  n = 2</text><text x="330" y="139" font-size="16" fill="#047857">returns 2 &#215; 1 = 2</text><path d="M318 134 C 300 148, 300 178, 318 190" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#fsg)"/><rect x="50" y="166" width="200" height="50" rx="4" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="150" y="197" font-size="16" text-anchor="middle" fill="#102A43">factorial  n = 3</text><text x="330" y="197" font-size="16" fill="#047857">returns 3 &#215; 2 = 6</text><path d="M318 192 C 300 206, 300 236, 318 248" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#fsg)"/><rect x="50" y="224" width="200" height="50" rx="4" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="150" y="255" font-size="16" text-anchor="middle" fill="#102A43">factorial  n = 4</text><text x="330" y="255" font-size="16" fill="#047857">returns 4 &#215; 6 = 24</text><path d="M318 250 C 300 264, 300 294, 318 306" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#fsg)"/><rect x="50" y="282" width="200" height="50" rx="4" fill="#F1F5F9" stroke="#102A43" stroke-width="2"/><text x="150" y="313" font-size="16" text-anchor="middle" fill="#102A43">main</text><text x="330" y="313" font-size="16" font-weight="bold" fill="#047857">receives 24</text><text x="256" y="81" font-size="15" fill="#2563EB">&#8592; top</text><path d="M25 330 L25 60" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#fsb)"/><text x="18" y="195" font-size="14" text-anchor="middle" fill="#2563EB" transform="rotate(-90 18 195)">winding: frames pushed</text><text x="280" y="365" font-size="15" text-anchor="middle" fill="#102A43">Each frame holds: return address, parameter n, local data</text></svg>
