<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>Stages of water treatment</title><rect width="560" height="360" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#102A43"/></marker></defs><g font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><text x="280" y="34" text-anchor="middle" font-size="16" fill="#102A43" font-weight="700">Treating river water at a works</text><rect x="20" y="70" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="95" y="101" text-anchor="middle" font-weight="700" font-size="15">River or reservoir</text><text x="95" y="121" text-anchor="middle" font-size="13">raw water</text><rect x="205" y="70" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="280" y="101" text-anchor="middle" font-weight="700" font-size="15">1 Screening</text><text x="280" y="121" text-anchor="middle" font-size="13">removes large objects</text><rect x="390" y="70" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465" y="101" text-anchor="middle" font-weight="700" font-size="15">2 Sedimentation</text><text x="465" y="121" text-anchor="middle" font-size="13">solids settle</text><line x1="170" y1="105" x2="205" y2="105" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="355" y1="105" x2="390" y2="105" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="465" y1="140" x2="465" y2="205" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="205" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465" y="236" text-anchor="middle" font-weight="700" font-size="15">3 Filtration</text><text x="465" y="256" text-anchor="middle" font-size="13">sand and gravel</text><rect x="205" y="205" width="150" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="280" y="236" text-anchor="middle" font-weight="700" font-size="15">4 Chlorination</text><text x="280" y="256" text-anchor="middle" font-size="13">kills germs</text><rect x="20" y="205" width="150" height="70" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="95" y="236" text-anchor="middle" font-weight="700" font-size="15">5 Storage</text><text x="95" y="256" text-anchor="middle" font-size="13">tank, then pipes</text><line x1="390" y1="240" x2="355" y2="240" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><line x1="205" y1="240" x2="170" y2="240" stroke="#102A43" stroke-width="2" marker-end="url(#a)"/><text x="280" y="320" text-anchor="middle" font-size="14" fill="#102A43">Water is cleaned in this order</text></g></svg>