<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>A series circuit: a 6 volt cell, a 2 ohm resistor, a 4 ohm resistor and an ammeter in one loop</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<line x1="72" y1="184" x2="108" y2="184" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
<line x1="81" y1="196" x2="99" y2="196" stroke="#102A43" stroke-width="5" stroke-linecap="round"/>
<text x="60" y="182" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">+</text>
<text x="60" y="200" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">&#8722;</text>
<line x1="90" y1="90" x2="90" y2="184" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="196" x2="90" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="140" y1="90" x2="160" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="220" y1="90" x2="240" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="160" y="78" width="60" height="24" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="190" y="64" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">R1 = 2 &#937;</text>
<line x1="310" y1="90" x2="330" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="390" y1="90" x2="410" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<rect x="330" y="78" width="60" height="24" rx="0" fill="#FFFFFF" stroke="#102A43" stroke-width="2"/>
<text x="360" y="64" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">R2 = 4 &#937;</text>
<line x1="90" y1="90" x2="140" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="240" y1="90" x2="310" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="410" y1="90" x2="480" y2="90" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="90" x2="480" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="290" x2="296" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<circle cx="280" cy="290" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="280" y="290" font-size="16" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text>
<line x1="264" y1="290" x2="90" y2="290" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
<text x="106" y="225" font-size="15" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">6 V</text>
<text x="280" y="320" font-size="13" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="400">ammeter</text>
<text x="280" y="40" font-size="14" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">Same current through every part of the loop</text>
</svg>
