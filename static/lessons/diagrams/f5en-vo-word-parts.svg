<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#102A43">unhappiness</text>
<rect x="40" y="80" width="110" height="80" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<text x="95" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#B45309">un</text>
<rect x="190" y="80" width="190" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="285" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563EB">happy</text>
<rect x="420" y="80" width="110" height="80" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/>
<text x="475" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#047857">ness</text>
<text x="165" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#102A43">+</text>
<text x="400" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#102A43">+</text>
<line x1="95" y1="165" x2="95" y2="205" stroke="#B45309" stroke-width="2.5"/>
<line x1="285" y1="165" x2="285" y2="205" stroke="#2563EB" stroke-width="2.5"/>
<line x1="475" y1="165" x2="475" y2="205" stroke="#047857" stroke-width="2.5"/>
<text x="95" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B45309">PREFIX</text>
<text x="95" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">front of the word</text>
<text x="95" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">means "not"</text>
<text x="285" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">ROOT</text>
<text x="285" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">main meaning</text>
<text x="285" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">(adjective)</text>
<text x="475" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">SUFFIX</text>
<text x="475" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">end of the word</text>
<text x="475" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43">makes a noun</text>
<text x="280" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#102A43">not + happy + state of = the state of not being happy</text>
</svg>