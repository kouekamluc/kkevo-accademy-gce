ke-width="3"/><path d="M20,190 150,196 260,196" fill="none" stroke="#102A43" stroke-width="3"/><path d="M318,196 430,150 540,120" fill="none" stroke="#102A43" stroke-width="3"/><path d="M285,182 285,150 250,110 220,60" fill="none" stroke="#102A43" stroke-width="2"/><g font-size="15" fill="#102A43" text-anchor="middle" font-weight="700"><text x="280" y="22">Site and situation of a town</text></g><g font-size="13" fill="#2563EB" text-anchor="middle"><text x="470" y="288">river and floodplain</text></g><g font-size="13" fill="#047857" text-anchor="middle"><text x="130" y="128">forested hills</text></g><g font-size="13" fill="#102A43" text-anchor="middle" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><text x="168" y="184">road to farming villages</text><text x="470" y="118">road to the port</text></g><g font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><text x="285" y="172">TOWN</text></g><g font-size="13" fill="#047857" text-anchor="start" font-weight="700"><text x="20" y="370">SITE: dry land just above the flood level, beside a bridge.</text></g><g font-size="13" fill="#B45309" text-anchor="start" font-weight="700"><text x="20" y="392">SITUATION: between hills, farmland and the road to the port.</text></g></svg>