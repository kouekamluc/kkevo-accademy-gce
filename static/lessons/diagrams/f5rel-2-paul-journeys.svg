<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43" text-anchor="middle">Paul's journeys (schematic, not a map)</text>
<rect x="10" y="44" width="120" height="60" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="79.2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1st journey</text>
<rect x="150" y="44" width="400" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="350.0" y="69.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">With Barnabas: Cyprus, Pisidian Antioch,</text>
<text x="350.0" y="87.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Iconium, Lystra, Derbe</text>
<line x1="70" y1="105" x2="70" y2="119" stroke="#102A43" stroke-width="2"/>
<polygon points="70,119 66.1,110.9 73.9,110.9" fill="#102A43"/>
<rect x="10" y="120" width="120" height="60" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="155.2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2nd journey</text>
<rect x="150" y="120" width="400" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="350.0" y="145.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">With Silas, then Timothy: Philippi,</text>
<text x="350.0" y="163.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Thessalonica, Athens, Corinth</text>
<line x1="70" y1="181" x2="70" y2="195" stroke="#102A43" stroke-width="2"/>
<polygon points="70,195 66.1,186.9 73.9,186.9" fill="#102A43"/>
<rect x="10" y="196" width="120" height="60" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="231.2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3rd journey</text>
<rect x="150" y="196" width="400" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="350.0" y="221.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Ephesus (about three years),</text>
<text x="350.0" y="239.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Macedonia, Troas, Miletus</text>
<line x1="70" y1="257" x2="70" y2="271" stroke="#102A43" stroke-width="2"/>
<polygon points="70,271 66.1,262.9 73.9,262.9" fill="#102A43"/>
<rect x="10" y="272" width="120" height="60" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="70.0" y="307.2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">To Rome</text>
<rect x="150" y="272" width="400" height="60" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<text x="350.0" y="297.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">Arrest, Caesarea, appeal to Caesar,</text>
<text x="350.0" y="315.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#102A43" text-anchor="middle">storm, Malta, Rome</text>
<text x="280" y="352" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#102A43" text-anchor="middle">All three journeys began from Antioch in Syria.</text>
</svg>
