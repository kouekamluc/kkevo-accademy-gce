<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img"><title>The OPCVL checklist for evaluating a source</title><rect width="560" height="360" fill="#FFFFFF"/><text x="280" y="28" font-size="16" fill="#102A43" text-anchor="middle" font-weight="700">Evaluating a source: O P C V L</text><rect x="30" y="50" width="500" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="58" y="81" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">O</text><text x="95" y="79" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Origin</text><text x="205" y="79" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Who wrote it, when, where?</text><rect x="30" y="106" width="500" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="58" y="137" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">P</text><text x="95" y="135" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Purpose</text><text x="205" y="135" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">Why was it made, for whom?</text><rect x="30" y="162" width="500" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="58" y="193" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">C</text><text x="95" y="191" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Content</text><text x="205" y="191" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">What does it actually say?</text><rect x="30" y="218" width="500" height="46" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="58" y="249" font-size="22" fill="#047857" text-anchor="middle" font-weight="700">V</text><text x="95" y="247" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Value</text><text x="205" y="247" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">What can it tell us?</text><rect x="30" y="274" width="500" height="46" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="58" y="305" font-size="22" fill="#047857" text-anchor="middle" font-weight="700">L</text><text x="95" y="303" font-size="15" fill="#102A43" text-anchor="start" font-weight="700">Limits</text><text x="205" y="303" font-size="14" fill="#102A43" text-anchor="start" font-weight="400">What can it not tell us?</text><text x="280" y="340" font-size="13" fill="#486581" text-anchor="middle" font-weight="400">Use the first three to describe it, the last two to judge it.</text></svg>