<rect x="407" y="208" width="145" height="110" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="479.5" y="250.0" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Reunion</text>
<text x="479.5" y="268.0" font-size="14" fill="#102A43" text-anchor="middle">Family moves to</text>
<text x="479.5" y="286.0" font-size="14" fill="#102A43" text-anchor="middle">Goshen</text>
