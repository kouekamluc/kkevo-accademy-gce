<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><rect width="560" height="360" fill="#fff"/><text x="280" y="30" text-anchor="middle" font-size="16" fill="#102A43" font-family="Inter, Arial, sans-serif" font-weight="700">Stages of production: cocoa to chocolate bar</text><rect x="20" y="60" width="160" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="100.0" y="90.6" text-anchor="middle" font-size="16" fill="#102A43" font-family="Inter, Arial, sans-serif" font-weight="700">Primary</text><rect x="20" y="140" width="160" height="100" rx="8" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="100.0" y="177.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">Farmer grows</text><text x="100.0" y="194.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">and harvests</text><text x="100.0" y="211.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">cocoa beans</text><line x1="100" y1="110" x2="100.0" y2="136.0" stroke="#102A43" stroke-width="2"/><polygon points="100,140 96.1,131.9 103.9,131.9" fill="#102A43"/><rect x="200" y="60" width="160" height="50" rx="8" fill="#ECFDF5" stroke="#102A43" stroke-width="2"/><text x="280.0" y="90.6" text-anchor="middle" font-size="16" fill="#102A43" font-family="Inter, Arial, sans-serif" font-weight="700">Secondary</text><rect x="200" y="140" width="160" height="100" rx="8" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="280.0" y="177.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">Factory turns beans</text><text x="280.0" y="194.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">into chocolate</text><text x="280.0" y="211.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">bars</text><line x1="280" y1="110" x2="280.0" y2="136.0" stroke="#102A43" stroke-width="2"/><polygon points="280,140 276.1,131.9 283.9,131.9" fill="#102A43"/><rect x="380" y="60" width="160" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/><text x="460.0" y="90.6" text-anchor="middle" font-size="16" fill="#102A43" font-family="Inter, Arial, sans-serif" font-weight="700">Tertiary</text><rect x="380" y="140" width="160" height="100" rx="8" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="460.0" y="177.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">Transport, shop</text><text x="460.0" y="194.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">and bank help</text><text x="460.0" y="211.9" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">bars reach buyers</text><line x1="460" y1="110" x2="460.0" y2="136.0" stroke="#102A43" stroke-width="2"/><polygon points="460,140 456.1,131.9 463.9,131.9" fill="#102A43"/><line x1="180" y1="85" x2="196.0" y2="85.0" stroke="#2563EB" stroke-width="2"/><polygon points="200,85 191.9,88.9 191.9,81.1" fill="#2563EB"/><line x1="360" y1="85" x2="376.0" y2="85.0" stroke="#2563EB" stroke-width="2"/><polygon points="380,85 371.9,88.9 371.9,81.1" fill="#2563EB"/><text x="280" y="285" text-anchor="middle" font-size="14" fill="#102A43" font-family="Inter, Arial, sans-serif">Each stage depends on the one before it.</text><text x="280" y="315" text-anchor="middle" font-size="13" fill="#102A43" font-family="Inter, Arial, sans-serif">Primary: extracts or grows. Secondary: changes raw materials.</text><text x="280" y="335" text-anchor="middle" font-size="13" fill="#102A43" font-family="Inter, Arial, sans-serif">Tertiary: services that help goods reach the consumer.</text></svg>