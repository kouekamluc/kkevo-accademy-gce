<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#102A43"><title>Where the water of the earth is stored (approximate shares)</title><defs><marker id="gwi" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#102A43"/></marker><marker id="gwb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker><marker id="gwg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="gwr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B45309"/></marker><marker id="gws" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs><rect width="560" height="360" fill="#fff"/><text x="280" y="30" font-size="16" text-anchor="middle" fill="#102A43" font-weight="bold">Where is the earth's water? (approximate shares)</text><text x="40" y="66" font-size="14" text-anchor="start" fill="#102A43" font-weight="bold">All water on earth</text><rect x="40" y="76" width="466" height="44" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="273" y="104" font-size="15" text-anchor="middle" fill="#102A43">Oceans and seas: about 97%</text><rect x="506" y="76" width="14" height="44" rx="0" fill="#047857" stroke="#047857" stroke-width="2"/><line x1="513" y1="156" x2="513" y2="124" stroke="#047857" stroke-width="2.5" marker-end="url(#gwg)"/><text x="520" y="172" font-size="14" text-anchor="end" fill="#047857" font-weight="bold">Fresh water: about 3%</text><text x="40" y="196" font-size="14" text-anchor="start" fill="#102A43" font-weight="bold">Fresh water only (about 3% of all water)</text><rect x="40" y="206" width="320" height="44" rx="0" fill="#fff" stroke="#102A43" stroke-width="2"/><text x="200" y="234" font-size="14" text-anchor="middle" fill="#102A43">Ice caps and glaciers: about two-thirds</text><rect x="360" y="206" width="150" height="44" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="435" y="234" font-size="14" text-anchor="middle" fill="#102A43">Groundwater</text><rect x="510" y="206" width="10" height="44" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><line x1="515" y1="260" x2="515" y2="282" stroke="#2563EB" stroke-width="2.5" marker-end="url(#gwb)"/><text x="508" y="280" font-size="14" text-anchor="end" fill="#2563EB" font-weight="bold">Lakes, soil moisture, rivers,</text><text x="508" y="298" font-size="14" text-anchor="end" fill="#2563EB" font-weight="bold">atmosphere: less than 1% of fresh water</text><text x="280" y="340" font-size="13" text-anchor="middle" fill="#64748B">Rivers and the atmosphere hold only a tiny share, yet water passes through them quickly.</text></svg>