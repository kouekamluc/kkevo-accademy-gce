<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif"><rect width="560" height="360" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker></defs><rect x="180" y="10" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="280.0" y="35.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Read the argument</text><line x1="280" y1="50" x2="280" y2="72" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="150" y="72" width="260" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="280.0" y="93.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Does it speak of classes:</text><text x="280.0" y="111.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">all, no, some?</text><line x1="170" y1="122" x2="95" y2="150" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><text x="80" y="140" font-size="14" text-anchor="end" fill="#047857" font-weight="700">yes</text><line x1="390" y1="122" x2="465" y2="150" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><text x="478" y="140" font-size="14" text-anchor="start" fill="#B45309" font-weight="700">no</text><rect x="10" y="150" width="170" height="76" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="95.0" y="175.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Categorical logic:</text><text x="95.0" y="193.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">standard form, mood,</text><text x="95.0" y="211.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">figure, rules, Venn</text><rect x="380" y="150" width="170" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="465.0" y="171.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Statements joined by</text><text x="465.0" y="189.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">if, and, or, not?</text><line x1="465" y1="200" x2="465" y2="232" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><text x="473" y="222" font-size="14" text-anchor="start" fill="#047857" font-weight="700">yes</text><rect x="340" y="232" width="210" height="78" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2.5"/><text x="445.0" y="258.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Propositional logic:</text><text x="445.0" y="276.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">symbolise, truth table</text><text x="445.0" y="294.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">or formal proof</text><line x1="95" y1="226" x2="95" y2="250" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="10" y="250" width="170" height="50" rx="8" fill="#EFF6FF" stroke="#102A43" stroke-width="2.5"/><text x="95.0" y="271.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Persuasive but</text><text x="95.0" y="289.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">bad in content?</text><line x1="95" y1="300" x2="95" y2="322" stroke="#102A43" stroke-width="2.5" marker-end="url(#ar)"/><rect x="10" y="322" width="170" height="32" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="95.0" y="343.0" font-size="14" text-anchor="middle" fill="#102A43" font-weight="600">Informal fallacy</text></svg>