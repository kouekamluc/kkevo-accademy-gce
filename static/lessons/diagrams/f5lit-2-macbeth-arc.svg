<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" font-size="14">
<rect width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#102A43" font-weight="700" font-size="17">Macbeth: the shape of the play</text>
<line x1="136" y1="128" x2="136" y2="262" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="232" y1="128" x2="232" y2="262" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="328" y1="128" x2="328" y2="262" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="424" y1="128" x2="424" y2="262" stroke="#102A43" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M40 250 C110 250 170 118 232 118 C300 118 380 250 520 250" fill="none" stroke="#2563EB" stroke-width="4"/>
<line x1="40" y1="250" x2="520" y2="250" stroke="#102A43" stroke-width="2"/>
<circle cx="232" cy="118" r="8" fill="#B45309"/>
<text x="232" y="80" text-anchor="middle" fill="#B45309" font-weight="700">Climax / turning point</text>
<text x="232" y="98" text-anchor="middle" fill="#102A43">(textbooks differ)</text>
<text x="68" y="208" text-anchor="middle" fill="#102A43" font-weight="700">Exposition</text>
<text x="98" y="150" text-anchor="middle" fill="#102A43" font-weight="700">Rising</text>
<text x="98" y="167" text-anchor="middle" fill="#102A43" font-weight="700">action</text>
<text x="384" y="150" text-anchor="middle" fill="#102A43" font-weight="700">Falling</text>
<text x="384" y="167" text-anchor="middle" fill="#102A43" font-weight="700">action</text>
<text x="474" y="212" text-anchor="middle" fill="#047857" font-weight="700">Catastrophe</text>
<text x="88" y="283" text-anchor="middle" fill="#102A43" font-weight="700">Act 1</text>
<text x="88" y="301" text-anchor="middle" fill="#102A43">Prophecy,</text>
<text x="88" y="318" text-anchor="middle" fill="#102A43">plan</text>
<text x="184" y="283" text-anchor="middle" fill="#102A43" font-weight="700">Act 2</text>
<text x="184" y="301" text-anchor="middle" fill="#102A43">Duncan is</text>
<text x="184" y="318" text-anchor="middle" fill="#102A43">murdered</text>
<text x="280" y="283" text-anchor="middle" fill="#102A43" font-weight="700">Act 3</text>
<text x="280" y="301" text-anchor="middle" fill="#102A43">Banquo dies;</text>
<text x="280" y="318" text-anchor="middle" fill="#102A43">the ghost</text>
<text x="376" y="283" text-anchor="middle" fill="#102A43" font-weight="700">Act 4</text>
<text x="376" y="301" text-anchor="middle" fill="#102A43">Apparitions;</text>
<text x="376" y="318" text-anchor="middle" fill="#102A43">family killed</text>
<text x="472" y="283" text-anchor="middle" fill="#102A43" font-weight="700">Act 5</text>
<text x="472" y="301" text-anchor="middle" fill="#102A43">Downfall of</text>
<text x="472" y="318" text-anchor="middle" fill="#102A43">Macbeth</text>
</svg>
