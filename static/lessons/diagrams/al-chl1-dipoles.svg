<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Bond dipoles in carbon dioxide cancel because the molecule is linear, but in bent water they add to a net dipole</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<text x="280.0" y="26.0" font-size="15" fill="#102A43" text-anchor="middle" font-weight="700" >Bond dipoles: add them as vectors</text>
<circle cx="140.0" cy="130.0" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="140.0" y="135.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >O</text>
<circle cx="200.0" cy="130.0" r="16" fill="#F3F4F6" stroke="#102A43" stroke-width="2.5" />
<text x="200.0" y="135.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >C</text>
<circle cx="260.0" cy="130.0" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="260.0" y="135.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >O</text>
<line x1="156.0" y1="130.0" x2="184.0" y2="130.0" stroke="#102A43" stroke-width="2.5" />
<line x1="216.0" y1="130.0" x2="244.0" y2="130.0" stroke="#102A43" stroke-width="2.5" />
<line x1="190.0" y1="96.0" x2="140.0" y2="96.0" stroke="#B45309" stroke-width="3.5" marker-end="url(#a)"/>
<line x1="210.0" y1="96.0" x2="260.0" y2="96.0" stroke="#B45309" stroke-width="3.5" marker-end="url(#a)"/>
<text x="200.0" y="178.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >CO2: linear</text>
<text x="200.0" y="198.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >dipoles cancel</text>
<text x="200.0" y="216.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >net dipole = 0</text>
<line x1="400.0" y1="100.0" x2="355.0" y2="145.0" stroke="#102A43" stroke-width="2.5" />
<line x1="400.0" y1="100.0" x2="445.0" y2="145.0" stroke="#102A43" stroke-width="2.5" />
<circle cx="355.0" cy="145.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="355.0" y="150.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<circle cx="445.0" cy="145.0" r="12" fill="#FFFFFF" stroke="#102A43" stroke-width="2" />
<text x="445.0" y="150.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="700" >H</text>
<circle cx="400.0" cy="100.0" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" />
<text x="400.0" y="105.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >O</text>
<line x1="360.0" y1="140.0" x2="386.0" y2="110.0" stroke="#B45309" stroke-width="3" marker-end="url(#a)"/>
<line x1="440.0" y1="140.0" x2="414.0" y2="110.0" stroke="#B45309" stroke-width="3" marker-end="url(#a)"/>
<line x1="500.0" y1="145.0" x2="500.0" y2="75.0" stroke="#2563EB" stroke-width="4" marker-end="url(#b)"/>
<text x="500.0" y="166.0" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700" >net dipole</text>
<text x="400.0" y="218.0" font-size="14" fill="#102A43" text-anchor="middle" font-weight="700" >H2O: bent</text>
<text x="400.0" y="238.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >bond dipoles add up</text>
<text x="400.0" y="256.0" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" >net dipole towards O</text>
<text x="280.0" y="325.0" font-size="13" fill="#102A43" text-anchor="middle" font-weight="600" >Arrow points towards the more electronegative atom</text>
</svg>
