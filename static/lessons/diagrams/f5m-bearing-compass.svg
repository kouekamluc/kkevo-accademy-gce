<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img">
<title>Compass: north 000, north-east 045, east 090, south-east 135, south 180, south-west 225, west 270, north-west 315</title>
<rect width="560" height="360" fill="#FFFFFF"/>
<circle cx="280" cy="185" r="105" fill="#EFF6FF" stroke="#102A43" stroke-width="2"/>
<line x1="280" y1="185" x2="280" y2="80" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<text x="280" y="63" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">N 000°</text>
<line x1="280" y1="185" x2="354.2" y2="110.8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="370.5" y="94.5" font-size="15" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">NE 045°</text>
<line x1="280" y1="185" x2="385" y2="185" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<text x="408" y="185" font-size="15" fill="#102A43" text-anchor="start" dominant-baseline="middle" font-weight="700">E 090°</text>
<line x1="280" y1="185" x2="354.2" y2="259.2" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="370.5" y="275.5" font-size="15" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">SE 135°</text>
<line x1="280" y1="185" x2="280" y2="290" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<text x="280" y="307" font-size="15" fill="#102A43" text-anchor="middle" dominant-baseline="middle" font-weight="700">S 180°</text>
<line x1="280" y1="185" x2="205.8" y2="259.2" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="189.5" y="275.5" font-size="15" fill="#2563EB" text-anchor="end" dominant-baseline="middle" font-weight="700">SW 225°</text>
<line x1="280" y1="185" x2="175" y2="185" stroke="#102A43" stroke-width="2.5" stroke-linecap="round"/>
<text x="152" y="185" font-size="15" fill="#102A43" text-anchor="end" dominant-baseline="middle" font-weight="700">W 270°</text>
<line x1="280" y1="185" x2="205.8" y2="110.8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
<text x="189.5" y="94.5" font-size="15" fill="#2563EB" text-anchor="end" dominant-baseline="middle" font-weight="700">NW 315°</text>
<path d="M280,135 A50,50 0 0 1 315.4,220.4" fill="none" stroke="#047857" stroke-width="3"/>
<polygon points="315.4,220.4 326,216.8 318.9,209.7" fill="#047857"/>
<circle cx="280" cy="185" r="4" fill="#102A43"/>
<text x="20" y="30" font-size="16" fill="#047857" text-anchor="start" dominant-baseline="middle" font-weight="700">Turn clockwise from north</text>
<text x="20" y="54" font-size="15" fill="#047857" text-anchor="start" dominant-baseline="middle">(south-east = 135°)</text>
</svg>