<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice quiz mobile — Newton’s Laws</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#2563EB;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.m{font-family:'STIX Two Text',Georgia,serif;white-space:nowrap}
</style>
<style>html{background:#CBD5E1}body{display:flex;justify-content:center;padding:24px 0}#dc-root>div{box-shadow:0 12px 40px rgba(15,23,42,.18);border-radius:28px}</style>
</head>
<body>
<div id="dc-root">
<div style="width:390px;height:1200px;background:#F8FAFC;position:relative;overflow:hidden">

<header style="background:#FFFFFF;border-bottom:1px solid #E2E8F0;padding:6px 8px 12px">
<div style="display:flex;align-items:center;gap:4px;height:44px">
<a href="02-dashboard-mobile.html" aria-label="Exit practice" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<span style="flex:1;font-size:15px;font-weight:600">Newton’s Laws</span>
<span style="font-size:14px;font-weight:600;padding-right:8px">4 <span style="color:#64748B;font-weight:500">/ 10</span></span>
</div>
<div style="height:6px;border-radius:999px;background:#E2E8F0;margin:4px 8px 0" role="progressbar" aria-valuenow="4" aria-valuemin="1" aria-valuemax="10" aria-label="Question 4 of 10"><div style="width:{{progressW}}%;height:6px;border-radius:999px;background:#2563EB"></div></div>
</header>

<main style="padding:18px 16px 120px;display:flex;flex-direction:column;gap:14px">
<div style="font-size:12px;font-weight:700;color:#1D4ED8;letter-spacing:.06em">QUESTION 4</div>
<h1 style="margin:0;font-size:19px;line-height:1.5;font-weight:600">A car of mass <span class="m" style="font-size:21px">1200 kg</span> accelerates from rest to <span class="m" style="font-size:21px">15 m/s</span> in <span class="m" style="font-size:21px">5 s</span>. What is the resultant force on it?</h1>
<figure style="margin:0;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:10px">
<svg viewBox="0 0 360 150" width="100%" role="img" aria-label="Car accelerating from 0 to 15 metres per second in 5 seconds.">
<path d="M10 120H350" stroke="#94A3B8" stroke-width="2"></path>
<g opacity=".35"><rect x="20" y="82" width="80" height="26" rx="8" fill="#102A43"></rect><path d="M34 82l12-16h30l12 16z" fill="#102A43"></path><circle cx="40" cy="110" r="9" fill="#334E68"></circle><circle cx="82" cy="110" r="9" fill="#334E68"></circle></g>
<rect x="230" y="82" width="80" height="26" rx="8" fill="#102A43"></rect><path d="M244 82l12-16h30l12 16z" fill="#102A43"></path><circle cx="250" cy="110" r="9" fill="#334E68"></circle><circle cx="292" cy="110" r="9" fill="#334E68"></circle>
<text x="22" y="143" font-family="Inter" font-size="14" fill="#475569">u = 0</text><text x="226" y="143" font-family="Inter" font-size="14" fill="#475569">v = 15 m/s</text>
<path d="M120 50H200" stroke="#047857" stroke-width="3"></path><path d="M200 42l14 8-14 8z" fill="#047857"></path><text x="132" y="38" font-family="STIX Two Text" font-style="italic" font-size="20" fill="#047857">t = 5 s</text>
</svg>
</figure>

<div role="radiogroup" aria-label="Answer options" style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="4">
<button role="radio" aria-checked="{{o.checked}}" data-on-click="{{o.pick}}" style="{{o.card}}"><span style="{{o.badge}}">{{o.key}}</span><span class="m" style="font-size:20px;flex:1;text-align:left">{{o.label}}</span><span style="{{o.note}}">{{o.noteText}}</span></button>
</sc-for>
</div>

<sc-if value="{{showCorrect}}" hint-placeholder-val="{{ true }}">
<section aria-live="polite" style="border:1.5px solid #A7F3D0;background:#ECFDF5;border-radius:16px;padding:18px">
<div style="display:flex;gap:12px;align-items:center"><span style="width:36px;height:36px;border-radius:50%;background:#047857;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><div style="font-size:18px;font-weight:700;color:#065F46">Correct — nicely done.</div></div>
<div style="margin-top:12px;background:#FFFFFF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
<div><div style="font-size:13px;font-weight:600;color:#475569">1 · Acceleration</div><div class="m" style="font-size:18px;margin-top:2px"><i>a</i> = (15 − 0) ÷ 5 = 3 m/s²</div></div>
<div><div style="font-size:13px;font-weight:600;color:#475569">2 · Force</div><div class="m" style="font-size:18px;margin-top:2px"><i>F</i> = 1200 × 3 = <strong style="color:#047857">3600 N</strong></div></div>
</div>
</section>
</sc-if>
<sc-if value="{{showWrong}}" hint-placeholder-val="{{ false }}">
<section aria-live="polite" style="border:1.5px solid #E2E8F0;background:#FFFFFF;border-radius:16px;padding:18px">
<div style="font-size:18px;font-weight:700;color:#991B1B">Not quite — it’s 3600 N.</div>
<div style="margin-top:10px;background:#F8FAFC;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px"><div class="m" style="font-size:18px"><i>a</i> = 15 ÷ 5 = 3 m/s²</div><div class="m" style="font-size:18px"><i>F</i> = 1200 × 3 = 3600 N</div></div>
</section>
</sc-if>
</main>

<div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #E2E8F0;padding:12px 16px 24px">
<sc-if value="{{showSubmit}}" hint-placeholder-val="{{ false }}"><button data-on-click="{{submit}}" style="{{submitStyle}}">Submit Answer</button></sc-if>
<sc-if value="{{showContinue}}" hint-placeholder-val="{{ true }}"><button data-on-click="{{cont}}" style="width:100%;height:52px;border-radius:12px;border:0;background:#2563EB;color:#FFFFFF;font-weight:600;font-size:16px">Continue</button></sc-if>
</div>
</div>
</div>

<script>
/* Minimal runtime: renders the {{bindings}} of the design file in plain JavaScript. */
class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
  setState(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__dcUpdate && window.__dcUpdate(); }
  forceUpdate(){ window.__dcUpdate && window.__dcUpdate(); } }
(function(){
  const RE = /\{\{\s*([\w.$]+)\s*\}\}/g;
  const whole = s => { const m = s.match(/^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/); return m ? m[1] : null; };
  const get = (o, p) => p.split('.').reduce((a, k) => a == null ? undefined : a[k], o);
  const interp = (s, sc) => s.replace(RE, (m, p) => { const v = get(sc, p); return v == null ? '' : v; });
  function compile(root, binds){
    const fors = [...root.querySelectorAll('sc-for')].filter(f => !f.parentElement.closest('sc-for'));
    fors.forEach(f => { const tpl = f.innerHTML; f.innerHTML = ''; f.style.display = 'contents';
      const listPath = whole(f.getAttribute('list')); const as = f.getAttribute('as') || 'item';
      binds.push(sc => { const list = get(sc, listPath) || []; f.innerHTML = '';
        list.forEach((it, i) => { const t = document.createElement('template'); t.innerHTML = tpl;
          const local = Object.assign({}, sc, { [as]: it, $index: i }); const inner = [];
          compile(t.content, inner); inner.forEach(b => b(local)); f.appendChild(t.content); }); }); });
    const inFor = el => { const p = el.closest && el.closest('sc-for'); return p && fors.includes(p) && p !== el; };
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      if (n.nodeType === 3) { if (!n.nodeValue.includes('{{')) return; if (n.parentElement && inFor(n.parentElement)) return;
        const orig = n.nodeValue; binds.push(sc => { n.nodeValue = interp(orig, sc); }); return; }
      if (inFor(n) || fors.includes(n)) return;
      if (n.tagName === 'SC-IF') { n.style.display = 'contents'; const p = whole(n.getAttribute('value'));
        binds.push(sc => { n.style.display = get(sc, p) ? 'contents' : 'none'; }); }
      [...n.attributes].forEach(a => {
        if (!a.value.includes('{{') || a.name.startsWith('hint-') || (n.tagName === 'SC-IF' && a.name === 'value')) return;
        const orig = a.value, name = a.name;
        if (name === 'data-on-click' || name === 'data-on-change') { const p = whole(orig);
          n.addEventListener(name === 'data-on-click' ? 'click' : 'input', e => { const f = n.__sc && get(n.__sc, p); f && f(e); });
          binds.push(sc => { n.__sc = sc; }); return; }
        if (name === 'value') { binds.push(sc => { const v = interp(orig, sc); if (n.value !== v) n.value = v; }); return; }
        binds.push(sc => { n.setAttribute(name, interp(orig, sc)); });
      });
    });
  }
  window.__dcMount = function(Comp){
    const root = document.getElementById('dc-root'); const binds = []; compile(root, binds);
    const c = new Comp({});
    window.__dcUpdate = () => { const v = c.renderVals(); window.__dcVals = v; binds.forEach(b => b(v)); };
    window.__dcUpdate();
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const v = props.view ?? 'correct';
    this.state = { picked: v === 'question' ? null : v === 'incorrect' ? 'D' : 'B', submitted: v === 'correct' || v === 'incorrect' };
  }
  renderVals() {
    const picked = this.state.picked, sub = this.state.submitted, correct = 'B';
    const opts = [['A', '1800 N'], ['B', '3600 N'], ['C', '6000 N'], ['D', '18 000 N']];
    const options = opts.map((o) => {
      const sel = picked === o[0], isC = o[0] === correct;
      let card = 'border:1.5px solid #E2E8F0;background:#FFFFFF;color:#0F172A';
      let badge = 'border:1.5px solid #CBD5E1;color:#334155;background:#FFFFFF';
      let note = '', noteStyle = 'display:none';
      if (!sub && sel) { card = 'border:2px solid #2563EB;background:#EFF6FF;color:#0F172A'; badge = 'background:#2563EB;color:#FFFFFF;border:0'; }
      if (sub && isC) { card = 'border:2px solid #10B981;background:#ECFDF5;color:#065F46'; badge = 'background:#047857;color:#FFFFFF;border:0'; note = sel ? 'You' : 'Answer'; noteStyle = 'font-size:12px;font-weight:600;color:#047857'; }
      if (sub && sel && !isC) { card = 'border:1.5px dashed #F87171;background:#FFFFFF;color:#991B1B'; badge = 'border:1.5px solid #F87171;color:#991B1B;background:#FFFFFF'; note = 'You'; noteStyle = 'font-size:12px;font-weight:600;color:#B91C1C'; }
      if (sub && !sel && !isC) { card = 'border:1.5px solid #E2E8F0;background:#FFFFFF;color:#64748B;opacity:.7'; }
      return { key: o[0], label: o[1], checked: sel ? 'true' : 'false', noteText: note, note: noteStyle,
        card: 'width:100%;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:14px;font-family:inherit;' + card,
        badge: 'width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-family:Inter,sans-serif;' + badge,
        pick: () => { if (!sub) this.setState({ picked: o[0] }); } };
    });
    return {
      options: options, progressW: sub ? 40 : 30,
      showCorrect: sub && picked === correct, showWrong: sub && picked !== correct,
      showSubmit: !sub, showContinue: sub,
      submit: () => { if (picked) this.setState({ submitted: true }); },
      cont: () => this.setState({ picked: null, submitted: false }),
      submitStyle: 'width:100%;height:52px;border-radius:12px;border:0;font-weight:600;font-size:16px;' + (picked ? 'background:#2563EB;color:#FFFFFF' : 'background:#E2E8F0;color:#64748B')
    };
  }
}
window.__dcMount(Component);
</script>
</body>
</html>
